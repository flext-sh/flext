# flext-cli DOMAIN-FIRST prefix refactor (reusable executor, with fix).
#
# WHY: flext-cli owns 11 canonical domains — Toml, Yaml, Csv, Json, Xlsx, Cli,
# Tui, Run, Dag, Templates, Workflow. Every public symbol it provides must carry
# its domain token FIRST (utilities snake `<domain>_<verb>_<rest>`, constants
# UPPER `<DOMAIN>_<REST>`, types/models Pascal `<Domain><Rest>`). Symbols whose
# real domain token is NOT first are refactored here so every downstream project
# (including external repos) can re-apply the exact same rename.
#
# HOW (precision, zero false positives): each rename matches ONLY the closed set
# of node kinds where an identifier legitimately appears — `identifier` (code),
# `comment` (line/# comments) and `string_content` (docstrings/strings) — and is
# gated by a word-boundary `\b<name>\b` regex so a shorter name can never touch a
# longer one (`files_read_yaml` never rewrites `files_read_yaml_model`). The
# `transform.replace` rewrites ONLY the bounded token inside the node, preserving
# every surrounding character.
#
# FALSE POSITIVES intentionally excluded (domain token is a substring, not the
# domain): CommandRunner / PromptRuntimeState (Run in Runner/Runtime), CmdService.
# ALREADY-CORRECT (domain already first) are not listed: toml_*, yaml_*, csv_*,
# json_*, run*, template_*, xlsx_*, Xlsx*.
#
# USAGE:  ast-grep scan --rule codemod/rules/refactor/refactor-cli-prefixes.yml --update-all <tree>
# Applies across code + comments + docstrings.

# ---------------------------------------------------------------------------
# Utilities (snake_case) — domain token moved to first position.
# ---------------------------------------------------------------------------
id: cli-prefix-files-read-yaml
language: python
severity: warning
message: "flext-cli domain-first: files_read_yaml -> yaml_read_files (Yaml domain)."
files:
  - "**/*.py"
ignores:
  - "**/legado/**"
rule:
  any:
    - kind: identifier
    - kind: comment
    - kind: string_content
  regex: '\bfiles_read_yaml\b'
  pattern: $T
transform:
  NEW:
    replace: { source: $T, replace: '\bfiles_read_yaml\b', by: yaml_read_files }
fix: $NEW
---
