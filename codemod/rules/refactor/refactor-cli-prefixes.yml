# flext-cli DOMAIN-FIRST prefix refactor — single data-driven executor (with fix).
#
# WHY: flext-cli owns 11 canonical domains (Toml, Yaml, Csv, Json, Xlsx, Cli, Tui,
# Run, Dag, Templates, Workflow). Every public symbol must carry its domain token
# FIRST (utilities snake `<domain>_<verb>_<rest>`, constants UPPER `<DOMAIN>_<REST>`,
# types/models Pascal `<Domain><Rest>`). Symbols whose real domain token is NOT
# first are renamed here so every downstream repo re-applies the identical rename.
#
# HOW (one rule, 23 from->to pairs): a single node match (identifier / comment /
# string_content) whose text is any listed name, then `transform.rewrite` runs the
# token through the `rewriters` list; the first rewriter whose `^name$` matches
# exactly applies its `fix`. The alternation and the rewriters list are ordered
# LONGEST-name-first so a shorter name (files_read_yaml) can never shadow a longer
# one (files_read_yaml_model[_chain]); `^...$` anchors guarantee exact-token rewrite.
#
# FALSE POSITIVES excluded (domain token is a substring, not the domain):
# CommandRunner / PromptRuntimeState (Run in Runner/Runtime), CmdService.
# ALREADY-CORRECT (domain already first) not listed: toml_*, yaml_*, csv_*, json_*,
# run*, template_*, xlsx_*, Xlsx*.
#
# USAGE:  ast-grep scan --rule codemod/rules/refactor/refactor-cli-prefixes.yml --update-all <tree>
id: refactor-cli-prefixes
language: python
severity: warning
message: >-
  flext-cli domain-first: this symbol's domain token must come first
  (e.g. files_read_yaml -> yaml_read_files, FILE_FORMAT_JSON -> JSON_FILE_FORMAT).
files:
  - "**/*.py"
ignores:
  - "**/legado/**"
rule:
  any:
    - kind: identifier
    - kind: comment
    - kind: string_content
  regex: '\b(files_read_yaml_model_chain|files_read_csv_with_headers|files_read_first_json_model|files_read_json_lines_model|ERR_TEMPLATE_OUTPUT_ESCAPE|ERR_TEMPLATE_RENDER_FAILED|ERR_TEMPLATE_NOT_FOUND|files_read_yaml_model|files_read_json_model|DEFAULT_CSV_DELIMITER|normalize_json_value|ERR_CSV_WRITE_FAILED|ERR_JSON_LOAD_FAILED|DEFAULT_JSON_INDENT|ERR_CSV_READ_FAILED|write_yaml_model|FILE_FORMAT_JSON|FILE_FORMAT_TOML|FILE_FORMAT_YAML|files_read_yaml|files_write_csv|files_read_json|FILE_FORMAT_CSV)\b'
  pattern: $T
rewriters:
  - id: r01
    rule: { regex: '^files_read_yaml_model_chain$', pattern: $X }
    fix: yaml_read_files_model_chain
  - id: r02
    rule: { regex: '^files_read_csv_with_headers$', pattern: $X }
    fix: csv_read_files_with_headers
  - id: r03
    rule: { regex: '^files_read_first_json_model$', pattern: $X }
    fix: json_read_first_files_model
  - id: r04
    rule: { regex: '^files_read_json_lines_model$', pattern: $X }
    fix: json_read_files_lines_model
  - id: r05
    rule: { regex: '^ERR_TEMPLATE_OUTPUT_ESCAPE$', pattern: $X }
    fix: TEMPLATE_ERR_OUTPUT_ESCAPE
  - id: r06
    rule: { regex: '^ERR_TEMPLATE_RENDER_FAILED$', pattern: $X }
    fix: TEMPLATE_ERR_RENDER_FAILED
  - id: r07
    rule: { regex: '^ERR_TEMPLATE_NOT_FOUND$', pattern: $X }
    fix: TEMPLATE_ERR_NOT_FOUND
  - id: r08
    rule: { regex: '^files_read_yaml_model$', pattern: $X }
    fix: yaml_read_files_model
  - id: r09
    rule: { regex: '^files_read_json_model$', pattern: $X }
    fix: json_read_files_model
  - id: r10
    rule: { regex: '^DEFAULT_CSV_DELIMITER$', pattern: $X }
    fix: CSV_DEFAULT_DELIMITER
  - id: r11
    rule: { regex: '^normalize_json_value$', pattern: $X }
    fix: json_normalize_value
  - id: r12
    rule: { regex: '^ERR_CSV_WRITE_FAILED$', pattern: $X }
    fix: CSV_ERR_WRITE_FAILED
  - id: r13
    rule: { regex: '^ERR_JSON_LOAD_FAILED$', pattern: $X }
    fix: JSON_ERR_LOAD_FAILED
  - id: r14
    rule: { regex: '^DEFAULT_JSON_INDENT$', pattern: $X }
    fix: JSON_DEFAULT_INDENT
  - id: r15
    rule: { regex: '^ERR_CSV_READ_FAILED$', pattern: $X }
    fix: CSV_ERR_READ_FAILED
  - id: r16
    rule: { regex: '^write_yaml_model$', pattern: $X }
    fix: yaml_write_model
  - id: r17
    rule: { regex: '^FILE_FORMAT_JSON$', pattern: $X }
    fix: JSON_FILE_FORMAT
  - id: r18
    rule: { regex: '^FILE_FORMAT_TOML$', pattern: $X }
    fix: TOML_FILE_FORMAT
  - id: r19
    rule: { regex: '^FILE_FORMAT_YAML$', pattern: $X }
    fix: YAML_FILE_FORMAT
  - id: r20
    rule: { regex: '^files_read_yaml$', pattern: $X }
    fix: yaml_read_files
  - id: r21
    rule: { regex: '^files_write_csv$', pattern: $X }
    fix: csv_write_files
  - id: r22
    rule: { regex: '^files_read_json$', pattern: $X }
    fix: json_read_files
  - id: r23
    rule: { regex: '^FILE_FORMAT_CSV$', pattern: $X }
    fix: CSV_FILE_FORMAT
transform:
  NEW:
    rewrite:
      rewriters: [r01, r02, r03, r04, r05, r06, r07, r08, r09, r10, r11, r12, r13, r14, r15, r16, r17, r18, r19, r20, r21, r22, r23]
      source: $T
fix: $NEW
