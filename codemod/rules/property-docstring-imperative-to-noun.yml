# Ruff D421 (property-docstring-starts-with-verb) root-cause codemod.
#
# ONE minimal, path-agnostic, idempotent rule that supersedes the two per-verb
# ai-hub rules (property-return/-get-docstring-to-noun-phrase). It rewrites the
# literal docstring of an exact @property whose first line opens with an
# imperative-mood verb into the required noun phrase, preserving quote style,
# byte-for-byte remainder, and additional paragraphs.
#
#   @property
#   def value(self) -> str:
#       """Return the validated value."""   ->   """The validated value."""
#
# Structural safety contract (all must hold):
#   1. node is the Python `string`, opens with triple quotes + verb + space + \S
#   2. it is inside a decorated_definition owning the exact decorator @property
#      (@override / @computed_field siblings allowed; @cached_property excluded
#       because its regex "^@property$" does not match)
#   3. src/, scripts/, cmd/, bin/, and package trees are all covered; generated
#      / vendored / archival trees are excluded.
# Idempotent: the fix strips the verb prefix, so a re-scan finds zero matches.
# Verb set mirrors Ruff's imperative-mood inventory for D401/D418 property heads.
id: property-docstring-imperative-to-noun
language: python
severity: hint
files:
  - "**/*.py"
ignores:
  - "**/.claude/**"
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
  - "**/*_pb2.py"
  - "**/*_pb2_grpc.py"
message: >-
  A property docstring must describe the attribute as a noun phrase, not issue
  an imperative command. The fix removes the exact verb prefix and capitalizes
  only the first retained character, preserving quote style and remaining
  content. See docs/ast-grep-property-docstrings.md.
rule:
  all:
    - pattern: $DOC
    - kind: string
    - regex: '^(?:"""|\x27\x27\x27)(?:Return|Returns|Get|Gets|Set|Sets|Compute|Computes|Calculate|Calculates|Fetch|Fetches|Retrieve|Retrieves|Provide|Provides|Build|Builds|Generate|Generates|Create|Creates|Determine|Determines|Give|Gives|Yield|Yields|Check|Checks|Produce|Produces)\s+\S'
    - inside:
        kind: decorated_definition
        has:
          kind: decorator
          regex: "^@property$"
        stopBy: end
transform:
  QUOTE:
    substring: { source: $DOC, startChar: 0, endChar: 3 }
  TAIL:
    replace:
      source: $DOC
      replace: '^(?:"""|\x27\x27\x27)(?:Return|Returns|Get|Gets|Set|Sets|Compute|Computes|Calculate|Calculates|Fetch|Fetches|Retrieve|Retrieves|Provide|Provides|Build|Builds|Generate|Generates|Create|Creates|Determine|Determines|Give|Gives|Yield|Yields|Check|Checks|Produce|Produces)\s+'
      by: ''
  FIRST:
    substring: { source: $TAIL, startChar: 0, endChar: 1 }
  FIRST_UP:
    convert: { source: $FIRST, toCase: upperCase }
  REST:
    substring: { source: $TAIL, startChar: 1 }
fix: $QUOTE$FIRST_UP$REST
