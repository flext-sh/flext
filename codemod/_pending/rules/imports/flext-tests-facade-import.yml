# flext_tests composes an extra test-facade family (td tf tk tm tv) beyond the
# base set (verified flext-tests/src/flext_tests/__init__.py). Detection only.
id: flext-tests-facade-import
language: python
severity: error
message: "Import only the canonical flext_tests facade aliases: base `c t p m u r e x h d s` plus the test family `td tf tk tm tv` (and `api cli main base config settings`), never a concrete `FlextTests*` class or an `as`-alias. Use `from flext_tests import tm, tv`, never `from flext_tests import FlextTestsModels`."
rule:
  kind: import_from_statement
  all:
    - has: { field: module_name, regex: '^flext_tests$' }
    - any:
        - has: { stopBy: end, kind: aliased_import }
        - has:
            stopBy: end
            kind: identifier
            all:
              - not: { regex: '^flext_tests$' }
              - not: { regex: '^(c|t|p|m|u|r|e|x|h|d|s|api|cli|main|base|config|settings|td|tf|tk|tm|tv)$' }
