version: "3.8"

services:
  # Source LDAP server with test data
  ldap-source:
    image: osixia/openldap:1.5.0
    container_name: flext-ldap-source-test
    environment:
      LDAP_ORGANISATION: "Flext Test"
      LDAP_DOMAIN: "internal.invalid"
      LDAP_ADMIN_PASSWORD: "REDACTED_LDAP_BIND_PASSWORD123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "reader"
      LDAP_READONLY_USER_PASSWORD: "reader123"
      LDAP_BACKEND: "mdb"
    ports:
      - "4389:389"
      - "4636:636"
    volumes:
      - ./ldap-data:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service --loglevel debug
    networks:
      - ldap-test

  # Target LDAP server for testing
  ldap-target:
    image: osixia/openldap:1.5.0
    container_name: flext-ldap-target-test
    environment:
      LDAP_ORGANISATION: "Flext Target"
      LDAP_DOMAIN: "internal.invalid"
      LDAP_ADMIN_PASSWORD: "REDACTED_LDAP_BIND_PASSWORD123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_BACKEND: "mdb"
    ports:
      - "4390:389"
      - "4637:636"
    networks:
      - ldap-test

  # phpLDAPREDACTED_LDAP_BIND_PASSWORD for testing and verification
  phpldapREDACTED_LDAP_BIND_PASSWORD:
    image: osixia/phpldapREDACTED_LDAP_BIND_PASSWORD:0.9.0
    container_name: flext-phpldapREDACTED_LDAP_BIND_PASSWORD
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "ldap-source,ldap-target"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8081:80"
    depends_on:
      - ldap-source
      - ldap-target
    networks:
      - ldap-test

networks:
  ldap-test:
    driver: bridge
