version: 1
default_environment: dev
project_id: flext-ldap-test-integration

environments:
  - name: dev
  - name: test

plugins:
  extractors:
    - name: tap-ldap-test
      namespace: tap_ldap
      executable: /home/marlonsc/flext/.venv/bin/flext-tap-ldap
      config:
        # Test LDAP server configuration (will use Docker compose)
        ldap_server: "localhost"
        ldap_port: 389
        bind_dn: "cn=REDACTED_LDAP_BIND_PASSWORD,dc=flext-test,dc=local"
        bind_password: "REDACTED_LDAP_BIND_PASSWORD123"
        base_dn: "dc=flext-test,dc=local"
        search_filter: "(objectClass=*)"
        # Test configuration
        page_size: 10
        connection_timeout: 30
        max_entries: 100
        attributes:
          - "dn"
          - "cn"
          - "sn"
          - "mail"
          - "uid"
          - "objectClass"
        stream_maps:
          users:
            search_filter: "(objectClass=inetOrgPerson)"
            base_dn: "ou=users,dc=flext-test,dc=local"
          groups:
            search_filter: "(objectClass=groupOfNames)"
            base_dn: "ou=groups,dc=flext-test,dc=local"

  loaders:
    - name: target-ldap-test
      namespace: target_ldap
      executable: /home/marlonsc/flext/.venv/bin/flext-target-ldap
      config:
        # Test LDAP target server
        ldap_server: "localhost"
        ldap_port: 389
        bind_dn: "cn=REDACTED_LDAP_BIND_PASSWORD,dc=flext-target,dc=local"
        bind_password: "REDACTED_LDAP_BIND_PASSWORD123"
        base_dn: "dc=flext-target,dc=local"
        # Enterprise features
        batch_size: 10
        max_retries: 3
        retry_delay: 1.0
        validate_dn_format: true
        # LDIF output for testing
        ldif_output_path: "/tmp/target-ldap-test-output.ldif"
        ldif_append_mode: false

    - name: target-ldif-test
      namespace: target_ldif
      executable: /home/marlonsc/flext/.venv/bin/flext-target-ldap
      config:
        # LDIF file output only
        output_format: "ldif"
        ldif_output_path: "/tmp/target-ldif-test-output.ldif"
        ldif_append_mode: false
        batch_size: 50
        max_retries: 2

jobs:
  - name: ldap-to-ldap-test
    tasks:
      - tap-ldap-test target-ldap-test

  - name: ldap-to-ldif-test
    tasks:
      - tap-ldap-test target-ldif-test

schedules: []
