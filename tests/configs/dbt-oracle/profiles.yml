flext_oracle_analytics:
  target: dev
  outputs:
    dev:
      type: oracle
      host: oracle-db
      port: 1521
      service_name: XEPDB1
      username: flext_dbt
      password: flext_dbt_password
      schema: FLEXT_DBT
      database: FLEXTDB
      protocol: tcp
      ssl_server_dn_match: false
      pool_min_size: 1
      pool_max_size: 5
      pool_increment: 1
      nls_date_format: "YYYY-MM-DD HH24:MI:SS"
      threads: 4
      keepalives_idle: 0
      search_path: "FLEXT_DBT"

    test:
      type: oracle
      host: oracle-db
      port: 1521
      service_name: XEPDB1
      username: flext_dbt
      password: flext_dbt_password
      schema: FLEXT_DBT_TEST
      database: FLEXTDB
      protocol: tcp
      ssl_server_dn_match: false
      pool_min_size: 1
      pool_max_size: 3
      pool_increment: 1
      threads: 2
