# Sample GitHub Actions configuration for E2E tests

name: LDAP E2E Tests

on:
  push:
    branches: [main, develop]
    paths:
      - "tap-ldap/**"
      - "target-ldap/**"
      - "dbt-ldap/**"
      - "flx-ldap/**"
      - "tests/e2e/**"
  pull_request:
    branches: [main]
    paths:
      - "tap-ldap/**"
      - "target-ldap/**"
      - "dbt-ldap/**"
      - "flx-ldap/**"
      - "tests/e2e/**"
  schedule:
    # Run nightly at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ldap-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pytest docker psycopg2-binary ldap3 faker pytest-cov pytest-xdist

          # Install project packages in development mode
          pip install -e ./tap-ldap
          pip install -e ./target-ldap
          pip install -e ./flx-ldap

          # Install dbt
          pip install dbt-postgres

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start services
        working-directory: tests/e2e
        run: |
          docker-compose up -d
          # Wait for services to be healthy
          timeout 60 bash -c 'until docker-compose ps | grep -q "healthy"; do sleep 2; done' || true
          docker-compose ps

      - name: Run E2E tests
        working-directory: tests/e2e
        run: |
          ./run_e2e_tests.py --coverage --pytest-args="-v --tb=short"
        env:
          PYTHONUNBUFFERED: 1

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./tests/e2e/htmlcov/coverage.xml
          flags: e2e
          name: e2e-coverage-${{ matrix.python-version }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            tests/e2e/htmlcov/
            tests/e2e/.coverage

      - name: Container logs on failure
        if: failure()
        working-directory: tests/e2e
        run: |
          docker-compose logs --tail=100

  e2e-performance:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pytest docker psycopg2-binary ldap3 faker
          pip install -e ./tap-ldap
          pip install -e ./target-ldap
          pip install -e ./flx-ldap

      - name: Run performance tests
        working-directory: tests/e2e
        run: |
          ./run_e2e_tests.py -k "performance" --pytest-args="-v"

      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: tests/e2e/performance-report.json
