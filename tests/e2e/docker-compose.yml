version: '3.8'

services:
  # Source LDAP server
  ldap-source:
    image: osixia/openldap:1.5.0
    container_name: e2e-ldap-source
    hostname: ldap-source.example.com
    environment:
      LDAP_LOG_LEVEL: "256"
      LDAP_ORGANISATION: "Source Organization"
      LDAP_DOMAIN: "source.example.com"
      LDAP_BASE_DN: "dc=source,dc=example,dc=com"
      LDAP_ADMIN_PASSWORD: "admin_source_password"
      LDAP_CONFIG_PASSWORD: "config_source_password"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly_source_password"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "false"
      LDAP_REPLICATION: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_SSL_HELPER_PREFIX: "ldap"
    volumes:
      - ./data/source/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - source_data:/var/lib/ldap
      - source_config:/etc/ldap/slapd.d
    ports:
      - "10389:389"
      - "10636:636"
    networks:
      - e2e-network
    command: --copy-service

  # Target LDAP server
  ldap-target:
    image: osixia/openldap:1.5.0
    container_name: e2e-ldap-target
    hostname: ldap-target.example.com
    environment:
      LDAP_LOG_LEVEL: "256"
      LDAP_ORGANISATION: "Target Organization"
      LDAP_DOMAIN: "target.example.com"
      LDAP_BASE_DN: "dc=target,dc=example,dc=com"
      LDAP_ADMIN_PASSWORD: "admin_target_password"
      LDAP_CONFIG_PASSWORD: "config_target_password"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly_target_password"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "false"
      LDAP_REPLICATION: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "false"
      LDAP_SSL_HELPER_PREFIX: "ldap"
    volumes:
      - ./data/target/ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom
      - target_data:/var/lib/ldap
      - target_config:/etc/ldap/slapd.d
    ports:
      - "11389:389"
      - "11636:636"
    networks:
      - e2e-network
    command: --copy-service

  # PostgreSQL for dbt-ldap testing
  postgres:
    image: postgres:16-alpine
    container_name: e2e-postgres
    environment:
      POSTGRES_USER: dbt_user
      POSTGRES_PASSWORD: dbt_password
      POSTGRES_DB: dbt_ldap_test
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./data/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "15432:5432"
    networks:
      - e2e-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbt_user -d dbt_ldap_test"]
      interval: 10s
      timeout: 5s
      retries: 5

  # phpLDAPadmin for debugging (optional)
  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: e2e-phpldapadmin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: |
        - Source:
            - ldap-source:389
        - Target:
            - ldap-target:389
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "18080:80"
    networks:
      - e2e-network
    depends_on:
      - ldap-source
      - ldap-target

networks:
  e2e-network:
    driver: bridge
    name: e2e-ldap-network

volumes:
  source_data:
    name: e2e-ldap-source-data
  source_config:
    name: e2e-ldap-source-config
  target_data:
    name: e2e-ldap-target-data
  target_config:
    name: e2e-ldap-target-config
  postgres_data:
    name: e2e-postgres-data
