openapi: 3.0.3
info:
  title: FLEXT API
  description: |
    Unified Hexagonal Architecture + DDD Implementation for Pipeline and Plugin Management

    ## Architecture

    FLEXT implements a clean hexagonal architecture with Domain-Driven Design patterns:

    - **Bounded Contexts**: Pipeline and Plugin domains are completely isolated
    - **Domain Events**: All operations emit domain events for integration
    - **CQRS**: Clear separation between commands and queries
    - **Dependency Injection**: Clean dependency management
    - **Plugin System**: Dynamic plugin loading and execution

    ## Features

    - 🚀 **Pipeline Execution Engine**: Execute complex data pipelines
    - 🔌 **Dynamic Plugin System**: Load and execute plugins at runtime
    - 🏗️ **Hexagonal Architecture**: Clean, maintainable, testable code
    - 📊 **Structured Logging**: Full observability and monitoring
    - 🔒 **Enterprise-Ready**: Configuration, error handling, graceful shutdown

  version: 1.0.0
  contact:
    name: FLEXT Development Team
    email: dev@flext.sh
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8081
    description: Development server
  - url: https://api.flext.sh
    description: Production server

paths:
  /health:
    get:
      summary: Health Check
      description: Returns the health status of the application
      operationId: getHealth
      tags:
        - System
      responses:
        "200":
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /metrics:
    get:
      summary: System Metrics
      description: Returns basic system metrics and statistics
      operationId: getMetrics
      tags:
        - System
      responses:
        "200":
          description: System metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricsResponse"

  /:
    get:
      summary: API Documentation
      description: Returns API documentation and available endpoints
      operationId: getApiDocs
      tags:
        - System
      responses:
        "200":
          description: API documentation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiDocsResponse"

  /api/v1/pipelines:
    get:
      summary: List Pipelines
      description: Retrieve a list of pipelines with optional filtering
      operationId: listPipelines
      tags:
        - Pipelines
      parameters:
        - name: limit
          in: query
          description: Maximum number of pipelines to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of pipelines to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: tags
          in: query
          description: Filter by tags (comma-separated)
          schema:
            type: string
      responses:
        "200":
          description: List of pipelines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineListResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Create Pipeline
      description: Create a new pipeline
      operationId: createPipeline
      tags:
        - Pipelines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePipelineRequest"
      responses:
        "201":
          description: Pipeline created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePipelineResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/pipelines/{id}:
    get:
      summary: Get Pipeline
      description: Retrieve a specific pipeline by ID
      operationId: getPipeline
      tags:
        - Pipelines
      parameters:
        - name: id
          in: path
          required: true
          description: Pipeline ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pipeline details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pipeline"
        "404":
          description: Pipeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/pipelines/{id}/steps:
    post:
      summary: Add Pipeline Step
      description: Add a new step to an existing pipeline
      operationId: addPipelineStep
      tags:
        - Pipelines
      parameters:
        - name: id
          in: path
          required: true
          description: Pipeline ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddStepRequest"
      responses:
        "201":
          description: Step added successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddStepResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Pipeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/plugins:
    get:
      summary: List Plugins
      description: Retrieve a list of registered plugins with optional filtering
      operationId: listPlugins
      tags:
        - Plugins
      parameters:
        - name: limit
          in: query
          description: Maximum number of plugins to return
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: Number of plugins to skip
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: type
          in: query
          description: Filter by plugin type
          schema:
            type: string
            enum: [source, target, transformer, utility]
        - name: status
          in: query
          description: Filter by plugin status
          schema:
            type: string
            enum: [active, inactive, registered, failed]
        - name: author
          in: query
          description: Filter by plugin author
          schema:
            type: string
      responses:
        "200":
          description: List of plugins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginListResponse"
        "400":
          description: Invalid parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      summary: Register Plugin
      description: Register a new plugin in the system
      operationId: registerPlugin
      tags:
        - Plugins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPluginRequest"
      responses:
        "201":
          description: Plugin registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPluginResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Plugin already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/plugins/{id}:
    get:
      summary: Get Plugin
      description: Retrieve a specific plugin by ID
      operationId: getPlugin
      tags:
        - Plugins
      parameters:
        - name: id
          in: path
          required: true
          description: Plugin ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plugin details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plugin"
        "404":
          description: Plugin not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"
        timestamp:
          type: string
          format: date-time
        uptime:
          type: string
          example: "2h34m12s"

    MetricsResponse:
      type: object
      properties:
        server:
          type: object
          properties:
            uptime:
              type: string
            version:
              type: string
        requests:
          type: object
          properties:
            total:
              type: string

    ApiDocsResponse:
      type: object
      properties:
        name:
          type: string
          example: "FLEXT API"
        description:
          type: string
        version:
          type: string
        endpoints:
          type: object

    Pipeline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        is_active:
          type: boolean
        steps:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStep"
        tags:
          type: array
          items:
            type: string
        configuration:
          type: object
        schedule:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: integer

    PipelineStep:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        plugin_id:
          type: string
          format: uuid
        configuration:
          type: object
        order:
          type: integer
        depends_on:
          type: array
          items:
            type: string
            format: uuid

    Plugin:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [source, target, transformer, utility]
        version:
          type: string
        description:
          type: string
        author:
          type: string
        status:
          type: string
          enum: [active, inactive, registered, failed]
        entry_point:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/Port"
        dependencies:
          type: array
          items:
            type: string
        configuration:
          type: object
        metadata:
          type: object

    Port:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        description:
          type: string
        schema:
          type: object

    CreatePipelineRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 500
        tags:
          type: array
          items:
            type: string
        configuration:
          type: object

    CreatePipelineResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid

    AddStepRequest:
      type: object
      required:
        - name
        - plugin_id
      properties:
        name:
          type: string
          maxLength: 100
        plugin_id:
          type: string
          format: uuid
        configuration:
          type: object
        depends_on:
          type: array
          items:
            type: string
            format: uuid

    AddStepResponse:
      type: object
      properties:
        step_id:
          type: string
          format: uuid

    RegisterPluginRequest:
      type: object
      required:
        - name
        - type
        - version
        - entry_point
      properties:
        name:
          type: string
          maxLength: 100
        type:
          type: string
          enum: [source, target, transformer, utility]
        version:
          type: string
        description:
          type: string
        author:
          type: string
        entry_point:
          type: string
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortDefinition"
        configuration:
          type: object

    PortDefinition:
      type: object
      required:
        - name
        - type
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
          default: false
        description:
          type: string
        schema:
          type: object

    RegisterPluginResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid

    PipelineListResponse:
      type: object
      properties:
        pipelines:
          type: array
          items:
            $ref: "#/components/schemas/Pipeline"
        total:
          type: integer

    PluginListResponse:
      type: object
      properties:
        plugins:
          type: array
          items:
            $ref: "#/components/schemas/Plugin"
        total:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          oneOf:
            - type: string
            - $ref: "#/components/schemas/APIError"

    APIError:
      type: object
      properties:
        type:
          type: string
          enum:
            [
              VALIDATION_ERROR,
              NOT_FOUND,
              CONFLICT,
              INTERNAL_ERROR,
              UNAUTHORIZED,
            ]
        message:
          type: string
        details:
          type: string

tags:
  - name: System
    description: System health, metrics and documentation endpoints
  - name: Pipelines
    description: Pipeline management operations
  - name: Plugins
    description: Plugin registration and management operations
