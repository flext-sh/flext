[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "tap-oracle-oic"
version = "1.0.0"
description = "Professional Singer tap for Oracle Integration Cloud (OIC) data extraction with OAuth2/IDCS authentication"
authors = [{ name = "Marlon Costa", email = "marlon.costa@datacosmos.com.br" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9,<4.0"
keywords = [
    "singer",
    "tap",
    "oracle",
    "oic",
    "integration",
    "cloud",
    "elt",
    "meltano",
    "oauth2",
    "idcs",
    "data-extraction",
    "etl",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Database",
    "Topic :: System :: Archiving",
    "Topic :: Office/Business",
]
dynamic = []

[project.urls]
Repository = "https://github.com/datacosmos-br/pyauto"
Documentation = "https://datacosmos-br.github.io/pyauto/"
"Bug Tracker" = "https://github.com/datacosmos-br/pyauto/issues"

[project.scripts]
tap-oracle-oic = "tap_oracle_oic.tap:TapOIC.cli"

[tool.poetry]
packages = [{ include = "tap_oracle_oic", from = "src" }]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
# Singer SDK core
singer-sdk = ">=0.41.0"
# HTTP client dependencies
httpx = ">=0.28.1"
requests = ">=2.32.0"
# Oracle OIC authentication
pyjwt = ">=2.10.1"
cryptography = ">=42.0.0"
python-jose = ">=3.3.0"
# Configuration
pydantic = ">=2.11.5"
pydantic-settings = ">=2.9.1"
python-dotenv = ">=1.1.0"
# Data processing
xmltodict = ">=0.14.2"
orjson = ">=3.10.13"
pyyaml = ">=6.0.2"
# Utilities
tenacity = ">=9.1.2"
click = ">=8.1.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = ">=8.4.0"
pytest-asyncio = "<0.24.0"
pytest-cov = ">=6.1.1"
pytest-mock = ">=3.14.1"
coverage = { extras = ["toml"], version = ">=7.8.2" }
# Code Quality
black = ">=25.1.0"
isort = ">=5.13.2"
ruff = ">=0.11.13"
mypy = ">=1.16.0"
bandit = ">=1.7.10"
# safety = ">=3.4.0"  # Disabled due to pydantic compatibility issues
# Testing dependencies
requests-mock = ">=1.12.1"
psutil = ">=6.0.0"
packaging = ">=24.0"
# Singer testing
singer-sdk = { extras = ["testing"], version = ">=0.41.0" }

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313"]
include = '\\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["tap_oracle_oic"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_reexport = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_no_return = true

[tool.ruff]
target-version = "py39"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
ignore = [
    "N818",   # Allow Exceptions to have suffix 'Exception' rather than 'Error'
    "S310",   # Allow `urllib.open`
    "S603",   # Allow `subprocess.run(..., shell=False)`
    "COM812", # Handled by the Ruff formatter
    "ISC001", # Handled by the Ruff formatter
]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "COM",   # flake8-commas
    "D",     # pydocstyle/flake8-docstrings
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle (error)
    "EM",    # flake8-errmsg
    "ERA",   # flake8-eradicate
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle (warning)
    "YTT",   # flake8-2020
]
unfixable = [
    "ERA001", # Don't remove commented-out code
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]
markers = [
    "unit: Unit tests - fast, isolated, no external dependencies",
    "integration: Integration tests - test component interactions",
    "functional: Functional tests - test end-to-end workflows",
    "performance: Performance tests - test speed and efficiency",
    "security: Security tests - test authentication and authorization",
    "regression: Regression tests - prevent known issues",
    "smoke: Smoke tests - basic functionality verification",
    "slow: Slow tests - may take significant time",
    "requires_oic: Tests requiring real OIC instance",
]
