[tool:pytest]
# Test discovery
testpaths = 
    flx/tests
    flx-database-oracle/tests
    flx-http-oracle-wms/tests
    tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, external dependencies)
    performance: Performance benchmarks
    security: Security tests
    e2e: End-to-end tests
    slow: Slow running tests
    smoke: Smoke tests (basic functionality)
    regression: Regression tests
    flx_core: FLX core framework tests
    flx_oracle: FLX Oracle database tests
    flx_wms: FLX WMS HTTP tests
    mocked: Tests with mocked dependencies
    requires_oracle: Tests requiring Oracle database
    requires_http: Tests requiring HTTP services

# Test execution options
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --color=yes
    --durations=10
    --maxfail=5
    --disable-warnings
    -ra

# Coverage configuration
# (Detailed coverage config is in pyproject.toml)

# Asyncio configuration
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

# Timeout configuration
timeout = 300
timeout_method = thread

# Parallel execution
# Use: pytest -n auto (or specific number)

# Logging configuration
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning
    ignore:.*PytestBenchmarkWarning.*
    error::pydantic.warnings.PydanticDeprecatedSince20

# Test selection patterns
# Use with: pytest -k "pattern"
# Examples:
# pytest -k "unit and not slow"
# pytest -k "integration and oracle"
# pytest -k "performance"

# Minimum version requirements
minversion = 7.0 
