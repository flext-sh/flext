# Zero-Tolerance Pre-commit Hooks Configuration
# This configuration enforces strict code quality standards

repos:
  # Code Quality Enforcement
  - repo: local
    hooks:
      - id: zero-tolerance-enforcer
        name: Zero Tolerance Code Quality Enforcer
        entry: python quality_enforcer.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [commit, push]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: requirements-txt-fixer
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python Code Formatting - STRICT
  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        args: [--line-length=88, --target-version=py313]
        language_version: python3.13

  # Import Sorting - STRICT
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=88, --force-single-line-imports]

  # Python Linting - ZERO TOLERANCE
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: v0.1.9
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --config=pyproject.toml]
      - id: ruff-format
        args: [--config=pyproject.toml]

  # Type Checking - STRICT
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml, --strict]
        additional_dependencies:
          [pydantic, sqlalchemy, types-pyyaml, types-requests]

  # Security Linting - ZERO TOLERANCE
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]

  # Docstring Linting - STRICT
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        args: [--config=pyproject.toml]

  # Dead Code Detection - ZERO TOLERANCE
  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.10
    hooks:
      - id: vulture
        args: [--min-confidence=80, src/]

  # Additional Python Checks
  - repo: https://github.com/pycqa/flake8
    rev: 6.1.0
    hooks:
      - id: flake8
        args: [--config=.flake8]
        additional_dependencies:
          [
            flake8-bugbear,
            flake8-comprehensions,
            flake8-simplify,
            flake8-pie,
            flake8-docstrings,
            flake8-type-checking,
          ]

  # Spell Checking for Comments and Docs
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args: [--write-changes]
        exclude: ^(\.git|\.pytest_cache|__pycache__|\.mypy_cache|\.ruff_cache)/

  # YAML/JSON Validation
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: [-c=.yamllint.yaml]

# Fail fast on first violation - Zero Tolerance
fail_fast: true

# Additional configurations
ci:
  autofix_commit_msg: "🤖 Auto-fix code quality violations"
  autofix_prs: true
  autoupdate_commit_msg: "🤖 Update pre-commit hooks"
  autoupdate_schedule: weekly
