[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flx"
version = "0.5.0"
description = "PyAuto Enterprise - FLX Hexagonal Architecture Framework"
authors = ["Marlon Costa <marlon.costa@datacosmos.com.br>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/datacosmos-br/flx"
documentation = "https://github.com/datacosmos-br/flx/blob/main/README.md"
keywords = ["pyauto", "enterprise", "hexagonal", "ddd", "architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
packages = [
    {include = "flx", from = "src"},
]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
pydantic = "^2.11.0"
pydantic-settings = "^2.0.0"
typing-extensions = "^4.12.0"
httpx = "^0.28.1"
structlog = "^24.4.0"
aiofiles = "^24.1.0"
rich = "^13.9.0"
click = "^8.1.7"
python-dotenv = "^1.0.1"
jsonschema = "^4.23.0"
pybreaker = "^1.0.0"
dramatiq = "^1.17.0"
loguru = "^0.7.0"
lato = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.24.0"
ruff = "^0.8.4"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.0"
types-requests = "^2.32.0"
types-setuptools = "^75.6.0"
pre-commit = "^4.0.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
ipython = "^8.12.0"

[tool.poetry.group.security.dependencies]
bandit = {extras = ["toml"], version = "^1.7.0"}
safety = "^3.2.0"

[tool.poetry.group.build.dependencies]
build = "^1.2.0"
twine = "^6.0.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/datacosmos-br/flx/issues"
"Changelog" = "https://github.com/datacosmos-br/flx/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "EM",     # flake8-errmsg
    "FA",     # flake8-future-annotations
    "ISC",    # flake8-implicit-str-concat
    "ICN",    # flake8-import-conventions
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "Q",      # flake8-quotes
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PGH",    # pygrep-hooks
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # ruff-specific
]
ignore = [
    "E501",    # line-too-long (handled by formatter)
    "PLR0913", # too-many-arguments (sometimes necessary for enterprise APIs)
    "PLR2004", # magic-value-comparison (sometimes practical)
    "TRY003",  # avoid-specifying-long-messages-outside-exception-class
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert (needed in tests)
    "PLR2004", # magic-value-comparison (common in tests)
    "ARG001",  # unused-function-argument (fixtures)
]
"examples/**/*.py" = [
    "T201",    # print statements allowed in examples
    "INP001",  # implicit-namespace-package
]

[tool.ruff.lint.isort]
known-first-party = ["flx"]
force-single-line = false
lines-between-types = 1
lines-after-imports = 2

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312", "py313"]
skip-string-normalization = false

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["flx"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
pretty = true
color_output = true
error_summary = true
disallow_any_generics = true
disallow_any_unimported = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
strict_equality = true
ignore_missing_imports = false
follow_imports = "silent"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
ignore_errors = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/pytest.xml",
    "--maxfail=10",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "hexagonal: marks tests as hexagonal architecture tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
]
data_file = "reports/.coverage"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
]

[tool.coverage.html]
directory = "reports/coverage"
title = "FLX Coverage Report"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]
