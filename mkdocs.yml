site_name: FLEXT Documentation
site_description: Enterprise Data Integration Platform - Complete Documentation Hub
site_author: FLEXT Team
site_url: https://docs.flext.sh

# Repository information
repo_name: flext-sh/flext
repo_url: https://github.com/flext-sh/flext
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2025 FLEXT Team

# Configuration
theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    # Navigation
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - header.autohide
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tabs.depth
    - content.tooltips
    # Table of contents
    - toc.follow
    - toc.integrate
    # Footer
    - footer

# Navigation structure
nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/overview.md
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quick-start.md
      - Prerequisites: getting-started/prerequisites.md
      - Development Setup: getting-started/development-setup.md
  - User Guides:
      - Data Integration:
          - Overview: user-guides/data-integration/overview.md
          - Oracle Integration: user-guides/data-integration/oracle.md
          - LDAP Integration: user-guides/data-integration/ldap.md
          - LDIF Processing: user-guides/data-integration/ldif.md
      - Authentication:
          - Overview: user-guides/authentication/overview.md
          - Setup: user-guides/authentication/setup.md
          - Security: user-guides/authentication/security.md
      - Configuration:
          - Overview: user-guides/configuration/overview.md
          - Files: user-guides/configuration/files.md
          - Environment: user-guides/configuration/environment.md
      - Troubleshooting:
          - Common Issues: user-guides/troubleshooting/common-issues.md
          - Monitoring: user-guides/troubleshooting/monitoring.md
          - Debugging: user-guides/troubleshooting/debugging.md
  - Developer Documentation:
      - Architecture:
          - Overview: developer/architecture/overview.md
          - Clean Architecture: developer/architecture/clean-architecture.md
          - Python-Go Integration: developer/architecture/python-go-integration.md
          - Package Structure: developer/architecture/pkg-structure.md
          - Current State: developer/architecture/current-state.md
      - API Development:
          - Overview: developer/api/overview.md
          - REST API: developer/api/rest-api.md
          - Python SDK: developer/api/python-sdk.md
          - Go SDK: developer/api/go-sdk.md
      - Patterns:
          - Foundation: developer/patterns/foundation.md
          - Type System: developer/patterns/types.md
          - Configuration: developer/patterns/config-cli.md
          - Error Handling: developer/patterns/error-observability.md
          - Constants: developer/patterns/constants.md
          - Utilities: developer/patterns/utilities.md
      - Deployment:
          - Overview: developer/deployment/overview.md
          - Docker: developer/deployment/docker.md
          - Kubernetes: developer/deployment/kubernetes.md
          - Production: developer/deployment/production.md
      - Contributing:
          - Overview: developer/contributing/overview.md
          - Development Guidelines: developer/contributing/guidelines.md
          - Code Standards: developer/contributing/standards.md
          - Testing: developer/contributing/testing.md
  - Reference:
      - API Reference:
          - REST API: reference/api/rest-api.md
          - Python SDK: reference/api/python-sdk.md
          - Go SDK: reference/api/go-sdk.md
          - OpenAPI Specs: reference/api/openapi/
      - Configuration:
          - Files: reference/configuration/files.md
          - Environment Variables: reference/configuration/environment.md
          - CLI Options: reference/cli/options.md
      - CLI Reference: reference/cli/README.md
  - Project Components:
      - Core Components:
          - FlexCore: projects/flexcore/README.md
          - FLEXT API: projects/flext-api/README.md
          - FLEXT CLI: projects/flext-cli/README.md
          - FLEXT Web: projects/flext-web/README.md
      - Data Integration:
          - FLEXT TAP Oracle: projects/flext-tap-oracle/README.md
          - FLEXT TAP LDAP: projects/flext-tap-ldap/README.md
          - FLEXT Target Oracle: projects/flext-target-oracle/README.md
          - FLEXT DBT Projects: projects/flext-dbt-oracle/README.md
      - Authentication & Security:
          - FLEXT Auth: projects/flext-auth/README.md
          - FLEXT LDAP: projects/flext-ldap/README.md
          - FLEXT LDIF: projects/flext-ldif/README.md
  - Standards:
      - Documentation Standards: standards/README.md
      - Writing Guide: standards/writing-guide.md
      - Style Guide: standards/style-guide.md
      - Templates: standards/templates/
      - Python Standards: standards/python.md
      - Go Standards: standards/go.md
      - API Standards: standards/api.md

# Markdown extensions
markdown_extensions:
  # Admonitions
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  # Code highlighting
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # Content organization
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  # Text formatting
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji
  - pymdownx.tasklist:
      custom_checkbox: true
  # Additional features
  - def_list
  - footnotes
  - abbr
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3

# Plugins
plugins:
  # Search
  - search:
      separator: '[\s\-\.]+'
      prebuild_index: true
      indexing: "full"
  # API documentation
  - mkdocstrings:
      handlers:
        python:
          paths: [src, flext-*/src]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            show_category_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            merge_init_into_class: true
            show_if_no_docstring: false
            filters: ["!^_"]
        go:
          paths: [flexcore, cmd]
          options:
            show_source: true
            show_root_heading: true
  # Git integration
  - git-revision-date-localized:
      enable_creation_date: true
      type: iso_datetime
  # Optimization
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  # Navigation
  - awesome-pages
  - section-index
  # Diagrams
  - mermaid2

# Extra configuration
extra:
  version:
    provider: mike
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/flext-sh/flext
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/flext/
  analytics:
    provider: google
    property: G-XXXXXXXXXX
  status:
    new: "New in this version"
    deprecated: "Deprecated"
    beta: "Beta - Critical Issues Present"

# Custom CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Watch files for live reload during development
watch:
  - src/
  - flext-*/src/
  - flexcore/
  - cmd/
  - docs/

# Validation
validation:
  nav:
    omitted_files: ignore
    not_found: warn
    absolute_links: warn
  mkdocs:
    strict: false
