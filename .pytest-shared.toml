ini_options.addopts = [
    "--cov-branch",
    "--cov-fail-under=90",
    "--cov-report=html:reports/coverage",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:reports/coverage.xml",
    "--maxfail=1000000",
    "--strict-config",
    "--strict-markers",
    "--tb=short",
    "-ra",
]
ini_options.asyncio_mode = "auto"
ini_options.filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
ini_options.markers = [
    "cleanup: Cleanup tests",
    "dbt: dbt transformation tests",
    "destructive: Tests that may modify external systems",
    "e2e: End-to-end tests",
    "integration: Integration tests",
    "oracle: Oracle database tests",
    "performance: Performance tests",
    "slow: Slow tests",
    "smoke: Smoke tests",
    "tap: Singer tap tests",
    "target: Singer target tests",
    "unit: Unit tests",
]
ini_options.minversion = "8.0"
ini_options.testpaths = ["tests"]
