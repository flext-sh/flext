[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flext-workspace"
version = "1.0.0"
description = "FLEXT - Workspace Coordinator for Submodules"
authors = ["FLEXT Team <team@flext.io>"]
maintainers = ["FLEXT Team <team@flext.io>"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/flext-sh/flext"
repository = "https://github.com/flext-sh/flext"
documentation = "https://flext.readthedocs.io"
keywords = [
    "data-integration", "etl", "meltano", "enterprise", "async",
    "ldap", "oracle", "grpc", "api", "authentication", "monitoring"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators", 
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Database",
    "Typing :: Typed",
    "Framework :: AsyncIO",
    "Framework :: Pydantic",
    "Framework :: FastAPI",
    "Framework :: Django",
]
# Workspace coordinator mode - no package installation
package-mode = false

[tool.black]
line-length = 88
target-version = [ "py39",]
include = "\\\\.pyi?$"
extend-exclude = "/(\n  # Directories to exclude\n  __pycache__|\n  .git|\n  .mypy_cache|\n  .pytest_cache|\n  .ruff_cache|\n  .venv|\n  venv|\n  build|\n  dist|\n  htmlcov|\n  node_modules\n)/\n"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [ "flext", "flext_database_oracle", "flext_http_oracle_oic", "flext_http_oracle_wms", "flext_adapter_example", "algar_oud_mig", "gn_oic_wms_db",]
known_local_folder = [ "algar_oud_mig", "gn_oic_wms_db",]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false
[[tool.mypy.overrides]]
module = [ "ldif.*", "singer.*", "meltano.*",]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tests.*", "conftest",]
ignore_errors = false
disallow_untyped_defs = false

[tool.ruff]
target-version = "py39"
line-length = 88
src = [ "src", "tests", "scripts", "flext/src", "*/src",]
extend-exclude = [ "__pycache__", ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "venv", "build", "dist", "htmlcov",]

[tool.bandit]
exclude_dirs = [ "tests", "scripts",]
skips = [ "B101", "B601",]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# No extras for workspace coordinator - each submodule has its own extras
# [tool.poetry.extras]

# No scripts - cada submodule tem seus próprios scripts
# [tool.poetry.scripts]
# Os scripts estão definidos nos submodules individuais

[tool.poetry.dependencies]
python = "^3.13"

# Core dependencies - essential for all functionality
pydantic = "^2.9.0"
pydantic-settings = "^2.4.0"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
click = "^8.1.7"
rich = "^13.8.0"
# asyncio-compat = "^0.1.2"  # Not a real package

# WORKSPACE COORDINATOR - cada projeto é um submodule independente
# Core framework modules (local development when needed)
# flext-core = {path = "./flext-core", develop = true}
# flext-auth = {path = "./flext-auth", develop = true}
# flext-api = {path = "./flext-api", develop = true}
# flext-grpc = {path = "./flext-grpc", develop = true}
# flext-web = {path = "./flext-web", develop = true}
# flext-cli = {path = "./flext-cli", develop = true}
# flext-plugin = {path = "./flext-plugin", develop = true}
# flext-meltano = {path = "./flext-meltano", develop = true}
# flext-observability = {path = "./flext-observability", develop = true}
# flext-ldap = {path = "./flext-ldap", develop = true}

# Singer/Meltano protocol modules (submodules independentes)
# flext-tap-ldap = {path = "./flext-tap-ldap", develop = true, optional = true}
# flext-tap-oracle-oic = {path = "./flext-tap-oracle-oic", develop = true, optional = true}
# flext-tap-oracle-wms = {path = "./flext-tap-oracle-wms", develop = true, optional = true}
# flext-target-ldap = {path = "./flext-target-ldap", develop = true, optional = true}
# flext-target-oracle-oic = {path = "./flext-target-oracle-oic", develop = true, optional = true}
# flext-target-oracle-wms = {path = "./flext-target-oracle-wms", develop = true, optional = true}
# flext-dbt-ldap = {path = "./flext-dbt-ldap", develop = true, optional = true}
# flext-oracle-oic-ext = {path = "./flext-oracle-oic-ext", develop = true, optional = true}

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.14.0"

# Code quality
ruff = "^0.8.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.13.0"
bandit = "^1.7.0"
pre-commit = "^4.0.0"

# Type stubs - CENTRALIZED (only for libs without built-in types)
types-requests = "^2.32.4.20250611"
types-pyyaml = "^6.0.12.20250516"
types-python-dateutil = "^2.9.0.20250516"
types-toml = "^0.10.8.20240310"
types-setuptools = "^75.6.0.20241126"
types-psutil = "^6.1.0.20241106"
# Note: oracledb 2.0+, sqlalchemy 2.0+, uvloop, fastapi, pydantic have built-in types
# Note: ldap3 may have built-in types - need to verify

# Documentation (Python 3.10+ only)
sphinx = {version = "^8.0.0", python = ">=3.10"}
sphinx-rtd-theme = {version = "^3.0.0", python = ">=3.10"}
myst-parser = {version = "^4.0.0", python = ">=3.10"}

# Development tools (Python 3.10+ only)
ipython = {version = "^8.29.0", python = ">=3.10"}
jupyter = {version = "^1.1.1", python = ">=3.10"}
rich-traceback = "^1.0.3"
vulture = "^2.14"

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "UP", "N", "B", "C4", "DTZ", "T20", "ISC", "PIE", "PT", "RET",]
ignore = [ "E501", "PLR0913", "PLR2004", "TRY003",]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--cov-fail-under=85", "--cov-report=term-missing:skip-covered", "--cov-report=html:reports/coverage", "--cov-report=xml:reports/coverage.xml",]
testpaths = [ "tests", "*/tests",]
markers = [ "unit: Unit tests", "integration: Integration tests", "e2e: End-to-end tests", "slow: Slow tests", "oracle: Tests requiring Oracle database", "redis: Tests requiring Redis",]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [ "src", "flext/src", "*/src",]
omit = [ "*/tests/*", "*/migrations/*", "*/__pycache__/*", "*/venv/*", "*/.venv/*",]

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", "def __repr__", "if self.debug:", "if settings.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod",]

# Singer/Meltano SDK for individual submodules if needed
# singer-sdk = {version = "^0.44.0", optional = true}

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101", "PLR2004", "ARG001",]
"scripts/*" = [ "T201", "T203",]

[tool.ruff.lint.pydocstyle]
convention = "google"
