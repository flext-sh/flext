reportUnusedFunction = "error"
reportUnusedImport = "error"
reportUnusedVariable = "error"
typeCheckingMode = "strict"

[[tool.pyright.executionEnvironments]]
root = "examples"
extraPaths = [".", "src"]
reportPrivateUsage = "error"

[[tool.pyright.executionEnvironments]]
root = "scripts"
extraPaths = [".", "src"]
reportPrivateUsage = "error"

[[tool.pyright.executionEnvironments]]
root = "src"
extraPaths = ["src"]
reportPrivateUsage = "error"

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = [".", "src"]
reportPrivateUsage = "error"

[tool.pytest.ini_options]
addopts = [
  "--benchmark-disable",
  "--strict-markers",
  "--markdown-docs",
  "--durations=10",
  "--flext-enforce-strict",
]
flext_slow_timeout_seconds = "30"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  "module::flext_core._constants.enforcement.FlextMroViolation",
  "once::pytest.PytestAssertRewriteWarning",
]
markers = [
  "smoke: public-interface smoke tests",
  "unit: unit tests",
  "integration: integration tests",
  "functional: functional behavior tests",
  "performance: performance and benchmark tests",
  "slow: slow-running tests",
  "docker: tests requiring Docker",
  "oracle: tests requiring the shared Oracle database",
  "remote: tests requiring remote/external network services",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "stress: stress tests",
  "resilience: resilience tests",
  "discovery: catalog and stream discovery tests",
  "singer: Singer protocol contract tests",
  "requires_engine: native check engine required by this test",
]
minversion = "8.0"
python_classes = ["Test*"]
python_files = ["*_test.py", "*_tests.py", "test_*.py"]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = [
  "**/.archive/**",
  "**/.agents/aihub-hooks/**",
  "**/.claude/aihub-hooks/**",
  "**/.codex/aihub-hooks/**",
  "**/.cursor/aihub-hooks/**",
  "**/.gemini/aihub-hooks/**",
  "**/protos/**",
]
fix = false
line-length = 88
namespace-packages = ["tests", "examples", "scripts"]
preview = true
respect-gitignore = true
show-fixes = true
src = ["examples", "scripts", "src", "tests"]
target-version = "py313"

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint]
ignore = [
  "missing-trailing-comma",
  "non-empty-init-module",
  "runtime-import-in-type-checking-block",
  "typing-only-first-party-import",
  "typing-only-standard-library-import",
  "typing-only-third-party-import",
]
extend-safe-fixes = [
  "camelcase-imported-as-lowercase",
  "relative-imports",
  "typing-only-first-party-import",
]
extend-select = ["missing-blank-line-after-last-section"]
select = ["ALL"]
unfixable = [
  "multi-value-repeated-key-literal",
  "multi-value-repeated-key-variable",
  "p-print",
  "print",
  "pytest-duplicate-parametrize-test-cases",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "Copyright \\(c\\) \\d{4} \\S[^\\n]*\\. All rights reserved\\."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "examples.m.BaseModel",
  "flext.m.Value",
  "flext_core.FlextConfig",
  "flext_core.FlextSettings",
  "flext_infra.m.BaseModel",
  "flext_tests.FlextTestsModels.Tests",
  "flext_tests.FlextTestsServiceBase",
  "pydantic.BaseModel",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api.argparse]
msg = "Use cli.register_result_command + Pydantic model from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.click]
msg = "Use flext_cli.cli application, registration, execution, and invocation methods."

[tool.ruff.lint.flake8-tidy-imports.banned-api.rich]
msg = "Use cli.print / cli.display_message / cli.render_panel / cli.render_table."

[tool.ruff.lint.flake8-tidy-imports.banned-api.tabulate]
msg = "Use cli.render_table from flext_cli."

[tool.ruff.lint.flake8-tidy-imports.banned-api.typer]
msg = "Use cli.create_app_with_common_params / cli.register_command from flext_cli."

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false
known-first-party = [
  "flext",
  "flext_api",
  "flext_auth",
  "flext_cli",
  "flext_core",
  "flext_db_oracle",
  "flext_dbt_ldap",
  "flext_dbt_ldif",
  "flext_dbt_oracle",
  "flext_dbt_oracle_wms",
  "flext_grpc",
  "flext_infra",
  "flext_ldap",
  "flext_ldif",
  "flext_meltano",
  "flext_observability",
  "flext_oracle_oic",
  "flext_oracle_wms",
  "flext_plugin",
  "flext_quality",
  "flext_tap_ldap",
  "flext_tap_ldif",
  "flext_tap_oracle",
  "flext_tap_oracle_oic",
  "flext_tap_oracle_wms",
  "flext_target_ldap",
  "flext_target_ldif",
  "flext_target_oracle",
  "flext_target_oracle_oic",
  "flext_target_oracle_wms",
  "flext_tests",
  "flext_web",
]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__base__", "__bases__"]

[tool.tomlsort]
all = true
in_place = true
sort_first = ["project", "build-system", "tool", "dependency-groups"]

[tool.vulture]
exclude = ["*/_protocols/*"]
min_confidence = 100
paths = ["src"]
verbose = false

[tool.yamlfix]
explicit_start = false
line_length = 88
preserve_quotes = true
section_whitelines = 1
whitelines = 1

[tool.uv]
constraint-dependencies = ["mypy<2.4.0"]
environments = ["sys_platform == 'linux'", "sys_platform == 'darwin'"]
link-mode = "copy"
