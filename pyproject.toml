# [MANAGED] FLEXT pyproject standardization
# Sections with [MANAGED] are enforced by flext_infra.deps.modernizer.
# Run `make mod` to regenerate all managed pyproject sections.
# Sections with [CUSTOM] are project-specific extension points.
# [MANAGED] build system
[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

# [CUSTOM] project metadata
[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "flext-core",
  "flext-infra",
  "flext-tests",
  "importlib-resources>=7.1.0",
  "pydantic>=2.13.3",
]
description = "FLEXT - Enterprise Data Integration Platform - Workspace Manager"
keywords = [ "coordination", "enterprise", "flext", "typed", "workspace" ]
license = "MIT"
name = "flext"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0-dev"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"

# [MANAGED] consolidated development dependencies
[project.optional-dependencies]
dev = [
  "autoflake>=2.3.1",
  "bandit>=1.8",
  "black>=26.5.1",
  "blacken-docs>=1.20.0",
  "codespell>=2.3",
  "deptry>=0.23",
  "django-stubs>=6.0.6",
  "factory-boy>=3.3.1",
  "faker>=37.4",
  "hypothesis>=6.157.2",
  "isort>=8.0.1",
  "matplotlib-stubs>=0.3",
  "mkdocs-awesome-pages-plugin>=2.9",
  "mkdocs-encryptcontent-plugin>=2",
  "mkdocs-exclude>=1.0.2",
  "mkdocs-get-deps>=0.2",
  "mkdocs-git-revision-date-localized-plugin>=1.2",
  "mkdocs-literate-nav>=0.6",
  "mkdocs-macros-plugin>=1",
  "mkdocs-material-extensions>=1.3.1",
  "mkdocs-material>=9.5",
  "mkdocs-mermaid2-plugin>=1.1",
  "mkdocs-minify-plugin>=0.7",
  "mkdocs-print-site-plugin>=0.8",
  "mkdocs-redirects>=1.2",
  "mkdocs-section-index>=0.3.12",
  "mkdocs-versioning>=0.2",
  "mkdocs>=1.6",
  "mkdocstrings-python>=1.7",
  "mkdocstrings>=0.24",
  "pip-audit>=2.10.1",
  "pre-commit>=4.6.0",
  "pylint>=3.3",
  "pyrefly>=1.1.1,<1.2.0",
  "pytest-benchmark>=5.2.3",
  "pytest-clarity>=1.0.1",
  "pytest-codeblocks>=0.17.0",
  "pytest-cov>=6.2",
  "pytest-deadfixtures>=2.2.1",
  "pytest-env>=1.1.5",
  "pytest-markdown-docs>=0.9.2",
  "pytest-mock>=3.14",
  "pytest-randomly>=3.16",
  "pytest-sugar>=1",
  "pytest-timeout>=2.4",
  "pytest-xdist>=3.8",
  "pytest>=8.4",
