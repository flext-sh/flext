reportAttributeAccessIssue = false
root = "flext-ldif/tests/helpers"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--tb=short",
  "-p no:sugar",
  "-q",
  "-ra",
  "--timeout=30",
  "--timeout-method=signal",
  "--durations=0",
]
filterwarnings = [
  "ignore::DeprecationWarning:pyasn1(.*|$)",
]
markers = [
  "docker: marca testes que requerem Docker",
  "e2e: marca testes como testes de integração end-to-end",
  "edge_cases: marca testes de casos extremos",
  "integration: marca testes como testes de integração",
  "integrity: marca testes de integridade",
  "oracle: marca testes específicos do Oracle",
  "performance: marca testes de performance",
  "resilience: marca testes de resiliência",
  "slow: marca testes como execução lenta",
  "stress: marca testes de stress",
  "unit: marca testes como testes unitários",
]
minversion = "8.0"
python_classes = [
  "Test*",
]
python_files = [
  "*_test.py",
  "*_tests.py",
  "test_*.py",
]
python_functions = [
  "test_*",
]
pythonpath = [
  ".",
  "src",
]
testpaths = [
  "tests/",
]

# [MANAGED] pyrefly
[tool.pyrefly]
project-excludes = [ "**/*_pb2*.py", "**/*_pb2_grpc*.py" ]
search-path = [
            "typings",
            "typings/generated",
            "src",
            "examples",
            "scripts",
        ]

[[tool.pyrefly.sub-config]]
matches = "**/typings.py"

[tool.pyrefly.sub-config.errors]
unknown-name = false

# [MANAGED] ruff
[tool.ruff]
extend = "./ruff-shared.toml"

[tool.ruff.lint.isort]
known-first-party = [
  "flext",
  "flext_tools",
]

[tool.bandit]
# Skip known false positives for CLI tools and quality analysis
exclude_dirs = [
  ".git",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "node_modules",
  "tests",
  "typings",
  "vendor",
]
skips = [
  "B404", # subprocess import - required for CLI tool execution
  "B603", # subprocess without shell=True - actually MORE secure
  "B607", # partial paths - standard for CLI tool discovery via PATH
  "B105", # "PASS" constant - not a password, it's a result status
  "B608", # hardcoded_sql_expressions - DBT/template code-gen; identifiers from config
]

[tool.vulture]
exclude = [
  ".*/examples/",
  ".*/scripts/",
  ".*/tests/",
  ".coverage.*",
  ".git/",
  ".mypy_cache/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  "__pycache__/",
  "build/",
  "dist/",
  "node_modules/",
  "tests/",
  "typings/",
  "vendor/",
]
min_confidence = 80
paths = [
  "**/src",
  "src",
]
sort_by_size = true
verbose = false

# ============================================
# REFURB - Python Modernization
# ============================================
# ============================================
# COMPLEXIPY - Cognitive Complexity
# ============================================
[tool.complexipy]
max_complexity = 15
output_format = "plain"

# ============================================
# CODESPELL - Spell Checking
# ============================================
# [MANAGED] codespell
[tool.codespell]
ignore-words-list = "dn,cn,ou,uid,sn,aci,acl,ldif,flext,FLEXT,dbt,oic,wms,grpc,meltano,protobuf,creds,assertIn"
skip = ".git,*.lock,*.egg-info,dist,build,.venv,__pycache__,.mypy_cache,.pytest_cache,.ruff_cache,node_modules,typings,vendor,*.pb2*.py"

# ============================================
# COVERAGE - Test Coverage Configuration
# ============================================
[tool.coverage.run]
branch = true
omit = [
  "*/tests/*",
  "*/__pycache__/*",
  "*/_pb2*.py",
  "*/conftest.py",
]
relative_files = true
source = ["src/flext"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  'if __name__ == .__main__.:',
  'if __name__ == "__main__":',
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@abstractmethod",
  "^\\s*\\.\\.\\.\\s*$",
  "def __repr__",
  "def __str__",
]
fail_under = 100
partial_branches = [
  "pragma: no branch",
]
precision = 2
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"
