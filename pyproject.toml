[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101", "PLR2004", "D", "ANN",]
"*/tests/*" = [ "S101", "PLR2004", "D", "ANN",]
"__init__.py" = [ "D104",]
"conftest.py" = [ "D",]
"scripts/*" = [ "T201", "D", "ERA001",]
"examples/*" = [ "T201", "D", "ERA001",]

[tool.ruff.lint.pydocstyle]
