[tool.vulture]
exclude = [
    ".venv/",
    "pkg/controlpanel/management/container/venv/",
    "__pycache__/",
    "*_pb2*.py",
]
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.mark.*",
    "@override",
    "@abstractmethod",
    "@handler",
    "@field_validator",
    "@model_validator",
    "@app.route",
    "@router.*",
]
ignore_names = [
    "test_*",
    "conftest",
]
min_confidence = 80
paths = [
    "vulture_whitelist.py",
    "src/",
    "tests/",
    "examples/",
    "docker/",
    "scripts/",
    ".claude/skills/",
]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
]
markers = [
  "docker: tests requiring Docker",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "integration: integration tests",
  "performance: performance and benchmark tests",
  "resilience: resilience tests",
  "slow: slow-running tests",
  "stress: stress tests",
  "unit: unit tests",
]
minversion = "8.0"
python_classes = [
  "Test*",
]
python_files = [
  "*_test.py",
  "*_tests.py",
  "test_*.py",
]

# [MANAGED] pyrefly

[tool.coverage.report]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
  "types-flask (>=1.1.6,<2.0.0)",
]
