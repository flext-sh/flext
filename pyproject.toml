dependencies.pyyaml = ">=6.0"
dependencies.rich = ">=14.0.0"
dependencies.structlog = ">=25.4.0"
dependencies.toml = ">=0.10.2"
dependencies.tomli-w = ">=1.2.0"
dependencies.tomlkit = ">=0.13.3"
dependencies.trio = ">=0.31.0"
dependencies.pydantic-core = ">=2.41.4"
dependencies.trafilatura = ">=2.0.0"
