[tool.vulture]
exclude = [
    "__pycache__/",
    ".*/examples/",
    ".*/generate_config.py",
    ".*/manage.py",
    ".*/scripts/",
    ".*/tests/",
    ".coverage.*",
    ".git/",
    ".mypy_cache/",
    ".ruff_cache/",
    ".pytest_cache/",
    ".venv/",
    "build/",
    "dist/",
    "node_modules/",
    "tests/",
    "vendor/",
]
# ignore_decorators = ["@app.route", "@require_*"]
# ignore_names = ["visit_*", "do_*"]
min_confidence = 80
paths = ["src"]
sort_by_size = true
