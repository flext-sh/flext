[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flext"
version = "0.6.0"
description = "FLEXT - Multi-Project Workspace Coordinator for Enterprise Data Integration"
authors = ["FLEXT Team <team@flext.sh>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/flext-sh/flext"
repository = "https://github.com/flext-sh/flext"
documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
keywords = [
    "flext",
    "workspace",
    "data-integration",
    "etl",
    "meltano",
    "enterprise",
    "async",
    "ldap",
    "oracle",
    "grpc",
    "api",
    "authentication",
    "monitoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]
packages = [
    { include = "flext", from = "src" },
]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
# Core dependencies (bleeding-edge)
pydantic = ">=2.11.0,<3.0.0"
pydantic-settings = ">=2.7.0,<3.0.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.32.0,<1.0.0"
click = ">=8.1.7,<9.0.0"
rich = ">=13.9.0,<14.0.0"
typer = ">=0.15.0,<1.0.0"
structlog = ">=24.0.0,<25.0.0"
httpx = ">=0.28.0,<1.0.0"
aiofiles = ">=24.1.0,<25.0.0"
python-dateutil = ">=2.9.0,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
typing-extensions = ">=4.12.0,<5.0.0"

# Local flext packages - workspace management
flext-core = { path = "./flext-core", develop = true }
flext-api = { path = "./flext-api", develop = true, optional = true }
flext-auth = { path = "./flext-auth", develop = true, optional = true }
flext-grpc = { path = "./flext-grpc", develop = true, optional = true }
flext-cli = { path = "./flext-cli", develop = true, optional = true }
flext-web = { path = "./flext-web", develop = true, optional = true }
flext-observability = { path = "./flext-observability", develop = true, optional = true }
flext-plugin = { path = "./flext-plugin", develop = true, optional = true }
flext-meltano = { path = "./flext-meltano", develop = true, optional = true }
flext-ldap = { path = "./flext-ldap", develop = true, optional = true }
flext-db-oracle = { path = "./flext-db-oracle", develop = true, optional = true }
flext-quality = { path = "./flext-quality", develop = true, optional = true }

# Data integration taps/targets
flext-tap-ldap = { path = "./flext-tap-ldap", develop = true, optional = true }
flext-tap-oracle-oic = { path = "./flext-tap-oracle-oic", develop = true, optional = true }
flext-tap-oracle-wms = { path = "./flext-tap-oracle-wms", develop = true, optional = true }
flext-target-ldap = { path = "./flext-target-ldap", develop = true, optional = true }
flext-target-oracle = { path = "./flext-target-oracle", develop = true, optional = true }
flext-target-oracle-oic = { path = "./flext-target-oracle-oic", develop = true, optional = true }
flext-dbt-ldap = { path = "./flext-dbt-ldap", develop = true, optional = true }

# Extensions
flext-oracle-oic-ext = { path = "./flext-oracle-oic-ext", develop = true, optional = true }
flext-meltano-bridge = { path = "./flext-meltano-bridge", develop = true, optional = true }

# Project-specific applications
client-a-oud-mig = { path = "./client-a-oud-mig", develop = true, optional = true }
client-b-poc-oic-wms = { path = "./client-b-poc-oic-wms", develop = true, optional = true }
client-b-meltano-native = { path = "./client-b-meltano-native", develop = true, optional = true }

[tool.poetry.group.dev.dependencies]
# Testing framework - Bleeding-edge versions
pytest = "^8.4.0"
pytest-asyncio = "^0.26.0"
pytest-cov = "^6.2.0"
pytest-xdist = "^3.8.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.4.0"
pytest-benchmark = "^5.1.0"
pytest-randomly = "^3.16.0"
pytest-sugar = "^1.0.0"
pytest-clarity = "^1.0.1"
pytest-deadfixtures = "^2.2.1"
pytest-env = "^1.1.5"
pytest-httpx = "^0.34.0"
hypothesis = "^6.125.0"
faker = "^33.1.0"
factory-boy = "^3.3.1"

# Code quality tools - Bleeding-edge versions
ruff = "^0.8.6"
black = "^24.10.0"
isort = "^5.13.2"
mypy = "^1.13.0"
pylint = "^3.3.0"

# Code analysis & metrics
vulture = "^2.13"
radon = "^6.0.1"
pre-commit = "^4.0.1"
codespell = "^2.3.0"
pyupgrade = "^3.19.0"
autoflake = "^2.3.1"

# Type stubs
types-requests = "^2.32.4"
types-setuptools = "^75.8.2"
types-python-dateutil = "^2.9.0"
types-pyyaml = "^6.0.12"
types-redis = "^4.6.0"
types-psutil = "^6.1.0"

# Documentation tools
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.15"
mkdocstrings = { extras = ["python"], version = "^0.27.0" }
mkdocs-gen-files = "^0.5.0"
mkdocs-literate-nav = "^0.6.0"

# Development experience
ipython = "^8.37.0"
jupyter = "^1.1.1"
rich-traceback = "^1.0.3"

[tool.poetry.group.test.dependencies]
# Test data & factories
faker = "^30.8.0"
factory-boy = "^3.3.0"
hypothesis = "^6.115.0"
testcontainers = "^4.9.0"
memory-profiler = "^0.61.0"

[tool.poetry.group.security.dependencies]
# Security tools (bleeding-edge)
bandit = { extras = ["toml"], version = "^1.8.0" }
safety = "^3.2.10"
pip-audit = "^2.7.3"
semgrep = "^1.128.0"

[tool.poetry.group.build.dependencies]
# Build tools
build = "^1.2.2"
twine = "^6.1.0"

[tool.poetry.group.load.dependencies]
# Load testing
locust = "^2.31.0"

[tool.poetry.extras]
# Feature groups
api = ["flext-api", "flext-auth", "flext-grpc"]
web = ["flext-web", "flext-api", "flext-auth"]
cli = ["flext-cli"]
data = ["flext-tap-ldap", "flext-tap-oracle-oic", "flext-tap-oracle-wms", "flext-target-ldap", "flext-target-oracle", "flext-target-oracle-oic", "flext-dbt-ldap"]
ldap = ["flext-ldap", "flext-tap-ldap", "flext-target-ldap", "flext-dbt-ldap"]
oracle = ["flext-db-oracle", "flext-tap-oracle-oic", "flext-tap-oracle-wms", "flext-target-oracle", "flext-target-oracle-oic", "flext-oracle-oic-ext"]
meltano = ["flext-meltano", "flext-meltano-bridge", "client-b-meltano-native"]
monitoring = ["flext-observability", "flext-quality"]
plugins = ["flext-plugin"]
projects = ["client-a-oud-mig", "client-b-poc-oic-wms"]
all = [
    "flext-api", "flext-auth", "flext-grpc", "flext-cli", "flext-web",
    "flext-observability", "flext-plugin", "flext-meltano", "flext-ldap",
    "flext-db-oracle", "flext-quality", "flext-tap-ldap", "flext-tap-oracle-oic",
    "flext-tap-oracle-wms", "flext-target-ldap", "flext-target-oracle",
    "flext-target-oracle-oic", "flext-dbt-ldap", "flext-oracle-oic-ext",
    "flext-meltano-bridge", "client-a-oud-mig", "client-b-poc-oic-wms",
    "client-b-meltano-native"
]

[tool.poetry.scripts]
flext = "flext.cli:main"
flext-workspace = "flext.workspace:main"
flext-dev = "flext.dev:main"

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = "/(\n    __pycache__\n  | .git\n  | .mypy_cache\n  | .pytest_cache\n  | .ruff_cache\n  | .venv\n  | venv\n  | build\n  | dist\n  | htmlcov\n  | node_modules\n)/\n"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [
    "flext",
    "flext_core",
    "flext_auth",
    "flext_api",
    "flext_grpc",
    "flext_web",
    "flext_cli",
    "flext_plugin",
    "flext_observability",
    "flext_meltano",
    "flext_tap_ldap",
    "flext_tap_oracle_oic",
    "flext_tap_oracle_wms",
    "flext_target_ldap",
    "flext_target_oracle_oic",
    "flext_dbt_ldap",
    "flext_oracle_oic_ext",
    "client-a_oud_mig",
    "client-b_poc_oic_wms",
]
known_local_folder = ["client-a_oud_mig", "client-b_poc_oic_wms"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
ignore_missing_imports = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = true
disallow_any_explicit = false
strict_optional = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "ldif.*",
    "singer.*",
    "meltano.*",
    "oracledb.*",
    "fire.*",
    "ldap3.*",
    "prefect.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "*/tests/*"]
ignore_errors = false
disallow_untyped_defs = false

[tool.ruff]
target-version = "py313"
line-length = 88
fix = true
show-fixes = true
output-format = "github"
respect-gitignore = true
src = ["src", "tests", "scripts", "*/src"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
# Enable ALL rules for maximum quality (FLEXT Standard)
select = ["ALL"]
preview = true

# ONLY ignore absolute conflicts and formatter issues
ignore = [
    # ===== FORMATTER CONFLICTS (MANDATORY TO IGNORE) =====
    "COM812",  # trailing-comma-missing (handled by formatter)
    "ISC001",  # implicit-str-concat (conflicts with formatter)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-docstring-summary-second-line (conflicts with D212)

    # ===== REASONABLE FLEXIBILITY (FLEXT APPROVED) =====
    "TD003",   # Missing issue link on TODO
    "FIX002",  # Line contains TODO
    "ERA001",  # Commented out code (development)
    "PLR0912", # Too many branches (refactor gradually)
    "PLR0913", # Too many arguments (refactor gradually)
    "PLR0915", # Too many statements (refactor gradually)
    "PLR2004", # Magic value used in comparison (case by case)
    "C901",    # Too complex (refactor gradually)
    "BLE001",  # Do not catch blind exception (fix gradually)
    "TRY003",  # Avoid specifying long messages outside exception class
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert (pytest requirement)
    "S106",    # Possible hardcoded password (test fixtures)
    "PLR2004", # Magic values (test data)
    "ANN",     # Type annotations (optional in tests)
    "D",       # Docstrings (optional in tests)
    "ARG",     # Unused arguments (fixtures)
    "FBT",     # Boolean trap (test parameters)
    "SLF001",  # Private member access (testing)
    "DTZ001",  # Timezone aware datetime (test data)
    "PLC0415", # Import should be placed at top of module (test utilities)
]
"scripts/*.py" = [
    "T201",    # Print statements (allowed in scripts)
    "S603",    # subprocess without shell=True (scripts)
    "S607",    # Starting a process with a partial path (scripts)
    "ANN",     # Type annotations (optional in scripts)
    "D",       # Docstrings (optional in scripts)
    "EXE001",  # Shebang is present but file is not executable
]
"*/__init__.py" = [
    "F401",    # Module imported but unused (re-exports)
    "D104",    # Missing docstring in public package
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.vulture]
min_confidence = 100
paths = ["src"]
exclude = ["tests/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post"]
ignore_names = ["_*"]
make_whitelist = true
sort_by_size = true

[tool.radon]
exclude = ["tests/*", "*/tests/*"]
ignore = ["F401"]
total_average = true
show_complexity = true
average = true
order = "SCORE"
