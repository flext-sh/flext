[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext-workspace"
version = "1.0.0"
description = "FLEXT - Multi-Project Workspace Coordinator for Enterprise Data Integration"
authors = [{ name = "FLEXT Team", email = "team@flext.sh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13"
keywords = [
    "flext",
    "workspace",
    "data-integration",
    "etl",
    "meltano",
    "enterprise",
    "async",
    "ldap",
    "oracle",
    "grpc",
    "api",
    "authentication",
    "monitoring"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed"]
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.5.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "click>=8.1.7",
    "rich>=13.9.0",
    "typing-extensions>=4.12.0"]

[project.urls]
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
"Bug Tracker" = "https://github.com/flext-sh/flext/issues"
Changelog = "https://github.com/flext-sh/flext/blob/main/CHANGELOG.md"

[tool.poetry]
# Workspace coordinator mode - no package installation
package-mode = true

[tool.poetry.dependencies]
python = "^3.13"

# Core workspace dependencies - minimal for coordination
pydantic = "^2.11.0"
pydantic-settings = "^2.5.0"
fastapi = "^0.115.0"
uvicorn = "^0.32.0"
click = "^8.1.7"
rich = "^13.9.0"
typing-extensions = "^4.12.0"

# WORKSPACE COORDINATOR - Each project is an independent submodule
# Local development paths (uncomment when needed for integrated development)
# flext-core = {path = "./flext-core", develop = true}
# flext-auth = {path = "./flext-auth", develop = true}
# flext-api = {path = "./flext-api", develop = true}
# flext-grpc = {path = "./flext-grpc", develop = true}
# flext-web = {path = "./flext-web", develop = true}
# flext-cli = {path = "./flext-cli", develop = true}
# flext-plugin = {path = "./flext-plugin", develop = true}
# flext-meltano = {path = "./flext-meltano", develop = true}
# flext-observability = {path = "./flext-observability", develop = true}
# flext-ldap = {path = "./flext-ldap", develop = true}
# flext-quality = {path = "./flext-quality", develop = true}
# flext-db-oracle = {path = "./flext-db-oracle", develop = true}

# Singer/Meltano protocol modules (independent submodules)
# flext-tap-ldap = {path = "./flext-tap-ldap", develop = true, optional = true}
# flext-tap-oracle-oic = {path = "./flext-tap-oracle-oic", develop = true, optional = true}
# flext-tap-oracle-wms = {path = "./flext-tap-oracle-wms", develop = true, optional = true}
# flext-target-ldap = {path = "./flext-target-ldap", develop = true, optional = true}
# flext-target-oracle-oic = {path = "./flext-target-oracle-oic", develop = true, optional = true}
# flext-target-oracle-wms = {path = "./flext-target-oracle-wms", develop = true, optional = true}
# flext-dbt-ldap = {path = "./flext-dbt-ldap", develop = true, optional = true}
# flext-oracle-oic-ext = {path = "./flext-oracle-oic-ext", develop = true, optional = true}

# Enterprise integration projects
# algar-oud-mig = {path = "./algar-oud-mig", develop = true, optional = true}
# gruponos-poc-oic-wms = {path = "./gruponos-poc-oic-wms", develop = true, optional = true}

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.14.0"
pytest-xdist = "^3.6.0"
pytest-timeout = "^2.3.0"

# Code quality
ruff = "^0.8.4"
black = "^24.10.0"
isort = "^5.13.0"
mypy = "^1.13.0"
bandit = "^1.7.0"
pre-commit = "^4.0.0"

# Type stubs - CENTRALIZED (only for libs without built-in types)
types-requests = "^2.32.0"
types-pyyaml = "^6.0.12"
types-python-dateutil = "^2.9.0"
types-setuptools = "^75.6.0"
types-psutil = "^6.1.0"
# Note: oracledb 2.0+, sqlalchemy 2.0+, uvloop, fastapi, pydantic have built-in types

# Documentation
sphinx = "^8.0.0"
sphinx-rtd-theme = "^3.0.0"
myst-parser = "^4.0.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

# Development tools
ipython = "^8.29.0"
jupyter = "^1.1.1"
rich-traceback = "^1.0.3"
vulture = "^2.14"

[tool.poetry.group.security.dependencies]
bandit = { extras = ["toml"], version = "^1.7.0" }
safety = "^3.2.0"

[tool.poetry.group.build.dependencies]
build = "^1.2.0"
twine = "^6.0.0"

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = '''
/(
    __pycache__
  | .git
  | .mypy_cache
  | .pytest_cache
  | .ruff_cache
  | .venv
  | venv
  | build
  | dist
  | htmlcov
  | node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [
    "flext",
    "flext_core",
    "flext_auth",
    "flext_api",
    "flext_grpc",
    "flext_web",
    "flext_cli",
    "flext_plugin",
    "flext_observability",
    "flext_meltano",
    "flext_tap_ldap",
    "flext_tap_oracle_oic",
    "flext_tap_oracle_wms",
    "flext_target_ldap",
    "flext_target_oracle_oic",
    "flext_target_oracle_wms",
    "flext_dbt_ldap",
    "flext_oracle_oic_ext",
    "algar_oud_mig",
    "gruponos_poc_oic_wms"]
known_local_folder = ["algar_oud_mig", "gruponos_poc_oic_wms"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "ldif.*",
    "singer.*",
    "meltano.*",
    "oracledb.*",
    "fire.*",
    "ldap3.*",
    "prefect.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "*/tests/*"]
ignore_errors = false
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
src = ["src", "tests", "scripts", "*/src"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov"]

[tool.ruff.lint]
ignore = [
    # MANDATORY: Only formatter conflicts that cannot be auto-fixed
    "COM812",  # trailing-comma-missing (handled by formatter)
    "ISC001",  # implicit-str-concat (conflicts with formatter)
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-docstring-summary-second-line (conflicts with D212)

    # WORKSPACE: Relaxed for coordination workspace
    "E501",    # line-too-long (formatting)
    "D100", "D101", "D102", "D103", "D105", "D107", "D205", "D401", "D417",  # docstring issues
    "ANN001", "ANN101", "ANN102", "ANN201", "ANN202", "ANN204", "ANN401", "ANN003", "ANN002",  # type annotations
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901",  # complexity
    "E402",    # import-not-at-top (workspace coordination)
    "F401",    # unused-import (workspace compatibility)
    "F841",    # unused-variable (workspace debugging)
    "ARG001", "ARG002", "ARG003", "ARG005",  # unused arguments
    "T201",   # log.error statements (workspace scripts)
    "INP001",  # namespace packages (workspace structure)
]
select = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D", "ANN"]
"*/tests/*" = ["S101", "PLR2004", "D", "ANN"]
"__init__.py" = ["D104"]
"conftest.py" = ["D"]
"scripts/*" = ["T201", "D", "ERA001"]
"examples/*" = ["T201", "D", "ERA001"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/pytest.xml",
    "--maxfail=10",
    "--timeout=60"]
testpaths = ["tests", "*/tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "workspace: marks tests as workspace coordination tests",
    "oracle: marks tests requiring Oracle database",
    "redis: marks tests requiring Redis",
    "performance: marks tests as performance tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["src", "*/src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*"]
data_file = "reports/.coverage"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING"]

[tool.coverage.html]
directory = "reports/coverage"
title = "FLEXT Workspace Coverage Report"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

[tool.vulture]
min_confidence = 100
paths = ["src"]
exclude = ["tests/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post"]
ignore_names = ["_*"]
make_whitelist = true
sort_by_size = true

[tool.radon]
exclude = ["tests/*", "*/tests/*"]
ignore = ["F401"]  # Unused imports
total_average = true
show_complexity = true
average = true
order = "SCORE"
