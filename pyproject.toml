    "flext-ldap",
    "flext-ldif",
    "flext-db-oracle",
    "flext-quality",
    "flext-tap-ldap",
    "flext-tap-ldif",
    "flext-tap-oracle",
    "flext-tap-oracle-oic",
    "flext-tap-oracle-wms",
    "flext-target-ldap",
    "flext-target-ldif",
    "flext-target-oracle",
    "flext-target-oracle-oic",
    "flext-target-oracle-wms",
    "flext-dbt-ldap",
    "flext-dbt-ldif",
    "flext-dbt-oracle",
    "flext-oracle-oic-ext",
