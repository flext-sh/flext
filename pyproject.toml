[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "pyauto-workspace"
version = "0.4.0"
description = "PyAuto - Enterprise Python automation workspace com todos os subprojetos e dependências opcionais."
authors = [{ name = "Marlon Costa", email = "marlon.costa@datacosmos.com.br" }]
readme = "README.md"
requires-python = ">=3.9,<4.0"
license = { text = "MIT" }
keywords = ["automation", "oracle", "hexagonal", "architecture", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# Dependências unificadas removidas para evitar conflito com subprojetos

[tool.poetry.extras]
subprojects = [
    # "flx-meltano-enterprise",
    "flx-ldap",
    "flx-oracle-wms",
    # "meltano-edk",
    "tap-ldap",
    "dbt-ldap",
    "target-oracle-wms",
    "target-ldap",
    "oracle-oic-ext",
    # "map-gpt-embeddings",
    # "superset-ext",
    # "meltano-map-transform",
    # "meltano-hub",
    "target-oracle-oic",
    # "hub-utils",
    # "airflow-ext",
    "singer-sdk",
    # "gpt-ext",
]

[project.urls]
Homepage = "https://github.com/datacosmos-br/pyauto"
Repository = "https://github.com/datacosmos-br/pyauto"
Documentation = "https://datacosmos-br.github.io/pyauto/"
"Bug Tracker" = "https://github.com/datacosmos-br/pyauto/issues"

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.9,<4.0"
# Instala todos os subprojetos em modo develop
# flx-meltano-enterprise = { path = "./flx-meltano-enterprise", develop = true, optional = true }
flx-ldap = { path = "./flx-ldap", develop = true, optional = true }
flx-oracle-wms = { path = "./flx-oracle-wms", develop = true, optional = true }
# meltano-edk = { path = "./meltano-edk", develop = true, optional = true }
tap-ldap = { path = "./tap-ldap", develop = true, optional = true }
dbt-ldap = { path = "./dbt-ldap", develop = true, optional = true }
target-oracle-wms = { path = "./target-oracle-wms", develop = true, optional = true }
target-ldap = { path = "./target-ldap", develop = true, optional = true }
oracle-oic-ext = { path = "./oracle-oic-ext", develop = true, optional = true }
# map-gpt-embeddings = { path = "./meltano-map-gpt-embeddings", develop = true, optional = true }
# superset-ext = { path = "./meltano-superset-ext", develop = true, optional = true }
# meltano-map-transform = { path = "./meltano-map-transform", develop = true, optional = true }
# meltano-hub = { path = "./meltano-hub", develop = true, optional = true }
target-oracle-oic = { path = "./target-oracle-oic", develop = true, optional = true }
# hub-utils = { path = "./meltano-hub-utils", develop = true, optional = true }
# airflow-ext = { path = "./meltano-airflow-ext", develop = true, optional = true }
singer-sdk = { version = "^0.45.0", optional = true }
# gpt-ext = { path = "./meltano-gpt-ext", develop = true, optional = true }

# ═══════════════════════════════════════════════════════════════════════════════
# UNIFIED TOOL CONFIGURATIONS - ENTERPRISE STANDARDS
# ═══════════════════════════════════════════════════════════════════════════════
flx = { path = "flx", develop = true }
flx-database-oracle = { path = "flx-database-oracle", develop = true }

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\\.pyi?$'
extend-exclude = '''
/(
  # Directories to exclude
  __pycache__|
  .git|
  .mypy_cache|
  .pytest_cache|
  .ruff_cache|
  .venv|
  venv|
  build|
  dist|
  htmlcov|
  node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [
    "flx",
    "flx_database_oracle",
    "flx_http_oracle_oic",
    "flx_http_oracle_wms",
    "flx_adapter_example",
    "client-a_oud_mig",
    "gn_oic_wms_db",
]
known_local_folder = ["client-a_oud_mig", "gn_oic_wms_db"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = ["oracledb.*", "ldap.*", "ldif.*", "singer.*", "meltano.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests", "scripts", "flx/src", "*/src"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T20", # flake8-print
    "ISC", # flake8-implicit-str-concat
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RET", # flake8-return
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "PLR0913", # too many arguments
    "PLR2004", # magic value comparison
    "TRY003",  # avoid specifying messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",
    "PLR2004",
    "ARG001",
] # Allow assert, magic values, unused args in tests
"scripts/*" = ["T201", "T203"] # Allow print statements in scripts

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov-fail-under=85",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
]
testpaths = ["tests", "*/tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "oracle: Tests requiring Oracle database",
    "redis: Tests requiring Redis",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src", "flx/src", "*/src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.bandit]
exclude_dirs = ["tests", "scripts"]
skips = ["B101", "B601"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
