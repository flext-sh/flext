# @flext-managed: continuous
# @flext-regenerate: make deps WHAT=upgrade APPLY=Y
# @flext-ssot: flext-infra/src/flext_infra/_constants/deps.py
# @flext-maintenance: do not edit managed sections; edit the SSOT
# [MANAGED] FLEXT pyproject standardization
# Sections with [MANAGED] are enforced by flext_infra.deps.modernizer.
# Sections with [CUSTOM] are project-specific extension points.

# [CUSTOM] project metadata
[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "flext-core",
  "flext-infra",
  "flext-tests",
  "importlib-resources>=7.1.0",
  "pydantic>=2.13.3",
]
description = "FLEXT - Enterprise Data Integration Platform - Workspace Manager"
keywords = ["coordination", "enterprise", "flext", "typed", "workspace"]
license = "MIT"
name = "flext"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0rc0"

[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"

[[project.maintainers]]
email = "team@flext.sh"
name = "FLEXT Team"

# [MANAGED] consolidated development dependencies
[project.optional-dependencies]

[project.scripts]
flext-dev = "flext.dev:main"
flext-docs = "flext.docs:main"
flext-workspace = "flext.workspace:main"

[project.urls]
Documentation = "https://docs.flext.sh"
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"

# [MANAGED] build system
[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

# [MANAGED] codespell
[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

# [MANAGED] coverage
[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "if _t.TYPE_CHECKING:",
  "if typing.TYPE_CHECKING:",
]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
omit = ["*/dependency_injector/providers.pyx"]
source = ["src"]

# [MANAGED] deptry
[tool.deptry]
known_first_party = [
  "flext",
  "flext_api",
  "flext_auth",
  "flext_cli",
  "flext_core",
  "flext_db_oracle",
  "flext_dbt_ldap",
  "flext_dbt_ldif",
  "flext_dbt_oracle",
  "flext_dbt_oracle_wms",
  "flext_grpc",
  "flext_infra",
  "flext_ldap",
  "flext_ldif",
  "flext_meltano",
  "flext_observability",
  "flext_oracle_oic",
  "flext_oracle_wms",
  "flext_plugin",
  "flext_quality",
  "flext_tap_ldap",
  "flext_tap_ldif",
  "flext_tap_oracle",
  "flext_tap_oracle_oic",
  "flext_tap_oracle_wms",
  "flext_target_ldap",
  "flext_target_ldif",
  "flext_target_oracle",
  "flext_target_oracle_oic",
  "flext_target_oracle_wms",
  "flext_tests",
  "flext_web",
]
pep621_dev_dependency_groups = ["dev"]

[tool.flext.docs]
exclude_docs = [
  "/README.md",
  "SUPPRESSIONS-RATIONALE.md",
  "architecture/FLEXT_*.md",
  "architecture/c4-model/**",
  "architecture/clean-architecture.md",
  "architecture/data/**",
  "architecture/deployment/**",
  "architecture/flext-*-architecture.md",
  "architecture/overview.md",
  "architecture/plantuml/**",
  "architecture/security/**",
  "examples/**",
  "planning/**",
  "projects/flext-*.md",
  "projects/flext-*/**",
  "prompts/**",
  "references/**",
  "releases/**",
  "reports/**",
  "roadmap/**",
  "scripts/**",
  "standards/link-management.md",
  "superpowers/**",
  "type-system-architecture.md",
  "utilities-guide.md",
]
site_title = "FLEXT Workspace"

[tool.hatch.metadata]
allow-direct-references = true

# [MANAGED] mypy
[tool.mypy]
# FLEXT mypy suppression rationale (validated at the facade-MRO boundary):
# FLEXT mypy[assignment]: Dependency-injector descriptors lose their MRO-bound type only in Mypy.
# FLEXT mypy[attr-defined]: PEP 562 facade members inherited through MRO are invisible to Mypy.
# FLEXT mypy[call-arg]: Pydantic v2 init signatures behind facade MRO are incomplete in Mypy.
# FLEXT mypy[misc]: Valid PEP 695 nested facade aliases are rejected under Mypy's misc bucket.
# FLEXT mypy[name-defined]: Generated PEP 562 exports are installed at runtime but absent to Mypy.
# FLEXT mypy[prop-decorator]: Mypy loses Pydantic computed-field descriptors across composed MRO.
# FLEXT mypy[valid-type]: Mypy rejects facade namespaces used as owners in valid PEP 695 aliases.
check_untyped_defs = true
disable_error_code = [
  "assignment",
  "attr-defined",
  "call-arg",
  "misc",
  "name-defined",
  "prop-decorator",
  "valid-type",
]
explicit_package_bases = true
extra_checks = true
follow_imports = "normal"
ignore_missing_imports = true
local_partial_types = true
mypy_path = [".", "src"]
namespace_packages = true
no_implicit_reexport = true
plugins = ["pydantic.mypy", "returns.contrib.mypy.returns_plugin"]
python_version = "3.13"
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
disable_error_code = ["arg-type"]
module = ["*.cli"]

[[tool.mypy.overrides]]
disable_error_code = ["unreachable"]
module = ["dcdoc._utilities._charts._matplotlib_renderer._renders_spec"]

# [MANAGED] pydantic-mypy
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

