[build-system]
    build-backend = "poetry.core.masonry.api"
    requires = ["poetry-core>=1.9.0"]

[project]
    authors = [{ name = "FLEXT Team", email = "team@flext.sh" }]
    description = "FLEXT - Enterprise Data Integration Platform - Workspace Manager"
    license = "MIT"
    maintainers = [{ name = "FLEXT Team", email = "team@flext.sh" }]
    name = "flext"
    readme = "README.md"
    requires-python = ">=3.13,<3.14"
    version = "0.9.0"
    classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "License :: OSI Approved :: MIT License",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3.13",
        "Programming Language :: Python :: 3 :: Only",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Typing :: Typed",
    ]
    dependencies = [
        "click (>=8.2.1)",
        "packaging (>=25.0)",
        "protobuf  (>=6.30.2)",
        "pydantic (>=2.11.7)",
        "pydantic-settings (>=2.10.1)",
        "pyyaml (>=6.0)",
        "rich (>=14.0.0)",
        "structlog (>=25.4.0)",
        "tomlkit (>=0.13.3)",
        "docker (>=7.1.0,<8.0.0)",
        "toml (>=0.10.2,<0.11.0)",
        "tomli-w (>=1.2.0,<2.0.0)",
        "cachetools (>=6.2.0,<7.0.0)",
    ]
    keywords = [
        "async",
        "coordination",
        "enterprise",
        "flext",
        "typed",
        "workspace",
    ]

[project.urls]
    Homepage = "https://github.com/flext-sh/flext"
    Documentation = "https://docs.flext.sh"
    Repository = "https://github.com/flext-sh/flext"

[project.optional-dependencies]
    dev = [
        "autoflake>=2.3.1",
        "black>=25.1.0",
        "codespell>=2.3.0",
        "deptry>=0.23.0",
        "isort>=6.0.1",
        # mypy removed - using pyrefly for unified type checking
        "pre-commit>=4.0.1",
        "pylint>=3.3.0",
        "pyupgrade>=3.19.0",
        "radon>=6.0.1",
        "ruff>=0.12.3",
        "vulture>=2.13",
    ]
    test = [
        "factory-boy>=3.3.1",
        "faker>=37.4.0",
        "hypothesis>=6.125.0",
        "pytest>=8.4.0",
        "pytest-benchmark>=5.1.0",
        "pytest-clarity>=1.0.1",
        "pytest-cov>=6.2.0",
        "pytest-deadfixtures>=2.2.1",
        "pytest-env>=1.1.5",
        "pytest-mock>=3.14.0",
        "pytest-randomly>=3.16.0",
        "pytest-sugar>=1.0.0",
        "pytest-timeout>=2.4.0",
        "pytest-xdist>=3.8.0",
    ]
    docs = [
        "mkdocs-awesome-pages-plugin>=2.9.0",
        "mkdocs-encryptcontent-plugin>=2.0.0",
        "mkdocs-exclude>=1.0.0",
        "mkdocs-get-deps>=0.2.0",
        "mkdocs-git-revision-date-localized-plugin>=1.2.0",
        "mkdocs-literate-nav>=0.6.0",
        "mkdocs-macros-plugin>=1.0.0",
        "mkdocs-material-extensions>=1.3.1",
        "mkdocs-material>=9.5.0",
        "mkdocs-mermaid2-plugin>=1.1.0",
        "mkdocs-minify-plugin>=0.7.0",
        "mkdocs-newsletter>=0.1.0",
        "mkdocs-print-site-plugin>=0.8.0",
        "mkdocs-redirects>=1.2.0",
        "mkdocs-section-index>=0.3.0",
        "mkdocs-versioning>=0.2.0",
        "mkdocs>=1.6.0",
        "mkdocstrings-python>=1.7.0",
        "mkdocstrings>=0.24.0",
    ]
    typings = [
        "django-stubs>=5.2.2",
        "types-ldap3>=2.9.13.20250622",
        "types-protobuf>=6.30.2.20250703",
        "types-psutil>=7.0.0",
        "types-psycopg2>=2.9.21.20250718",
        "types-python-dateutil>=2.9.0",
        "types-pyyaml>=6.0.12",
        "types-redis>=4.6.0",
        "types-requests>=2.32.4",
        "types-setuptools>=80.9.0",
        "types-toml>=0.10.8.20240310",
    ]
    security = ["bandit>=1.8.0", "pip-audit>=2.7.3"]

[project.scripts]
    flext-dev = "flext.dev:main"
    flext-docs = "flext.docs:main"
    flext-workspace = "flext.workspace:main"

[tool.poetry]
    packages = [
        { include = "flext", from = "src" },
        { include = "flext_tools", from = "src" },
]

    [tool.poetry.dependencies]
        client-a-oud-mig = { path = "./client-a-oud-mig", develop = true }
        flexcore = { path = "./flexcore", develop = true }
        flext-api = { path = "./flext-api", develop = true }
        flext-auth = { path = "./flext-auth", develop = true }
        flext-cli = { path = "./flext-cli", develop = true }
        flext-core = { path = "./flext-core", develop = true }
        flext-db-oracle = { path = "./flext-db-oracle", develop = true }
        flext-dbt-ldap = { path = "./flext-dbt-ldap", develop = true }
        flext-dbt-ldif = { path = "./flext-dbt-ldif", develop = true }
        flext-dbt-oracle = { path = "./flext-dbt-oracle", develop = true }
        flext-dbt-oracle-wms = { path = "./flext-dbt-oracle-wms", develop = true }
        flext-grpc = { path = "./flext-grpc", develop = true }
        flext-ldap = { path = "./flext-ldap", develop = true }
        flext-ldif = { path = "./flext-ldif", develop = true }
        flext-meltano = { path = "./flext-meltano", develop = true }
        flext-observability = { path = "./flext-observability", develop = true }
        flext-oracle-oic-ext = { path = "./flext-oracle-oic-ext", develop = true }
        flext-oracle-wms = { path = "./flext-oracle-wms", develop = true }
        flext-plugin = { path = "./flext-plugin", develop = true }
        flext-quality = { path = "./flext-quality", develop = true }
        flext-tap-ldap = { path = "./flext-tap-ldap", develop = true }
        flext-tap-ldif = { path = "./flext-tap-ldif", develop = true }
        flext-tap-oracle = { path = "./flext-tap-oracle", develop = true }
        flext-tap-oracle-oic = { path = "./flext-tap-oracle-oic", develop = true }
        flext-tap-oracle-wms = { path = "./flext-tap-oracle-wms", develop = true }
        flext-target-ldap = { path = "./flext-target-ldap", develop = true }
        flext-target-ldif = { path = "./flext-target-ldif", develop = true }
        flext-target-oracle = { path = "./flext-target-oracle", develop = true }
        flext-target-oracle-oic = { path = "./flext-target-oracle-oic", develop = true }
        flext-target-oracle-wms = { path = "./flext-target-oracle-wms", develop = true }
        flext-web = { path = "./flext-web", develop = true }
        client-b-meltano-native = { path = "./client-b-meltano-native", develop = true }

    [tool.poetry.group.dev.dependencies]
        aiohttp = ">=3.12.14"
        numpy = ">=2.3.2"
        ldap3 = ">=2.9.1"
        docker = ">=7.1.0"
        redis = ">=5.0.0"
        psycopg2 = ">=2.9.10"
        jedi-language-server = "^0.45.1"
        types-pyyaml = "^6.0.12.20250809"
        pytest-benchmark = "^5.1.0"
        pytest-xdist = "^3.8.0"
        pytest-cov = "^6.2.1"
        pytest-randomly = "^3.16.0"
        pytest-clarity = "^1.0.1"
        twisted = "^25.5.0"
        email-validator = "^2.3.0"

    [tool.poetry.group.typings.dependencies]
        types-pyyaml = ">=6.0.12.20250516"
        types-pymysql = "^1.1.0.20250711"
        types-click-default-group = "^1.2.0.20250513"
        types-dateparser = "^1.2.2.20250627"
        types-greenlet = "^3.2.0.20250417"
        types-networkx = "^3.5.0.20250728"
        types-pytz = "^2025.2.0.20250516"
        types-simplejson = "^3.20.0.20250326"
        types-six = "^1.17.0.20250515"
        types-ujson = "^5.10.0.20250326"
        types-mock = "^5.2.0.20250809"
        types-factory-boy = "^0.4.1"
        aiofiles = "^24.1.0"
        types-grpcio = "^1.0.0.20250914"
        pyarrow-stubs = "^20.0.0.20250825"

    [tool.poetry.group.typing.dependencies]
        types-croniter = "^6.0.0.20250626"
        types-aiofiles = "^24.1.0.20250809"

[tool.deptry]
    exclude = [
        "__pycache__",
        ".archive",
        ".git",
        ".meltano",
        ".mypy_cache",
        ".pytest_cache",
        ".ruff_cache",
        ".venv",
        "build",
        "dist",
        "htmlcov",
        "vendor",
        "node_modules",
        "reports",
        "venv",
    ]
    extend_exclude = ["client-a-.*/", "flexcore/", "flext-.*/", "client-b-.*/"]
    known_first_party = ["flext", "flext_tools"]
    pep621_dev_dependency_groups = ["dev", "security", "test", "typings", "docs"]

[tool.mypy]
    cache_dir = ".mypy_cache"
    check_untyped_defs = true
    color_output = true
    disallow_any_decorated = false
    disallow_any_explicit = true
    disallow_any_expr = false # Too restrictive for real-world usage
    disallow_any_generics = true
    disallow_any_unimported = true
    disallow_incomplete_defs = true
    disallow_subclassing_any = true
    disallow_untyped_calls = true
    disallow_untyped_decorators = false
    disallow_untyped_defs = true
    error_summary = true
    exclude = [
        "__pycache__/",
        ".*_pb2_grpc\\.py$",     # Exclude generated protobuf gRPC files
        ".*_pb2\\.py$",          # Exclude generated protobuf files
        ".*/generate_config.py",
        ".*/manage.py",
        ".coverage.*",
        ".git/",
        ".mypy_cache/",
        ".pytest_cache/",
        ".ruff_cache/",
        ".venv/",
        "build/",
        "dist/",
        "node_modules/",
        "vendor/",
    ]
    explicit_package_bases = true
    extra_checks = true
    follow_imports = "normal"
    follow_imports_for_stubs = true
    incremental = true
    local_partial_types = true
    mypy_path = "src"
    namespace_packages = true
    no_implicit_optional = true
    no_implicit_reexport = true
    platform = "linux"
    plugins = ["pydantic.mypy"]
    pretty = true
    python_version = "3.13"
    show_column_numbers = true
    show_error_codes = true
    show_error_context = true
    show_traceback = true
    strict = true
    strict_equality = true
    strict_optional = true
    warn_incomplete_stub = true
    warn_no_return = true
    warn_redundant_casts = true
    warn_return_any = true
    warn_unreachable = true
    warn_unused_configs = true
    warn_unused_ignores = false

[tool.pydantic-mypy]
    init_forbid_extra = true
    init_typed = true
    warn_required_dynamic_aliases = true
    warn_untyped_fields = true

[tool.pyright]
    include = ["examples/", "scripts/", "src/", "tests/"]
    exclude = [
        "__pycache__/",
        ".meltano/",
        ".mypy_cache/",
        ".pytest_cache/",
        ".ruff_cache/",
        ".venv/",
        "build/",
        "dist/",
        "node_modules/",
        "target/",
]

    [[tool.pyright.executionEnvironments]]
        root = "./tests"
        extraPaths = [
            "./examples",
            "./scripts",
            "**/examples/",
            "**/scripts/",
            "**/tests/",
        ]
        reportImplicitRelativeImport = false
        reportPrivateUsage = false

[tool.pyrefly]
    project-excludes = [
        "**/.git",
        "**/__pycache__",
        "**/*.venv",
        "**/*dist",
        "**/*mypy_cache",
        "**/*pytest_cache",
        "**/*ruff_cache",
        "**/*venv/**",
        "**/node_modules/**",
    ]
    python-version = "3.13"
    search-path = [
        "examples",
        "scripts",
        "src",
        "tests",
        "flext-core/src",
        "flext-cli/src",
        "flext-ldap/src",
        "flext-ldif/src",
        "flext-db-oracle/src",
        "flext-meltano/src",
        "flext-observability/src",
        "flext-plugin/src",
        "flext-quality/src",
        "flext-web/src",
        "flext-api/src",
        "flext-auth/src",
        "flext-grpc/src",
        "flext-tools/src",
        "flext-dbt-ldap/src",
        "flext-dbt-ldif/src",
        "flext-dbt-oracle/src",
        "flext-dbt-oracle-wms/src",
        "flext-oracle-oic-ext/src",
        "flext-oracle-wms/src",
        "flext-tap-ldap/src",
        "flext-tap-ldif/src",
        "flext-tap-oracle/src",
        "flext-tap-oracle-oic/src",
        "flext-tap-oracle-wms/src",
        "flext-target-ldap/src",
        "flext-target-ldif/src",
        "flext-target-oracle/src",
        "flext-target-oracle-oic/src",
        "flext-target-oracle-wms/src",
    ]

[tool.pytest.ini_options]
    testpaths = ["tests"]
    python_files = ["test_*.py", "*_test.py"]
    python_classes = ["Test*"]
    python_functions = ["test_*"]
    addopts = ["--strict-markers", "--strict-config", "--tb=short", "-ra"]
    markers = [
        "docker: marca testes que requerem Docker",
        "e2e: marca testes como testes de integração end-to-end",
        "edge_cases: marca testes de casos extremos",
        "integration: marca testes como testes de integração",
        "integrity: marca testes de integridade",
        "oracle: marca testes específicos do Oracle",
        "performance: marca testes de performance",
        "resilience: marca testes de resiliência",
        "slow: marca testes como execução lenta",
        "stress: marca testes de stress",
        "unit: marca testes como testes unitários",
    ]
    filterwarnings = ["ignore::DeprecationWarning:pyasn1(.*|$)"]

[tool.ruff]
    extend = "./ruff-shared.toml"

[tool.ruff.lint.isort]
    known-first-party = ["flext", "flext_tools"]

[tool.vulture]
    exclude = [
        "__pycache__/",
        ".*/examples/",
        ".*/generate_config.py",
        ".*/manage.py",
        ".*/scripts/",
        ".*/tests/",
        ".coverage.*",
        ".git/",
        ".mypy_cache/",
        ".ruff_cache/",
        ".pytest_cache/",
        ".venv/",
        "build/",
        "dist/",
        "node_modules/",
        "tests/",
        "vendor/",
    ]
    min_confidence = 80
    paths = ["src"]
    sort_by_size = true
    verbose = false
