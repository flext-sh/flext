    "flext-dbt-ldap",
    "flext-dbt-ldif",
    "flext-dbt-oracle",
]
ldap = ["flext-ldap", "flext-tap-ldap", "flext-target-ldap", "flext-dbt-ldap"]
ldif = ["flext-ldif", "flext-tap-ldif", "flext-target-ldif", "flext-dbt-ldif"]
oracle = [
    "flext-db-oracle",
    "flext-tap-oracle",
    "flext-tap-oracle-oic",
    "flext-tap-oracle-wms",
    "flext-target-oracle",
    "flext-target-oracle-oic",
    "flext-target-oracle-wms",
    "flext-oracle-oic-ext",
    "flext-oracle-wms",
    "flext-dbt-oracle",
]
meltano = ["flext-meltano", "gruponos-meltano-native"]
monitoring = ["flext-observability", "flext-quality"]
plugins = ["flext-plugin"]
# projects group removed - algar-oud-mig not in main dependencies
all = [
    "flext-api",
    "flext-auth",
    "flext-grpc",
    "flext-cli",
    "flext-web",
    "flext-observability",
    "flext-plugin",
