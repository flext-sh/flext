[tool.poetry]
name = "pyauto-workspace"
version = "0.4.0"
description = "PYAUTO - Consolidated Python automation workspace with all subprojects"
authors = ["PYAUTO Team <pyauto@example.com>"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.13,<3.15"

dc-code-analyzer = { path = "./dc-code-analyzer", develop = true }
dc-meltano-plugins = { path = "./dc-meltano-plugins", develop = true }
flx = { path = "./flx", develop = true }
flx-adapter-example = { path = "./flx-adapter-example", develop = true }
flx-database-oracle = { path = "./flx-database-oracle", develop = true }
flx-http-oracle-oic = { path = "./flx-http-oracle-oic", develop = true }
flx-http-oracle-wms = { path = "./flx-http-oracle-wms", develop = true }
client-b-poc-oic-wms = { path = "./client-b-poc-oic-wms", develop = true }
oud-automation = { path = "./oud-automation", develop = true }
# scripts = { path = "./scripts", develop = true }

# AI & machine learning
openai = "^1.0.0"

# Jupyter
ipykernel = "^6.0.0"
ipython = "^8.0.0"

[tool.poetry.group.dev.dependencies]
# ===== TESTING FRAMEWORKS =====
pytest = "^8.4.0"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
pytest-asyncio = "<0.24.0"
pytest-benchmark = "^4.0.0"
pytest-django = "^4.5.0"
pytest-html = "^4.1.1"
pytest-timeout = "^2.4.0"
pytest-tornasync = "^0.6.0.post2"
pytest-trio = "^0.8.0"
pytest-twisted = "^1.14.3"
pytest-xdist = "^3.7.0"
coverage = "^7.8.2"

# ===== CODE FORMATTING & LINTING =====
black = "^25.1.0"
isort = "<6"
ruff = "^0.11.13"
flake8 = "^7.2.0"
autoflake = "^2.2.1"
pyupgrade = "^3.1.0"

# ===== TYPE CHECKING =====
mypy = "^1.16.0"
django-stubs = "^4.2.0"
djangorestframework-stubs = "^3.14.0"
types-python-dateutil = "^2.9.0.20241206"
types-pyyaml = "^6.0.12.20250516"
types-redis = "^4.6.0.20240903"
types-requests = "^2.32.0.20241016"
types-setuptools = "^75.7.0.20250106"
types-sqlalchemy = "^1.4.53.38"

# ===== SECURITY & QUALITY ANALYSIS =====
bandit = "^1.8.0"
safety = "^2.3.0"
vulture = "^2.12"
radon = "^6.0.1"

# ===== PROFILING & PERFORMANCE =====
line-profiler = "^4.1.0"
memory-profiler = "^0.61.0"

# ===== DEVELOPMENT TOOLS =====
pre-commit = "^4.2.0"
refurb = "^2.1.0"
pipenv = "^2025.0.2"
monkeytype = "^23.3.0"
codebase-digest = "^0.1.43"
pdoc3 = "^0.11.6"
graphviz = "^0.20.3"
interrogate = "^1.7.0"
nuitka = "^2.7.4"
pygraphviz = "^1.10"


[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool."ruff.lint"]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "G",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "BLE",
    "COM",
]
ignore = [
    "E501",
    "UP007",
    "BLE001",
    "G004",
    "DTZ007",
    "TRY003",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "TRY401",
]

[tool."ruff.lint.per-file-ignores"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "TID252", "ARG", "FBT"]
"scripts/**/*.py" = ["T20", "S101", "PLR2004"]

[tool."pytest.ini_options"]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--junitxml=reports/junit.xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool."coverage.run"]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__main__.py", "*/conftest.py"]

[tool."coverage.report"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
