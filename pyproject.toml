dependencies.flext-dbt-oracle-wms = {path = "flext-dbt-oracle-wms", develop = true}
dependencies.flext-grpc = {path = "flext-grpc", develop = true}
dependencies.flext-ldap = {path = "flext-ldap", develop = true}
dependencies.flext-ldif = {path = "flext-ldif", develop = true}
dependencies.flext-meltano = {path = "flext-meltano", develop = true}
dependencies.flext-observability = {path = "flext-observability", develop = true}
dependencies.flext-oracle-oic = {path = "flext-oracle-oic", develop = true}
dependencies.flext-oracle-wms = {path = "flext-oracle-wms", develop = true}
dependencies.flext-plugin = {path = "flext-plugin", develop = true}
dependencies.flext-quality = {path = "flext-quality", develop = true}
dependencies.flext-tap-ldap = {path = "flext-tap-ldap", develop = true}
dependencies.flext-tap-ldif = {path = "flext-tap-ldif", develop = true}
dependencies.flext-tap-oracle = {path = "flext-tap-oracle", develop = true}
dependencies.flext-tap-oracle-oic = {path = "flext-tap-oracle-oic", develop = true}
dependencies.flext-tap-oracle-wms = {path = "flext-tap-oracle-wms", develop = true}
dependencies.flext-target-ldap = {path = "flext-target-ldap", develop = true}
dependencies.flext-target-ldif = {path = "flext-target-ldif", develop = true}
