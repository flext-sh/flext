[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext"
version = "0.7.0"
description = "FLEXT - Multi-Project Workspace Coordinator for Enterprise Data Integration"
authors = [{ name = "FLEXT Team", email = "team@flext.sh" }]
maintainers = [{ name = "FLEXT Team", email = "team@flext.sh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.14"
# dependencies moved to [tool.poetry.dependencies] to avoid duplication warnings
keywords = [
    "flext",
    "workspace",
    "data-integration",
    "etl",
    "meltano",
    "enterprise",
    "async",
    "ldap",
    "oracle",
    "grpc",
    "api",
    "authentication",
    "monitoring",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"

[project.scripts]
flext = "flext.cli:main"
flext-workspace = "flext.workspace:main"
flext-dev = "flext.dev:main"

[tool.poetry]
# NOTE: Metadados movidos para [project] (PEP 621)
# Mantendo apenas configurações específicas do Poetry
# keywords e classifiers movidos para [project] seção
packages = [{ include = "flext", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
# Core dependencies (bleeding-edge)
pydantic = ">=2.6.0,<3.0.0"
pydantic-settings = ">=2.7.0,<3.0.0"
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.32.0,<1.0.0"
click = ">=8.1.7,<9.0.0"
rich = ">=13.5.2,<15.0.0"
typer = ">=0.15.0,<1.0.0"
structlog = ">=24.0.0,<26.0.0"
httpx = ">=0.28.0,<1.0.0"
aiofiles = ">=24.1.0,<25.0.0"
python-dateutil = ">=2.9.0,<3.0.0"
python-dotenv = ">=1.0.0,<2.0.0"
typing-extensions = ">=4.12.0,<5.0.0"

# FLEXT Framework Modules - TO BE ADDED VIA POETRY ADD COMMANDS
flext-core = { develop = true }
flext-api = { develop = true }
flext-auth = { develop = true }
flext-grpc = { develop = true }
flext-cli = { develop = true }
flext-web = { develop = true }
flext-observability = { develop = true }
flext-plugin = { develop = true }
flext-meltano = { develop = true }
flext-ldap = { develop = true }
flext-db-oracle = { develop = true }
flext-quality = { develop = true }
flext-tap-ldap = { develop = true }
flext-tap-oracle-oic = { develop = true }
flext-tap-oracle-wms = { develop = true }
flext-target-ldap = { develop = true }
flext-target-oracle = { develop = true }
flext-target-oracle-oic = { develop = true }
flext-target-oracle-wms = { develop = true }
flext-dbt-ldap = { develop = true }
flext-dbt-ldif = { develop = true }
flext-dbt-oracle = { develop = true }
flext-ldif = { develop = true }
flext-oracle-oic-ext = { develop = true }
flext-oracle-wms = { develop = true }
flext-tap-ldif = { develop = true }
flext-tap-oracle = { develop = true }
flext-target-ldif = { develop = true }
gruponos-meltano-native = { develop = true }


[tool.poetry.group.dev.dependencies]
# === CODE QUALITY & FORMATTERS ===
ruff = "^0.12.3"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.13.0"
pylint = "^3.3.0"

# === CODE ANALYSIS & METRICS ===
vulture = "^2.13"
radon = "^6.0.1"
pre-commit = "^4.0.1"
codespell = "^2.3.0"
pyupgrade = "^3.19.0"
autoflake = "^2.3.1"

# === DOCUMENTATION TOOLS ===
sphinx = "^8.2.3"
sphinx-rtd-theme = "^3.0.2"
myst-parser = "^4.0.1"
mkdocs = "^1.6.1"
mkdocs-material = "^9.6.15"
mkdocstrings = { extras = ["python"], version = "^0.27.0" }
mkdocs-gen-files = "^0.5.0"
mkdocs-literate-nav = "^0.6.0"

# === DEVELOPMENT EXPERIENCE ===
ipython = "^9.4.0"
jupyter = "^1.1.1"
rich-traceback = "^1.0.3"
ply = "^3.11"
django-crispy-forms = "^2.4"
crispy-bootstrap5 = "^2025.6"
django-celery-beat = "^2.8.1"
django-celery-results = "^2.6.0"
dbt-duckdb = "^1.9.4"

[tool.poetry.group.test.dependencies]
# === TESTING FRAMEWORK ===
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.2.0"
pytest-xdist = "^3.8.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.4.0"
pytest-benchmark = "^5.1.0"
pytest-randomly = "^3.16.0"
pytest-sugar = "^1.0.0"
pytest-clarity = "^1.0.1"
pytest-deadfixtures = "^2.2.1"
pytest-env = "^1.1.5"
pytest-httpx = "^0.35.0"
hypothesis = "^6.125.0"
factory-boy = "^3.3.1"
faker = "^37.4.0"

[tool.poetry.group.typings.dependencies]
# === TYPE STUBS ===
# Standard library stubs
types-python-dateutil = "^2.9.0"
types-pyyaml = "^6.0.12"
types-setuptools = "^80.9.0"
types-toml = "^0.10.8.20240310"

# Third-party library stubs
types-requests = "^2.32.4"
types-redis = "^4.6.0"
types-psutil = "^7.0.0"
types-jsonschema = "^4.24.0.20250708"
types-greenlet = "^3.2.0.20250417"
types-pygments = "^2.19.0.20250516"
types-cffi = "^1.17.0.20250523"
types-colorama = "^0.4.15.20240311"
types-decorator = "^5.2.0.20250324"
types-pexpect = "^4.9.0.20250516"
types-deprecated = "^1.2.15.20250304"
types-passlib = "^1.7.7.20250602"
types-ujson = "^5.10.0.20250326"
types-pymysql = "^1.1.0.20250711"
types-click-default-group = "^1.2.0.20250513"
types-croniter = "^6.0.0.20250626"
types-dateparser = "^1.2.2.20250627"
types-aiofiles = "^24.1.0.20250708"
types-six = "^1.17.0.20250515"
types-psycopg2 = "^2.9.21.20250516"
django-stubs = "^5.2.1"

[tool.poetry.group.security.dependencies]
# === SECURITY SCANNING ===
bandit = { extras = ["toml"], version = "^1.8.0" }
pip-audit = "^2.7.3"

[tool.poetry.group.build.dependencies]
# === BUILD & PACKAGING ===
build = "^1.2.2"
twine = "^6.1.0"

[tool.poetry.group.load.dependencies]
# === LOAD TESTING ===
locust = "^2.31.0"

[tool.poetry.extras]
# Feature groups (core dependencies only)
api = ["flext-api", "flext-auth", "flext-grpc"]
web = ["flext-web", "flext-api", "flext-auth"]
cli = ["flext-cli"]
data = [
    "flext-tap-ldap",
    "flext-tap-ldif",
    "flext-tap-oracle",
    "flext-tap-oracle-oic",
    "flext-tap-oracle-wms",
