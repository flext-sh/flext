# Django configuration
# plugins = ["mypy_django_plugin.main", "pydantic.mypy"]
plugins = ["pydantic.mypy"]

[tool.django-stubs]
django_settings_module = "flext_web.settings_simple"

[[tool.mypy.overrides]]
module = [
    "ldif.*",
    "singer.*",
    "meltano.*",
    "oracledb.*",
    "fire.*",
    "ldap3.*",
    "prefect.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest", "*/tests/*"]
ignore_errors = false
disallow_untyped_defs = false

[tool.ruff]
target-version = "py313"
line-length = 88
fix = true
show-fixes = true
respect-gitignore = true
src = ["src", "tests", "scripts", "*/src"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
# Enable ALL rules for maximum quality (FLEXT Standard)
select = ["ALL"]

# ONLY ignore absolute conflicts and formatter issues
ignore = [
    # ===== FORMATTER CONFLICTS (MANDATORY TO IGNORE) =====
    "COM812", # trailing-comma-missing (handled by formatter)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-docstring-summary-second-line (conflicts with D212)
    "ISC001", # implicit-str-concat (conflicts with formatter)

    # ===== REASONABLE FLEXIBILITY (FLEXT APPROVED) =====
    "ANN401",
    "ARG001",  # Unused argument (fix gradually)
    "ARG002",  # Unused argument (fix gradually)
    "BLE001",  # Do not catch blind exception (fix gradually)
    "C901",    # Too complex (refactor gradually)
    "D102",
    "D103",    # Missing docstring in public module
    "D105",
    "D107",    # Missing docstring in __init__
    "D401",
    "DTZ001",
    "DTZ005",
    "E401",
    "E501",
    "EM101",   # Exception must not use a string literal
    "EM102",   # Exception must not use an f-string literal
    "ERA001",  # Commented out code (development)
    "EXE001",  # Shebang is present but file is not executable
    "F401",
    "F823",
    "FBT001",  # Boolean trap (refactor gradually)
    "FBT002",  # Boolean trap (refactor gradually)
    "FBT003",  # Boolean trap (refactor gradually)
    "FIX002",  # Line contains TODO
    "G004",
    "PLC0415", # Import should be placed at top of module
    "PLR0911", # Too many positional arguments (refactor gradually)
    "PLR0912", # Too many branches (refactor gradually)
    "PLR0913", # Too many arguments (refactor gradually)
    "PLR0915", # Too many statements (refactor gradually)
    "PLR2004", # Magic value used in comparison (case by case)
    "PLW0603", # Unnecessary `else` after `return` (fix gradually)
    "PTH118",
    "PTH123",
    "RUF001",
    "S103",    # Use of assert (pytest requirement)
    "S104",
    "S105",
    "S106",
    "S107",
    "S603",
    "S607",
    "SIM102",
    "TD002",
    "TD003",   # Missing issue link on TODO
    "TRY003",  # Avoid specifying long messages outside exception class
    "TRY203",
    "TRY300",  # Try/except/finally should not be empty (refactor gradually)
    "TRY301",
    "TRY401",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = [
    "S101",    # Use of assert (pytest requirement)
    "S106",    # Possible hardcoded password (test fixtures)
    "PLR2004", # Magic values (test data)
    "ANN",     # Type annotations (optional in tests)
    "D",       # Docstrings (optional in tests)
    "ARG",     # Unused arguments (fixtures)
    "FBT",     # Boolean trap (test parameters)
    "SLF001",  # Private member access (testing)
    "DTZ001",  # Timezone aware datetime (test data)
    "PLC0415", # Import should be placed at top of module (test utilities)
]
"**/scripts/**" = [
    "T201",   # Print statements (allowed in scripts)
    "S603",   # subprocess without shell=True (scripts)
    "S607",   # Starting a process with a partial path (scripts)
    "ANN",    # Type annotations (optional in scripts)
    "D",      # Docstrings (optional in scripts)
    "EXE001", # Shebang is present but file is not executable
]
"*/__init__.py" = [
    "F401", # Module imported but unused (re-exports)
    "D104", # Missing docstring in public package
]


# Auto-generated files - exclude from ALL linting
"**/proto/*_pb2.py" = ["ALL"]
"**/proto/*_pb2_grpc.py" = ["ALL"]
"**/*_pb2.py" = ["ALL"]
"**/*_pb2_grpc.py" = ["ALL"]
"**/generated/**/*.py" = ["ALL"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.vulture]
min_confidence = 100
paths = ["src"]
exclude = ["tests/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post"]
ignore_names = ["_*"]
make_whitelist = true
sort_by_size = true

[tool.radon]
exclude = ["tests/*", "*/tests/*"]
ignore = ["F401"]
total_average = true
show_complexity = true
average = true
order = "SCORE"
