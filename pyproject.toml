    "gruponos-meltano-native",
]

# [tool.poetry.scripts] - REMOVED: Duplicated, using [project.scripts] instead (PEP 621)

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = "/(\n    __pycache__\n  | .git\n  | .mypy_cache\n  | .pytest_cache\n  | .ruff_cache\n  | .venv\n  | venv\n  | build\n  | dist\n  | htmlcov\n  | node_modules\n)/\n"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [
    "flext",
    "flext_core",
    "flext_auth",
    "flext_api",
    "flext_grpc",
    "flext_web",
    "flext_cli",
    "flext_plugin",
    "flext_observability",
    "flext_meltano",
    "flext_ldap",
    "flext_ldif",
    "flext_db_oracle",
    "flext_quality",
    "flext_tap_ldap",
    "flext_tap_ldif",
    "flext_tap_oracle",
    "flext_tap_oracle_oic",
    "flext_tap_oracle_wms",
    "flext_target_ldap",
    "flext_target_ldif",
    "flext_target_oracle",
    "flext_target_oracle_oic",
    "flext_target_oracle_wms",
    "flext_dbt_ldap",
    "flext_dbt_ldif",
    "flext_dbt_oracle",
    "flext_oracle_oic_ext",
    "flext_oracle_wms",
    "algar_oud_mig",
    "gruponos_poc_oic_wms",
    "gruponos_meltano_native",
]
known_local_folder = ["algar_oud_mig", "gruponos_poc_oic_wms"]

[tool.mypy]
check_untyped_defs = true
color_output = true
disallow_any_decorated = true
disallow_any_explicit = false
disallow_any_expr = false
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
error_summary = true
ignore_missing_imports = false
no_implicit_optional = true
pretty = true
python_version = "3.13"
show_error_codes = true
show_error_context = true
strict = true
strict_concatenate = true
strict_equality = true
strict_optional = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

# Resolve namespace conflicts
explicit_package_bases = true

# Exclude conflicting directories and tests
