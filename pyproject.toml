[build-system]
    build-backend = "poetry.core.masonry.api"
    requires = [
        "poetry-core>=2.0",
    ]

[project]
    classifiers = [
        "Development Status :: 4 - Beta",
        "Intended Audience :: Developers",
        "Operating System :: OS Independent",
        "Programming Language :: Python :: 3 :: Only",
        "Programming Language :: Python :: 3.13",
        "Topic :: Software Development :: Libraries :: Python Modules",
        "Typing :: Typed",
    ]
    dependencies = [
        "flexcore @ ./.flext-deps/flexcore",
        "flext-api @ ./.flext-deps/flext-api",
        "flext-auth @ ./.flext-deps/flext-auth",
        "flext-cli @ ./.flext-deps/flext-cli",
        "flext-core @ ./.flext-deps/flext-core",
        "flext-db-oracle @ ./.flext-deps/flext-db-oracle",
        "flext-dbt-ldap @ ./.flext-deps/flext-dbt-ldap",
        "flext-dbt-ldif @ ./.flext-deps/flext-dbt-ldif",
        "flext-dbt-oracle @ ./.flext-deps/flext-dbt-oracle",
        "flext-dbt-oracle-wms @ ./.flext-deps/flext-dbt-oracle-wms",
        "flext-grpc @ ./.flext-deps/flext-grpc",
        "flext-ldap @ ./.flext-deps/flext-ldap",
        "flext-ldif @ ./.flext-deps/flext-ldif",
        "flext-meltano @ ./.flext-deps/flext-meltano",
        "flext-observability @ ./.flext-deps/flext-observability",
        "flext-oracle-oic @ ./.flext-deps/flext-oracle-oic",
        "flext-oracle-wms @ ./.flext-deps/flext-oracle-wms",
        "flext-plugin @ ./.flext-deps/flext-plugin",
        "flext-quality @ ./.flext-deps/flext-quality",
        "flext-tap-ldap @ ./.flext-deps/flext-tap-ldap",
        "flext-tap-ldif @ ./.flext-deps/flext-tap-ldif",
        "flext-tap-oracle @ ./.flext-deps/flext-tap-oracle",
        "flext-tap-oracle-oic @ ./.flext-deps/flext-tap-oracle-oic",
        "flext-tap-oracle-wms @ ./.flext-deps/flext-tap-oracle-wms",
        "flext-target-ldap @ ./.flext-deps/flext-target-ldap",
        "flext-target-ldif @ ./.flext-deps/flext-target-ldif",
        "flext-target-oracle @ ./.flext-deps/flext-target-oracle",
        "flext-target-oracle-oic @ ./.flext-deps/flext-target-oracle-oic",
        "flext-target-oracle-wms @ ./.flext-deps/flext-target-oracle-wms",
        "flext-web @ ./.flext-deps/flext-web",
    ]

    description = "FLEXT - Enterprise Data Integration Platform - Workspace Manager"
    keywords = [
        "coordination",
        "enterprise",
        "flext",
        "typed",
        "workspace",
    ]
    name = "flext"
    readme = "README.md"
    requires-python = ">=3.13,<3.14"
    version = "0.10.0-dev"
    license = "MIT"

    [[project.authors]]
        email = "team@flext.sh"
        name = "FLEXT Team"
    [[project.maintainers]]
        email = "team@flext.sh"
        name = "FLEXT Team"

    [project.optional-dependencies]
        dev = [
            "autoflake>=2.3.1",
            "black>=25.1.0",
            "codespell>=2.3.0",
            "deptry>=0.23.0",
            "isort>=6.0.1",
            "pre-commit>=4.0.1",
            "pylint>=3.3.0",
            "pyupgrade>=3.19.0",
            "radon>=6.0.1",
            "ruff>=0.12.3",
            "vulture>=2.13",
        ]
        docs = [
            "mkdocs-awesome-pages-plugin>=2.9.0",
            "mkdocs-encryptcontent-plugin>=2.0.0",
            "mkdocs-exclude>=1.0.0",
            "mkdocs-get-deps>=0.2.0",
            "mkdocs-git-revision-date-localized-plugin>=1.2.0",
            "mkdocs-literate-nav>=0.6.0",
            "mkdocs-macros-plugin>=1.0.0",
            "mkdocs-material-extensions>=1.3.1",
            "mkdocs-material>=9.5.0",
            "mkdocs-mermaid2-plugin>=1.1.0",
            "mkdocs-minify-plugin>=0.7.0",
            "mkdocs-newsletter>=0.1.0",
            "mkdocs-print-site-plugin>=0.8.0",
            "mkdocs-redirects>=1.2.0",
            "mkdocs-section-index>=0.3.0",
            "mkdocs-versioning>=0.2.0",
            "mkdocs>=1.6.0",
            "mkdocstrings-python>=1.7.0",
            "mkdocstrings>=0.24.0",
        ]
        security = [
            "bandit>=1.8.0",
            "pip-audit>=2.7.3",
        ]
        test = [
            "factory-boy>=3.3.1",
            "faker>=37.4.0",
            "hypothesis>=6.125.0",
            "pytest-benchmark>=5.1.0",
            "pytest-clarity>=1.0.1",
            "pytest-cov>=6.2.0",
            "pytest-deadfixtures>=2.2.1",
            "pytest-env>=1.1.5",
            "pytest-mock>=3.14.0",
            "pytest-randomly>=3.16.0",
            "pytest-sugar>=1.0.0",
            "pytest-timeout>=2.4.0",
            "pytest-xdist>=3.8.0",
            "pytest>=8.4.0",
        ]
        typings = [
            "django-stubs>=5.2.2",
            "types-docker>=7.1.0",
            "types-ldap3>=2.9.13.20250622",
            "types-protobuf>=6.30.2.20250703",
            "types-psutil>=7.0.0",
            "types-psycopg2>=2.9.21.20250718",
            "types-python-dateutil>=2.9.0",
            "types-pyyaml>=6.0.12",
            "types-redis>=4.6.0",
            "types-requests>=2.32.4",
            "types-setuptools>=80.9.0",
            "types-toml>=0.10.8.20240310",
        ]

    [project.scripts]
        flext-dev = "flext.dev:main"
        flext-docs = "flext.docs:main"
        flext-workspace = "flext.workspace:main"

    [project.urls]
        Documentation = "https://docs.flext.sh"
        Homepage = "https://github.com/flext-sh/flext"
        Repository = "https://github.com/flext-sh/flext"
[tool]
    [tool.deptry]
        exclude = [
            ".archive",
            ".git",
            ".meltano",
            ".mypy_cache",
            ".pytest_cache",
            ".ruff_cache",
            ".venv",
            "__pycache__",
            "build",
            "dist",
            "htmlcov",
            "node_modules",
            "reports",
            "scripts",
            "tests",
            "vendor",
            "venv",
        ]
        extend_exclude = [
            "flexcore/",
            "flext-.*/",
        ]
        known_first_party = [
            "flext",
            "flext_quality",
        ]
        pep621_dev_dependency_groups = [
            "dev",
            "docs",
            "security",
            "test",
            "typings",
        ]

    [tool.mypy]
        cache_dir = ".mypy_cache"
        check_untyped_defs = true
        color_output = true
        disallow_any_decorated = false
        disallow_any_explicit = true
        disallow_any_expr = false
        disallow_any_generics = true
        disallow_any_unimported = true
        disallow_incomplete_defs = true
        disallow_subclassing_any = true
        disallow_untyped_calls = true
        disallow_untyped_decorators = false
        disallow_untyped_defs = true
        error_summary = true
        exclude = [
            ".*/generate_config.py",
            ".*/manage.py",
            ".*_pb2\\.py$",
            ".*_pb2_grpc\\.py$",
            ".coverage.*",
            ".git/",
            ".mypy_cache/",
            ".pytest_cache/",
            ".ruff_cache/",
            ".venv/",
            "__pycache__/",
            "build/",
            "dist/",
            "node_modules/",
            "vendor/",
        ]
        extra_checks = true
        follow_imports = "silent"
        follow_imports_for_stubs = true
        incremental = true
        local_partial_types = true
        namespace_packages = true
        no_implicit_optional = true
        no_implicit_reexport = true
        platform = "linux"
        plugins = [
            "pydantic.mypy",
        ]
        pretty = true
        python_version = "3.13"
        show_column_numbers = true
        show_error_codes = true
        show_error_context = true
        show_traceback = true
        strict = true
        strict_equality = true
        strict_optional = true
        warn_incomplete_stub = true
        warn_no_return = true
        warn_redundant_casts = true
        warn_return_any = true
        warn_unreachable = true
        warn_unused_configs = true
        warn_unused_ignores = false
mypy_path = ["src", "flext-api/src", "flext-auth/src", "flext-cli/src", "flext-core/src", "flext-db-oracle/src", "flext-dbt-ldap/src", "flext-dbt-ldif/src", "flext-dbt-oracle/src", "flext-dbt-oracle-wms/src", "flext-grpc/src", "flext-ldap/src", "flext-ldif/src", "flext-meltano/src", "flext-observability/src", "flext-oracle-oic/src", "flext-oracle-wms/src", "flext-plugin/src", "flext-quality/src", "flext-tap-ldap/src", "flext-tap-ldif/src", "flext-tap-oracle/src", "flext-tap-oracle-oic/src", "flext-tap-oracle-wms/src", "flext-target-ldap/src", "flext-target-ldif/src", "flext-target-oracle/src", "flext-target-oracle-oic/src", "flext-target-oracle-wms/src", "flext-web/src"]
files = ["src/flext"]

        [[tool.mypy.overrides]]
            disable_error_code = [
                "call-overload",
            ]
            module = "(models.py|result.py|service.py)"

        [[tool.mypy.overrides]]
            disable_error_code = [
                "comparison-overlap",
                "truthy-function",
            ]
            disallow_untyped_defs = false
            module = "tests.*"

        [[tool.mypy.overrides]]
            disable_error_code = [
                "name-defined",
            ]
            module = "*.protocols"

        [[tool.mypy.overrides]]
            disable_error_code = [
                "explicit-any",
            ]
            module = "flext_core.typings"

        [[tool.mypy.overrides]]
            disable_error_code = [
                "prop-decorator",
                "return-value",
            ]
            module = "flext_core._models.base"

    [tool.poetry]

        packages = [
            { from = "src", include = "flext" },
        ]

        [tool.poetry.dependencies]
            python = ">=3.13,<3.14"
            # Regular dependencies (moved from [project.dependencies])
            cachetools = ">=6.2.0"
            cbor2 = ">=5.7.0"
            click = ">=8.2.1"
            docker = ">=7.1.0"
            packaging = ">=25.0"
            protobuf = ">=6.30.2"
            pydantic = ">=2.12.3"
            pydantic-settings = ">=2.10.1"
            pyyaml = ">=6.0"
            rich = ">=14.0.0"
            structlog = ">=25.4.0"
            toml = ">=0.10.2"
            tomli-w = ">=1.2.0"
            tomlkit = ">=0.13.3"
            trio = ">=0.31.0"
            pydantic-core = ">=2.41.4"
            trafilatura = ">=2.0.0"
            # Path dependencies (editable installs - paths defined in [project.dependencies])
            flexcore = {path = ".flext-deps/flexcore", develop = true}
            flext-api = {path = ".flext-deps/flext-api", develop = true}
            flext-auth = {path = ".flext-deps/flext-auth", develop = true}
            flext-cli = {path = ".flext-deps/flext-cli", develop = true}
            flext-core = {path = ".flext-deps/flext-core", develop = true}
            flext-db-oracle = {path = ".flext-deps/flext-db-oracle", develop = true}
            flext-dbt-ldap = {path = ".flext-deps/flext-dbt-ldap", develop = true}
            flext-dbt-ldif = {path = ".flext-deps/flext-dbt-ldif", develop = true}
            flext-dbt-oracle = {path = ".flext-deps/flext-dbt-oracle", develop = true}
            flext-dbt-oracle-wms = {path = ".flext-deps/flext-dbt-oracle-wms", develop = true}
            flext-grpc = {path = ".flext-deps/flext-grpc", develop = true}
            flext-ldap = {path = ".flext-deps/flext-ldap", develop = true}
            flext-ldif = {path = ".flext-deps/flext-ldif", develop = true}
            flext-meltano = {path = ".flext-deps/flext-meltano", develop = true}
            flext-observability = {path = ".flext-deps/flext-observability", develop = true}
            flext-oracle-oic = {path = ".flext-deps/flext-oracle-oic", develop = true}
            flext-oracle-wms = {path = ".flext-deps/flext-oracle-wms", develop = true}
            flext-plugin = {path = ".flext-deps/flext-plugin", develop = true}
            flext-quality = {path = ".flext-deps/flext-quality", develop = true}
            flext-tap-ldap = {path = ".flext-deps/flext-tap-ldap", develop = true}
            flext-tap-ldif = {path = ".flext-deps/flext-tap-ldif", develop = true}
            flext-tap-oracle = {path = ".flext-deps/flext-tap-oracle", develop = true}
            flext-tap-oracle-oic = {path = ".flext-deps/flext-tap-oracle-oic", develop = true}
            flext-tap-oracle-wms = {path = ".flext-deps/flext-tap-oracle-wms", develop = true}
            flext-target-ldap = {path = ".flext-deps/flext-target-ldap", develop = true}
            flext-target-ldif = {path = ".flext-deps/flext-target-ldif", develop = true}
            flext-target-oracle = {path = ".flext-deps/flext-target-oracle", develop = true}
            flext-target-oracle-oic = {path = ".flext-deps/flext-target-oracle-oic", develop = true}
            flext-target-oracle-wms = {path = ".flext-deps/flext-target-oracle-wms", develop = true}
            flext-web = {path = ".flext-deps/flext-web", develop = true}

        [tool.poetry.group.dev.dependencies]
            aiohttp = ">=3.12.14"
            docker = ">=7.1.0"
            email-validator = "^2.3.0"
            jedi-language-server = "^0.45.1"
            ldap3 = ">=2.9.1"
            numpy = ">=2.3.2"
            psycopg2 = ">=2.9.10"
            pytest-benchmark = "^5.1.0"
            pytest-clarity = "^1.0.1"
            pytest-cov = "^7.0.0"
            pytest-json-report = "^1.5.0"
            pytest-randomly = "^4.0.1"
            pytest-xdist = "^3.8.0"
            redis = ">=5.0.0"
            twisted = "^25.5.0"
            types-pyyaml = "^6.0.12.20250809"
            beartype = "^0.22.5"
        commitizen = ">=4.8.3,<4.9"
        opentelemetry-exporter-prometheus = ">=0.60b1"
        opentelemetry-api = ">=1.39.1"
        opentelemetry-sdk = ">=1.39.1"
        prompt-toolkit = ">=3.0.52"
        sqlparse = ">=0.5.5"
        vulture = "^2.14"
        complexipy = "^5.1.0"
        rope = "^1.14.0"
        detect-secrets = "^1.5.0"
        safety = "^3.7.0"

        [tool.poetry.group.typings.dependencies]
            aiofiles = "^24.1.0"
            pyarrow-stubs = "^20.0.0.20250825"
            types-aiofiles = "^24.1.0.20250809"
            types-click-default-group = "^1.2.0.20250513"
            types-croniter = "^6.0.0.20250626"
            types-dateparser = "^1.2.2.20250627"
            types-factory-boy = "^0.4.1"
            types-greenlet = "^3.2.0.20250417"
            types-grpcio = "^1.0.0.20250914"
            types-ldap3 = "^2.9.13.20250622"
            types-mock = "^5.2.0.20250809"
            types-networkx = "^3.5.0.20250728"
            types-pymysql = "^1.1.0.20250711"
            types-pytz = "^2025.2.0.20250516"
            types-pyyaml = ">=6.0.12.20250516"
            types-simplejson = "^3.20.0.20250326"
            types-six = "^1.17.0.20250515"
            types-ujson = "^5.10.0.20250326"
types-cachetools = "^6.2.0.20251022"
types-tabulate = "^0.9.0.20241207"

        [tool.poetry.group.docs.dependencies]
            matplotlib = "^3.10.7"
            seaborn = "^0.13.2"

    [tool.pydantic-mypy]
        init_forbid_extra = true
        init_typed = true
        warn_required_dynamic_aliases = true

    [tool.pyright]
        exclude = [
            "**/*.pb2.py",
            "**/*.pb2_grpc.py",
            ".git/",
            ".meltano/",
            ".mypy_cache/",
            ".pytest_cache/",
            ".ruff_cache/",
            "__pycache__/",
            "build/",
            "dist/",
            "node_modules/",
            "target/",
        ]
        pythonPlatform = "Linux"
        pythonVersion = "3.13"
        typeCheckingMode = "strict"
        enableTypeIgnoreComments = false
        reportAssertAlwaysTrue = false
        reportCallInDefaultInitializer = "error"
        reportCallIssue = "error"
        reportConstantRedefinition = "error"
        reportDuplicateImport = "error"
        reportFunctionMemberAccess = "error"
        reportGeneralTypeIssues = "error"
        reportImplicitRelativeImport = false
        reportImplicitStringConcatenation = "warning"
        reportImportCycles = "error"
        reportIncompatibleMethodOverride = "error"
        reportIncompatibleVariableOverride = "error"
        reportIncompleteStub = "warning"
        reportInconsistentConstructor = "error"
        reportInvalidStringEscapeSequence = "error"
        reportInvalidStubStatement = "error"
        reportInvalidTypeForm = false
        reportInvalidTypeVarUse = "error"
        reportMatchNotExhaustive = "warning"
        reportMissingImports = "error"
        reportMissingModuleSource = "error"
        reportMissingParameterType = "error"
        reportMissingSuperCall = "warning"
        reportMissingTypeArgument = "error"
        reportMissingTypeStubs = "warning"
        reportOptionalCall = "error"
        reportOptionalContextManager = "error"
        reportOptionalIterable = "error"
        reportOptionalMemberAccess = "error"
        reportOptionalOperand = "error"
        reportOptionalSubscript = "error"
        reportPrivateUsage = false
        reportPropertyTypeMismatch = "error"
        reportSelfClsParameterName = "error"
        reportTypedDictNotRequiredAccess = "error"
        reportUnboundVariable = "error"
        # reportUndefinedVariable = false
        reportUninitializedInstanceVariable = "warning"
        # reportUnknownArgumentType = "error"
        reportUnknownArgumentType = false
        reportUnknownLambdaType = "error"
        # reportUnknownMemberType = "error"
        reportUnknownMemberType = false
        # reportUnknownParameterType = "error"
        reportUnknownParameterType = false
        # reportUnknownVariableType = "error"
        reportUnknownVariableType = false
        reportUnnecessaryCast = "warning"
        reportUnnecessaryComparison = "warning"
        reportUnnecessaryIsInstance = "warning"
        reportUnnecessaryTypeIgnoreComment = "warning"
        reportUnsupportedDunderAll = "error"
        reportUntypedBaseClass = "error"
        reportUntypedClassDecorator = "error"
        reportUntypedFunctionDecorator = "error"
        reportUntypedNamedTuple = "error"
        reportUnusedCallResult = "warning"
        reportUnusedClass = "warning"
        reportUnusedCoroutine = "error"
        reportUnusedExpression = "warning"
        reportUnusedFunction = "warning"
        reportUnusedImport = "error"
        reportUnusedVariable = "error"
        reportWildcardImportFromLibrary = "error"
        strictDictionaryInference = true
        strictListInference = true
        strictParameterNoneValue = true
        strictSetInference = true
        useLibraryCodeForTypes = true

        # Execution environment for specific directory with known pyright limitations
        # Known limitation: kwargs unpacking with type aliases (pyright issue #11136)
        # Dynamic attribute access with hasattr checks (pyright limitation)
        [[tool.pyright.executionEnvironments]]
        root = "flext-ldif/tests/helpers"
        reportArgumentType = false
        reportAttributeAccessIssue = false

    [tool.pytest.ini_options]
        addopts = [
            "--strict-config",
            "--strict-markers",
            "--tb=short",
            "-p no:sugar",
            "-q",
            "-ra",
        ]
        filterwarnings = [
            "ignore::DeprecationWarning:pyasn1(.*|$)",
        ]
        markers = [
            "docker: marca testes que requerem Docker",
            "e2e: marca testes como testes de integração end-to-end",
            "edge_cases: marca testes de casos extremos",
            "integration: marca testes como testes de integração",
            "integrity: marca testes de integridade",
            "oracle: marca testes específicos do Oracle",
            "performance: marca testes de performance",
            "resilience: marca testes de resiliência",
            "slow: marca testes como execução lenta",
            "stress: marca testes de stress",
            "unit: marca testes como testes unitários",
        ]
        minversion = "8.0"
        python_classes = [
            "Test*",
        ]
        python_files = [
            "*_test.py",
            "test_*.py",
        ]
        python_functions = [
            "test_*",
        ]
        pythonpath = [
            "src",
        ]
        testpaths = [
            "tests/",
        ]

    [tool.pyrefly]
        search-path = [
            "../typings",
            "../typings/generated",
            "typings",
            "typings/generated",
            "src",
            "examples",
            "scripts",
        ]
        project-excludes = ["**/*_pb2*.py", "**/*_pb2_grpc*.py"]

        [[tool.pyrefly.sub-config]]
        matches = "**/typings.py"

            [tool.pyrefly.sub-config.errors]
            unknown-name = false

    [tool.ruff]
        extend = "./ruff-shared.toml"

        [tool.ruff.lint.isort]
            known-first-party = [
                "flext",
                "flext_tools",
            ]

    [tool.bandit]
        # Skip known false positives for CLI tools and quality analysis
        skips = [
            "B404",  # subprocess import - required for CLI tool execution
            "B603",  # subprocess without shell=True - actually MORE secure
            "B607",  # partial paths - standard for CLI tool discovery via PATH
            "B105",  # "PASS" constant - not a password, it's a result status
            "B608",  # hardcoded_sql_expressions - DBT/template code-gen; identifiers from config
        ]
        exclude_dirs = [
            ".git",
            ".mypy_cache",
            ".pytest_cache",
            ".ruff_cache",
            ".venv",
            "__pycache__",
            "build",
            "dist",
            "node_modules",
            "tests",
            "vendor",
        ]

    [tool.vulture]
        exclude = [
            ".*/examples/",
            ".*/scripts/",
            ".*/tests/",
            ".coverage.*",
            ".git/",
            ".mypy_cache/",
            ".pytest_cache/",
            ".ruff_cache/",
            ".venv/",
            "__pycache__/",
            "build/",
            "dist/",
            "node_modules/",
            "tests/",
            "vendor/",
        ]
        min_confidence = 80
        paths = [
            "**/src",
            "src",
        ]
        sort_by_size = true
        verbose = false

    # ============================================
    # REFURB - Python Modernization
    # ============================================
    # ============================================
    # COMPLEXIPY - Cognitive Complexity
    # ============================================
    [tool.complexipy]
        max_complexity = 15
        output_format = "plain"

    # ============================================
    # CODESPELL - Spell Checking
    # ============================================
    [tool.codespell]
        skip = ".git,*.lock,*.egg-info,dist,build,.venv,__pycache__,.mypy_cache,.pytest_cache,.ruff_cache,node_modules,vendor,*.pb2*.py"
        ignore-words-list = "dn,cn,ou,uid,sn,aci,acl,ldif,flext,FLEXT,dbt,oic,wms,grpc,meltano,protobuf,creds,assertIn"

    # ============================================
    # COVERAGE - Test Coverage Configuration
    # ============================================
    [tool.coverage.run]
        branch = true
        source = ["src"]
        omit = [
            "*/tests/*",
            "*/__pycache__/*",
            "*/_pb2*.py",
            "*/conftest.py",
        ]
        relative_files = true

    [tool.coverage.report]
        fail_under = 100
        exclude_lines = [
            "pragma: no cover",
            'if __name__ == .__main__.:',
            'if __name__ == "__main__":',
            "if TYPE_CHECKING:",
            "raise NotImplementedError",
            "@abstractmethod",
            "^\\s*\\.\\.\\.\\s*$",
            "def __repr__",
            "def __str__",
        ]
        partial_branches = [
            "pragma: no branch",
        ]
        skip_empty = true
        show_missing = true
        precision = 2

    [tool.coverage.html]
        directory = "htmlcov"

    [tool.coverage.xml]
        output = "coverage.xml"
