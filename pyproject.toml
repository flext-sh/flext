[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "pyauto-workspace"
version = "0.4.0"
description = "PyAuto - Enterprise Python automation workspace with unified dependencies"
authors = ["PyAuto Team <team@pyauto.dev>"]
readme = "README.md"
packages = []
package-mode = false
homepage = "https://github.com/datacosmos-br/pyauto"
repository = "https://github.com/datacosmos-br/pyauto"
documentation = "https://datacosmos-br.github.io/pyauto/"
keywords = ["automation", "oracle", "hexagonal", "architecture", "framework"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.13,<3.15"

# ===== LOCAL PYAUTO PROJECTS =====
# Core framework (required by all adapters)
flx = { path = "./flx", develop = true }

# Oracle adapters
flx-database-oracle = { path = "./flx-database-oracle", develop = true }
flx-http-oracle-oic = { path = "./flx-http-oracle-oic", develop = true }
flx-http-oracle-wms = { path = "./flx-http-oracle-wms", develop = true }

# Implementation projects
client-a-oud-migration = { path = "./client-a-mig-oud", develop = true }
client-b-oic-wms = { path = "./client-b-poc-oic-wms", develop = true }

# Example and templates
flx-adapter-example = { path = "./flx-adapter-example", develop = true }

[tool.poetry.group.dev.dependencies]
# ===== TESTING FRAMEWORKS =====
pytest = "^8.4.0"
pytest-asyncio = "<0.24.0"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
pytest-xdist = "^3.7.0"
pytest-benchmark = "^4.0.0"
pytest-html = "^4.1.1"
pytest-timeout = "^2.4.0"
coverage = "^7.8.2"

# ===== CODE FORMATTING & LINTING =====
black = "^25.1.0"
isort = "<6"
ruff = "^0.11.13"
autoflake = "^2.2.1"
pyupgrade = "^3.19.0"

# ===== TYPE CHECKING =====
mypy = "^1.16.0"
types-python-dateutil = "^2.9.0.20241206"
types-pyyaml = "^6.0.12.20250516"
types-redis = "^4.6.0.20240903"
types-requests = "^2.32.0.20241016"
types-setuptools = "^75.7.0.20250106"

# ===== SECURITY & QUALITY ANALYSIS =====
bandit = "^1.8.0"
safety = "^2.3.0"
vulture = "^2.12"

# ===== DEVELOPMENT TOOLS =====
pre-commit = "^4.2.0"
refurb = "^2.1.0"
monkeytype = "^23.3.0"

# ===== DOCUMENTATION =====
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.47"

[tool.poetry.scripts]
pyauto = "scripts.main:main"

[tool.black]
line-length = 88
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = '''
/(
  # Directories to exclude
  __pycache__|
  .git|
  .mypy_cache|
  .pytest_cache|
  .ruff_cache|
  .venv|
  venv|
  build|
  dist|
  htmlcov|
  node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["flx", "flx_database_oracle", "flx_http_oracle_oic", "flx_http_oracle_wms"]
known_local_folder = ["client-a_oud_mig", "gn_oic_wms_db"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true
pretty = true

# Ignore missing imports for external packages that don't have stubs
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = [
    "oracledb.*",
    "ldap.*",
    "ldif.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache", 
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "N",      # pep8-naming
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T20",    # flake8-print
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RET",    # flake8-return
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "PL",     # pylint
    "RUF",    # ruff-specific rules
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
    "TRY003",   # avoid specifying messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG001"]  # Allow assert, magic values, unused args in tests
"scripts/*" = ["T201", "T203"]             # Allow print statements in scripts

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers", 
    "--strict-config",
    "--cov-fail-under=85",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "oracle: Tests requiring Oracle database",
    "redis: Tests requiring Redis",
]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src", "flx/src", "*/src"]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]