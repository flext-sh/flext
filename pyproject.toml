[project.scripts]
flext-dev = "flext.dev:main"
flext-docs = "flext.docs:main"
flext-workspace = "flext.workspace:main"

[project.urls]
Documentation = "https://docs.flext.sh"
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"

# [MANAGED] codespell
[tool.codespell]
check-filenames = true
ignore-words-list = "crate,nd"

# [MANAGED] coverage
[tool.coverage.report]
exclude_also = [ "if TYPE_CHECKING:", "if _t.TYPE_CHECKING:", "if typing.TYPE_CHECKING:" ]
fail_under = 45
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.run]
omit = [ "*/dependency_injector/providers.pyx" ]

# [MANAGED] deptry
[tool.deptry]
known_first_party = [ "flext", "flext_core", "flext_infra", "flext_tests" ]
pep621_dev_dependency_groups = [ "dev" ]

[tool.flext.docs]
exclude_docs = [
  "/README.md",
  "SUPPRESSIONS-RATIONALE.md",
  "api-reference/foundation.md",
  "api/types.md",
  "architecture/FLEXT_*.md",
  "architecture/arc42/**",
  "architecture/c4-model/**",
  "architecture/clean-architecture.md",
  "architecture/data/**",
  "architecture/deployment/**",
  "architecture/flext-*-architecture.md",
  "architecture/overview.md",
  "architecture/plantuml/**",
  "architecture/security/**",
  "examples/**",
  "planning/**",
  "projects/flext-*.md",
  "projects/flext-*/**",
  "prompts/**",
  "references/**",
  "releases/**",
  "reports/**",
  "roadmap/**",
  "scripts/**",
  "standards/docstrings/**",
  "standards/link-management.md",
  "superpowers/**",
  "type-system-architecture.md",
  "utilities-guide.md",
  "version-policy.md",
]
site_title = "FLEXT Workspace"

[tool.hatch.metadata]
allow-direct-references = true

# [MANAGED] mypy
[tool.mypy]
check_untyped_defs = true
disable_error_code = [
  "assignment",
  "attr-defined",
  "call-arg",
  "misc",
  "name-defined",
  "prop-decorator",
  "valid-type",
]
exclude = "^tests/fixtures(?:/|$)"
explicit_package_bases = true
extra_checks = true
follow_imports = "normal"
ignore_missing_imports = true
local_partial_types = true
mypy_path = [ ".", "src" ]
namespace_packages = true
no_implicit_reexport = true
overrides = [  ]
plugins = [ "pydantic.mypy", "returns.contrib.mypy.returns_plugin" ]
python_version = "3.13"
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true

[tool.poetry]

# [MANAGED] pydantic-mypy
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

