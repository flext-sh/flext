errors.invalid-inheritance = true
errors.missing-attribute = true
errors.missing-import = true
errors.missing-override-decorator = true
errors.no-matching-overload = true
errors.not-a-type = true
errors.not-callable = true
errors.not-iterable = true
errors.redundant-condition = true
errors.unannotated-attribute = true
