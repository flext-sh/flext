# [MANAGED] tomlsort
[tool.tomlsort]
all = true
in_place = true
sort_first = [
  "build-system",
  "dependency-groups",
  "project",
  "tool",
]

# [MANAGED] yamlfix
[tool.yamlfix]
explicit_start = false
line_length = 88
preserve_quotes = true
section_whitelines = 1
whitelines = 1

