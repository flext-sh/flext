[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext"
dynamic = [ "version",]
description = "FLEXT - Multi-Project Workspace Coordinator for Enterprise Data Integration"
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = [ "flext", "workspace", "data-integration", "etl", "meltano", "enterprise", "async", "ldap", "oracle", "grpc", "api", "authentication", "monitoring",]
classifiers = [ "Development Status :: 5 - Production/Stable", "Intended Audience :: Developers", "Intended Audience :: System Administrators", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Systems Administration", "Topic :: Database", "Topic :: Office/Business :: Financial :: Accounting", "Typing :: Typed",]
dependencies = [ "pydantic>=2.11.0", "pydantic-settings>=2.5.0", "fastapi>=0.115.0", "uvicorn>=0.32.0", "click>=8.1.7", "rich>=13.9.0", "typing-extensions>=4.12.0", "flext-oracle-oic-ext @ file:///home/marlonsc/flext/flext-oracle-oic-ext"]
[[project.authors]]
name = "FLEXT Team"
email = "team@flext.sh"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"
"Bug Tracker" = "https://github.com/flext-sh/flext/issues"
Changelog = "https://github.com/flext-sh/flext/blob/main/CHANGELOG.md"

[tool.poetry]
version = "0.6.0"
[[tool.poetry.packages]]
include = "flext"
from = "src"

[tool.black]
line-length = 88
target-version = [ "py312",]
include = "\\.pyi?$"
extend-exclude = "/(\n    __pycache__\n  | .git\n  | .mypy_cache\n  | .pytest_cache\n  | .ruff_cache\n  | .venv\n  | venv\n  | build\n  | dist\n  | htmlcov\n  | node_modules\n)/\n"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [ "flext", "flext_core", "flext_auth", "flext_api", "flext_grpc", "flext_web", "flext_cli", "flext_plugin", "flext_observability", "flext_meltano", "flext_tap_ldap", "flext_tap_oracle_oic", "flext_tap_oracle_wms", "flext_target_ldap", "flext_target_oracle_oic", "flext_dbt_ldap", "flext_oracle_oic_ext", "client-a_oud_mig", "client-b_poc_oic_wms",]
known_local_folder = [ "client-a_oud_mig", "client-b_poc_oic_wms",]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
ignore_missing_imports = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = true
disallow_any_explicit = false
strict_optional = true
strict_concatenate = true
[[tool.mypy.overrides]]
module = [ "ldif.*", "singer.*", "meltano.*", "oracledb.*", "fire.*", "ldap3.*", "prefect.*",]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tests.*", "conftest", "*/tests/*",]
ignore_errors = false
disallow_untyped_defs = false

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
src = [ "src", "tests", "scripts", "*/src",]
extend-exclude = [ "__pycache__", ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "venv", "build", "dist", "htmlcov",]

[tool.bandit]
targets = [ "src",]
exclude_dirs = [ "tests", "build", "dist",]
skips = [ "B101", "B601",]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.vulture]
min_confidence = 100
paths = [ "src",]
exclude = [ "tests/",]
ignore_decorators = [ "@app.route", "@router.get", "@router.post",]
ignore_names = [ "_*",]
make_whitelist = true
sort_by_size = true

[tool.radon]
exclude = [ "tests/*", "*/tests/*",]
ignore = [ "F401",]
total_average = true
show_complexity = true
average = true
order = "SCORE"

[tool.poetry.dependencies]
python = ">=3.13,<3.14"
flext-oracle-oic-ext = {develop = true}

[tool.ruff.lint]
ignore = [ "COM812", "ISC001", "D203", "D213", "E501", "D100", "D101", "D102", "D103", "D105", "D107", "D205", "D401", "D417", "ANN101", "ANN102", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901", "E402", "T201", "INP001",]
select = [ "ALL",]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [ "--strict-markers", "--strict-config", "--verbose", "--tb=short", "--cov=src", "--cov-report=term-missing:skip-covered", "--cov-report=html:reports/coverage", "--cov-report=xml:reports/coverage.xml", "--cov-fail-under=85", "--junitxml=reports/pytest.xml", "--maxfail=10", "--timeout=60",]
testpaths = [ "tests", "*/tests",]
python_files = [ "test_*.py", "*_test.py",]
python_classes = [ "Test*",]
python_functions = [ "test_*",]
markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')", "integration: marks tests as integration tests", "unit: marks tests as unit tests", "e2e: marks tests as end-to-end tests", "workspace: marks tests as workspace coordination tests", "oracle: marks tests requiring Oracle database", "redis: marks tests requiring Redis", "performance: marks tests as performance tests",]
filterwarnings = [ "error", "ignore::UserWarning", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning",]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = [ "src", "*/src",]
omit = [ "*/tests/*", "*/test_*", "*/*_test.py", "*/conftest.py", "*/__pycache__/*", "*/site-packages/*", "*/.venv/*", "*/venv/*", "*/build/*", "*/dist/*", "*/.eggs/*",]
data_file = "reports/.coverage"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
exclude_lines = [ "pragma: no cover", "def __repr__", "if self.debug:", "if settings.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod", "TYPE_CHECKING",]

[tool.coverage.html]
directory = "reports/coverage"
title = "FLEXT Workspace Coverage Report"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.bandit.assert_used]
skips = [ "*/tests/*", "*/test_*.py",]

[tool.setuptools.dynamic.version]
attr = "flext.__version__.__version__"

