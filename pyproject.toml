# [MANAGED] ruff
[tool.ruff]
extend = "./ruff-shared.toml"
lint.isort.known-first-party = [ "flext", "flext_tools" ]

# ============================================
# CODESPELL - Spell Checking
# ============================================
# [MANAGED] codespell
[tool.codespell]
ignore-words-list = "dn,cn,ou,uid,sn,aci,acl,ldif,flext,FLEXT,dbt,oic,wms,grpc,meltano,protobuf,creds,assertIn"
skip = """\
  .git,*.lock,*.egg-info,dist,build,.venv,__pycache__,.mypy_cache,.pytest_cache,.ruff_cache,node_modules,typings,vendor\
  ,*.pb2*.py\
  """

# [MANAGED] deptry
[tool.deptry]
exclude = [
  ".archive",
  ".git",
  ".meltano",
  ".mypy_cache",
  ".pytest_cache",
  ".ruff_cache",
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "htmlcov",
  "node_modules",
  "reports",
  "tests",
  "typings",
  "vendor",
  "venv",
]
extend_exclude = [ "flexcore/", "flext-.*/" ]
known_first_party = [ "flext", "flext_quality" ]
pep621_dev_dependency_groups = [ "dev" ]

# [MANAGED] pytest
[tool.pytest]
[tool.pytest.ini_options]
tool.pytest.ini_options.minversion = "8.0"
tool.pytest.ini_options.python_classes = [ "Test*" ]
tool.pytest.ini_options.python_files = [ "*_test.py", "*_tests.py", "test_*.py" ]
tool.pytest.ini_options.addopts = [ "--strict-markers" ]
tool.pytest.ini_options.markers = [
  "unit: unit tests",
  "integration: integration tests",
  "performance: performance and benchmark tests",
  "slow: slow-running tests",
  "docker: tests requiring Docker",
  "e2e: end-to-end integration tests",
  "edge_cases: edge case tests",
  "stress: stress tests",
  "resilience: resilience tests",
]

# [MANAGED] coverage
[tool.coverage]
# ============================================

# COVERAGE - Test Coverage Configuration

# ============================================

html.directory = "htmlcov"
report.exclude_lines = [
  "@abstractmethod",
  "^\\s*\\.\\.\\.\\s*$",
  "def __repr__",
  "def __str__",
  'if __name__ == "__main__":',
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "pragma: no cover",
  "raise NotImplementedError",
]
report.fail_under = 100
report.partial_branches = [ "pragma: no branch" ]
report.precision = 2
report.show_missing = true
report.skip_empty = true
run.branch = true
run.omit = [ "*/__pycache__/*", "*/_pb2*.py", "*/conftest.py", "*/tests/*" ]
run.relative_files = true
run.source = [ "src/flext" ]
xml.output = "coverage.xml"

# [MANAGED] mypy
[tool.mypy]
cache_dir = ".mypy_cache"
check_untyped_defs = true
color_output = true
disallow_any_decorated = false
disallow_any_explicit = true
disallow_any_expr = false
disallow_any_generics = true
disallow_any_unimported = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
error_summary = true
exclude = [
  ".*/generate_config.py",
  ".*/manage.py",
  ".*_pb2\\.py$",
  ".*_pb2_grpc\\.py$",
  ".coverage.*",
  ".git/",
  ".mypy_cache/",
  ".pytest_cache/",
  ".ruff_cache/",
  ".venv/",
  "__pycache__/",
  "build/",
  "dist/",
  "node_modules/",
  "typings/",
  "vendor/",
]
extra_checks = true
files = [ "src", "tests", "examples" ]
follow_imports = "normal"
follow_imports_for_stubs = true
incremental = true
local_partial_types = true
mypy_path = [
  "typings",
  "typings/generated",
  "src",
  "flexcore/src",
  "flext-api/src",
  "flext-auth/src",
  "flext-cli/src",
  "flext-core/src",
  "flext-db-oracle/src",
  "flext-dbt-ldap/src",
  "flext-dbt-ldif/src",
  "flext-dbt-oracle/src",
  "flext-dbt-oracle-wms/src",
  "flext-grpc/src",
  "flext-ldap/src",
  "flext-ldif/src",
  "flext-meltano/src",
  "flext-observability/src",
  "flext-oracle-oic/src",
  "flext-oracle-wms/src",
  "flext-plugin/src",
  "flext-quality/src",
  "flext-tap-ldap/src",
  "flext-tap-ldif/src",
  "flext-tap-oracle/src",
  "flext-tap-oracle-oic/src",
  "flext-tap-oracle-wms/src",
  "flext-target-ldap/src",
  "flext-target-ldif/src",
  "flext-target-oracle/src",
  "flext-target-oracle-oic/src",
  "flext-target-oracle-wms/src",
  "flext-web/src",
]
namespace_packages = true
no_implicit_optional = true
no_implicit_reexport = true
platform = "linux"
plugins = [ "pydantic.mypy" ]
pretty = true
python_version = "3.13"
show_column_numbers = true
show_error_codes = true
show_error_context = true
show_traceback = true
strict = true
strict_equality = true
strict_optional = true
warn_incomplete_stub = true
warn_no_return = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
disable_error_code = [ "call-overload" ]
module = "(models.py|result.py|service.py)"

[[tool.mypy.overrides]]
disable_error_code = [ "comparison-overlap", "truthy-function" ]
disallow_untyped_defs = false
module = "tests.*"

[[tool.mypy.overrides]]
disable_error_code = [ "name-defined" ]
module = "*.protocols"

[[tool.mypy.overrides]]
disable_error_code = [ "explicit-any" ]
module = "flext_core.typings"

[[tool.mypy.overrides]]
disable_error_code = [ "prop-decorator", "return-value" ]
module = "flext_core._models.base"

[[tool.mypy.overrides]]
disable_error_code = [ "no-any-unimported", "misc" ]
module = "flext_core.runtime"

