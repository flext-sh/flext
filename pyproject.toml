# [MANAGED] FLEXT pyproject standardization
# Sections with [MANAGED] are enforced by flext_infra.deps.modernizer.
# Sections with [CUSTOM] are project-specific extension points.
# Sections with [AUTO] are derived from workspace layout and dependencies.
# [MANAGED] build system
[build-system]
build-backend = "poetry.core.masonry.api"
requires = [
  "poetry-core>=2.0",
]

# [CUSTOM] project metadata
[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "flexcore @ ./flexcore",
  "flext-api @ ./flext-api",
  "flext-auth @ ./flext-auth",
  "flext-cli @ ./flext-cli",
  "flext-core @ ./flext-core",
  "flext-db-oracle @ ./flext-db-oracle",
  "flext-dbt-ldap @ ./flext-dbt-ldap",
  "flext-dbt-ldif @ ./flext-dbt-ldif",
  "flext-dbt-oracle @ ./flext-dbt-oracle",
  "flext-dbt-oracle-wms @ ./flext-dbt-oracle-wms",
  "flext-grpc @ ./flext-grpc",
  "flext-ldap @ ./flext-ldap",
  "flext-ldif @ ./flext-ldif",
  "flext-meltano @ ./flext-meltano",
  "flext-observability @ ./flext-observability",
  "flext-oracle-oic @ ./flext-oracle-oic",
  "flext-oracle-wms @ ./flext-oracle-wms",
  "flext-plugin @ ./flext-plugin",
  "flext-quality @ ./flext-quality",
  "flext-tap-ldap @ ./flext-tap-ldap",
  "flext-tap-ldif @ ./flext-tap-ldif",
  "flext-tap-oracle @ ./flext-tap-oracle",
  "flext-tap-oracle-oic @ ./flext-tap-oracle-oic",
  "flext-tap-oracle-wms @ ./flext-tap-oracle-wms",
  "flext-target-ldap @ ./flext-target-ldap",
  "flext-target-ldif @ ./flext-target-ldif",
  "flext-target-oracle @ ./flext-target-oracle",
  "flext-target-oracle-oic @ ./flext-target-oracle-oic",
  "flext-target-oracle-wms @ ./flext-target-oracle-wms",
  "flext-web @ ./flext-web",
]

description = "FLEXT - Enterprise Data Integration Platform - Workspace Manager"
keywords = [
  "coordination",
  "enterprise",
  "flext",
  "typed",
  "workspace",
]
name = "flext"
readme = "README.md"
requires-python = ">=3.13,<3.14"
version = "0.12.0-dev"
license = "MIT"
[[project.authors]]
email = "team@flext.sh"
name = "FLEXT Team"
[[project.maintainers]]
