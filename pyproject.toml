[build-system]
requires = [ "poetry-core>=2.1.3",]
build-backend = "poetry.core.masonry.api"

[project]
name = "pyauto-workspace"
version = "0.4.0"
description = "PyAuto - Enterprise Python automation workspace com todos os subprojetos e dependências opcionais."
readme = "README.md"
requires-python = ">=3.9,<4.0"
keywords = [ "automation", "oracle", "hexagonal", "architecture", "framework",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.9", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Topic :: Software Development :: Libraries :: Application Frameworks", "Typing :: Typed",]
authors = [
    {name = "Marlon Costa", email = "marlon.costa@datacosmos.com.br"}
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/datacosmos-br/pyauto"
Repository = "https://github.com/datacosmos-br/pyauto"
Documentation = "https://datacosmos-br.github.io/pyauto/"
"Bug Tracker" = "https://github.com/datacosmos-br/pyauto/issues"

[tool.poetry]
name = "pyauto-workspace"
version = "0.4.0"
description = "PyAuto - Enterprise Python automation workspace com todos os subprojetos e dependências opcionais."
readme = "README.md"
packages = [{include = "pyauto", from = "src"}]

[tool.black]
line-length = 88
target-version = [ "py39",]
include = "\\\\.pyi?$"
extend-exclude = "/(\n  # Directories to exclude\n  __pycache__|\n  .git|\n  .mypy_cache|\n  .pytest_cache|\n  .ruff_cache|\n  .venv|\n  venv|\n  build|\n  dist|\n  htmlcov|\n  node_modules\n)/\n"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = [ "flext", "flext_database_oracle", "flext_http_oracle_oic", "flext_http_oracle_wms", "flext_adapter_example", "client-a_oud_mig", "gn_oic_wms_db",]
known_local_folder = [ "client-a_oud_mig", "gn_oic_wms_db",]

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false
[[tool.mypy.overrides]]
module = [ "ldif.*", "singer.*", "meltano.*",]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [ "tests.*", "conftest",]
ignore_errors = false
disallow_untyped_defs = false

[tool.ruff]
target-version = "py39"
line-length = 88
src = [ "src", "tests", "scripts", "flext/src", "*/src",]
extend-exclude = [ "__pycache__", ".git", ".mypy_cache", ".pytest_cache", ".ruff_cache", ".venv", "venv", "build", "dist", "htmlcov",]

[tool.bandit]
exclude_dirs = [ "tests", "scripts",]
skips = [ "B101", "B601",]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.poetry.extras]
database = [ "flext-database-oracle",]
http = [ "flext-http-oracle-oic", "flext-http-oracle-wms",]
integration = [ "flext-oracle-oic", "flext-oracle-wms",]
ldap = [ "flext-ldap", "tap-ldap", "target-ldap", "dbt-ldap",]
oracle = [ "target-oracle-wms", "target-oracle-oic", "tap-oracle-oic", "tap-oracle-wms", "oracle-oic-ext",]
singer = [ "singer-sdk",]
all = [ "flext-database-oracle", "flext-http-oracle-oic", "flext-http-oracle-wms", "flext-oracle-oic", "flext-oracle-wms", "flext-ldap", "tap-ldap", "target-ldap", "dbt-ldap", "target-oracle-wms", "target-oracle-oic", "tap-oracle-oic", "tap-oracle-wms", "oracle-oic-ext", "singer-sdk",]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
typing-extensions = "^4.12.0"

# Core dependencies that subprojects can use
uvloop = "^0.21.0"
fastapi = "^0.115.13"
starlette = ">=0.40.0,<0.47.0"
pydantic = "^2.11.0"
pydantic-settings = "^2.0.0"
httpx = "^0.28.1"
structlog = "^24.4.0"
aiofiles = "^24.1.0"
rich = "^13.9.0"
click = "^8.1.7"
python-dotenv = "^1.0.1"
sqlalchemy = "^2.0.0"
oracledb = "^2.0.0"
asyncio-extras = "^1.3.2"
ldap3 = "^2.9.0"
tomli = "^2.0.0"
tomli-w = "^1.1.0"
unstructured = "^0.17.2"
transitions = "^0.9.2"
dependency-injector = "^4.48.1"
orjson = "^3.10.18"
typer = "^0.16.0"
asyncpg = "^0.30.0"
django-debug-toolbar = "^5.2.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.14.0"

# Code quality
ruff = "^0.8.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.13.0"
bandit = "^1.7.0"
pre-commit = "^4.0.0"

# Type stubs - CENTRALIZED (only for libs without built-in types)
types-requests = "^2.32.4.20250611"
types-pyyaml = "^6.0.12.20250516"
types-python-dateutil = "^2.9.0.20250516"
types-toml = "^0.10.8.20240310"
types-setuptools = "^75.6.0.20241126"
types-psutil = "^6.1.0.20241106"
# Note: oracledb 2.0+, sqlalchemy 2.0+, uvloop, fastapi, pydantic have built-in types
# Note: ldap3 may have built-in types - need to verify

# Documentation (Python 3.10+ only)
sphinx = {version = "^8.0.0", python = ">=3.10"}
sphinx-rtd-theme = {version = "^3.0.0", python = ">=3.10"}
myst-parser = {version = "^4.0.0", python = ">=3.10"}

# Development tools (Python 3.10+ only)
ipython = {version = "^8.29.0", python = ">=3.10"}
jupyter = {version = "^1.1.1", python = ">=3.10"}
rich-traceback = "^1.0.3"
vulture = "^2.14"

[tool.ruff.lint]
select = [ "E", "W", "F", "I", "UP", "N", "B", "C4", "DTZ", "T20", "ISC", "PIE", "PT", "RET",]
ignore = [ "E501", "PLR0913", "PLR2004", "TRY003",]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [ "-ra", "--strict-markers", "--strict-config", "--cov-fail-under=85", "--cov-report=term-missing:skip-covered", "--cov-report=html:reports/coverage", "--cov-report=xml:reports/coverage.xml",]
testpaths = [ "tests", "*/tests",]
markers = [ "unit: Unit tests", "integration: Integration tests", "e2e: End-to-end tests", "slow: Slow tests", "oracle: Tests requiring Oracle database", "redis: Tests requiring Redis",]
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = [ "src", "flext/src", "*/src",]
omit = [ "*/tests/*", "*/migrations/*", "*/__pycache__/*", "*/venv/*", "*/.venv/*",]

[tool.coverage.report]
exclude_lines = [ "pragma: no cover", "def __repr__", "if self.debug:", "if settings.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod",]

[tool.poetry.dependencies.flext]
path = "flext"
develop = true

[tool.poetry.dependencies.flext-database-oracle]
path = "flext-database-oracle"
develop = true
optional = true

[tool.poetry.dependencies.flext-http-oracle-oic]
path = "flext-http-oracle-oic"
develop = true
optional = true

[tool.poetry.dependencies.flext-http-oracle-wms]
path = "flext-http-oracle-wms"
develop = true
optional = true

[tool.poetry.dependencies.flext-oracle-oic]
path = "flext-oracle-oic"
develop = true
optional = true

[tool.poetry.dependencies.flext-oracle-wms]
path = "flext-oracle-wms"
develop = true
optional = true

[tool.poetry.dependencies.flext-ldap]
path = "./flext-ldap"
develop = true
optional = true

[tool.poetry.dependencies.tap-ldap]
path = "./tap-ldap"
develop = true
optional = true

[tool.poetry.dependencies.target-ldap]
path = "./target-ldap"
develop = true
optional = true

[tool.poetry.dependencies.dbt-ldap]
path = "./dbt-ldap"
develop = true
optional = true

[tool.poetry.dependencies.target-oracle-wms]
path = "./target-oracle-wms"
develop = true
optional = true

[tool.poetry.dependencies.target-oracle-oic]
path = "./target-oracle-oic"
develop = true
optional = true

[tool.poetry.dependencies.tap-oracle-oic]
path = "./tap-oracle-oic"
develop = true
optional = true

[tool.poetry.dependencies.tap-oracle-wms]
path = "./tap-oracle-wms"
develop = true
optional = true

[tool.poetry.dependencies.oracle-oic-ext]
path = "./oracle-oic-ext"
develop = true
optional = true

[tool.poetry.dependencies.singer-sdk]
version = "^0.44.0"
optional = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101", "PLR2004", "ARG001",]
"scripts/*" = [ "T201", "T203",]

[tool.ruff.lint.pydocstyle]
convention = "google"
