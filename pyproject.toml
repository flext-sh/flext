  "flext-target-oracle",
  "flext-target-oracle-oic",
  "flext-target-oracle-wms",
  "flext-tests",
  "flext-web",
  "gruponos-meltano-native",
  "libs",
  "pkg",
  "scripts",
  "src",
  "tests",
  "typings",
]

[tool.pyrefly.errors]
bad-override = false
deprecated = true
implicit-abstract-class = true
implicit-any = true
implicitly-defined-attribute = true
missing-override-decorator = true
missing-source = true
not-required-key-access = true
open-unpacking = true
protocol-implicitly-defined-attribute = true
redundant-cast = true
unannotated-attribute = true
unannotated-parameter = true
unannotated-return = true

# [MANAGED] mypy
[tool.mypy]
disable_error_code = [
  "prop-decorator",
]
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
plugins = [
  "pydantic.mypy",
]
python_version = "3.13"

