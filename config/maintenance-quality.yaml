# Quality-Focused Maintenance Configuration
# For comprehensive code quality improvements

# Target all projects
target_projects: []

# Standard exclusions
exclude_patterns:
  - __pycache__
  - .venv
  - .git
  - dist
  - build
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - node_modules
  - archive
  - backup
  - logs
  - reports
  - htmlcov
  - junit
  - reference

# Enable all quality improvements
fix_categories:
  # All categories enabled for maximum quality
  type_annotations: true
  logging_patterns: true
  exception_handling: true
  unused_variables: true
  import_sorting: true
  string_quotes: true
  undefined_variables: true
  docstring_formatting: true
  line_length: true
  blank_lines: true
  trailing_whitespace: true
  indentation: true
  f_string_conversion: true
  comprehension_optimization: true
  method_ordering: true
  class_structure: true
  type_checking_imports: true
  sql_injection_prevention: true
  hardcoded_secrets: true
  assert_statements: true
  eval_usage: true
  loop_optimizations: true
  dict_get_usage: true
  set_operations: true
  string_concatenation: true
  asyncio_patterns: true
  dependency_injection: true
  hexagonal_architecture: true
  ddd_patterns: true
  cqrs_compliance: true
  markdownlint_compliance: true
  readme_coverage: true
  api_documentation: true
  code_examples: true

# Careful incremental processing
processing_mode: incremental

# Conservative safety settings
safety:
  validate_syntax: true
  max_changes_per_file: 20   # Limit changes per file
  create_backup: true        # Create backups
  rollback_on_error: true
  dry_run: false
  parallel_workers: 4        # Moderate parallelism

# Comprehensive reporting
metrics:
  detailed_report: true
  json_output: true
  html_report: true
  metrics_file: reports/quality_metrics.json
  include_timing: true

# Detailed logging
log_level: DEBUG
log_file: logs/quality_maintenance.log
