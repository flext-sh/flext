# Unified Maintenance System Configuration - Comprehensive Analysis
# PyAuto Enterprise Standard - Quality Analysis and Validation

# Target specific projects (empty list = all projects)
target_projects: []

# Patterns to exclude from processing
exclude_patterns:
  - __pycache__
  - .venv
  - .git
  - dist
  - build
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - node_modules
  - archive
  - backup
  - logs
  - reports
  - htmlcov
  - junit
  - .tox
  - "*.egg-info"
  - reference
  - docs/oracle_wms_25b

# Analysis-focused custom fix modules (in order)
custom_fixes:
  # Analysis and validation modules (PRIMARY FOCUS)
  - dependency_management      # Analyze dependency conflicts and standardization
  - project_validation        # Validate enterprise compliance standards
  - quality_metrics           # Generate comprehensive quality metrics
  - testing_orchestration     # Run comprehensive test suite

  # Essential code fixes (minimal set for analysis)
  - type_annotations          # Type safety analysis
  - logging_patterns          # Logging standard compliance
  - security                  # Security vulnerability detection

# Processing mode
processing_mode: sequential  # sequential for detailed analysis

# Safety configuration - analysis-friendly
safety:
  validate_syntax: true      # Validate Python syntax during analysis
  max_changes_per_file: 0    # No changes during analysis
  create_backup: false       # No backups needed for analysis
  rollback_on_error: false   # Continue analysis despite errors
  dry_run: true             # Analysis only - no modifications
  parallel_workers: 2        # Conservative for analysis

# Metrics and reporting - comprehensive for analysis
metrics:
  detailed_report: true      # Generate detailed report
  json_output: true          # Output JSON format for analysis
  html_report: true          # Generate HTML report for dashboards
  metrics_file: "reports/comprehensive_analysis.json"
  include_timing: true       # Include timing information

# Analysis-specific settings
analysis:
  coverage_threshold: 85.0           # Minimum test coverage percentage
  complexity_threshold: 10           # Maximum cyclomatic complexity
  quality_score_threshold: 75.0      # Minimum quality score
  dependency_conflict_tolerance: 0   # Zero tolerance for dependency conflicts
  compliance_threshold: 90.0         # Minimum compliance percentage

  # Quality metrics configuration
  generate_dashboard: true           # Generate quality dashboard
  save_historical_data: true        # Save data for trend analysis
  compare_with_baseline: true       # Compare with previous analysis

  # Testing configuration
  test_types: ["unit", "integration", "e2e"]  # Test types to run
  parallel_test_jobs: 4             # Parallel test execution
  test_timeout: 1800                 # 30 minutes max per test suite

  # Validation configuration
  strict_standards: true             # Enforce strict enterprise standards
  zero_tolerance_violations: true   # No tolerance for critical violations
  generate_compliance_report: true  # Generate detailed compliance report

# Logging configuration
log_level: INFO              # INFO level for analysis details
log_file: "logs/comprehensive_analysis.log"  # Log analysis activities

# Tool configuration - all enabled for analysis
tools:
  ruff:
    enabled: true
    args: ["--format=json", "--output-format=json"]
  mypy:
    enabled: true
    args: ["--no-error-summary", "--show-error-codes"]
  black:
    enabled: true
    args: ["--check", "--diff"]
  isort:
    enabled: true
    args: ["--check-only", "--diff"]
  autoflake:
    enabled: true
    args: ["--check"]
  pyupgrade:
    enabled: true
    args: ["--py313-plus"]
  markdownlint:
    enabled: true
    args: ["--json"]

# Reporting configuration
reporting:
  output_dir: "reports"
  formats: ["json", "html", "markdown"]
  include_charts: true
  include_trends: true
  include_recommendations: true
  export_csv: true
