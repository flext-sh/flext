Infra:
  codegen:
    vscode:
      # Ordered key/value pairs accept every extension setting and JSON value.
      # Layer composition appends pairs; the final occurrence replaces the whole value.
      settings:
      - [python.analysis.enableTroubleshootMissingImports, true]
    repository:
      project:
        package_name: flext
        class_stem: Flext
        namespace: Flext
        constant_name: flext
        namespace_attribute: flext
        alias: flext
        environment_prefix: FLEXT_
        description: FLEXT - Enterprise Data Integration Platform - Workspace Manager
        license: MIT
        author_name: FLEXT Team
        author_email: team@flext.sh
        upstream: flext_core
        namespace_scan_dirs: []
        homepage: https://github.com/flext-sh/flext
        documentation: https://docs.flext.sh
        repository_root_rel: .
        year: 2026
      integration:
        provider: flext-sh
        branch: 0.12.0-dev
      namespace_scan_dirs: []
      examples_module: examples.runtime
      publishes_release: true
