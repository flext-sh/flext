# HAProxy configuration for FLEXT distributed load balancing

global
    maxconn 4096
    log stdout local0
    
defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option httplog
    option dontlognull
    option redispatch
    retries 3

# Frontend - Load Balancer Entry Point
frontend flext_frontend
    bind *:8080
    default_backend flext_nodes

# Backend - FLEXT Nodes
backend flext_nodes
    balance roundrobin
    option httpchk GET /health
    
    server node1 flext-node-1:8081 check inter 5s rise 2 fall 3
    server node2 flext-node-2:8082 check inter 5s rise 2 fall 3
    server node3 flext-node-3:8083 check inter 5s rise 2 fall 3

# Stats interface
listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE