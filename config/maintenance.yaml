# Unified Maintenance System Configuration
# PyAuto Enterprise Standard

# Target specific projects (empty list = all projects)
target_projects: []

# Patterns to exclude from processing
exclude_patterns:
  - __pycache__
  - .venv
  - .git
  - dist
  - build
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - node_modules
  - archive
  - backup
  - logs
  - reports
  - htmlcov
  - junit
  - .tox
  - "*.egg-info"
  - reference
  - docs/oracle_wms_25b  # Large documentation files

# Fix categories to enable/disable
fix_categories:
  # Syntax and style
  type_annotations: true
  logging_patterns: true
  exception_handling: true
  unused_variables: true
  import_sorting: true
  string_quotes: true

  # Code quality
  undefined_variables: true
  docstring_formatting: true
  line_length: true
  blank_lines: true
  trailing_whitespace: true
  indentation: true

  # Modern Python patterns
  f_string_conversion: true
  comprehension_optimization: true
  method_ordering: true
  class_structure: true
  type_checking_imports: true

  # Security and best practices
  sql_injection_prevention: true
  hardcoded_secrets: true
  assert_statements: true
  eval_usage: true

  # Performance optimizations
  loop_optimizations: true
  dict_get_usage: true
  set_operations: true
  string_concatenation: true
  asyncio_patterns: true

  # Enterprise patterns
  dependency_injection: true
  hexagonal_architecture: true
  ddd_patterns: true
  cqrs_compliance: true

  # Documentation
  markdownlint_compliance: true
  readme_coverage: true
  api_documentation: true
  code_examples: true

  # Workspace organization (NEW)
  project_standardization: true   # Standardize pyproject.toml across projects
  temp_file_cleanup: true         # Remove old temporary files
  project_customization: true     # Customize project templates by type
  redundant_file_cleanup: true    # Remove redundant/duplicate files

  # Critical automation modules (NEW from zero-tolerance analysis)
  universal_quality_loop: true    # Zero-tolerance quality assurance automation
  config_generation: true         # Unified configuration generation across projects
  oracle_integration: true        # Oracle WMS/OIC integration automation
  ldif_processing: true           # LDAP migration and LDIF processing automation

  # Final automation gaps (NEW - completing zero-tolerance requirements)
  deployment_automation: true     # Automated deployment, health checks, rollback
  monitoring_automation: true     # Automated monitoring, alerting, performance tracking
  cli_validation_automation: true # Automated CLI testing and validation

# Custom fix modules to run (in order)
custom_fixes:
  # Code quality and fixes
  - type_annotations
  - logging_patterns
  - exception_handling
  - asyncio_patterns
  - imports
  - docstrings
  - performance
  - security

  # Critical automation modules (NEW from zero-tolerance analysis)
  - universal_quality_loop    # Zero-tolerance quality assurance automation
  - config_generation         # Unified configuration generation across projects
  - oracle_integration        # Oracle WMS/OIC integration automation
  - ldif_processing           # LDAP migration and LDIF processing automation

  # Final automation gaps (NEW - completing zero-tolerance requirements)
  - deployment_automation     # Automated deployment, health checks, rollback
  - monitoring_automation     # Automated monitoring, alerting, performance tracking
  - cli_validation_automation # Automated CLI testing and validation

  # Workspace organization and validation
  - dependency_management
  - project_validation
  - project_standardization
  - project_customization

  # Testing and quality metrics
  - testing_orchestration
  - quality_metrics

  # Cleanup operations (run last)
  - temp_file_cleanup
  - redundant_file_cleanup

# Processing mode
processing_mode: incremental  # sequential, parallel, incremental

# Safety configuration
safety:
  validate_syntax: true      # Validate Python syntax after changes
  max_changes_per_file: 50   # Maximum changes per file
  create_backup: false       # Create .bak files
  rollback_on_error: true    # Rollback changes on error
  dry_run: false            # Show changes without applying
  parallel_workers: 8        # Number of parallel workers

# Metrics and reporting
metrics:
  detailed_report: true      # Generate detailed report
  json_output: false         # Output JSON format
  html_report: false         # Generate HTML report
  metrics_file: null         # Save metrics to file (e.g., reports/metrics.json)
  include_timing: true       # Include timing information

# Logging configuration
log_level: INFO              # DEBUG, INFO, WARNING, ERROR, CRITICAL
log_file: null              # Log to file (e.g., logs/maintenance.log)
