# Unified Maintenance System Configuration - Reorganization Focus
# PyAuto Enterprise Standard - Workspace Organization

# Target specific projects (empty list = all projects)
target_projects: []

# Patterns to exclude from processing
exclude_patterns:
  - __pycache__
  - .venv
  - .git
  - dist
  - build
  - .pytest_cache
  - .mypy_cache
  - .ruff_cache
  - node_modules
  - archive
  - backup
  - logs
  - reports
  - htmlcov
  - junit
  - .tox
  - "*.egg-info"
  - reference
  - docs/oracle_wms_25b

# Fix categories focused on reorganization
fix_categories:
  # Workspace organization (PRIMARY FOCUS)
  project_standardization: true   # Standardize pyproject.toml across projects
  temp_file_cleanup: true         # Remove old temporary files
  project_customization: true     # Customize project templates by type
  redundant_file_cleanup: true    # Remove redundant/duplicate files

  # Essential code quality (minimal set)
  type_annotations: false
  logging_patterns: false
  exception_handling: false
  unused_variables: false
  import_sorting: false
  string_quotes: false
  undefined_variables: false
  docstring_formatting: false
  line_length: false
  blank_lines: false
  trailing_whitespace: false
  indentation: false
  f_string_conversion: false
  comprehension_optimization: false
  method_ordering: false
  class_structure: false
  type_checking_imports: false
  sql_injection_prevention: false
  hardcoded_secrets: false
  assert_statements: false
  eval_usage: false
  loop_optimizations: false
  dict_get_usage: false
  set_operations: false
  string_concatenation: false
  asyncio_patterns: false
  dependency_injection: false
  hexagonal_architecture: false
  ddd_patterns: false
  cqrs_compliance: false
  markdownlint_compliance: false
  readme_coverage: false
  api_documentation: false
  code_examples: false

# Custom fix modules to run (reorganization only)
custom_fixes:
  - redundant_file_cleanup
  - temp_file_cleanup
  - project_standardization
  - project_customization

# Processing mode
processing_mode: sequential  # sequential for safer reorganization

# Safety configuration - more conservative for reorganization
safety:
  validate_syntax: true      # Validate Python syntax after changes
  max_changes_per_file: 100  # Higher limit for reorganization
  create_backup: true        # Always create backups for reorganization
  rollback_on_error: true    # Rollback changes on error
  dry_run: false            # Default to dry run for safety
  parallel_workers: 4        # Fewer workers for safety

# Metrics and reporting
metrics:
  detailed_report: true      # Generate detailed report
  json_output: true          # Output JSON format for analysis
  html_report: false         # Skip HTML for reorganization
  metrics_file: "reports/reorganization_metrics.json"
  include_timing: true       # Include timing information

# Reorganization-specific settings
reorganization:
  max_temp_file_age_days: 30     # Files older than 30 days
  backup_directory: ".reorganization_backup"
  standardization_template: "enterprise"
  preserve_project_metadata: true
  force_project_type_detection: false

# Logging configuration
log_level: INFO              # INFO level for reorganization details
log_file: "logs/reorganization.log"  # Log reorganization activities

# Tool configuration - minimal for reorganization focus
tools:
  ruff:
    enabled: false  # Skip linting during reorganization
  mypy:
    enabled: false  # Skip type checking during reorganization
  black:
    enabled: false  # Skip formatting during reorganization
  isort:
    enabled: false  # Skip import sorting during reorganization
  autoflake:
    enabled: false  # Skip unused import removal
  pyupgrade:
    enabled: false  # Skip syntax upgrades
  markdownlint:
    enabled: false  # Skip markdown linting
