version: 1
default_environment: dev
project_id: 3d9051ef-ffbb-4d99-888e-44ea47bb0bb7
environments:
  - name: dev
  - name: staging
  - name: prod
plugins:
  extractors:
    - name: tap-csv
      variant: meltanolabs
      pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
      config:
        files:
          - entity: test_data
            path: test_data.csv
            keys:
              - id
  loaders:
    - name: target-jsonl
      variant: andyh1203
      pip_url: target-jsonl
