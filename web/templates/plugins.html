{{template "base.html" .}}

{{define "content"}}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="fas fa-plug"></i> Plugins</h1>
            <button class="btn btn-primary" onclick="registerPlugin()">
                <i class="fas fa-plus"></i> Register Plugin
            </button>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-3">
        <div class="card">
            <div class="card-header">
                <h6 class="card-title mb-0"><i class="fas fa-filter"></i> Filters</h6>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label">Plugin Type</label>
                    <select class="form-select" id="pluginTypeFilter">
                        <option value="">All Types</option>
                        <option value="extractor">Extractors</option>
                        <option value="loader">Loaders</option>
                        <option value="transformer">Transformers</option>
                        <option value="utility">Utilities</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select class="form-select" id="pluginStatusFilter">
                        <option value="">All Status</option>
                        <option value="active">Active</option>
                        <option value="inactive">Inactive</option>
                        <option value="error">Error</option>
                    </select>
                </div>
                <button class="btn btn-secondary btn-sm w-100" onclick="applyFilters()">
                    <i class="fas fa-filter"></i> Apply Filters
                </button>
            </div>
        </div>
    </div>
    
    <div class="col-md-9">
        <div class="card">
            <div class="card-header">
                <div class="row align-items-center">
                    <div class="col">
                        <h5 class="card-title mb-0">Plugin Registry</h5>
                    </div>
                    <div class="col-auto">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchPlugins" placeholder="Search plugins...">
                            <button class="btn btn-outline-secondary" type="button" onclick="searchPlugins()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row" id="pluginsGrid">
                    <div class="col-12 text-center text-muted">
                        <i class="fas fa-spinner fa-spin"></i> Loading plugins...
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Register Plugin Modal -->
<div class="modal fade" id="registerPluginModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-plus"></i> Register New Plugin</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="registerPluginForm">
                    <div class="mb-3">
                        <label for="pluginName" class="form-label">Plugin Name</label>
                        <input type="text" class="form-control" id="pluginName" required>
                    </div>
                    <div class="mb-3">
                        <label for="pluginVersion" class="form-label">Version</label>
                        <input type="text" class="form-control" id="pluginVersion" placeholder="1.0.0" required>
                    </div>
                    <div class="mb-3">
                        <label for="pluginType" class="form-label">Type</label>
                        <select class="form-select" id="pluginType" required>
                            <option value="">Select Type</option>
                            <option value="extractor">Extractor</option>
                            <option value="loader">Loader</option>
                            <option value="transformer">Transformer</option>
                            <option value="utility">Utility</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="pluginDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="pluginDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="pluginConfig" class="form-label">Configuration (JSON)</label>
                        <textarea class="form-control" id="pluginConfig" rows="5" placeholder='{\n  "key": "value"\n}'></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitRegisterPlugin()">Register Plugin</button>
            </div>
        </div>
    </div>
</div>

<!-- Plugin Detail Modal -->
<div class="modal fade" id="pluginDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-plug"></i> Plugin Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="pluginDetailBody">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin"></i> Loading plugin details...
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-warning" id="togglePluginBtn" onclick="togglePlugin()">Toggle Status</button>
                <button type="button" class="btn btn-danger" id="deletePluginBtn" onclick="deletePlugin()">Delete</button>
            </div>
        </div>
    </div>
</div>
{{end}}
