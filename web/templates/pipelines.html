{{template "base.html" .}}

{{define "content"}}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center">
            <h1><i class="fas fa-sitemap"></i> Pipelines</h1>
            <button class="btn btn-primary" onclick="createPipeline()">
                <i class="fas fa-plus"></i> Create Pipeline
            </button>
        </div>
    </div>
</div>

<div class="row mt-4">
    <div class="col-12">
        <div class="card">
            <div class="card-header">
                <div class="row align-items-center">
                    <div class="col">
                        <h5 class="card-title mb-0">Pipeline List</h5>
                    </div>
                    <div class="col-auto">
                        <div class="input-group">
                            <input type="text" class="form-control" id="searchPipelines" placeholder="Search pipelines...">
                            <button class="btn btn-outline-secondary" type="button" onclick="searchPipelines()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>Steps</th>
                                <th>Created</th>
                                <th>Last Updated</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="pipelinesTableBody">
                            <tr>
                                <td colspan="7" class="text-center text-muted">
                                    <i class="fas fa-spinner fa-spin"></i> Loading pipelines...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Create Pipeline Modal -->
<div class="modal fade" id="createPipelineModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-plus"></i> Create New Pipeline</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="createPipelineForm">
                    <div class="mb-3">
                        <label for="pipelineName" class="form-label">Pipeline Name</label>
                        <input type="text" class="form-control" id="pipelineName" required>
                    </div>
                    <div class="mb-3">
                        <label for="pipelineDescription" class="form-label">Description</label>
                        <textarea class="form-control" id="pipelineDescription" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="pipelineType" class="form-label">Type</label>
                        <select class="form-select" id="pipelineType">
                            <option value="etl">ETL Pipeline</option>
                            <option value="data_processing">Data Processing</option>
                            <option value="batch">Batch Job</option>
                            <option value="streaming">Streaming</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" onclick="submitCreatePipeline()">Create Pipeline</button>
            </div>
        </div>
    </div>
</div>

<!-- Pipeline Detail Modal -->
<div class="modal fade" id="pipelineDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title"><i class="fas fa-sitemap"></i> Pipeline Details</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="pipelineDetailBody">
                <div class="text-center">
                    <i class="fas fa-spinner fa-spin"></i> Loading pipeline details...
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary" id="executePipelineBtn" onclick="executePipeline()">Execute</button>
            </div>
        </div>
    </div>
</div>
{{end}}
