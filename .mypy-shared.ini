# FLEXT Workspace Shared MyPy Configuration
# Professional Python Type Checking Standards
# Used by all subprojects - DO NOT MODIFY without workspace coordination

[mypy]
# Python version and basic settings
python_version = 3.13
platform = linux

# Strict mode - enterprise-grade type checking
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Display options
show_error_codes = true
show_error_context = true
pretty = true
color_output = true
error_summary = true

# Advanced type checking
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
no_implicit_reexport = true

# Namespace packages support (PEP 420)
explicit_package_bases = true
namespace_packages = true

# Source path configuration
mypy_path = src

# Plugins for common frameworks
plugins = [
    "pydantic.mypy",
]

# Files to exclude from type checking
exclude = [
    "build/",
    "dist/", 
    ".venv/",
    ".mypy_cache/",
    "__pycache__/",
    "node_modules/",
    ".git/",
    "*/tests/fixtures/",
    "*/examples/",
    "*/scripts/generate_config.py",
    "*/manage.py",
    "vendor/",
    "*/proto/*_pb2.py",
    "*/proto/*_pb2_grpc.py",
    "*/generated/",
]

# Per-module overrides for external libraries without stubs
[[tool.mypy.overrides]]
module = [
    # Database libraries
    "sqlalchemy.*",
    "alembic.*",
    "psycopg2.*",
    "redis.*",
    "oracledb.*",
    
    # Data processing libraries  
    "ldap3.*",
    "singer.*",
    "meltano.*",
    "dbt.*",
    
    # Infrastructure libraries
    "dependency_injector.*",
    "grpcio.*",
    "uvicorn.*",
    "gunicorn.*",
    
    # Testing libraries (when not typed)
    "factory_boy.*",
    "faker.*",
    
    # Monitoring libraries
    "prometheus_client.*",
    "structlog.*",
    
    # Misc libraries
    "click.*",
    "rich.*",
    "tomlkit.*",
]
ignore_missing_imports = true

# Test files - more permissive type checking
[[tool.mypy.overrides]]
module = "tests.*"
disable_error_code = [
    "arg-type",      # Tests intentionally pass invalid types
    "attr-defined",  # Tests access private attributes for testing
    "misc",          # Tests may have intentional type mismatches
    "assignment",    # Tests may assign invalid values intentionally
    "return-value",  # Tests may not care about return values
    "call-overload", # Tests may call functions with test data
]
# Reduce strictness for test files
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

# Generated code - ignore all errors
[[tool.mypy.overrides]]
module = [
    "*.proto.*_pb2",
    "*.proto.*_pb2_grpc", 
    "*_pb2",
    "*_pb2_grpc",
    "generated.*",
]
ignore_errors = true

# Django-specific overrides (for flext-quality)
[[tool.mypy.overrides]]
module = [
    "django.*",
    "*.migrations.*",
    "*.settings.*",
    "*.wsgi.*",
    "*.asgi.*",
]
ignore_missing_imports = true

# Configuration overrides for specific patterns
[[tool.mypy.overrides]]
module = [
    "*.conftest",
    "*.config",
    "*.settings",
]
disable_error_code = ["attr-defined"]

# Pydantic plugin configuration
[pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true