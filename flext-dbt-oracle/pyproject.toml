[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext-dbt-oracle"
version = "1.0.0"
description = "FLEXT DBT Oracle - Modern Oracle Database Adapter for DBT"
authors = [{ name = "FLEXT Team", email = "team@flext.sh" }]
maintainers = [{ name = "FLEXT Team", email = "team@flext.sh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # FLEXT Core Dependencies (REQUIRED for ecosystem integration)
    "flext-core>=0.7.0",
    "flext-observability>=0.7.0",
    "flext-db-oracle>=0.7.0",

    # DBT Core and Oracle dependencies (Modern versions without PostgreSQL)
    "dbt-core>=1.8.0,<2.0.0",
    "agate>=1.7.0,<1.10.0",
    "oracledb>=3.2.0",
    
    # Core Python dependencies
    "pydantic>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "sqlalchemy>=2.0.0",
    "click>=8.2.1,<9.0.0",
    "structlog>=24.0.0",
    "rich>=14.0.0,<15.0.0",
]

keywords = ["flext", "dbt", "oracle", "database", "adapter", "enterprise"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: Database :: Database Engines/Servers",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"

[tool.poetry]
name = "flext-dbt-oracle"
version = "1.0.0"
description = "FLEXT DBT Oracle - Modern Oracle Database Adapter for DBT"
authors = ["FLEXT Team <team@flext.sh>"]
readme = "README.md"
packages = [{ include = "dbt", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

# Core FLEXT dependencies - primary source of truth (Oracle Database)
flext-core = { path = "../flext-core", develop = true }
flext-observability = { path = "../flext-observability", develop = true }
flext-db-oracle = { path = "../flext-db-oracle", develop = true }

# DBT Core and Oracle dependencies (Compatible versions)
dbt-core = ">=1.8.0,<1.10.0"
agate = ">=1.7.0,<1.10.0"
oracledb = ">=3.2.0"

# Core dependencies are managed by flext-core - no duplication
# pydantic, click, structlog, etc.

[tool.poetry.group.dev.dependencies]
# Development dependencies
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.6.0"
pytest-timeout = ">=2.3.1"
pytest-sugar = ">=1.0.0"
pytest-clarity = ">=1.0.1"
pytest-benchmark = ">=4.0.0"

# Code quality (aligned with workspace conservative standard)
ruff = ">=0.8.0"
mypy = ">=1.13.0"
pre-commit = ">=4.0.1"
bandit = ">=1.8.0"

# Documentation
mkdocs = ">=1.6.1"
mkdocs-material = ">=9.6.15"
black = ">=25.1.0"
isort = ">=6.0.1"

[tool.poetry.group.test.dependencies]
# Pytest ecosystem (aligned with workspace conservative standard)
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=4.0.0"
pytest-xdist = ">=3.6.0"
pytest-mock = ">=3.12.0"
pytest-timeout = ">=2.3.1"
pytest-benchmark = ">=4.0.0"
pytest-randomly = ">=3.16.0"
pytest-sugar = ">=1.0.0"
pytest-clarity = ">=1.0.1"
hypothesis = ">=6.125.0"
factory-boy = ">=3.3.1"
faker = ">=37.4.0"

[tool.poetry.group.typings.dependencies]
types-python-dateutil = ">=2.9.0"
types-pyyaml = ">=6.0.12"
types-setuptools = ">=80.9.0"

[tool.poetry.group.security.dependencies]
bandit = ">=1.8.0"
pip-audit = ">=2.7.3"

# Project-specific tool configurations
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=dbt",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=0",
    "--maxfail=1",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "smoke: Smoke tests",
    "e2e: End-to-end tests",
    "oracle: marks tests as Oracle database tests",
    "dbt: marks tests as DBT tests",
    "adapter: marks tests as adapter tests",
    "requires_oracle: tests that need Oracle database access",
]

# Ruff configuration
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # Use of assert
    "S106",    # hardcoded-password-possible - Test configurations
    "PLR2004", # Magic value used in comparison
    "ANN201",  # Missing return type annotation for public function
    "D",       # Docstring rules
]
"src/dbt/adapters/oracle/impl.py" = [
    "S608",    # SQL injection - False positive for Oracle dictionary views with trusted schema names
]

[tool.ruff.lint.isort]
known-first-party = ["dbt", "flext_core", "flext_observability", "flext_db_oracle"]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Use module name instead of src directory
files = ["src/dbt"]

# Disable namespace packages
namespace_packages = false
explicit_package_bases = false

# Error output
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

# Disable specific checks for tests
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# External library stubs - ignore DBT typing issues for now
[[tool.mypy.overrides]]
module = ["dbt.*", "agate.*", "oracledb.*"]
ignore_missing_imports = true
ignore_errors = true

# Temporarily disable mypy for adapter code while DBT types are being resolved
[[tool.mypy.overrides]]
module = ["dbt.adapters.oracle.*"]
ignore_errors = true

# Coverage configuration

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"