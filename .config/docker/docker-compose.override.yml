# FLEXT Development Override
# Use: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

# version removed (obsolete in compose v2)

services:
  # Development overrides for FLEXT service
  flext-service:
    environment:
      FLEXT_ENVIRONMENT: development
      FLEXT_LOG_LEVEL: debug
      FLEXT_DEBUG: true
    volumes:
      # Mount source code for development
      - ./cmd/flext:/app/cmd/flext
      - ./internal:/app/internal
      - ./config.yaml:/home/marlonsc/flext/config.yaml
      - ./.env:/app/.env
    ports:
      # Expose additional ports for development
      - "8080:8080" # API
      - "6060:6060" # pprof profiling
    command: ["./flext", "-env", "development", "-log-level", "debug"]

  # Development overrides for web interface
  flext-web:
    environment:
      FLASK_ENV: development
      FLASK_DEBUG: true
      FLEXT_WEB_DEBUG: true
    volumes:
      # Mount source code for hot reloading
      - ./flext-web/src:/app/src
      - ./.env:/app/.env
    ports:
      - "5000:5000" # Web interface
    command: ["python", "-m", "flext_web.api", "--debug"]

  # Enable all monitoring services in development
  prometheus:
    profiles: [] # Remove profile to enable by default

  grafana:
    profiles: [] # Remove profile to enable by default
    environment:
      GF_SECURITY_ADMIN_PASSWORD: REDACTED_LDAP_BIND_PASSWORD
      GF_USERS_ALLOW_SIGN_UP: true
      GF_INSTALL_PLUGINS: grafana-piechart-panel

  # Development database with exposed port
  postgres:
    environment:
      POSTGRES_PASSWORD: flext_dev_password
    ports:
      - "5433:5432"

  # Development Redis with exposed port
  redis:
    ports:
      - "6379:6379"

  # Add development tools
  REDACTED_LDAP_BIND_PASSWORDer:
    image: REDACTED_LDAP_BIND_PASSWORDer:4-standalone
    container_name: flext-REDACTED_LDAP_BIND_PASSWORDer
    restart: unless-stopped
    ports:
      - "8082:8080"
    networks:
      - flext-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres
