app:
  mode: "server"
  environment: "development"
  debug: true
  version: "2.0.0"

server:
  host: "0.0.0.0"
  port: 8081
  timeout: 30s
  read_timeout: 30s
  write_timeout: 30s
  shutdown_timeout: 30s

database:
  url: "postgresql://localhost:5433/flext"
  max_connections: 20
  conn_max_lifetime: "1h"

redis:
  url: "redis://localhost:6380"
  pool_size: 10
  max_retries: 3

flexcore:
  url: "http://localhost:8080"
  timeout: 30s
  max_retries: 3
  health_check_interval: "30s"

python:
  meltano_project_root: "./meltano_project"
  virtual_env: "./venv"
  requirements_file: "requirements.txt"
  timeout: "300s"

logging:
  level: "info"
  format: "json"
  structured: true
  output: "stdout"
  correlation_ids: true
