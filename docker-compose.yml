# FLEXT Platform Docker Compose
# Complete orchestration for FLEXT services with web interface

# version removed (obsolete in compose v2)

networks:
  flext-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  flext-plugins:
    driver: local
  flext-pipelines:
    driver: local

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flext-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flext
      POSTGRES_USER: flext
      POSTGRES_PASSWORD: flext_secure_password_change_in_production
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    # ports: exposed only in development override
    networks:
      - flext-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flext -d flext"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: flext-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - flext-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # FLEXT Go Service (Main Backend)
  flext-service:
    build:
      context: .
      dockerfile: cmd/flext/Dockerfile
      args:
        VERSION: 2.0.0
        BUILD: docker-compose
    container_name: flext-service
    restart: unless-stopped
    environment:
      # Service configuration
      FLEXT_MODE: server
      FLEXT_ENVIRONMENT: production
      FLEXT_HOST: 0.0.0.0
      FLEXT_PORT: 8080
      FLEXT_LOG_LEVEL: info
      
      # Database configuration
      FLEXT_DATABASE_URL: postgresql://flext:flext_secure_password_change_in_production@postgres:5432/flext?sslmode=disable
      FLEXT_DB_POOL_SIZE: 20
      FLEXT_DB_MAX_IDLE: 10
      FLEXT_DB_MAX_OPEN: 20
      
      # Redis configuration
      FLEXT_REDIS_URL: redis://redis:6379/0
      FLEXT_REDIS_POOL_SIZE: 10
      
      # Plugin and pipeline paths
      FLEXT_PLUGINS_DIR: /var/lib/flext/plugins
      FLEXT_WORKSPACE: /var/lib/flext/pipelines
      FLEXT_MAX_CONCURRENT_PIPELINES: 10
      
      # Security settings
      FLEXT_ENABLE_AUTH: false
      FLEXT_CORS_ENABLED: true
      FLEXT_CORS_ORIGINS: "*"
      
      # Monitoring
      FLEXT_METRICS_ENABLED: true
      FLEXT_TRACING_ENABLED: false
    volumes:
      - flext-plugins:/var/lib/flext/plugins
      - flext-pipelines:/var/lib/flext/pipelines
      - ./logs:/var/log/flext
    ports:
      - "8080:8080"
    networks:
      - flext-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # FLEXT Web Interface (Flask Dashboard)
  flext-web:
    build:
      context: ./flext-web
      dockerfile: Dockerfile
    container_name: flext-web
    restart: unless-stopped
    environment:
      # Web interface configuration
      FLEXT_WEB_PORT: 5000
      FLEXT_SERVICE_URL: http://flext-service:8080
      
      # FLEXT service integration
      FLEXT_BINARY_PATH: /usr/local/bin/flext
      FLEXT_CONFIG_PATH: /etc/flext/config.yaml
      
      # Database for web interface (if needed)
      FLEXT_WEB_DATABASE_URL: postgresql://flext:flext_secure_password_change_in_production@postgres:5432/flext?sslmode=disable
      
      # Flask settings
      FLASK_ENV: production
      FLASK_DEBUG: false
    volumes:
      - flext-plugins:/var/lib/flext/plugins:ro
      - flext-pipelines:/var/lib/flext/pipelines:ro
      - ./logs:/app/logs
    ports:
      - "5000:5000"
    networks:
      - flext-network
    depends_on:
      flext-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx Reverse Proxy (Production Setup)
  nginx:
    image: nginx:alpine
    container_name: flext-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - flext-network
    depends_on:
      - flext-service
      - flext-web
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus Metrics (Optional - for monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: flext-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - flext-network
    profiles:
      - monitoring

  # Grafana Dashboard (Optional - for monitoring)
  grafana:
    image: grafana/grafana:latest
    container_name: flext-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: REDACTED_LDAP_BIND_PASSWORD_change_in_production
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - flext-network
    depends_on:
      - prometheus
    profiles:
      - monitoring