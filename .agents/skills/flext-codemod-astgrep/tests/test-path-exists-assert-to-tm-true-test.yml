    from flext_infra import tm
    def test_report() -> None:
        tm.that((workspace / "report.md").exists(), eq=True)
  - |
    def test_report() -> None:
        assert (workspace / "report.md").exists()
  - |
    from other import tm
    def test_report() -> None:
        assert (workspace / "report.md").exists()
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert report_path.exists()
