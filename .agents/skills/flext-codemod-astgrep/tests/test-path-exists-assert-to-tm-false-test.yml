id: test-path-exists-assert-to-tm-false
valid:
  - |
    from flext_infra import tm
    def test_report() -> None:
        tm.that((workspace / "report.md").exists(), eq=False)
  - |
    def test_report() -> None:
        assert not (workspace / "report.md").exists()
  - |
    from other import tm
    def test_report() -> None:
        assert not (workspace / "report.md").exists()
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert not report_path.exists()
invalid:
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert not (workspace / "report.md").exists()
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert not (workspace / "reports" / "report.md").exists()
