id: no-assert-false
# `valid` MUST NOT match: not a bare assert False, or has a message (sibling
# rule owns it), or the module lacks `import pytest` (companion rule owns it).
valid:
  - "assert x == False"
  - "assert not x"
  # message form -> owned by no-assert-false-with-message
  - |
    import pytest
    def test_m():
        assert False, "boom"
  # no pytest import -> owned by no-assert-false-missing-pytest (F821-unsafe)
  - |
    def test_n():
        assert False
# `invalid` MUST match: bare assert False in a module importing pytest.
invalid:
  - |
    import pytest
    def test_b():
        assert False
