id: test-parenthesized-assert-equality-to-tm
valid:
  - |
    from flext_infra import tm
    def test_value() -> None:
        tm.that(actual, eq=expected)
  - |
    from flext_infra import tm
    def test_value() -> None:
        assert (first == second == third)
  - |
    from flext_infra import tm
    def test_value() -> None:
        assert (actual == expected), "diagnostic"
  - |
    def test_value() -> None:
        assert (actual == expected)
invalid:
  - |
    from flext_infra import tm
    def test_cli() -> None:
        assert (
            infra_main(["docs", "audit"])
            == 0
        )
