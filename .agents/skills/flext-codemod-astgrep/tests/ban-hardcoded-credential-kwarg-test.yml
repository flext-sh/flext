id: ban-hardcoded-credential-kwarg
valid:
  - "connect(host=settings.Db.host, password=settings.Db.password)"
  - "connect(password=os.environ['DB_PASSWORD'])"
  - "connect(token=vault.read('db/token'))"
  - "connect(username='bob', host='db.example.com')"
  - "connect(password='')"
invalid:
  - "connect(password='example_password')"
  - "connect(api_key='sk-live-123')"
  - "Client(client_secret=\"shhh\")"
