id: test-path-is-file-assert-to-tm-true
valid:
  - |
    from flext_infra import tm
    def test_report() -> None:
        tm.that((workspace / "report.md").is_file(), eq=True)
  - |
    def test_report() -> None:
        assert (workspace / "report.md").is_file()
  - |
    from other import tm
    def test_report() -> None:
        assert (workspace / "report.md").is_file()
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert report_path.is_file()
invalid:
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert (workspace / "report.md").is_file()
  - |
    from flext_infra import tm
    def test_report() -> None:
        assert (workspace / "releases" / "latest.md").is_file()
