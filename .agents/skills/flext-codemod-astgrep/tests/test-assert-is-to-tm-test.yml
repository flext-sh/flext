id: test-assert-is-true-to-tm
valid:
  - |
    from flext_tests import tm
    def test_value() -> None:
        tm.that(flag, eq=True)
  - |
    from flext_tests import m, r, t, u
    def test_value() -> None:
        assert flag is True
  - |
    from other import tm
    def test_value() -> None:
        assert flag is True
  - |
    from flext_tests import tm
    def test_value() -> None:
        assert flag is True, "diagnostic"
invalid:
  - |
    from flext_tests import tm
    def test_value() -> None:
        assert flag is True
  - |
    from flext_infra import tm
    def test_value() -> None:
        assert result.value is True
---
