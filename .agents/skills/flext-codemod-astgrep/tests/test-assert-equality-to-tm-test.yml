id: test-assert-equality-to-tm
valid:
  - |
    from flext_infra import tm
    def test_value() -> None:
        tm.that(actual, eq=expected)
  - |
    from flext_infra import m, r, t, u
    def test_value() -> None:
        assert actual == expected
  - |
    from other import tm
    def test_value() -> None:
        assert actual == expected
  - |
    from flext_infra import tm
    def test_value() -> None:
        assert first == second == third
  - |
    from flext_infra import tm
    def test_value() -> None:
        assert actual == expected, "diagnostic"
  - |
    from flext_infra import tm
    def test_value() -> None:
        assert actual != expected
invalid:
  - |
    from flext_infra import m, r, t, tm, p, u
    def test_value() -> None:
        assert actual == expected
