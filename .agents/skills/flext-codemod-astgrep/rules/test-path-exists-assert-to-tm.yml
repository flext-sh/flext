id: test-path-variable-exists-assert-review
language: python
severity: warning
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
message: >-
  Review a raw .exists() assertion. Use tm.that only after type evidence proves
  the receiver is pathlib-compatible. Detection only.
rule:
  kind: assert_statement
  all:
    - any:
        - pattern: assert $PATH.exists()
        - pattern: assert not $PATH.exists()
    - not:
        pattern: assert ($BASE / $RELATIVE).exists()
    - not:
        pattern: assert not ($BASE / $RELATIVE).exists()
    - not:
        pattern: assert $CONDITION, $MESSAGE
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_from_statement
          stopBy: end
          all:
            - has: { pattern: tm, stopBy: end }
            - has:
                field: module_name
                regex: "^flext(?:_[a-z0-9_]+)?$"
