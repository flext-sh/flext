id: test-path-exists-assert-to-tm-true
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
message: >-
  A pathlib-style existence assertion in a FLEXT test can use tm.that(...,
  eq=True). Require a canonical tm import and a path-division receiver.
rule:
  kind: assert_statement
  all:
    - pattern: assert ($BASE / $RELATIVE).exists()
    - not:
        pattern: assert $CONDITION, $MESSAGE
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_from_statement
          stopBy: end
          all:
            - has: { pattern: tm, stopBy: end }
            - has:
                field: module_name
                regex: "^flext(?:_[a-z0-9_]+)?$"
fix: "tm.that(($BASE / $RELATIVE).exists(), eq=True)"
---
