id: test-result-success-assert-to-tm
language: python
severity: warning
message: >-
  Use tm.ok for a Result success assertion when the canonical matcher is
  already imported. Leave message-bearing assertions for contextual review.
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
rule:
  pattern:
    context: assert $RESULT.success
    strictness: cst
  inside:
    kind: module
    stopBy: end
    has:
      pattern: from flext_tests import tm
      stopBy: end
constraints:
  RESULT:
    kind: identifier
fix: tm.ok($RESULT)
---
id: test-result-failure-assert-to-tm
language: python
severity: warning
message: >-
  Use tm.fail for a Result failure assertion when the canonical matcher is
  already imported. Leave message-bearing assertions for contextual review.
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
rule:
  pattern:
    context: assert $RESULT.failure
    strictness: cst
  inside:
    kind: module
    stopBy: end
    has:
      pattern: from flext_tests import tm
      stopBy: end
constraints:
  RESULT:
    kind: identifier
fix: tm.fail($RESULT)
