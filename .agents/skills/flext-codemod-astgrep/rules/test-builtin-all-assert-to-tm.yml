id: test-builtin-all-assert-to-tm
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
message: >-
  An exact builtin all assertion can use the canonical tm matcher. Reject
  message-bearing, multi-argument and every statically proven shadowed form.
rule:
  kind: assert_statement
  all:
    - pattern: assert all($$$ITERABLE)
    - not:
        pattern: assert all($FIRST, $SECOND)
    - not:
        pattern: assert $CONDITION, $MESSAGE
    - inside:
        kind: module
        stopBy: end
        all:
          - has:
              kind: import_from_statement
              stopBy: end
              all:
                - has:
                    pattern: tm
                    stopBy: end
                - has:
                    field: module_name
                    regex: "^flext(?:_[a-z0-9_]+)?$"
          - not:
              has:
                stopBy: end
                any:
                  - pattern: all = $VALUE
                  - pattern: |
                      def all($$$PARAMS):
                          $$$BODY
                  - pattern: from $MODULE import all
                  - pattern: from $MODULE import $NAME as all
                  - pattern: import $MODULE as all
    - inside:
        kind: function_definition
        stopBy: end
        not:
          has:
            field: parameters
            regex: "(^|[,(/ ])all([,):= ]|$)"
fix: tm.that(all($$$ITERABLE), eq=True)
