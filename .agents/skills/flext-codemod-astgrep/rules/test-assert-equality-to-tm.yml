id: test-assert-equality-to-tm
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
message: >-
  A simple equality assertion in a FLEXT test can use the canonical tm matcher.
  Rewrite only when tm is already imported from a flext facade; preserve both
  expressions and leave messages or chained comparisons for review.
rule:
  kind: assert_statement
  all:
    - pattern: assert $ACTUAL == $EXPECTED
    - regex: "^assert [^=]+ == [^=]+$"
    - not:
        pattern: assert $CONDITION, $MESSAGE
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_from_statement
          stopBy: end
          all:
            - has:
                pattern: tm
                stopBy: end
            - has:
                field: module_name
                regex: "^flext(?:_[a-z0-9_]+)?$"
fix: "tm.that($ACTUAL, eq=$EXPECTED)"
---
id: test-parenthesized-assert-equality-to-tm
language: python
severity: hint
files:
  - "**/tests/**/*.py"
  - "tests/**/*.py"
ignores:
  - "**/legado/**"
message: >-
  A parenthesized equality assertion in a FLEXT test can use the canonical tm
  matcher. Comparison, import, message and chain guards keep the fix narrow.
rule:
  kind: assert_statement
  all:
    - pattern: assert ($ACTUAL == $EXPECTED)
    - has:
        kind: comparison_operator
        regex: "^[^=]+==[^=]+$"
        stopBy: end
    - not:
        pattern: assert $CONDITION, $MESSAGE
    - inside:
        kind: module
        stopBy: end
        has:
          kind: import_from_statement
          stopBy: end
          all:
            - has:
                pattern: tm
                stopBy: end
            - has:
                field: module_name
                regex: "^flext(?:_[a-z0-9_]+)?$"
fix: "tm.that($ACTUAL, eq=$EXPECTED)"
