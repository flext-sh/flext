id: ban-hardcoded-credential-kwarg
language: python
severity: warning
message: >-
  Hardcoded credential literal passed to a credential-named keyword argument.
  Source the value from config/settings (from <ns> import settings ->
  settings.<Ns>.*), an environment variable, or a typed secret provider; never
  embed a real or example credential in call arguments. Detection only.
ignores:
  - "**/legado/**"
rule:
  kind: keyword_argument
  all:
    - has:
        field: name
        regex: "(?i)^(password|passwd|pwd|secret|secret_key|token|auth_token|api_key|apikey|access_key|access_token|private_key|client_secret)$"
    - has:
        field: value
        kind: string
        has:
          kind: string_content
          stopBy: end
