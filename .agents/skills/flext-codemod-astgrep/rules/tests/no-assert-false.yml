# `assert False` in a test is an always-fail placeholder; the pytest idiom is
# `pytest.fail()`. This rule handles the BARE form (no message) and rewrites it
# to `pytest.fail()` — it never fabricates a reason (a `TODO: ...` string is a
# no-TODO law violation). The message form `assert False, <msg>` is owned by the
# sibling rule no-assert-false-with-message, which preserves the real reason.
#
# F821-safety guard: only rewrite when the module imports pytest via
# `import pytest` (so `pytest.fail` resolves). A module without that import is
# flagged by the detection-only companion no-assert-false-missing-pytest, never
# auto-rewritten to an undefined name. A `from pytest import fail` module also
# falls to the companion (this rule intentionally emits the `pytest.fail` form).
id: no-assert-false
language: python
severity: error
files:
  - "**/*.py"
ignores:
  - "**/.claude/**"
  - "**/.git/**"
  - "**/.venv/**"
  - "**/legado/**"
  - "**/legacy/**"
  - "**/node_modules/**"
rule:
  pattern: "assert False"
  not:
    pattern: "assert False, $MSG"
  inside:
    stopBy: end
    kind: module
    has:
      stopBy: end
      kind: import_statement
      has:
        stopBy: end
        kind: dotted_name
        regex: "^pytest$"
fix: "pytest.fail()"
message: >-
  Bare `assert False` must be `pytest.fail()`; do not fabricate a reason string.
  (The message form is handled by no-assert-false-with-message.)
