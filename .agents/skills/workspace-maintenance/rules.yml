skill: workspace-maintenance
description: "Validate workspace hygiene: script ownership, gitignore patterns, cruft
  detection."
scan_targets:
  include:
    - scripts/maintenance/**/*.py
  exclude: []
  projects:
    - .
rules:
  - id: require-owner-skill-marker
    type: ast-grep
    match: absent
    severity: error
    group: ownership
    description: Workspace maintenance scripts must declare Owner-Skill marker
    fix_auto: false
    fix_instruction: "Add '# Owner-Skill: .agents/skills/workspace-maintenance/SKILL.md'
      in the first 10 lines."
    file: rules/require-owner-skill-marker.yml
baseline:
  strategy: total
