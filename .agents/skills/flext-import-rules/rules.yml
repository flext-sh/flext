skill: flext-import-rules
description: "Enforce core FLEXT import conventions: no wildcards, no relative imports, no legacy typing."
scan_targets:
  include:
    - "**/*.py"
  exclude: []
  projects:
    - .
    - flext-core
    - flext-api
    - flext-auth
    - flext-cli
    - flext-db-oracle
    - flext-grpc
    - flext-ldap
    - flext-ldif
    - flext-meltano
    - flext-observability
    - flext-plugin
    - flext-quality
    - flext-web
    - flext-oud-mig
    - flext-meltano-native
rules:
  - id: ban-wildcard-import
    type: ast-grep
    severity: error
    group: import_hygiene
    description: Wildcard imports are banned.
    fix_auto: false
    fix_instruction: Replace wildcard imports with explicit imported symbols.
    file: rules/ban-wildcard-import.yml
  - id: ban-relative-import
    type: ast-grep
    severity: error
    group: import_hygiene
    description: Relative imports are banned in this workspace.
    fix_auto: false
    fix_instruction: Use absolute package imports instead of relative imports.
    file: rules/ban-relative-import.yml
  - id: ban-legacy-typing-imports
    type: ast-grep
    file: rules/legacy-typing-imports.yml
    severity: warning
    group: modern_typing
    count_by: rule_id
    description: Legacy typing imports (Dict/List/Optional/Union/Tuple/Set) detected by AST.
    fix_auto: true
    fix_type: ast-grep
    fix_file: rules/legacy-typing-fix.yml
    fix_instruction:
      Auto-rewrites typing.Dict->dict, typing.List->list, typing.Tuple->tuple, typing.Set->set in attribute access.
      Import cleanup is manual.
    fix_description:
      Rewrites typing.X attribute usages to builtin equivalents. Import line cleanup requires manual removal
      of unused typing imports.
baseline:
  strategy: total
