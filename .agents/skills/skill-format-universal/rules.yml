skill: skill-format-universal
description: "Validate SKILL.md format: frontmatter, required sections, naming consistency"
scan_targets:
  include:
    - "**/SKILL.md"
  exclude: []
  projects: []
rules:
  - id: skill-format-check
    type: custom
    script: validate_format.sh
    severity: error
    group: skill_format
    description: SKILL.md frontmatter, required sections, no TODO/TBD
    fix_auto: false
    fix_instruction: "Ensure SKILL.md has: YAML frontmatter (name matching dir, description),
      sections (Scope, References, Rules, Instructions, Workflow, Examples, Verification),
      no TODO/TBD."
baseline:
  strategy: total
