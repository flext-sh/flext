skill: rules-flext-core
description: Directory-scoped checks for flext-core result and typing conventions.
scan_targets:
  include:
    - src/**/*.py
    - "**/src/**/*.py"
  exclude: []
  projects:
    - flext-core
rules:
  - id: require-future-annotations
    type: ast-grep
    match: absent
    severity: error
    group: flext_core_style
    description: Python modules should enable postponed annotation evaluation.
    fix_auto: false
    fix_instruction: >-
      Add `from __future__ import annotations` near the top of each module and
      import collection contracts from `collections.abc` only when used.
    file: rules/require-future-annotations.yml
  - id: require-flext-result-pattern
    type: ast-grep
    match: absent
    severity: warning
    group: flext_core_result
    description: Service boundaries should prefer r-based result flow.
    fix_auto: false
    fix_instruction: Use r typing (for example '-> r[...]') on boundary methods where applicable.
    file: rules/require-flext-result-pattern.yml
  - id: standardize-test-aliases
    type: ast-grep
    file: rules/test-alias-fix.yml
    severity: warning
    group: flext_core_style
    count_by: rule_id
    description: Standardize test helper aliases to tm/tt/u/c/p naming.
    fix_auto: true
    fix_type: ast-grep
    fix_file: rules/test-alias-fix.yml
    fix_instruction: Auto-rewrite test alias assignments to standardized names.
  - id: require-flext-constants-import
    type: ast-grep
    match: absent
    severity: warning
    group: constants_standards
    description: Subproject constants.py should import FlextConstants from flext_core.
    fix_auto: false
    fix_instruction: Add 'from flext_core import FlextConstants' and inherit from it.
    file: rules/require-flext-constants-import.yml
baseline:
  strategy: total
