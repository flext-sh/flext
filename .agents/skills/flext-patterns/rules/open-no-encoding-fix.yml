id: fix-open-no-encoding
language: python
rule:
  pattern: open($PATH)
fix: open($PATH, encoding="utf-8")
message: "Rewrite open(path) -> open(path, encoding='utf-8')"
severity: warning
---
id: fix-open-no-encoding-2arg
language: python
rule:
  pattern: open($PATH, $MODE)
fix: open($PATH, $MODE, encoding="utf-8")
message: "Rewrite open(path, mode) -> open(path, mode, encoding='utf-8')"
severity: warning
