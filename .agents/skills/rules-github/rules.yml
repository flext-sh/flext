skill: rules-github
description: Directory-scoped checks for GitHub automation YAML files.
scan_targets:
  include:
  - .github/**/*.yml
  - .github/**/*.yaml
  exclude:
  - .github/dependabot.yml
  projects:
  - .
rules:
- id: ban-hardcoded-secrets
  type: ast-grep
  severity: error
  group: github_security
  description: Do not hardcode secret-like values in GitHub configuration.
  fix_auto: false
  fix_instruction: Use GitHub encrypted secrets or inherited env references instead of literal secret values.
  file: rules/ban-hardcoded-secrets.yml
  count_by: rule_id
baseline:
  strategy: total
