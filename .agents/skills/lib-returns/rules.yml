skill: lib-returns
description: Detect unsafe unwrapping outside the canonical flext-core result bridge.
scan_targets:
  include:
    - "**/*.py"
  exclude:
    - "flext-core/src/flext_core/result.py"
  projects: []
rules:
  - id: ban-unwrap-call
    type: ast-grep
    file: rules/unwrap-to-value.yml
    severity: warning
    group: result_flow
    count_by: rule_id
    description: Detect deprecated .unwrap() calls on r-like values.
    fix_auto: false
    fix_instruction: >-
      Review the receiver type. For `r[T]`, preserve failure handling with bind/map,
      pattern matching, or `value_or(default)`; do not rewrite `returns` library
      containers whose public API legitimately defines `unwrap()`.
baseline:
  strategy: total
