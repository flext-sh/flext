id: ban-direct-returns-import
language: python
rule:
  any:
  - kind: import_statement
    has:
      kind: dotted_name
      regex: "^returns"
      stopBy: end
  - kind: import_from_statement
    has:
      kind: dotted_name
      field: module_name
      regex: "^returns"
message: "Direct returns library import - use flext_core bridge"
severity: error
