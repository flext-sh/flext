skill: rules-pkg
description: Directory-scoped checks for Python packages under pkg/.
scan_targets:
  include:
    - pkg/**/*.py
  exclude: []
  projects:
    - .
rules:
  - id: require-future-annotations
    type: ast-grep
    match: absent
    severity: error
    group: pkg_style
    description: Package modules should enable postponed annotation evaluation.
    fix_auto: false
    fix_instruction: >-
      Add `from __future__ import annotations` near the top of the module and
      import collection contracts from `collections.abc` only when used.
    file: rules/require-future-annotations.yml
baseline:
  strategy: total
