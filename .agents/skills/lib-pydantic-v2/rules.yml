skill: lib-pydantic-v2
description: Ban Pydantic v1 API usage, enforce v2 migration across all FLEXT projects
scan_targets:
  include:
  - "**/*.py"
  exclude: []
  projects: []
rules:
- id: pydantic-v1-auto-fixable
  type: ast-grep
  file: rules/pydantic-v2.yml
  severity: error
  group: pydantic_v1_violations
  count_by: rule_id
  description: "Auto-fixable Pydantic v1 APIs: .dict(), parse_obj(), parse_raw(), .json()"
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/pydantic-v2-fix.yml
  fix_instruction: "Auto-rewrites: .dict()->model_dump(), parse_obj()->model_validate(), parse_raw()->model_validate_json(), .json()->model_dump_json()."
  fix_description: Applies ast-grep rewrites for 4 method renames.
- id: pydantic-model-rebuild-critical
  type: ast-grep
  severity: error
  group: pydantic_critical
  description: "CRITICAL: model_rebuild() is prohibited — resolve type references at definition time or use protocols."
  fix_auto: false
  fix_instruction: "Remove model_rebuild() call entirely. Resolve forward references with from __future__ import annotations from collections.abc import Mapping, Sequence or protocol-based decoupling."
  file: rules/pydantic-model-rebuild-critical.yml
- id: pydantic-v1-from-orm
  type: ast-grep
  severity: error
  group: pydantic_v1_violations
  description: Pydantic v1 from_orm() is banned.
  fix_auto: false
  fix_instruction: Replace .from_orm(obj) with (obj) and set model_config = ConfigDict(from_attributes=True).
  file: rules/pydantic-v1-from-orm.yml
- id: pydantic-v1-validator-decorator
  type: ast-grep
  severity: error
  group: pydantic_v1_violations
  description: Pydantic v1 @validator decorator is banned.
  fix_auto: false
  fix_instruction: "Replace @validator with @u.field_validator. Update function signature: use @u.field_validator('field_name', mode='before'|'after') and (cls, v) -> (cls, v, info)."
  file: rules/pydantic-v1-validator-decorator.yml
- id: pydantic-v1-root-validator-decorator
  type: ast-grep
  severity: error
  group: pydantic_v1_violations
  description: Pydantic v1 @root_validator decorator is banned.
  fix_auto: false
  fix_instruction: Replace @root_validator with @u.model_validator(mode='before'|'after'). Update signature to use u.model_validator patterns.
  file: rules/pydantic-v1-root-validator-decorator.yml
baseline:
  strategy: total
