id: fix-typing-dict-attr
valid:
  - "x = typing.Mapping"
  - "x = typing.List"
invalid:
  - "x = typing.Dict"
---
id: fix-typing-dict-import-head
valid:
  - "from typing import List, Mapping"
invalid:
  - "from typing import Dict, List"
---
id: fix-typing-dict-import-tail
valid:
  - "from typing import List, Mapping"
invalid:
  - "from typing import List, Dict"
---
id: fix-typing-dict-import-middle
valid:
  - "from typing import List, Mapping, Tuple"
invalid:
  - "from typing import List, Dict, Tuple"
