skill: lib-structlog
description: Enforce structured logging through FlextLogger and u bridges.
scan_targets:
  include:
    - src/**/*.py
  exclude: []
  projects:
    - flext-oud-mig
    - flext-api
    - flext-auth
    - flext-cli
    - flext-db-oracle
    - flext-dbt-ldap
    - flext-dbt-ldif
    - flext-dbt-oracle
    - flext-dbt-oracle-wms
    - flext-grpc
    - flext-ldap
    - flext-ldif
    - flext-meltano
    - flext-observability
    - flext-oracle-oic
    - flext-oracle-wms
    - flext-plugin
    - flext-quality
    - flext-tap-ldap
    - flext-tap-ldif
    - flext-tap-oracle
    - flext-tap-oracle-oic
    - flext-tap-oracle-wms
    - flext-target-ldap
    - flext-target-ldif
    - flext-target-oracle
    - flext-target-oracle-oic
    - flext-target-oracle-wms
    - flext-web
    - flext-meltano-native
rules:
  - id: ban-direct-structlog-getlogger
    type: ast-grep
    file: rules/direct-get-logger.yml
    severity: error
    group: structlog_bridge
    count_by: rule_id
    description: Direct structlog.get_logger usage is banned outside FlextLogger/u bridge files.
    fix_auto: false
    fix_instruction: Use the public FlextLogger or u logging facade in consumer projects; keep direct structlog access inside the canonical flext-core bridge only.
  - id: ban-print-in-src
    type: ast-grep
    severity: warning
    group: structured_logging
    description: Avoid print statements in Python sources; use structured logging.
    fix_auto: false
    fix_instruction: Replace print(...) with FlextLogger/u logging methods.
    file: rules/ban-print-in-src.yml
baseline:
  strategy: total
