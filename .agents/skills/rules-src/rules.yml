skill: rules-src
description: Directory-scoped checks for shared source modules under src/.
scan_targets:
  include:
    - src/**/*.py
  exclude: []
  projects:
    - .
rules:
  - id: require-future-annotations
    type: ast-grep
    match: absent
    severity: error
    group: src_style
    description: Shared source modules should use postponed annotations.
    fix_auto: false
    fix_instruction: >-
      Add `from __future__ import annotations` near the top of the module and
      import collection contracts from `collections.abc` only when used.
    file: rules/require-future-annotations.yml
  - id: ban-star-import
    type: ast-grep
    severity: error
    group: src_imports
    description: Shared source code should avoid wildcard imports.
    fix_auto: false
    fix_instruction: Replace wildcard imports with explicit imported symbols.
    file: rules/ban-star-import.yml
baseline:
  strategy: total
