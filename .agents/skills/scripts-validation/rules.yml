skill: scripts-validation
description: Enforce the common script contract in the accepted automation taxonomy.
scan_targets:
  include:
    - scripts/analysis/**/*.sh
    - scripts/analysis/**/*.py
    - scripts/migration/**/*.sh
    - scripts/migration/**/*.py
    - scripts/validation/**/*.sh
    - scripts/validation/**/*.py
    - scripts/maintenance/**/*.sh
    - scripts/maintenance/**/*.py
  exclude:
    - "**/__init__.py"
  projects:
    - .
rules:
  - id: bash-strict-mode
    type: ast-grep
    file: rules/bash-strict-mode.yml
    severity: warning
    group: bash_strict_mode
    count_by: rule_id
    description: Bash validators and fixers use strict mode.
    fix_auto: false
    fix_instruction: Add set -euo pipefail after the shebang.
  - id: no-interactive-prompts
    type: ast-grep
    file: rules/no-interactive.yml
    severity: error
    group: no_interactive
    count_by: aggregate
    description: Automation is non-interactive unless an explicit mode owns prompting.
    fix_auto: false
    fix_instruction: Remove interactive reads from the default path.
  - id: python-main-guard
    type: ast-grep
    file: rules/python-main-guard.yml
    severity: warning
    group: python_main_guard
    count_by: rule_id
    description: Standalone Python automation has a main guard.
    fix_auto: false
    fix_instruction: Add a typed main entry point and guard to standalone automation.
baseline:
  strategy: total
