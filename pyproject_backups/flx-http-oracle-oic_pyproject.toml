[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flx_http_oracle_oic"
version = "0.4.0"
description = "HTTP client and FLX plugin for Oracle Integration Cloud with OAuth2/JWT authentication"
authors = ["FlxHttp Oracle OIC Team <team@example.com>"]
license = "MIT"
packages = [{ include = "flx_http_oracle_oic", from = "src" }]
repository = "https://github.com/datacosmos-br/flx_http_oracle_oic"
documentation = "https://datacosmos-br.github.io/flx_http_oracle_oic/"
keywords = ["oracle", "oic", "integration", "cloud", "http", "flx", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[tool.poetry.dependencies]
python = "^3.13"
PyJWT = "^2.8.0"
cryptography = "^43.0.0"
pandas = "^2.2.0"
tabulate = "^0.9.0"
openpyxl = "^3.1.0"
pyarrow = "^18.0.0"
lxml = "^5.3.0"
xmltodict = "^0.13.0"
click = "^8.2.1"
python-dotenv = "^1.1.0"

[tool.poetry.dependencies.flx]
path = "../flx"
develop = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "<0.24.0"
pytest-cov = "^6.1.1"
pytest-xdist = "^3.7.0"
pytest-mock = "^3.14.1"
mypy = "^1.16.0"
types-requests = "^2.32.0.20241016"
ruff = "^0.11.13"
bandit = "^1.8.0"
vulture = "^2.12"
pre-commit = "^4.2.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
pytest-benchmark = "^4.0.0"
black = "^25.1.0"
isort = "<6"
pycodestyle = "^2.12.0"
pydocstyle = "^6.3.0"
pylint = "^3.0.0"

[tool.poetry.scripts]
oic = "flx_http_oracle_oic.cli:main"
flx-oic = "flx_http_oracle_oic.cli:main"
oracle-oic-cli = "flx_http_oracle_oic.cli:main"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/datacosmos-br/flx_http_oracle_oic/issues"
Changelog = "https://github.com/datacosmos-br/flx_http_oracle_oic/blob/main/CHANGELOG.md"

# PEP 8 Compliant Configuration

[tool.black]
line-length = 79  # PEP 8 standard line length
target-version = ["py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
# PEP 8 compliant import sorting
line_length = 79
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["flx_http_oracle_oic"]
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
import_order_style = "pep8"

[tool.ruff]
# PEP 8 enforcement
target-version = "py313"
line-length = 79  # PEP 8 standard
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "D104"]
"tests/**/*.py" = ["D", "S101"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["flx_http_oracle_oic"]

[tool.pycodestyle]
max-line-length = 79
exclude = [".git", "__pycache__", "docs/source/conf.py", "old", "build", "dist"]
statistics = true
count = true

[tool.pydocstyle]
convention = "pep257"
add-ignore = ["D100", "D104"]

[tool.pylint.messages_control]
max-line-length = 79
disable = [
    "C0111",  # missing-docstring (we use pydocstyle for this)
    "R0903",  # too-few-public-methods
    "R0913",  # too-many-arguments
    "W0212",  # protected-access
]

[tool.pylint.format]
indent-string = "    "  # PEP 8: 4 spaces

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/flx_http_oracle_oic",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--cov-fail-under=10",
    "--junitxml=reports/pytest/junit.xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests requiring real environment",
    "slow: Slow tests",
    "record: Tests that record API responses for mockup creation",
    "oic: OIC-specific tests",
    "http: HTTP-related tests",
    "auth: Authentication tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__main__.py",
    "*/conftest.py",
    "*/__version__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "if TYPE_CHECKING:",
]

