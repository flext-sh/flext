[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flx"
version = "0.4.0"
description = "Enterprise-grade Python framework implementing Hexagonal Architecture"
authors = ["FLX Team"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/flx/flx"
repository = "https://github.com/flx/flx"
documentation = "https://flx.readthedocs.io"
keywords = [
    "hexagonal",
    "architecture",
    "ddd",
    "ports",
    "adapters",
    "enterprise",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
packages = [{ include = "flx", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
dramatiq = { extras = ["redis", "watch"], version = "^1.18.0" }
pluggy = "^1.6.0"
fire = "^0.7.0"
fastapi = "^0.115.0"
uvicorn = "^0.30.0"
pyyaml = "^6.0.2"
loguru = "^0.7.3"
python-dotenv = "^1.1.0"
anyio = "^4.9.0"
attrs = "^25.3.0"
httpx = "^0.28.1"
redis = "^6.2.0"
tenacity = "^9.1.2"
python-json-logger = "^3.3.0"
opentelemetry-api = "^1.34.0"
opentelemetry-sdk = "^1.34.0"
opentelemetry-instrumentation = "^0.55b0"
lato = "^0.12.0"
sqlalchemy = "^2.0.0"
# asyncpg = "^0.29.0"  # Disabled due to Python 3.13 compatibility
alembic = "^1.14.0"
rich = "^14.0.0"
aiohttp = "^3.12.11"
aiosqlite = "^0.21.0"
twisted = {extras = ["tls"], version = "^25.5.0"}
pyjwt = "^2.10.1"
# Meltano integration dependencies
meltano = { version = "^3.7.6", python = "~3.13", optional = true }
singer-sdk = { version = "^0.46.3", python = "~3.13", optional = true }
paramiko = "^3.3.1"
oracledb = "^2.5.0"

[tool.poetry.extras]
meltano = ["meltano", "singer_sdk"]

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = ">=0.23.5.post1,<0.24.0"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
pytest-timeout = "^2.4.0"
pytest-xdist = "^3.7.0"
mypy = "^1.16.0"
ruff = "^0.11.13"
isort = "^6.0.1"
black = "^25.1.0"
coverage = { extras = ["toml"], version = "^7.8.2" }
pytest-html = "^4.1.1"
types-sqlalchemy = "^1.4.53.38"
types-pyyaml = "^6.0.12.20250516"
types-redis = "^4.6.0.20240903"
types-requests = "^2.32.0.20241016"
types-setuptools = "^75.7.0.20250106"
types-python-dateutil = "^2.9.0.20241206"
pre-commit = "^4.2.0"
pytest-tornasync = "^0.6.0.post2"
pytest-trio = "^0.8.0"
pytest-twisted = "^1.14.3"

[tool.poetry.scripts]
flx = "flx.cli.main:app"

[tool.mypy]
python_version = "3.13"
# Strict type checking settings for hexagonal architecture
strict = true
strict_optional = true
strict_equality = true
strict_concatenate = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_no_return = true
disallow_any_unimported = true
disallow_any_expr = false # Allow for complex types in enterprise code
disallow_any_decorated = true
disallow_any_explicit = false # Allow explicit Any when needed
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
no_implicit_reexport = true
check_untyped_defs = true
namespace_packages = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
show_traceback = true
pretty = true
error_summary = true
plugins = ["pydantic.mypy"]
exclude = [
    "legacy/.*",
    ".*/legacy/.*",
    ".*legacy.*",
    "src/flx/infra/observability/metrics.py",
    "src/flx/infra/observability/test_engine.py",
]

[[tool.mypy.overrides]]
module = [
    "dramatiq.*",
    "lato.*",
    "pluggy.*",
    "cyclopts.*",
    "redis.*",
    "structlog.*",
    "tenacity.*",
    "opentelemetry.*",
    "pythonjsonlogger.*",
    "jsonlogger.*",
    "rich.*",
    "yaml.*",
    "pydantic_settings.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "flx.adapters.outbound.database.*",
    "flx.adapters.outbound.cache.*",
    "flx.adapters.outbound.logging",
    "flx.infra.messaging.brokers",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "examples.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_any_unimported = false

[tool.ruff]
target-version = "py313"
line-length = 120 # Increased for better enterprise code readability
src = ["src", "tests"]
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "legacy",
    "*/legacy/*",
    "**/legacy/**",
    "**/*legacy*",
]

[tool.ruff.lint]
select = [
    # Strict rules for enterprise hexagonal architecture
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "BLE",  # flake8-blind-except
    "C4",   # flake8-comprehensions
    "C90",  # mccabe complexity
    "D",    # pydocstyle
    "DTZ",  # flake8-datetimez
    "E",    # pycodestyle errors
    "ERA",  # eradicate
    "F",    # pyflakes
    "FBT",  # flake8-boolean-trap
    "FLY",  # flynt
    "G",    # flake8-logging-format
    "I",    # isort
    "ICN",  # flake8-import-conventions
    "INP",  # flake8-no-pep420
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "NPY",  # numpy specific rules
    "PERF", # perflint
    "PGH",  # pygrep-hooks
    "PIE",  # flake8-pie
    "PL",   # pylint
    "PT",   # flake8-pytest-style
    "PTH",  # flake8-use-pathlib
    "PYI",  # flake8-pyi
    "Q",    # flake8-quotes
    "RET",  # flake8-return
    "RSE",  # flake8-raise
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "T10",  # flake8-debugger
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
    "YTT",  # flake8-2020
]
ignore = [
    # Required for functional code - acceptable violations
    "D100",    # Missing docstring in public module
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "FBT001",  # Boolean positional arg in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "S101",    # Use of assert detected
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison
    "TRY003",  # Avoid specifying long messages outside exception class
    "C90",     # Function is too complex
    # Additional acceptable violations for working code
    "BLE001",  # Blind except - acceptable in some contexts
    "TRY300",  # Try-consider-else - style preference
    "G004",    # Logging f-string - acceptable for readability
    "TRY301",  # Raise within try - sometimes necessary
    "ARG002",  # Unused method argument - interface compliance
    "FBT003",  # Boolean positional value in function call
    "PYI036",  # Bad exit annotation - pydantic compatibility
    "DTZ003",  # Call datetime utcnow - acceptable in non-timezone code
    "SIM117",  # Multiple with statements - readability preference
    "PLW0603", # Global statement - sometimes necessary
    "SLF001",  # Private member access - internal framework use
    "PGH003",  # Blanket type ignore - sometimes necessary
    "PLR0912", # Too many branches - complex business logic
    "PTH123",  # Builtin open - acceptable for simple cases
    "S311",    # Suspicious non-cryptographic random usage
    "SIM102",  # Collapsible if - readability preference
    "D205",    # Missing blank line after summary
    "G201",    # Logging exc info - acceptable pattern
    "A002",    # Builtin argument shadowing - interface compliance
    "ERA001",  # Commented out code - temporary debugging
    "PLR0911", # Too many return statements
    "PLR0915", # Too many statements
    "PLW2901", # Redefined loop name
    "PYI024",  # Collections named tuple
    "A001",    # Builtin variable shadowing
    "ARG001",  # Unused function argument
    "B007",    # Unused loop control variable
    "B904",    # Raise without from inside except
    "D417",    # Undocumented param
    "N811",    # Constant imported as non-constant
    "PLC0206", # Dict index missing items
    "S110",    # Try except pass
    "S306",    # Suspicious mktemp usage
    "D401",    # First line should be in imperative mood (often subjective)
    "SIM103",  # Needless bool
    "SIM105",  # Suppressible exception
    "TRY004",  # Type check without type error
    "UP038",   # Non-pep604 isinstance
    "D102",    # Missing docstring in public method (test methods)
    "PT018",   # Assertion should be broken down (test assertions)
    "SIM113",  # Use enumerate for index variable (acceptable in tests)
    "E722",    # Bare except (acceptable in specific test cases)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101",    # Assert usage in tests
    "S105",    # Hardcoded password string
    "S106",    # Hardcoded password function argument
    "S108",    # Hardcoded temp file - acceptable in tests
    "S104",    # Hardcoded bind all interfaces - acceptable in tests
    "S608",    # Hardcoded SQL expression - acceptable in tests
    "PLR2004", # Magic values
    "D",       # Documentation not required in tests
    "ARG",     # Unused arguments acceptable in test fixtures
    "FBT",     # Boolean traps acceptable in tests
    "PLR0913", # Too many arguments
    "TRY003",  # Long exception messages
    "SLF001",  # Private member access
    "PLR0912", # Too many branches in complex tests
    "PLR0915", # Too many statements in complex tests
    "PLR0911", # Too many return statements
    "C901",    # Complex functions acceptable in comprehensive tests
    "BLE001",  # Blind except acceptable in test cleanup
    "TRY300",  # Try-else acceptable in tests
    "G004",    # f-strings in logging acceptable in tests
    "PGH003",  # Type ignore acceptable in tests
]
"scripts/*" = ["T20", "S101", "PLR2004"]
"examples/*" = ["T20", "S101", "PLR2004", "D", "ARG", "FBT"]
"**/legacy/**" = ["ALL"] # Ignore all rules in legacy code
"legacy/*" = ["ALL"]
# Infrastructure code with legitimate security patterns
"src/flx/infra/config/settings.py" = [
    "S104",
] # 0.0.0.0 binding is intentional for config
"src/flx/infra/runtime/backends.py" = [
    "S104",
] # 0.0.0.0 binding is intentional for server
"src/flx/infra/database/production_engine.py" = [
    "S608",
] # Parameterized queries are safe
"src/flx/infra/deployment/*.py" = ["S108"] # Temp files necessary for deployment
"src/flx/infra/deployment/environments.py" = [
    "S108",
] # Temp files necessary for K8s
"src/flx/infra/deployment/pipeline.py" = [
    "S108",
] # Temp files necessary for CI/CD
"src/flx/infra/deployment/strategies.py" = [
    "S108",
] # Temp files necessary for deployment strategies
"src/flx/infra/observability/metrics.py" = [
    "I001",
] # Complex imports for metrics system
# "src/flx/infra/messaging/brokers.py" ignored in mypy overrides for third-party typing issues

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["flx"]
skip_gitignore = true
force_single_line = false
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__main__.py",
    "*/legacy/*",
    "**/legacy/**",
    "**/*legacy*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*Protocol:",
    "@abstract",
    "@overload",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/flx",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
    "-n=auto",
    "--ignore=legacy",
    "--ignore=**/legacy",
]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["legacy", "*/legacy/*", "**/legacy/**"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "hexarch: marks tests as hexagonal architecture tests",
    "ports: marks tests for port interfaces",
    "adapters: marks tests for adapter implementations",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
