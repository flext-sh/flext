version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: flext-postgres
    environment:
      POSTGRES_DB: flext_db
      POSTGRES_USER: flext
      POSTGRES_PASSWORD: flext123
      POSTGRES_MULTIPLE_DATABASES: flext_db,flext_web,flext_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - ./docker/postgres/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flext -d flext_db"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - flext-cluster

  # Redis Cluster for distributed coordination
  redis:
    image: redis:7-alpine
    container_name: flext-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - flext-cluster

  # FLEXT Node 1 (Leader candidate)
  flext-node-1:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    container_name: flext-node-1
    environment:
      - FLEXT_PORT=8080
      - FLEXT_HOST=0.0.0.0
      - FLEXT_LOG_LEVEL=info
      - FLEXT_DB_TYPE=postgres
      - FLEXT_DB_URL=postgres://flext:flext123@postgres:5432/flext_db?sslmode=disable
      - JWT_SECRET_KEY=cluster-secret-key-production-change
      - REDIS_URL=redis://redis:6379/0
      - NODE_ID=node-1
      - CLUSTER_NAME=flext-cluster
      - PROMETHEUS_PORT=9090
      - OTEL_SERVICE_NAME=flext-node-1
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:14268/api/traces
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/app/flext", "-distributed"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - flext-cluster

  # FLEXT Node 2
  flext-node-2:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    container_name: flext-node-2
    environment:
      - FLEXT_PORT=8080
      - FLEXT_HOST=0.0.0.0
      - FLEXT_LOG_LEVEL=info
      - FLEXT_DB_TYPE=postgres
      - FLEXT_DB_URL=postgres://flext:flext123@postgres:5432/flext_db?sslmode=disable
      - JWT_SECRET_KEY=cluster-secret-key-production-change
      - REDIS_URL=redis://redis:6379/0
      - NODE_ID=node-2
      - CLUSTER_NAME=flext-cluster
      - PROMETHEUS_PORT=9091
      - OTEL_SERVICE_NAME=flext-node-2
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:14268/api/traces
    ports:
      - "8081:8080"
      - "9091:9091"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flext-node-1:
        condition: service_healthy
    command: ["/app/flext", "-distributed"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - flext-cluster

  # FLEXT Node 3
  flext-node-3:
    build:
      context: .
      dockerfile: docker/Dockerfile.demo
    container_name: flext-node-3
    environment:
      - FLEXT_PORT=8080
      - FLEXT_HOST=0.0.0.0
      - FLEXT_LOG_LEVEL=info
      - FLEXT_DB_TYPE=postgres
      - FLEXT_DB_URL=postgres://flext:flext123@postgres:5432/flext_db?sslmode=disable
      - JWT_SECRET_KEY=cluster-secret-key-production-change
      - REDIS_URL=redis://redis:6379/0
      - NODE_ID=node-3
      - CLUSTER_NAME=flext-cluster
      - PROMETHEUS_PORT=9092
      - OTEL_SERVICE_NAME=flext-node-3
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:14268/api/traces
    ports:
      - "8082:8080"
      - "9092:9092"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      flext-node-1:
        condition: service_healthy
    command: ["/app/flext", "-distributed"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - flext-cluster

  # Load Balancer (HAProxy)
  load-balancer:
    image: haproxy:2.8-alpine
    container_name: flext-lb
    ports:
      - "80:80"
      - "8404:8404" # HAProxy stats
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - flext-node-1
      - flext-node-2
      - flext-node-3
    networks:
      - flext-cluster

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: flext-prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    networks:
      - flext-cluster

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: flext-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - flext-cluster

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: flext-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - flext-cluster

  # Redis Insight for Redis monitoring
  redis-insight:
    image: redislabs/redisinsight:latest
    container_name: flext-redis-insight
    ports:
      - "8001:8001"
    volumes:
      - redis_insight_data:/db
    networks:
      - flext-cluster

  # PgAdmin for PostgreSQL management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: flext-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@flext.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - flext-cluster

networks:
  flext-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  redis_insight_data:
  pgadmin_data:
