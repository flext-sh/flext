server:
  host: "0.0.0.0"
  port: 8080
  environment: "production"
  debug: false
  enable_cors: false

database:
  driver: "postgres"
  host: "${DB_HOST:-postgres}"
  port: 5432
  database: "${DB_NAME:-flext}"
  username: "${DB_USER:-flext}"
  password: "${DB_PASSWORD:-changeme}"
  ssl_mode: "require"
  max_open_conns: 50
  max_idle_conns: 25

redis:
  host: "${REDIS_HOST:-redis}"
  port: 6379
  database: 0
  pool_size: 20
  min_idle_conns: 10

jwt:
  secret_key: "${JWT_SECRET_KEY}"
  expiry_time: "1h"
  refresh_time: "24h"
  issuer: "flext-api"
  audience: "flext-users"
  signing_method: "HS256"

logging:
  level: "info"
  format: "json"
  output: "stdout"
  structured: true

monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  collection_interval: "15s"
  retention_period: "24h"
  alerting_enabled: true
  error_threshold: 0.05

features:
  websocket_enabled: true
  metrics_enabled: true
  swagger_enabled: false # Disabled in production for security
  database_enabled: true # Enable all advanced features in production
  auth_required: true
  plugin_system_enabled: true
  pipeline_execution: true
  redis_enabled: true # Enable Redis caching in production
  gorm_enabled: true # Enable GORM for complex operations
  sqlx_enabled: true # Enable SQLX for high-performance queries
  gin_server_enabled: false # Keep disabled to avoid conflicts
