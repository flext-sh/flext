# Prometheus configuration for FLEXT distributed monitoring

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # FLEXT Node 1
  - job_name: 'flext-node-1'
    static_configs:
      - targets: ['flext-node-1:8081']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # FLEXT Node 2
  - job_name: 'flext-node-2'
    static_configs:
      - targets: ['flext-node-2:8082']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # FLEXT Node 3
  - job_name: 'flext-node-3'
    static_configs:
      - targets: ['flext-node-3:8083']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # HAProxy Load Balancer Stats
  - job_name: 'haproxy'
    static_configs:
      - targets: ['load-balancer:8404']
    metrics_path: '/stats'
    scrape_interval: 30s

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    scrape_interval: 30s