# FLEXT Distributed Configuration
# This file contains configuration for distributed mode operation

server:
  host: "0.0.0.0"
  port: 8081
  environment: "development"
  debug: true
  enable_cors: true

database:
  driver: "postgres"
  host: "localhost"
  port: 5432
  database: "flext_distributed"
  username: "flext"
  password: "flext"
  ssl_mode: "disable"
  max_open_conns: 50
  max_idle_conns: 25

jwt:
  secret_key: "flext-distributed-secret-key-change-in-production"
  issuer: "flext-distributed"
  audience: "flext-users"

websocket:
  enabled: true
  max_concurrent_conn: 500

monitoring:
  enabled: true
  metrics_path: "/metrics"
  health_path: "/health"
  collection_interval: "15s"
  retention_period: "24h"
  alerting_enabled: true
  error_threshold: 0.05

logging:
  level: "debug"
  format: "json"
  structured: true

features:
  websocket_enabled: true
  metrics_enabled: true
  swagger_enabled: true
  database_enabled: true
  auth_required: false
  plugin_system_enabled: true
  pipeline_execution: true

# Distributed-specific configuration
distributed:
  # Redis configuration for cluster coordination
  redis:
    address: "localhost:6379"
    password: ""
    db: 0
    pool_size: 10

  # Node configuration
  node:
    capabilities:
      - "pipeline"
      - "plugin"
      - "meltano"
      - "singer"
      - "ldap"
      - "oracle"
    max_jobs: 100
    metadata:
      datacenter: "dc1"
      region: "us-east-1"
      environment: "development"

  # Worker pool configuration
  worker_pool:
    max_workers: 20
    min_workers: 5
    queue_size: 2000
    auto_scaling: true

  # Cluster configuration
  cluster:
    enabled: true
    heartbeat_interval: "15s"
    node_timeout: "45s"
    leader_election: true

  # Service discovery configuration
  service_discovery:
    enabled: true
    registration_ttl: "60s"
    health_check_interval: "30s"

  # Load balancing configuration
  load_balancing:
    enabled: true
    strategy: "round_robin" # round_robin, least_load, random, weighted
    health_check_required: true

  # Metrics and observability
  metrics:
    enabled: true
    collection_interval: "15s"
    aggregation_interval: "30s"
    retention_period: "24h"

  # Alert configuration
  alerts:
    enabled: true
    rules:
      - name: "high_error_rate"
        metric_name: "error_rate"
        condition: "greater_than"
        threshold: 0.1
        duration: "5m"

      - name: "high_cpu_usage"
        metric_name: "cpu_usage"
        condition: "greater_than"
        threshold: 0.8
        duration: "10m"

      - name: "low_memory"
        metric_name: "memory_available"
        condition: "less_than"
        threshold: 0.2
        duration: "5m"

  # Agent communication
  agent:
    enabled: true
    websocket_path: "/agent/ws"
    message_buffer_size: 1000
    connection_timeout: "30s"
    reconnect_interval: "10s"

  # Coordination and task distribution
  coordination:
    enabled: true
    task_timeout: "1h"
    max_retries: 3
    default_sharding: "load" # none, round_robin, capability, load

  # Distributed tracing
  tracing:
    enabled: true
    sample_rate: 0.1
    trace_timeout: "5m"
