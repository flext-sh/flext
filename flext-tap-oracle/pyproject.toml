[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext-tap-oracle"
version = "0.7.0"
description = "FLEXT Tap Oracle - Modern Singer Tap for Oracle Database"
authors = [{ name = "FLEXT Team", email = "team@flext.sh" }]
maintainers = [{ name = "FLEXT Team", email = "team@flext.sh" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Singer SDK - latest version for modern patterns
    "singer-sdk>=0.47.0",
    
    # FLEXT ecosystem dependencies
    "flext-core>=0.7.0",
    "flext-observability>=0.7.0", 
    "flext-db-oracle>=0.7.0",
    
    # Explicit dependencies for DEP003 violations
    "pydantic>=2.11.0",
    
    # Oracle functionality is provided via flext-db-oracle
    # Other dependencies removed as unused (DEP002 violations)
]
keywords = [
    "flext", 
    "singer", 
    "tap", 
    "oracle", 
    "database", 
    "enterprise", 
    "integration",
    "etl"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
    "Topic :: Office/Business",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/flext-sh/flext"
Repository = "https://github.com/flext-sh/flext"
Documentation = "https://github.com/flext-sh/flext/blob/main/README.md"

[project.scripts]
tap-oracle = "flext_tap_oracle.tap:TapOracle.cli"
flext-tap-oracle = "flext_tap_oracle.tap:TapOracle.cli"

# Poetry configuration - using PEP 621 [project] section above

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

# Core FLEXT dependencies
flext-core = { path = "../flext-core", develop = true }
flext-observability = { path = "../flext-observability", develop = true }
flext-db-oracle = { path = "../flext-db-oracle", develop = true }

# Singer SDK dependency
singer-sdk = ">=0.47.0"

# Explicit dependencies for DEP003 violations
pydantic = ">=2.11.0"

[tool.poetry.group.dev.dependencies]
# Development dependencies
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
pytest-cov = ">=4.0.0"
pytest-mock = ">=3.12.0"
pytest-xdist = ">=3.6.0"
pytest-timeout = ">=2.3.1"
pytest-sugar = ">=1.0.0"
pytest-clarity = ">=1.0.1"
pytest-benchmark = ">=4.0.0"

# Code quality
ruff = ">=0.8.0"
mypy = ">=1.13.0"
pre-commit = ">=4.0.0"
bandit = ">=1.8.0"

# Documentation
mkdocs = ">=1.6.0"
mkdocs-material = ">=9.5.0"
mkdocs-mermaid2-plugin = ">=1.1.0"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=flext_tap_oracle",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=95",
    "--maxfail=1",
    "--tb=short",
    # "--dist=auto",  # Requires pytest-xdist properly configured
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow tests",
    "smoke: Smoke tests",
    "e2e: End-to-end tests",
    "performance: Performance tests",
    "stress: Stress tests", 
    "error_handling: Error handling tests",
    "cli: CLI tests",
    "memory: Memory efficiency tests",
    "oracle: marks tests as Oracle database tests",
    "singer: marks tests as Singer protocol tests",
    "tap: marks tests as tap tests",
    "stream: marks tests as stream tests",
    "discovery: marks tests as entity discovery tests",
    "requires_oracle: tests that need Oracle database access",
]
filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]
asyncio_mode = "auto"

# Ruff configuration - focused on src/ and tests/
[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
fix = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Formatting
    "E501",     # line-too-long (handled by formatter)
    "COM812",   # missing-trailing-comma (conflicts with formatter)
    "ISC001",   # single-line-implicit-string-concatenation (conflicts with formatter)
    "CPY001",   # missing-copyright-notice (we have copyright headers)
    
    # Documentation - enterprise standards but flexible for Singer taps
    "D100",     # missing-docstring-in-public-module
    "D101",     # missing-docstring-in-public-class (Singer SDK patterns)
    "D102",     # missing-docstring-in-public-method (Singer SDK patterns)
    "D103",     # missing-docstring-in-public-function
    "D104",     # missing-docstring-in-public-package
    "D105",     # missing-docstring-in-magic-method
    "D106",     # missing-docstring-in-public-nested-class
    "D107",     # missing-docstring-in-__init__
    "D203",     # blank-line-before-class-docstring (conflicts with D211)
    "D213",     # multi-line-summary-second-line (conflicts with D212)
    
    # Type annotations - Singer SDK uses Any extensively
    "ANN401",   # any-type (Singer SDK patterns)
    
    # Code style flexibility
    "ERA001",   # commented-out-code (development annotations)
    "EM101",    # raw-string-in-exception
    "EM102",    # f-string-in-exception
    "TRY003",   # raise-vanilla-args
    "FIX002",   # line-contains-todo
    "TD002",    # missing-todo-author
    "TD003",    # missing-todo-link
    
    # Complexity - Oracle integration can be complex
    "PLR0913",  # too-many-arguments (Oracle API needs many params)
    "PLR0912",  # too-many-branches
    "PLR0915",  # too-many-statements
    "C901",     # too-complex
    
    # Performance - Singer SDK patterns
    "PERF203",  # try-except in loop (Singer SDK patterns)
    "PERF401",  # manual list comprehension
    
    # Security - Oracle integration patterns
    "S105",     # possible-hardcoded-password (config patterns)
    "S106",     # possible-hardcoded-password (test secrets)
    "S608",     # possible-sql-injection (handled by Oracle driver)
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Test files have different requirements
"tests/**" = [
    "S101",     # assert (pytest uses assert statements)
    "S106",     # hardcoded-password (tests use hardcoded test passwords)
    "S105",     # hardcoded-password-string (tests use test strings)
    "PLR2004",  # magic-value-comparison (tests often use magic values)
    "SLF001",   # private-member-access (tests need to test private members)
    "PLR0913",  # too-many-arguments (test functions can have many fixtures)
    "ANN001",   # missing-type-annotation-for-function-argument (pytest fixtures)
    "ANN201",   # missing-return-type-annotation (test functions)
    "ANN002",   # missing-type-annotation-for-*args
    "ANN003",   # missing-type-annotation-for-**kwargs
    "D103",     # missing-docstring-in-public-function (test functions)
    "D102",     # missing-docstring-in-public-method (test methods)
    "PLR6301",  # no-self-use (test methods don't always use self)
    "PT011",    # pytest.raises too broad (tests may use broad exceptions)
    "ARG002",   # unused-method-argument (test fixtures)
    "C901",     # too-complex (test functions can be complex)
    "PLR0912",  # too-many-branches (test functions)
    "BLE001",   # blind-except (tests may catch broad exceptions)
    "INP001",   # implicit-namespace-package (test structure)
    "PLC0415",  # import-outside-toplevel (tests may import locally)
    "DTZ001",   # datetime-without-timezone (tests may use naive datetime)
    "SIM117",   # combine-if-branches (tests may have nested with statements)
    "TRY301",   # raise-within-try (tests may raise in try blocks)
    "PT017",    # pytest-assert-in-except (tests may assert in except)
    "PT012",    # pytest-raises-with-multiple-statements (tests may be complex)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = [
    "flext_tap_oracle",
    "flext_core",
    "flext_observability",
    "flext_db_oracle",
]
force-single-line = false
split-on-trailing-comma = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# MyPy configuration - focused on src/ and tests/
[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Paths to check
files = ["src/flext_tap_oracle", "tests"]

# Error output
show_error_codes = true
show_column_numbers = true
show_error_context = true
pretty = true

# Disable specific checks for tests

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

# External library stubs
[[tool.mypy.overrides]]
module = [
    "singer_sdk.*",
    "oracledb.*",
    "sqlalchemy.*",
    "tenacity.*",
    "httpx.*",
    "uvloop.*",
    "orjson.*",
    "flext_core.*",
    "flext_observability.*",
    "flext_db_oracle.*",
]
ignore_missing_imports = true

# Coverage configuration
[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"