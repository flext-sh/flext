[mypy]
check_untyped_defs = true
disable_error_code = no-any-return, unused-ignore, truthy-function, misc
disallow_any_generics = false
disallow_incomplete_defs = true
disallow_untyped_decorators = false
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
python_version = 3.9
strict_equality = true
strict_optional = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_ignores = false
namespace_packages = true
exclude = dc-code-analyzer/(dc_code_analyzer|analyzer|code_analyzer_web|dashboard|tests)/

[mypy.plugins.pydantic.*]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
warn_untyped_fields = True

[mypy-ldap3.*]
ignore_missing_imports = True

[mypy-responses.*,typer.*,rich.*,structlog.*,opentelemetry.*,psutil.*,setuptools.*,pytest_benchmark.*,asyncpg.*,aio_pika.*,redis.*,aioredis.*,aiokafka.*,motor.*,httpx.*,uvloop.*,fastapi.*,starlette.*,pydantic.*,sqlalchemy.*,alembic.*,prefect.*,celery.*,prometheus_client.*,boto3.*,kubernetes.*,docker.*,grpc.*,protobuf.*,pandas.*,numpy.*,ldif3.*,python_ldap.*,click.*,flask.*,django.*,pytest.*,meltano.*,singer.*,pendulum.*,orjson.*,confluent_kafka.*,elasticsearch.*,cassandra.*,jwt.*,cryptography.*,passlib.*,bcrypt.*,invoke.*,fabric.*,paramiko.*,sshtunnel.*,cx_Oracle.*,oracledb.*,pyodbc.*,pymongo.*,psycopg2.*,mysqlclient.*,aiomysql.*,aiopg.*,databases.*,asyncpg.*,edgedb.*,tortoise.*,beanie.*,odmantic.*,mongoengine.*,djongo.*,pymssql.*,ibm_db.*,jaydebeapi.*,phoenix.*,happybase.*,hdfs3.*,pyarrow.*,fastavro.*,confluent_kafka.*,kafka.*,pykafka.*,aiokafka.*,pulsar.*,nats.*,aio_pika.*,pika.*,kombu.*,nameko.*,dramatiq.*,rq.*,huey.*,arq.*,saq.*,taskiq.*,temporalio.*,prefect.*,dagster.*,airflow.*,luigi.*,bonobo.*,petl.*,pandas.*,polars.*,duckdb.*,datafusion.*,ray.*,dask.*,vaex.*,modin.*,koalas.*,pyspark.*,databricks.*,delta.*,mlflow.*,wandb.*,comet_ml.*,neptune.*,clearml.*,polyaxon.*,kubeflow.*,zenml.*,bentoml.*,seldon.*,cortex.*,sagemaker.*,vertex_ai.*]
ignore_missing_imports = True

[mypy-src.dc_api_x.ext.auth.ldap]
disallow_untyped_calls = False

# Configurações mais permissivas para arquivos de teste
[mypy-*/tests/*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false

[mypy-*/temp/*]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
