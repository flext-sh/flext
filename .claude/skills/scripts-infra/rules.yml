skill: scripts-infra
description: 'Validate script infrastructure: Owner-Skill markers, shebangs, gate exit codes'
scan_targets:
  include:
  - '**/*.sh'
  - '**/*.py'
  exclude: []
  projects: []
rules:
- id: owner-skill-marker
  type: ast-grep
  match: absent
  severity: error
  group: ownership
  description: Every script must have Owner-Skill marker
  fix_auto: false
  fix_instruction: 'Add ''# Owner-Skill: .claude/skills/<skill-name>/SKILL.md'' in the first 10 lines.'
  file: rules/owner-skill-marker.yml
- id: shebang-env-bash
  type: ast-grep
  match: absent
  severity: warning
  group: shebang
  description: Scripts should use portable shebang
  fix_auto: false
  fix_instruction: Use '#!/usr/bin/env bash' or '#!/usr/bin/env python3'.
  file: rules/shebang-env-bash.yml
- id: gate-contract-exit-codes
  type: ast-grep
  match: absent
  severity: warning
  group: gate_contract
  description: Gate scripts should use standard exit codes (0/1/2/3)
  fix_auto: false
  fix_instruction: Use exit 0 (pass), 1 (fail), 2 (usage), 3 (infra).
  file: rules/gate-contract-exit-codes.yml
baseline:
  strategy: total
