skill: python-modern-type-syntax
description: "Detect legacy typing constructs (Union, Optional) replaceable by modern 3.10+ syntax."

scan_targets:
  include: ["**/*.py"]
  exclude: ["**/typings.py"]
  projects: []

rules:
  - id: no-union-import
    type: ripgrep
    pattern: 'from typing import.*\bUnion\b'
    severity: warning
    group: modern_syntax
    description: "Import of Union from typing — use X | Y syntax instead."
    fix_auto: false
    fix_type: manual
    fix_instruction: "Remove Union import; use X | Y union syntax (Python 3.10+)."

  - id: no-optional-import
    type: ripgrep
    pattern: 'from typing import.*\bOptional\b'
    severity: warning
    group: modern_syntax
    description: "Import of Optional from typing — use X | None syntax instead."
    fix_auto: false
    fix_type: manual
    fix_instruction: "Remove Optional import; use X | None syntax (Python 3.10+)."

  - id: no-union-annotation
    type: ripgrep
    pattern: 'Union\['
    severity: warning
    group: modern_syntax
    description: "Usage of Union[] — use X | Y syntax instead."
    fix_auto: true
    fix_type: regex
    fix_pattern: 'Union\[([^\[\]]+),\s*([^\[\]]+)\]'
    fix_replacement: '\1 | \2'
    fix_instruction: "Auto-rewrites Union[X, Y] -> X | Y for two-type unions. Multi-type or nested unions require manual fix."

  - id: no-optional-annotation
    type: ripgrep
    pattern: 'Optional\['
    severity: warning
    group: modern_syntax
    description: "Usage of Optional[] — use X | None syntax instead."
    fix_auto: true
    fix_type: regex
    fix_pattern: 'Optional\[([^\[\]]+)\]'
    fix_replacement: '\1 | None'
    fix_instruction: "Auto-rewrites Optional[X] -> X | None for simple types. Nested generics (Optional[Dict[str, int]]) require manual fix."

baseline:
  strategy: total
