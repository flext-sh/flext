skill: rules-typings
description: Directory-scoped checks for typing stubs and local typing shims.
scan_targets:
  include:
    - typings/**/*.py
    - typings/**/*.pyi
  exclude: []
  projects:
    - .
rules:
  - id: require-typing-extensions-compat
    type: ast-grep
    severity: warning
    group: typings_compat
    description: Prefer explicit typing_extensions imports when backport compatibility is needed.
    fix_auto: false
    fix_instruction: If using backported typing features, import them from typing_extensions.
    file: rules/require-typing-extensions-compat.yml
baseline:
  strategy: total
