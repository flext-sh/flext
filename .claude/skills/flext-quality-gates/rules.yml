skill: flext-quality-gates
description: Baseline checks for quality-gate configuration entrypoints.
scan_targets:
  include:
  - pyproject.toml
  - Makefile
  - '**/base.mk'
  exclude: []
  projects:
  - .
rules:
- id: require-ruff-config
  type: ast-grep
  match: absent
  severity: warning
  group: quality_gate_config
  description: Core gate configuration files should include Ruff config or test targets.
  fix_auto: false
  fix_instruction: Ensure pyproject.toml references Ruff and Makefile/base.mk expose
    test targets.
  file: rules/require-ruff-config.yml
  count_by: rule_id
- id: require-test-target
  type: ast-grep
  match: absent
  severity: warning
  group: quality_gate_config
  description: Core gate configuration files should include test gate command wiring.
  fix_auto: false
  fix_instruction: Define a test target (or delegated pytest call) in Makefile/base.mk.
  file: rules/require-test-target.yml
  count_by: rule_id
baseline:
  strategy: total
