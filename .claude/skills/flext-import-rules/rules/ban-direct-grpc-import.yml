id: ban-direct-grpc-import
language: python
rule:
  any:
    - kind: import_statement
      has:
        kind: dotted_name
        regex: "^grpc"
        stopBy: end
    - kind: import_from_statement
      has:
        kind: dotted_name
        field: module_name
        regex: "^grpc"
message: "Direct grpc import banned - use flext_core adapter"
severity: error
