id: ban-direct-sqlalchemy-import
language: python
rule:
  any:
    - kind: import_statement
      has:
        kind: dotted_name
        regex: "^sqlalchemy"
        stopBy: end
    - kind: import_from_statement
      has:
        kind: dotted_name
        field: module_name
        regex: "^sqlalchemy"
message: "Direct sqlalchemy import banned - use flext_core adapter"
severity: error
