id: ban-direct-oracledb-import
language: python
rule:
  any:
    - kind: import_statement
      has:
        kind: dotted_name
        regex: "^oracledb"
        stopBy: end
    - kind: import_from_statement
      has:
        kind: dotted_name
        field: module_name
        regex: "^oracledb"
message: "Direct oracledb import banned - use flext_core adapter"
severity: error
