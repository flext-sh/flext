skill: flext-import-rules
description: 'Enforce core FLEXT import conventions: no wildcards, no relative imports, no legacy typing.'
scan_targets:
  include:
  - '**/*.py'
  exclude:
  - '**/test_*'
  - '**/tests/**'
  - '**/conftest.py'
  projects:
  - .
  - flext-core
  - flext-api
  - flext-auth
  - flext-cli
  - flext-db-oracle
  - flext-grpc
  - flext-ldap
  - flext-ldif
  - flext-meltano
  - flext-observability
  - flext-plugin
  - flext-quality
  - flext-web
  - client-a-oud-mig
  - client-b-meltano-native
rules:
- id: ban-wildcard-import
  type: ripgrep
  pattern: from .+ import \*
  severity: error
  group: import_hygiene
  description: Wildcard imports are banned.
  fix_auto: false
  fix_instruction: Replace wildcard imports with explicit imported symbols.
  fix_type: manual
- id: ban-relative-import
  type: ripgrep
  pattern: from \.\.|from \.
  severity: error
  group: import_hygiene
  description: Relative imports are banned in this workspace.
  fix_auto: false
  fix_instruction: Use absolute package imports instead of relative imports.
  fix_type: manual
- id: ban-legacy-typing-imports
  type: ast-grep
  file: rules/legacy-typing-imports.yml
  severity: warning
  group: modern_typing
  count_by: rule_id
  description: Legacy typing imports (Dict/List/Optional/Union/Tuple/Set) detected by AST.
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/legacy-typing-fix.yml
  fix_instruction: Auto-rewrites typing.Dict->dict, typing.List->list, typing.Tuple->tuple, typing.Set->set in attribute access.
    Import cleanup is manual.
  fix_description: Rewrites typing.X attribute usages to builtin equivalents. Import line cleanup requires manual removal
    of unused typing imports.
- id: ban-direct-oracledb-import
  type: ripgrep
  pattern: (?:^import oracledb|^from oracledb)
  severity: error
  group: domain_isolation
  description: Direct oracledb import — use flext-db-oracle wrapper instead.
  fix_auto: false
  fix_instruction: Import from flext_db_oracle instead of oracledb directly.
  fix_type: manual
- id: ban-direct-sqlalchemy-import
  type: ripgrep
  pattern: (?:^import sqlalchemy|^from sqlalchemy)
  severity: error
  group: domain_isolation
  description: Direct sqlalchemy import — use flext-db-oracle wrapper instead.
  fix_auto: false
  fix_instruction: Import from flext_db_oracle instead of sqlalchemy directly.
  fix_type: manual
- id: ban-direct-ldap3-import
  type: ripgrep
  pattern: (?:^import ldap3|^from ldap3)
  severity: error
  group: domain_isolation
  description: Direct ldap3 import — use flext-ldap wrapper instead.
  fix_auto: false
  fix_instruction: Import from flext_ldap instead of ldap3 directly.
  fix_type: manual
- id: ban-direct-grpc-import
  type: ripgrep
  pattern: (?:^import grpc|^from grpc)
  severity: error
  group: domain_isolation
  description: Direct grpc import — use flext-grpc wrapper instead.
  fix_auto: false
  fix_instruction: Import from flext_grpc instead of grpc directly.
  fix_type: manual
baseline:
  strategy: total
