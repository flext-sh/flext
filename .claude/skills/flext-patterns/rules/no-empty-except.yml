id: no-empty-except
language: python
rule:
  kind: except_clause
  all:
    - not:
        has:
          any:
            - kind: identifier
            - kind: attribute
          stopBy: neighbor
    - has:
        kind: block
        has:
          kind: pass_statement
          stopBy: end
        stopBy: end
message: "Empty bare except clause"
severity: error
