id: fix-sys-exit-with-arg
language: python
rule:
  pattern: sys.exit($N)
fix: raise SystemExit($N)
message: "Rewrite sys.exit(N) -> raise SystemExit(N)"
severity: error
---
id: fix-sys-exit-no-arg
language: python
rule:
  pattern: sys.exit()
fix: raise SystemExit()
message: "Rewrite sys.exit() -> raise SystemExit()"
severity: error
