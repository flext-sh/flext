skill: flext-patterns
description: 'Enforce repository patterns: no bare except, no print in src, no debug leftovers.'
scan_targets:
  include:
  - '**/*.py'
  exclude: []
  projects: []
rules:
- id: ban-bare-except
  type: ast-grep
  file: rules/bare-except.yml
  severity: error
  group: pattern_consistency
  count_by: rule_id
  description: 'Bare except: catches everything including SystemExit/KeyboardInterrupt.'
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/bare-except-fix.yml
  fix_instruction: Auto-rewrite bare except to except Exception; prefer specific exception types when possible.
- id: ban-print-in-src
  type: ast-grep
  severity: warning
  group: code_quality
  description: "print() in source code \u2014 use FlextLogger for structured logging."
  fix_auto: false
  fix_instruction: Replace print() with logger.info() or logger.debug().
  file: rules/ban-print-in-src.yml
- id: detect-todo-fixme
  type: ast-grep
  severity: warning
  group: code_quality
  description: "TODO/FIXME/HACK/XXX comment \u2014 track as issue or resolve."
  fix_auto: false
  fix_instruction: Create a tracking issue and remove the comment, or resolve the issue inline.
  file: rules/detect-todo-fixme.yml
- id: no-breakpoint
  type: ast-grep
  severity: error
  group: code_quality
  description: Debug breakpoint left in code.
  fix_auto: true
  fix_type: ast-grep
  fix_instruction: Auto-removes breakpoint()/import pdb/pdb.set_trace() lines.
  file: rules/no-breakpoint.yml
  fix_file: rules/no-breakpoint-fix.yml
- id: no-empty-except
  type: ast-grep
  severity: warning
  group: pattern_consistency
  description: Empty except/pass block silently swallows errors.
  fix_auto: false
  fix_instruction: Log the error or re-raise with context.
  file: rules/no-empty-except.yml
- id: no-hardcoded-version-string
  type: ast-grep
  severity: error
  group: version_hygiene
  description: "Hardcoded __version__ string \u2014 use importlib.metadata instead."
  fix_auto: false
  fix_instruction: 'Replace with: from importlib.metadata import metadata; __version__ = metadata(''package-name'')[''Version'']'
  file: rules/no-hardcoded-version-string.yml
- id: no-sys-exit-in-library
  type: ast-grep
  severity: warning
  group: code_quality
  description: "sys.exit() in library code \u2014 raise an exception instead; only use in __main__ or CLI entry points."
  fix_auto: false
  fix_instruction: Replace sys.exit(N) with raising an appropriate exception. sys.exit() is acceptable only in if __name__
    == '__main__' blocks.
  file: rules/no-sys-exit-in-library.yml
- id: ban-open-no-encoding
  type: ast-grep
  file: rules/open-no-encoding-detect.yml
  severity: warning
  group: code_quality
  count_by: rule_id
  description: "open(path) without encoding \u2014 use open(path, encoding='utf-8') for portable I/O."
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/open-no-encoding-fix.yml
  fix_instruction: Auto-rewrite open(path) to open(path, encoding='utf-8').
baseline:
  strategy: total
