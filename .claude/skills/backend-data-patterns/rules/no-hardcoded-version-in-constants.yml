id: no-hardcoded-version-in-constants
language: python
rule:
  kind: expression_statement
  has:
    kind: assignment
    all:
      - has:
          kind: identifier
          regex: "^VERSION$"
          field: left
      - has:
          kind: string
          field: right
          regex: "\\d+\\.\\d+"
message: "Hardcoded VERSION constant"
severity: warning
