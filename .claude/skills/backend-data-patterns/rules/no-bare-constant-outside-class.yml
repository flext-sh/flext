id: no-bare-constant-outside-class
language: python
rule:
  kind: expression_statement
  has:
    kind: assignment
    has:
      kind: identifier
      regex: "^[A-Z][A-Z_]{2,}$"
      field: left
  not:
    inside:
      kind: class_definition
      stopBy: end
message: "Bare constant outside class"
severity: warning
