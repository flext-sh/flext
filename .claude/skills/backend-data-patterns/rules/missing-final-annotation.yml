id: missing-final-annotation
language: python
rule:
  kind: expression_statement
  all:
    - has:
        kind: assignment
        has:
          kind: identifier
          regex: "^[A-Z][A-Z_]{2,}$"
          field: left
    - not:
        has:
          kind: type
          has:
            regex: "Final"
            stopBy: end
          stopBy: end
  inside:
    kind: class_definition
    stopBy: end
message: "Class constant missing Final annotation"
severity: warning
