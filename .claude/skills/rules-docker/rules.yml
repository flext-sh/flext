skill: rules-docker
description: Directory-scoped checks for compose files and Dockerfiles under docker/.
scan_targets:
  include:
  - docker/**/*.yml
  - docker/**/*.yaml
  - docker/**/Dockerfile*
  exclude: []
  projects:
  - .
rules:
- id: require-healthcheck
  type: custom
  severity: warning
  group: docker_runtime
  description: Docker images should define a HEALTHCHECK.
  fix_auto: false
  fix_instruction: Add a HEALTHCHECK in Dockerfiles when the container should report readiness/liveness.
  script: ../../../scripts/core/text_pattern_scanner.py
  args:
  - --pattern
  - 'HEALTHCHECK|^services:'
  - --match
  - absent
  - --include
  - docker/**/*.yml
  - --include
  - docker/**/*.yaml
  - --include
  - docker/**/Dockerfile*
- id: ban-latest-tag
  type: ast-grep
  severity: warning
  group: docker_runtime
  description: Compose services should avoid floating :latest tags.
  fix_auto: false
  fix_instruction: Pin image tags to explicit versions instead of ':latest'.
  file: rules/ban-latest-tag.yml
- id: ban-hardcoded-coverage-threshold-flags
  type: custom
  severity: error
  group: docker_runtime
  description: Docker compose and Dockerfile commands must not use --cov-fail-under flags.
  fix_auto: false
  fix_instruction: Remove hardcoded threshold flags and enforce coverage via pyproject.toml with a separate coverage report command.
  script: ../../../scripts/core/text_pattern_scanner.py
  args:
  - --pattern
  - '\-\-cov-fail-under'
  - --match
  - present
  - --include
  - docker/**/*.yml
  - --include
  - docker/**/*.yaml
  - --include
  - docker/**/Dockerfile*
baseline:
  strategy: total
