skill: async-python-patterns
description: 'Detect async anti-patterns: nested asyncio.run(), blocking calls in async code.'
scan_targets:
  include:
  - '**/src/**/*.py'
  exclude: []
  projects: []
rules:
- id: no-asyncio-run-in-src
  type: ast-grep
  severity: warning
  group: async_safety
  description: "asyncio.run() in source \u2014 may cause nested event loop error."
  fix_auto: false
  fix_instruction: Use await directly or restructure to avoid nested asyncio.run().
  file: rules/no-asyncio-run-in-src.yml
- id: no-blocking-sleep-in-async
  type: ast-grep
  severity: warning
  group: async_safety
  description: "Blocking time.sleep() in src/ \u2014 use asyncio.sleep() in async code."
  fix_auto: false
  fix_instruction: Replace time.sleep() with await asyncio.sleep() in async contexts.
  file: rules/no-blocking-sleep-in-async.yml
- id: no-sync-requests-in-src
  type: ast-grep
  severity: warning
  group: async_safety
  description: "Blocking requests.* call \u2014 use httpx.AsyncClient or aiohttp in async code."
  fix_auto: false
  fix_instruction: Replace requests.get() with async HTTP client (httpx.AsyncClient).
  file: rules/no-sync-requests-in-src.yml
baseline:
  strategy: total
