skill: rules-src
description: Directory-scoped checks for shared source modules under src/.
scan_targets:
  include:
  - src/**/*.py
  exclude: []
  projects:
  - .
rules:
- id: require-future-annotations
  type: ripgrep
  pattern: from __future__ import annotations
  match: absent
  severity: error
  group: src_style
  description: Shared source modules should use postponed annotations.
  fix_auto: false
  fix_instruction: Add 'from __future__ import annotations' near the top of each module.
  fix_type: manual
- id: ban-star-import
  type: ripgrep
  pattern: from\s+.+\s+import\s+\*
  severity: error
  group: src_imports
  description: Shared source code should avoid wildcard imports.
  fix_auto: false
  fix_instruction: Replace wildcard imports with explicit imported symbols.
  fix_type: manual
baseline:
  strategy: total
