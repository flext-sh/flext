skill: scripts-validation
description: 'Enforce script quality: bash strict mode, no interactive prompts, Python
  main guards'
scan_targets:
  include:
  - '**/*.sh'
  - '**/*.py'
  exclude: []
  projects: []
rules:
- id: bash-strict-mode
  type: ast-grep
  file: rules/bash-strict-mode.yml
  severity: warning
  group: bash_strict_mode
  count_by: rule_id
  description: Bash scripts must use set -euo pipefail
  fix_auto: false
  fix_instruction: Add 'set -euo pipefail' after shebang line.
  fix_type: manual
- id: no-interactive-prompts
  type: ast-grep
  file: rules/no-interactive.yml
  severity: error
  group: no_interactive
  count_by: aggregate
  description: Interactive prompts (read -p) are forbidden by default
  fix_auto: false
  fix_instruction: Remove read -p and gate behind --interactive flag, or use environment
    variable for input.
  fix_type: manual
- id: python-main-guard
  type: ast-grep
  file: rules/python-main-guard.yml
  severity: warning
  group: python_main_guard
  count_by: rule_id
  description: Python scripts should have if __name__ == '__main__' guard
  fix_auto: false
  fix_instruction: 'Add ''if __name__ == "__main__": sys.exit(main())'' at end of
    script.'
  fix_type: manual
baseline:
  strategy: total
