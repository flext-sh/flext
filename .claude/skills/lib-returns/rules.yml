skill: lib-returns
description: Enforce FlextResult factory/composition patterns and isolate direct returns imports.
scan_targets:
  include:
  - '**/*.py'
  exclude:
  - flext-core/src/flext_core/result.py
  projects: []
rules:
- id: ban-direct-constructor
  type: ripgrep
  pattern: FlextResult\(Success|FlextResult\(Failure
  severity: error
  group: result_flow
  description: Direct FlextResult constructor usage with Success/Failure is banned.
  fix_auto: false
  fix_instruction: Use r[T].ok(...) or r.fail(...) factory methods instead.
  fix_type: manual
- id: ban-direct-returns-import
  type: ripgrep
  pattern: from returns\.|import returns\.
  severity: error
  group: result_flow
  description: Direct returns imports are banned outside flext_core/result.py.
  fix_auto: false
  fix_instruction: Use flext_core.FlextResult (r alias) APIs instead of importing returns directly.
  fix_type: manual
- id: ban-unwrap-call
  type: ast-grep
  file: rules/unwrap-to-value.yml
  severity: warning
  group: result_flow
  count_by: rule_id
  description: Detect deprecated .unwrap() calls on FlextResult-like values.
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/unwrap-to-value-fix.yml
  fix_instruction: Auto-rewrite .unwrap() to .value.
baseline:
  strategy: total
