id: no-fstring-execute
language: python
rule:
  kind: call
  all:
    - has:
        kind: attribute
        regex: "execute$"
        stopBy: end
    - has:
        kind: argument_list
        has:
          kind: string
          has:
            kind: string_start
            regex: "^f"
          stopBy: end
        stopBy: end
message: "f-string in execute() is SQL injection risk"
severity: error
