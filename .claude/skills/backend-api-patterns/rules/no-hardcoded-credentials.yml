id: no-hardcoded-credentials
language: python
rule:
  kind: expression_statement
  has:
    kind: assignment
    all:
      - has:
          kind: identifier
          regex: "(?i)(password|secret|api_key|token)"
          field: left
          stopBy: end
      - has:
          kind: string
          field: right
message: "Hardcoded credential detected"
severity: error
