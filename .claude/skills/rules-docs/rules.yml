skill: rules-docs
description: Ensure documentation quality, relative paths, and absence of placeholders.
scan_targets:
  include:
  - docs/**/*.md
  exclude: []
  projects: []
rules:
- id: docs-no-todo-fixme
  type: ast-grep
  severity: warning
  group: docs_quality
  description: Documentation should not contain TODO/FIXME/TBD placeholders.
  fix_auto: false
  fix_instruction: Resolve the TODO/FIXME items or move them to issue tracker.
  file: rules/docs-no-todo-fixme.yml
  count_by: rule_id
- id: docs-absolute-paths
  type: ast-grep
  severity: error
  group: docs_quality
  description: Documentation should not contain absolute system paths.
  fix_auto: false
  fix_instruction: Replace absolute paths with repository-relative paths.
  file: rules/docs-absolute-paths.yml
  count_by: rule_id
- id: no-trailing-whitespace-in-md
  type: ast-grep
  severity: warning
  group: markdown_hygiene
  description: Markdown files should not have trailing whitespace.
  fix_auto: false
  fix_instruction: Remove trailing whitespace from lines.
  file: rules/no-trailing-whitespace-in-md.yml
  count_by: rule_id
- id: docs-has-readme
  type: ast-grep
  match: absent
  severity: warning
  group: docs_structure
  description: Markdown files should have at least one heading.
  fix_auto: false
  fix_instruction: Add a heading to the markdown file.
  file: rules/docs-has-readme.yml
  count_by: rule_id
baseline:
  strategy: total
