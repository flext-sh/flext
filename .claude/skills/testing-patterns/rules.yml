skill: testing-patterns
description: 'Detect test anti-patterns: useless assertions, flaky sleep, broad asserts.'
scan_targets:
  include:
  - '**/test_*.py'
  - '**/tests/**/*.py'
  exclude: []
  projects: []
rules:
- id: no-assert-true
  type: ast-grep
  severity: warning
  group: test_quality
  description: "assert True is a no-op \u2014 tests must verify actual behavior."
  fix_auto: false
  fix_instruction: Replace assert True with a meaningful assertion on actual output. Requires understanding test intent.
  file: rules/no-assert-true.yml
- id: no-assert-false
  type: ast-grep
  severity: warning
  group: test_quality
  description: Bare assert False without message should be pytest.fail() with a reason.
  fix_auto: true
  fix_type: ast-grep
  fix_instruction: 'Auto-rewrites bare assert False -> pytest.fail(''TODO: add failure reason''). assert False with message
    is acceptable.'
  file: rules/no-assert-false.yml
  fix_file: rules/no-assert-false-fix.yml
- id: no-sleep-in-tests
  type: ast-grep
  severity: warning
  group: test_quality
  description: time.sleep() in tests makes them flaky and slow.
  fix_auto: false
  fix_instruction: Use mocks, events, or polling instead of sleep.
  file: rules/no-sleep-in-tests.yml
- id: no-bare-assert
  type: ast-grep
  severity: warning
  group: test_quality
  description: "Bare assert on variable (truthy-only) \u2014 use specific assertions."
  fix_auto: false
  fix_instruction: Use assert x == expected or assert x is not None.
  file: rules/no-bare-assert.yml
baseline:
  strategy: total
