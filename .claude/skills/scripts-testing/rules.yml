skill: scripts-testing
description: Validate scripts/testing ownership and shell shebang presence
scan_targets:
  include:
  - scripts/testing/*.py
  - scripts/testing/**/*.py
  - scripts/testing/*.sh
  - scripts/testing/**/*.sh
  exclude: []
  projects:
  - .
rules:
- id: require-owner-skill-marker
  type: ripgrep
  pattern: 'Owner-Skill:'
  match: absent
  severity: error
  group: ownership
  description: Every testing script must declare Owner-Skill marker
  fix_auto: false
  fix_instruction: 'Add ''# Owner-Skill: .claude/skills/scripts-testing/SKILL.md''
    near the top of each testing script.'
  fix_type: manual
- id: require-shebang-in-sh
  type: ripgrep
  pattern: ^#!/usr/bin/env
  match: absent
  severity: error
  group: shebang
  description: Testing shell scripts should include a portable shebang
  fix_auto: false
  fix_instruction: Add '#!/usr/bin/env bash' as the first line in shell scripts.
  fix_type: manual
baseline:
  strategy: total
