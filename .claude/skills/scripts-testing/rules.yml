skill: scripts-testing
description: Validate scripts/testing ownership and shell shebang presence
scan_targets:
  include:
  - scripts/testing/*.py
  - scripts/testing/**/*.py
  - scripts/testing/*.sh
  - scripts/testing/**/*.sh
  exclude: []
  projects:
  - .
rules:
- id: require-owner-skill-marker
  type: ast-grep
  match: absent
  severity: error
  group: ownership
  description: Every testing script must declare Owner-Skill marker
  fix_auto: false
  fix_instruction: 'Add ''# Owner-Skill: .claude/skills/scripts-testing/SKILL.md'' near the top of each testing script.'
  file: rules/require-owner-skill-marker.yml
- id: require-shebang-in-sh
  type: ast-grep
  match: absent
  severity: error
  group: shebang
  description: Testing shell scripts should include a portable shebang
  fix_auto: false
  fix_instruction: Add '#!/usr/bin/env bash' as the first line in shell scripts.
  file: rules/require-shebang-in-sh.yml
baseline:
  strategy: total
