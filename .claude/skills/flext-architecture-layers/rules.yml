skill: flext-architecture-layers
description: Guard architecture boundaries by banning private flext_core module imports in subprojects.
scan_targets:
  include:
  - '**/*.py'
  exclude: []
  projects:
  - client-a-oud-mig
  - flext-api
  - flext-auth
  - flext-cli
  - flext-db-oracle
  - flext-dbt-ldap
  - flext-dbt-ldif
  - flext-dbt-oracle
  - flext-dbt-oracle-wms
  - flext-grpc
  - flext-ldap
  - flext-ldif
  - flext-meltano
  - flext-observability
  - flext-oracle-oic
  - flext-oracle-wms
  - flext-plugin
  - flext-quality
  - flext-tap-ldap
  - flext-tap-ldif
  - flext-tap-oracle
  - flext-tap-oracle-oic
  - flext-tap-oracle-wms
  - flext-target-ldap
  - flext-target-ldif
  - flext-target-oracle
  - flext-target-oracle-oic
  - flext-target-oracle-wms
  - flext-web
  - client-b-meltano-native
rules:
- id: ban-private-module-import
  type: ast-grep
  severity: error
  group: architecture_layers
  description: Subprojects must not import private flext_core modules.
  fix_auto: false
  fix_instruction: Import from flext_core public facades instead of private underscore modules.
  file: rules/ban-private-module-import.yml
baseline:
  strategy: total
