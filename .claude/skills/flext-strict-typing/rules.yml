skill: flext-strict-typing
description: 'Enforce Mapping-first typing standards: almost-ban dict in contracts, preserve explicit mutable exceptions.'
scan_targets:
  include:
  - '**/*.py'
  exclude: []
  projects: []
rules:
- id: ban-dict-type-annotation
  type: ast-grep
  file: rules/ban-dict-type-annotation.yml
  severity: error
  group: strict_typing_contract
  count_by: rule_id
  description: dict in type annotations is banned for contracts (prefer Mapping, MutableMapping, or TypedDict).
  fix_auto: false
  fix_instruction: 'Manual semantic fix: use Mapping for read-only contracts, MutableMapping for mutating contracts, TypedDict/Pydantic for schema-bearing payloads.'
- id: ban-typing-dict-attribute
  type: ast-grep
  file: rules/ban-typing-dict-attribute.yml
  severity: error
  group: strict_typing_contract
  count_by: rule_id
  description: typing.Dict is banned (prefer collections.abc.Mapping-family types).
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/no-dict-fix.yml
  fix_imports:
  - from collections.abc import Mapping
  fix_instruction: 'Auto-rewrite: typing.Dict -> Mapping. Then manually validate mutability intent.'
- id: ban-typing-dict-import
  type: ast-grep
  file: rules/ban-typing-dict-import.yml
  severity: error
  group: strict_typing_contract
  count_by: rule_id
  description: Importing Dict from typing is banned (use collections.abc.Mapping or built-in dict only for mutation hotspots).
  fix_auto: true
  fix_type: ast-grep
  fix_file: rules/no-dict-fix.yml
  fix_instruction: Auto-removes standalone 'from typing import Dict'.
- id: ban-isinstance-dict
  type: ast-grep
  file: rules/isinstance-dict-detect.yml
  severity: error
  group: strict_typing_runtime
  count_by: rule_id
  description: "isinstance(x, dict) is almost-banned — prefer Mapping or explicit protocol checks."
  fix_auto: false
  fix_type: ast-grep
  fix_file: rules/isinstance-dict-fix.yml
  fix_imports:
  - from collections.abc import Mapping
  fix_instruction: "MANUAL ONLY \u2014 this is a SEMANTIC CHANGE. isinstance(x, dict) \u2192 isinstance(x, Mapping)\nwidens\
    \ the accepted types to include UserDict, OrderedDict, defaultdict, ChainMap, etc.\nThis changes runtime behavior and\
    \ may introduce bugs if the code later calls dict-only\nmethods (.pop, .update, .setdefault) on the value. Review each\
    \ callsite individually.\nAlso requires adding 'from collections.abc import Mapping' import. Only apply when the\ncode\
    \ truly needs duck-typed mapping support, not when it expects an actual dict.\n"
- id: ban-default-factory-dict
  type: ast-grep
  file: rules/ban-default-factory-dict.yml
  severity: error
  group: strict_typing_contract
  count_by: rule_id
  description: default_factory=dict is banned.
  fix_auto: false
  fix_instruction: 'Use explicit factory returning TypedDict-compatible structure, model constructor, or MappingProxyType wrapper.'
- id: grep-typing-any
  type: ast-grep
  severity: error
  group: strict_typing
  description: Direct usage of typing.Any is banned.
  fix_auto: false
  fix_instruction: Replace Any with specific type or object.
  file: rules/grep-typing-any.yml
- id: grep-any-import
  type: ast-grep
  severity: error
  group: strict_typing
  description: Importing Any from typing is banned.
  fix_auto: false
  fix_instruction: Remove Any import.
  file: rules/grep-any-import.yml
- id: ban-type-ignore-comment
  type: ast-grep
  severity: warning
  group: suppress_comments
  description: "type: ignore comments suppress type checker \u2014 fix the underlying issue."
  fix_auto: false
  fix_instruction: Remove the comment and fix the underlying type error.
  file: rules/ban-type-ignore-comment.yml
- id: ban-noqa-comment
  type: ast-grep
  severity: warning
  group: suppress_comments
  description: "noqa comments suppress linter \u2014 fix the underlying issue."
  fix_auto: false
  fix_instruction: Remove the comment and fix the underlying lint violation.
  file: rules/ban-noqa-comment.yml
- id: ban-pylint-disable-comment
  type: ast-grep
  severity: warning
  group: suppress_comments
  description: "pylint: disable comments suppress linter \u2014 fix the underlying issue."
  fix_auto: false
  fix_instruction: Remove the comment and fix the underlying violation.
  file: rules/ban-pylint-disable-comment.yml
- id: ban-mypy-ignore-comment
  type: ast-grep
  severity: warning
  group: suppress_comments
  description: mypy ignore comments suppress type checker.
  fix_auto: false
  fix_instruction: Remove the comment and fix the underlying type error.
  file: rules/ban-mypy-ignore-comment.yml
baseline:
  strategy: total
report: {}
