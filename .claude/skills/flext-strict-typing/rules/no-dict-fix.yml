id: fix-typing-dict-attr
language: python
rule:
  all:
    - kind: attribute
    - pattern: typing.Dict
fix: Mapping
message: "Rewrite typing.Dict -> Mapping"
severity: error
---
id: fix-typing-dict-import-solo
language: python
rule:
  pattern: from typing import Dict
fix: ""
message: "Remove standalone 'from typing import Dict'"
severity: error
---
id: fix-typing-dict-import-head
language: python
rule:
  pattern: from typing import Dict, $$$AFTER
fix: from typing import $$$AFTER
message: "Remove Dict from typing import (head)"
severity: error
---
id: fix-typing-dict-import-tail
language: python
rule:
  pattern: from typing import $$$BEFORE, Dict
fix: from typing import $$$BEFORE
message: "Remove Dict from typing import (tail)"
severity: error
---
id: fix-typing-dict-import-middle
language: python
rule:
  pattern: from typing import $$$BEFORE, Dict, $$$AFTER
fix: from typing import $$$BEFORE, $$$AFTER
message: "Remove Dict from typing import (middle)"
severity: error
