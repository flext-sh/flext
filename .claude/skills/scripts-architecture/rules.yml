skill: scripts-architecture
description: "Enforce domain separation: no direct imports of singer, database, HTTP, CLI libraries in leaf projects"
scan_targets:
  include:
    - "**/src/**/*.py"
  exclude: []
  projects:
    - flext-tap-oracle-oic
    - flext-tap-oracle
    - flext-tap-oracle-wms
    - flext-target-oracle
    - flext-target-oracle-wms
    - flext-target-oracle-oic
    - flext-target-ldap
    - flext-target-ldif
    - flext-oud-mig
    - flext-dbt-oracle
    - flext-dbt-ldap
    - flext-dbt-ldif
rules:
  - id: no-direct-singer-import
    type: ast-grep
    severity: error
    group: singer_separation
    description: Direct Singer/Meltano imports banned
    fix_auto: false
    fix_instruction: Replace direct singer/meltano imports with flext-meltano wrappers.
    file: rules/no-direct-singer-import.yml
  - id: no-direct-db-import
    type: ast-grep
    severity: error
    group: database_separation
    description: Direct database library imports banned
    fix_auto: false
    fix_instruction: Replace direct sqlalchemy/oracledb/cx_Oracle/ldap3 imports with flext-db-oracle/flext-ldap/flext-ldif wrappers.
    file: rules/no-direct-db-import.yml
  - id: no-direct-http-import
    type: ast-grep
    severity: error
    group: http_separation
    description: Direct HTTP client imports banned
    fix_auto: false
    fix_instruction: Replace direct requests/httpx/urllib imports with flext-api wrappers.
    file: rules/no-direct-http-import.yml
  - id: no-direct-cli-import
    type: ast-grep
    severity: error
    group: cli_separation
    description: Direct CLI library imports banned
    fix_auto: false
    fix_instruction: Replace direct click/rich/typer imports with flext-cli wrappers.
    file: rules/no-direct-cli-import.yml
  - id: requires-flext-core
    type: ast-grep
    match: absent
    severity: warning
    group: flext_core_integration
    description: Projects should import flext_core.
    fix_auto: false
    fix_instruction: Add 'from flext_core import ...' to integrate with FLEXT core APIs.
    file: rules/requires-flext-core.yml
  - id: requires-flext-meltano-integration
    type: ast-grep
    severity: warning
    group: singer_protocol
    description: Singer projects should avoid direct singer_sdk imports in leaf modules.
    fix_auto: false
    fix_instruction: Replace direct singer_sdk imports with flext_meltano wrappers when available.
    file: rules/requires-flext-meltano-integration.yml
  - id: requires-singer-message-handling
    type: ast-grep
    severity: warning
    group: singer_protocol
    description: Singer projects should avoid direct Singer message construction in leaf modules.
    fix_auto: false
    fix_instruction: Use flext_meltano stream/target abstractions instead of direct singer message APIs.
    file: rules/requires-singer-message-handling.yml
baseline:
  strategy: total
