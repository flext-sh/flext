id: img-requires-alt
language: html
rule:
  kind: element
  all:
    - has:
        kind: start_tag
        has:
          kind: tag_name
          regex: "^img$"
        stopBy: end
    - not:
        has:
          kind: attribute
          has:
            kind: attribute_name
            regex: "^alt$"
          stopBy: end
message: "img element missing alt attribute"
severity: error
