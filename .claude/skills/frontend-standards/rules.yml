skill: frontend-standards
description: "Detect accessibility and HTML quality issues in frontend code."

scan_targets:
  include: ["**/*.html", "**/*.htm", "**/*.jinja2", "**/*.j2"]
  exclude: []
  projects: []

rules:
  - id: img-requires-alt
    type: ripgrep
    pattern: '<img(?![^>]*alt=)[^>]*>'
    severity: warning
    group: accessibility
    description: "img tag without alt attribute — accessibility violation."
    fix_auto: false
    fix_type: manual
    fix_instruction: "Add alt='descriptive text' to all img elements."

  - id: no-inline-style
    type: ripgrep
    pattern: 'style="[^"]*"'
    severity: warning
    group: frontend_quality
    description: "Inline style attribute — use CSS classes instead."
    fix_auto: false
    fix_type: manual
    fix_instruction: "Move styles to CSS class and use class attribute."

baseline:
  strategy: total
