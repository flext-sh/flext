skill: lib-beartype
description: Enforce beartype usage through flext-core runtime bridge only.
scan_targets:
  include:
  - '**/*.py'
  exclude:
  - flext-core/src/flext_core/_beartype_conf.py
  - flext-core/src/flext_core/runtime.py
  projects: []
rules:
- id: ban-direct-beartype-decorator
  type: ast-grep
  severity: error
  group: beartype_bridge
  description: Direct @beartype decorator usage is banned outside flext-core bridge files.
  fix_auto: false
  fix_instruction: Remove @beartype and rely on FlextRuntime.enable_runtime_checking().
  file: rules/ban-direct-beartype-decorator.yml
- id: ban-adhoc-beartype-conf
  type: ast-grep
  severity: error
  group: beartype_bridge
  description: Ad hoc BeartypeConf construction is banned outside flext-core bridge files.
  fix_auto: false
  fix_instruction: Reuse flext_core.BEARTYPE_CONF or the runtime bridge configuration path.
  file: rules/ban-adhoc-beartype-conf.yml
baseline:
  strategy: total
