id: require-flext-result-pattern
language: python
rule:
  any:
    - kind: import_from_statement
      has:
        kind: identifier
        regex: "^FlextResult$"
        stopBy: end
    - kind: function_definition
      has:
        field: return_type
        regex: "FlextResult"
        stopBy: end
message: "FlextResult pattern found (tracking)"
severity: warning
