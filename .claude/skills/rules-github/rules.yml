skill: rules-github
description: Directory-scoped checks for GitHub automation YAML files.
scan_targets:
  include:
    - .github/**/*.yml
    - .github/**/*.yaml
  exclude:
    - .github/dependabot.yml
  projects:
    - .
rules:
  - id: require-workflow-name
    type: custom
    severity: error
    group: github_workflows
    description: Workflow files should define a top-level name.
    fix_auto: false
    fix_instruction: Add a top-level 'name:' field to each workflow YAML file.
    script: ../../../scripts/core/text_pattern_scanner.py
    args:
      - --pattern
      - "^name:"
      - --match
      - absent
      - --include
      - .github/**/*.yml
      - --include
      - .github/**/*.yaml
      - --exclude
      - .github/dependabot.yml
  - id: ban-hardcoded-secrets
    type: ast-grep
    severity: error
    group: github_security
    description: Do not hardcode secret-like values in GitHub configuration.
    fix_auto: false
    fix_instruction: Use GitHub encrypted secrets or inherited env references instead
      of literal secret values.
    file: rules/ban-hardcoded-secrets.yml
    count_by: rule_id
  - id: ban-legacy-coverage-threshold-flags
    type: custom
    severity: error
    group: github_workflows
    description: Workflows must not use --cov-fail-under or MIN_COVERAGE style thresholds.
    fix_auto: false
    fix_instruction: Remove hardcoded coverage thresholds and rely on pyproject.toml [tool.coverage.report].fail_under via coverage report.
    script: ../../../scripts/core/text_pattern_scanner.py
    args:
      - --pattern
      - '\-\-cov-fail-under|\bMIN_COVERAGE(_DEFAULT)?\b'
      - --match
      - present
      - --include
      - .github/**/*.yml
      - --include
      - .github/**/*.yaml
      - --exclude
      - .github/dependabot.yml
baseline:
  strategy: total
