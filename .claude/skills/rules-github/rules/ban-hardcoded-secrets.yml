id: ban-hardcoded-secrets
language: yaml
rule:
  kind: block_mapping_pair
  all:
  - has:
      kind: flow_node
      regex: (?i)(password|secret|token)
  - has:
      kind: flow_node
      regex: '[A-Za-z0-9_\-]{8,}'
  not:
    has:
      kind: flow_node
      regex: \$\{\{
message: Do not hardcode secret-like values in GitHub configuration.
severity: error
