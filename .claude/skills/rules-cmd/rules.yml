skill: rules-cmd
description: Directory-scoped checks for command wrappers under cmd/.
scan_targets:
  include:
  - cmd/**/*.py
  - cmd/**/*.sh
  exclude: []
  projects:
  - .
rules:
- id: require-shebang
  type: ripgrep
  pattern: ^#!/usr/bin/env
  match: absent
  severity: warning
  group: cmd_entrypoint
  description: Command scripts should use portable env shebangs.
  fix_auto: false
  fix_instruction: Add an env-based shebang at the top (for example '#!/usr/bin/env
    python3' or '#!/usr/bin/env bash').
  fix_type: manual
- id: require-docstring
  type: ripgrep
  pattern: ^("""|''')|^#!/usr/bin/env (bash|sh)$
  match: absent
  severity: warning
  group: cmd_entrypoint
  description: Python command scripts should start with a module docstring.
  fix_auto: false
  fix_instruction: Add a leading module docstring to Python scripts; keep shell scripts
    with their shebang.
  fix_type: manual
baseline:
  strategy: total
