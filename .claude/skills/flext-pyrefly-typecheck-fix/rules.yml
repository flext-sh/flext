skill: flext-pyrefly-typecheck-fix
description: "Pyrefly type-check error detection and safe auto-fix rules for FLEXT ecosystem."
scan_targets:
  include:
    - "**/*.py"
  exclude:
    - "**/tests/**"
    - "**/__pycache__/**"
  projects: []
rules:
  # =========================================================================
  # Cluster 1: r.ok(None) — Real bug (None rejected at runtime)
  # =========================================================================
  - id: detect-ok-none
    type: ast-grep
    file: rules/detect-ok-none.yml
    severity: error
    group: result_ok_none
    count_by: rule_id
    description: "r.ok(None) is a runtime bug — ok() rejects None values."
    fix_auto: true
    fix_type: ast-grep
    fix_file: rules/fix-ok-none.yml
    fix_instruction: "Replace .ok(None) with .ok(True) for r[bool] return types."

  # =========================================================================
  # Cluster 2: r[t.NormalizedValue] type erasure
  # =========================================================================
  - id: detect-result-t.NormalizedValue
    type: ast-grep
    file: rules/detect-result-t.NormalizedValue.yml
    severity: error
    group: result_type_erasure
    count_by: rule_id
    description: "r[t.NormalizedValue] uses type erasure — prefer r[t.NormalizedValue]."
    fix_auto: true
    fix_type: ast-grep
    fix_file: rules/fix-result-t.NormalizedValue.yml
    fix_instruction: "Rewrite r[t.NormalizedValue] to r[t.NormalizedValue] at boundaries."
    fix_imports:
      - from flext_core import t

  - id: detect-jsondict-legacy
    type: ast-grep
    file: rules/detect-jsondict-legacy.yml
    severity: error
    group: jsondict_legacy
    count_by: rule_id
    description: "Legacy Mapping[str, t.NormalizedValue] annotation — normalize to t.NormalizedValue alias."
    fix_auto: true
    fix_type: ast-grep
    fix_file: rules/fix-jsondict-legacy.yml
    fix_instruction: "Rewrite Mapping[str, t.NormalizedValue] to t.NormalizedValue."
    fix_imports:
      - from flext_core import t

  # =========================================================================
  # Cluster 3: Logger annotation drift (BindableLogger vs Logger)
  # =========================================================================
  - id: detect-bindable-logger-annotation
    type: ast-grep
    file: rules/detect-bindable-logger.yml
    severity: error
    group: logger_typing
    count_by: rule_id
    description: "BindableLogger annotation lacks logging method signatures — use p.Logger."
    fix_auto: true
    fix_type: ast-grep
    fix_file: rules/fix-bindable-logger.yml
    fix_instruction: "Rewrite BindableLogger type annotations to p.Logger."
    fix_imports:
      - from flext_core import p

  # =========================================================================
  # Cluster 4: RootModel dict() coercion
  # =========================================================================
  - id: detect-dict-rootmodel-coercion
    type: ast-grep
    file: rules/detect-dict-rootmodel.yml
    severity: error
    group: rootmodel_coercion
    count_by: rule_id
    description: "dict(rootmodel_instance) causes no-matching-overload — use .root instead."
    fix_auto: false
    fix_instruction: "Replace dict(rootmodel_instance) with rootmodel_instance.root for RootModel containers."

  # =========================================================================
  # Cluster 5: Mapping mutation (Mapping has no setdefault/item assignment)
  # =========================================================================
  - id: detect-mapping-mutation
    type: ast-grep
    file: rules/detect-mapping-mutation.yml
    severity: error
    group: mapping_mutation
    count_by: rule_id
    description: "Mapping type used at mutation site — contract must be MutableMapping or local dict materialization."
    fix_auto: false
    fix_instruction: "Architecture-aware fix: keep Mapping at read-only boundaries, use MutableMapping for mutating contracts, or create local dict copy before mutation."

baseline:
  strategy: total
report: {}
