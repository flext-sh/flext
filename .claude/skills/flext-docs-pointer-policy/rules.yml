skill: flext-docs-pointer-policy
description: Enforce pointer-only content in agent config files.
scan_targets:
  include:
  - .github/copilot-instructions.md
  - .gemini/styleguide.md
  - .cursor/rules/flext.mdc
  - .clinerules
  - .windsurfrules
  - .continue/rules/flext.md
  - CONVENTIONS.md
  - codex.md
  exclude: []
  projects: []
rules:
- id: pointer-reference-claude
  type: custom
  severity: error
  group: pointer_policy
  description: Pointer files must reference the canonical 'CLAUDE.md' policy.
  fix_auto: false
  fix_instruction: Add a reference to 'CLAUDE.md' as the single source of truth.
  script: ../../../scripts/core/text_pattern_scanner.py
  args:
  - --pattern
  - CLAUDE\.md
  - --match
  - absent
  - --include
  - .github/copilot-instructions.md
  - --include
  - .gemini/styleguide.md
  - --include
  - .cursor/rules/flext.mdc
  - --include
  - .clinerules
  - --include
  - .windsurfrules
  - --include
  - .continue/rules/flext.md
  - --include
  - CONVENTIONS.md
  - --include
  - codex.md
- id: pointer-no-duplication-policy
  type: custom
  severity: warning
  group: pointer_policy
  description: Pointer files should not duplicate full policy or architecture content.
  fix_auto: false
  fix_instruction: Remove detailed policy content and link to 'CLAUDE.md' or 'docs/'
    instead.
  script: ../../../scripts/core/text_pattern_scanner.py
  args:
  - --pattern
  - (Governance|Full Policy|Architecture Overview)
  - --match
  - present
  - --include
  - .github/copilot-instructions.md
  - --include
  - .gemini/styleguide.md
  - --include
  - .cursor/rules/flext.mdc
  - --include
  - .clinerules
  - --include
  - .windsurfrules
  - --include
  - .continue/rules/flext.md
  - --include
  - CONVENTIONS.md
  - --include
  - codex.md
baseline:
  strategy: total
