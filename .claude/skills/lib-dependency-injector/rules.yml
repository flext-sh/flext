skill: lib-dependency-injector
description: Prevent direct dependency_injector imports outside flext-core bridge modules.
scan_targets:
  include:
    - "**/*.py"
  exclude: []
  projects:
    - flext-oud-mig
    - flext-api
    - flext-auth
    - flext-cli
    - flext-db-oracle
    - flext-dbt-ldap
    - flext-dbt-ldif
    - flext-dbt-oracle
    - flext-dbt-oracle-wms
    - flext-grpc
    - flext-ldap
    - flext-ldif
    - flext-meltano
    - flext-observability
    - flext-oracle-oic
    - flext-oracle-wms
    - flext-plugin
    - flext-quality
    - flext-tap-ldap
    - flext-tap-ldif
    - flext-tap-oracle
    - flext-tap-oracle-oic
    - flext-tap-oracle-wms
    - flext-target-ldap
    - flext-target-ldif
    - flext-target-oracle
    - flext-target-oracle-oic
    - flext-target-oracle-wms
    - flext-web
    - flext-meltano-native
rules:
  - id: ban-direct-di-import
    type: ast-grep
    severity: error
    group: di_bridge
    description: Direct dependency_injector imports are banned outside flext-core bridge files.
    fix_auto: false
    fix_instruction: Use FlextContainer/FlextRuntime bridge APIs instead of importing dependency_injector directly.
    file: rules/ban-direct-di-import.yml
baseline:
  strategy: total
