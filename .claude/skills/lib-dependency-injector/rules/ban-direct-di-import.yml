id: ban-direct-di-import
language: python
rule:
  any:
    - kind: import_statement
      has:
        kind: dotted_name
        regex: "^dependency_injector"
        stopBy: end
    - kind: import_from_statement
      has:
        kind: dotted_name
        field: module_name
        regex: "^dependency_injector"
message: "Direct dependency_injector import banned - use flext_core DI bridge"
severity: error
