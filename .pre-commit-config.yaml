repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      # - id: check-yaml
      #  exclude: ^.*mkdocs\.yml$
      - id: check-added-large-files
      - id: check-ast
      - id: check-toml
      - id: check-json
      - id: debug-statements

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort (python)

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        language_version: python3.13

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [types-requests]
        language_version: python3.13

  # Add complexity checking
  - repo: local
    hooks:
      - id: complexity-check
        name: Check code complexity
        entry: python -m scripts.utils.complexity_check
        language: system
        files: '^src/.*\.py$'
        pass_filenames: true

      - id: duplicate-code-check
        name: Check for duplicate code
        entry: python -m scripts.utils.duplicate_check
        language: system
        files: '^src/.*\.py$'
        pass_filenames: false

      - id: parameter-count-check
        name: Check parameter counts
        entry: python -m scripts.utils.parameter_check
        language: system
        files: '^src/.*\.py$'
        pass_filenames: true
