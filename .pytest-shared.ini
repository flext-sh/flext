# FLEXT Workspace Shared Pytest Configuration
# Professional Python Testing Standards
# Used by all subprojects - DO NOT MODIFY without workspace coordination

[tool:pytest]
minversion = "8.0"
asyncio_mode = "auto"
python_paths = ["src"]

# Standard testing options for all FLEXT projects
addopts = [
    "-ra",                              # Show extra test summary info for all except passes
    "--strict-markers",                 # Require all markers to be defined
    "--strict-config",                  # Require all config options to be valid
    "--cov-branch",                     # Enable branch coverage measurement
    "--cov-report=term-missing:skip-covered",  # Terminal report skipping covered lines
    "--cov-report=html:reports/coverage",      # HTML coverage report
    "--cov-report=xml:reports/coverage.xml",   # XML coverage report for CI/CD
    "--cov-fail-under=90",              # Enterprise standard: 90% minimum coverage
    "--maxfail=1",                      # Stop after first failure (fast feedback)
    "--tb=short",                       # Shorter traceback format
    "--strict-config",                  # Enforce strict configuration
    "--disable-warnings",               # Reduce noise in test output
    "--color=yes",                      # Colored output for better readability
]

# Standard test paths
testpaths = ["tests"]

# Standard test markers for all FLEXT projects
markers = [
    "unit: Unit tests - fast, isolated tests",
    "integration: Integration tests - tests with external dependencies", 
    "slow: Slow tests - tests that take significant time",
    "smoke: Smoke tests - quick sanity checks",
    "e2e: End-to-end tests - full system tests",
    "oracle: Oracle database tests - require Oracle connection",
    "ldap: LDAP tests - require LDAP server",
    "redis: Redis tests - require Redis server",
    "postgres: PostgreSQL tests - require PostgreSQL connection",
    "tap: Singer tap tests - data extraction tests",
    "target: Singer target tests - data loading tests", 
    "dbt: dbt transformation tests - require dbt environment",
    "meltano: Meltano tests - require Meltano environment",
    "performance: Performance tests - measure execution time",
    "security: Security tests - vulnerability and security checks",
    "cleanup: Cleanup tests - test cleanup procedures",
    "network: Network tests - require network connectivity",
    "requires_auth: Tests requiring authentication",
    "requires_REDACTED_LDAP_BIND_PASSWORD: Tests requiring REDACTED_LDAP_BIND_PASSWORD privileges",
]

# Warning filters - suppress known warnings
filterwarnings = [
    "error",                           # Treat warnings as errors by default
    "ignore::UserWarning",             # Ignore user warnings
    "ignore::DeprecationWarning",      # Ignore deprecation warnings
    "ignore::PendingDeprecationWarning", # Ignore pending deprecation warnings
    "ignore::ResourceWarning",         # Ignore resource warnings
    # Specific library warnings to ignore
    "ignore:.*imp module.*:DeprecationWarning",
    "ignore:.*distutils.*:DeprecationWarning",
    "ignore:.*pkg_resources.*:DeprecationWarning",
]

# Logging configuration for tests
log_cli = false                        # Don't show logs during test runs by default
log_cli_level = "INFO"                 # Log level when log_cli is enabled
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

# Test discovery patterns
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# Minimum Python version for tests
minversion = "8.0"

# Timeout configuration (prevent hanging tests)
timeout = 300                          # 5 minutes max per test
timeout_method = "thread"              # Use thread-based timeout

# Parallel execution configuration
# Enable with: pytest -n auto
# Requires pytest-xdist plugin