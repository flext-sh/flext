[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[project]
name = "flx-adapter-example"
description = "FLX Adapter Example - Template for creating FLX bidirectional plugins"
dynamic = ["version"]
authors = [{name = "Marlon Costa", email = "marlon.costa@datacosmos.com.br"}]
readme = "README.md"
requires-python = ">=3.13,<3.15"
license = {text = "MIT"}
keywords = ["flx", "adapter", "plugin", "template", "example"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# ═══════════════════════════════════════════════════════════════════════════════
# COMPLETE INDEPENDENT DEPENDENCIES - Example adapter can work standalone
# ═══════════════════════════════════════════════════════════════════════════════
dependencies = [
    # Core FLX dependency (can be from PyPI or local development)
    "flx>=0.4.0",
    
    # Configuration
    "pydantic>=2.11.5",
    "pydantic-settings>=2.9.1",
    "python-dotenv>=1.1.0",
    
    # CLI utilities
    "typer>=0.9.0",
    "rich>=14.0.0",
    "click>=8.2.1",
    
    # Basic utilities
    "loguru>=0.7.3",
    "structlog>=25.4.0",
    
    # For example data processing
    "pyyaml>=6.0.2",
    "orjson>=3.10.13",
]

[project.urls]
Repository = "https://github.com/datacosmos-br/pyauto"
Documentation = "https://datacosmos-br.github.io/pyauto/"
"Bug Tracker" = "https://github.com/datacosmos-br/pyauto/issues"
Changelog = "https://github.com/datacosmos-br/pyauto/blob/main/CHANGELOG.md"

[project.scripts]
flx-adapter-example = "flx_adapter_example.cli:main"

[project.optional-dependencies]
# Development dependencies - everything needed for development
dev = [
    # Testing
    "pytest>=8.4.0",
    "pytest-asyncio<0.24.0",
    "pytest-cov>=6.1.1",
    "pytest-mock>=3.14.1",
    "pytest-xdist>=3.7.0",
    "pytest-benchmark>=4.0.0",
    "pytest-html>=4.1.1",
    "pytest-timeout>=2.4.0",
    "coverage[toml]>=7.8.2",
    
    # Code Quality
    "black>=25.1.0",
    "isort>=5.13.2",
    "ruff>=0.11.13",
    "autoflake>=2.2.1",
    "pyupgrade>=3.19.0",
    
    # Type Checking
    "mypy>=1.16.0",
    "types-python-dateutil>=2.9.0.20241206",
    "types-pyyaml>=6.0.12.20250516",
    "types-setuptools>=75.7.0.20250106",
    
    # Security & Quality
    "bandit>=1.8.0",
    "safety>=2.3.0",
    "vulture>=2.12",
    "pre-commit>=4.2.0",
    
    # Documentation
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.47",
]

[tool.poetry]
version = "0.1.0"  # Sync with src/flx_adapter_example/__version__.py
packages = [{include = "flx_adapter_example", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13,<3.15"
# IMPORTANT: Poetry dependencies left minimal for workspace compatibility
# All real dependencies in [project.dependencies] section above

[tool.poetry.group.dev.dependencies]
# Minimal dev dependencies for Poetry compatibility

# ═══════════════════════════════════════════════════════════════════════════════
# STANDARDIZED TOOL CONFIGURATIONS
# ═══════════════════════════════════════════════════════════════════════════════

[tool.black]
line-length = 88
target-version = ["py313"]
include = '\\.pyi?$'
extend-exclude = '''
/(
  __pycache__|
  .git|
  .mypy_cache|
  .pytest_cache|
  .ruff_cache|
  .venv|
  venv|
  build|
  dist|
  htmlcov|
  node_modules
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["flx_adapter_example", "flx"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
show_error_context = true
pretty = true

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "N", "B", "C4", "DTZ", "T20",
    "ISC", "PIE", "PT", "RET", "SIM", "ARG", "PL", "RUF"
]
ignore = [
    "E501",     # line too long (handled by formatter)
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "ARG001"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov-fail-under=85",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]