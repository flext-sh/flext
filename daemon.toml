# FLX Daemon Configuration File
# This file configures the FLX daemon service

[daemon]
# Network configuration
host = "0.0.0.0"          # Host to bind servers
port = 8000               # API server port
web_port = 8080           # Web interface port
web_enabled = true        # Enable web interface

# Process management (for production)
# pid_file = "/var/run/flx/flx.pid"
# work_dir = "/var/lib/flx"
# log_dir = "/var/log/flx"

# Development settings (uncomment for dev)
pid_file = "/tmp/flx_daemon.pid"
work_dir = "/tmp/flx_daemon"
log_dir = "/tmp/flx_daemon/logs"

# Worker configuration
workers = 1               # Number of worker processes

# Monitoring
health_check_interval = 30    # Health check interval (seconds)
max_memory_mb = 512          # Maximum memory usage (MB)
max_cpu_percent = 80.0       # Maximum CPU usage (%)

# Security
# api_key = "your-secret-api-key"  # Uncomment to enable API authentication
allowed_hosts = ["localhost", "127.0.0.1", "0.0.0.0"]

# Auto-restart configuration
auto_restart = true          # Auto-restart on failure
restart_delay = 5           # Delay before restart (seconds)
max_restart_attempts = 3    # Maximum restart attempts