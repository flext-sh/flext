# Beads Configuration File
# This file configures default behavior for all bd commands in this repository
# All settings can also be set via environment variables (BD_* prefix)
# or overridden with command-line flags

# Issue prefix for this repository (used by bd init)
# If not set, bd init will auto-detect from directory name
# Example: issue-prefix: "myproject" creates issues like "myproject-1", "myproject-2", etc.
issue-prefix: "mro"

# Dolt is the live coordination database. JSONL is export/import material only.
dolt:
  mode: server
  shared-server: true
  host: 127.0.0.1
  port: 3308
  user: root
  database: mro
  auto-commit: off

# Shared-server backups are explicit to avoid a backup sync on every bd command.
backup:
  enabled: false

# Enable JSON output by default
# json: false

# Default actor for audit trails (overridden by BD_ACTOR or --actor)
# actor: ""

# Durable coordination uses Dolt shared-server plus bd backup commands.
# Legacy SQLite/no-db/daemon sync settings are intentionally not used here.
# Health checks: bd dolt show, bd dolt status, bd backup status --json.
# Publication/recovery: bd backup sync and configured bd dolt remotes.

# Multi-repo coordination stays per-repository; link beads across repos with labels,
# dependencies, and reports instead of hydrating multiple JSONL sources into one DB.
# repos:
#   primary: "."  # Primary repo (where this database lives)
#   additional:   # Additional repos to hydrate from (read-only)
#     - ~/beads-planning  # Personal planning repo
#     - ~/work-planning   # Work planning repo

# Integration settings (access with 'bd config get/set')
# These are stored in the database, not in this file:
# - jira.url
# - jira.project
# - linear.url
# - linear.api-key
# - github.org
# - github.repo

dolt.database: "mro"

sync.remote: "git+https://github.com/flext-sh/flext.git"
