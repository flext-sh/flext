[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flext-tools"
version = "0.9.0"
description = "FLEXT Development Tools and Utilities - Administrative and tooling support for FLEXT ecosystem"
authors = ["FLEXT Team <flext@company.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/company/flext"
repository = "https://github.com/company/flext"
documentation = "https://flext.readthedocs.io"
keywords = ["data-integration", "etl", "tools", "utilities", "development"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
]
packages = [{include = "flext_tools", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
flext-core = {path = "../flext-core", develop = true}

# Development and REDACTED_LDAP_BIND_PASSWORDistrative utilities
rich = "^13.7.0"
click = "^8.1.7"
pydantic = "^2.5.0"
typer = "^0.9.0"

# System monitoring and backup utilities
psutil = "^5.9.6"
watchdog = "^3.0.0"

# Code quality and analysis tools
ruff = "^0.1.8"
mypy = "^1.7.1"
pyrefly = "^1.0.0"
bandit = "^1.7.5"
pip-audit = "^2.6.1"

# Documentation generation
sphinx = "^7.2.6"
sphinx-rtd-theme = "^1.3.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
pytest-mock = "^3.12.0"
pytest-xdist = "^3.5.0"
pytest-asyncio = "^0.21.1"
pytest-benchmark = "^4.0.0"
pytest-watch = "^4.2.0"
pytest-html = "^4.1.1"
pytest-env = "^1.1.1"
coverage = "^7.3.2"
pre-commit = "^3.6.0"
tox = "^4.11.4"
black = "^23.11.0"
isort = "^5.12.0"
flake8 = "^6.1.0"
jupyter = "^1.0.0"
ipykernel = "^6.27.1"

[tool.poetry.group.test.dependencies]
factory-boy = "^3.3.0"
faker = "^20.1.0"
freezegun = "^1.2.2"
responses = "^0.24.1"
httpx = "^0.25.2"
pytest-docker = "^2.0.1"

[tool.poetry.scripts]
flext-tools = "flext_tools.cli:main"
flext-backup = "flext_tools.backup:main"
flext-monitor = "flext_tools.monitoring:main"
flext-quality = "flext_tools.quality:main"

# ============================================================================
# TOOL CONFIGURATION
# ============================================================================

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=flext_tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=75",
]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "performance: marks tests as performance tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/conftest.py",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py313"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",   # line too long, handled by black
    "B008",   # do not perform function calls in argument defaults
    "B006",   # do not use mutable data structures for argument defaults
    "C901",   # too complex
    "TRY003", # avoid specifying long messages outside the exception class
]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]

[tool.ruff.per-file-ignores]
"tests/**/*" = ["PLR2004", "S101", "TID252"]
"__init__.py" = ["F401"]

[tool.ruff.mccabe]
max-complexity = 10

[tool.ruff.isort]
known-first-party = ["flext_tools", "flext_core"]
force-sort-within-sections = true
split-on-trailing-comma = true

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
no_implicit_reexport = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "flext_tools.*",
]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
disallow_untyped_defs = false
check_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
tests = ["B201", "B301", "B318", "B322", "B324", "B602", "B604"]

[tool.bandit.assert_used]
skips = ["*_test.py", "*/test_*.py"]

[tool.black]
line-length = 88
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88
known_first_party = ["flext_tools", "flext_core"]
skip = [".gitignore", ".dockerignore"]
extend_skip = ["migrations"]