version: 1
default_environment: dev
project_id: gruponos-meltano-native

environments:
- name: dev

plugins:
  extractors:
  - name: tap-oracle-wms
    namespace: tap_oracle_wms_custom
    executable: ./meltano_tap_wrapper.py
    capabilities:
    - discover
    - catalog
    - properties  
    - state
    config:
      base_url: $TAP_ORACLE_WMS_BASE_URL
      username: $TAP_ORACLE_WMS_USERNAME
      password: $TAP_ORACLE_WMS_PASSWORD
      page_size: 1000
      request_timeout: 7200
      enable_incremental: true
      entities:
      - allocation
      - order_hdr
      - order_dtl
      company_code: "*"
      facility_code: "*"

  loaders:
  - name: target-oracle
    namespace: target_oracle_advanced
    executable: ./oracle_target_wrapper.py
    config:
      # Connection settings
      host: $DATABASE__HOST
      port: $DATABASE__PORT
      service_name: $DATABASE__SERVICE_NAME
      username: $DATABASE__USERNAME
      password: $DATABASE__PASSWORD
      schema: $DATABASE__SCHEMA
      protocol: $DATABASE__PROTOCOL
      
      # Performance settings  
      batch_size: 1000
      max_workers: 4
      pool_size: 5
      pool_recycle: 3600
      connection_timeout: 30
      
      # Advanced features
      use_bulk_insert: true
      parallel_degree: 4
      enable_performance_metrics: true
      add_record_metadata: true
      ignore_duplicate_keys: true
      max_retries: 3
      retry_delay: 1.0

jobs:
- name: allocation-full-sync
  tasks:
  - tap-oracle-wms target-oracle
  
- name: allocation-incremental-sync
  tasks:
  - tap-oracle-wms target-oracle

- name: order-hdr-full-sync  
  tasks:
  - tap-oracle-wms target-oracle
  
- name: order-hdr-incremental-sync
  tasks:
  - tap-oracle-wms target-oracle

- name: order-dtl-full-sync
  tasks:
  - tap-oracle-wms target-oracle
  
- name: order-dtl-incremental-sync
  tasks:
  - tap-oracle-wms target-oracle

schedules:
- name: allocation-full-schedule
  job: allocation-full-sync
  interval: '0 0 * * 0'  # Weekly on Sunday at midnight
  
- name: allocation-incremental-schedule
  job: allocation-incremental-sync  
  interval: '*/1 * * * *'  # Every minute
  
- name: order-hdr-full-schedule
  job: order-hdr-full-sync
  interval: '0 1 * * 0'  # Weekly on Sunday at 1 AM
  
- name: order-hdr-incremental-schedule
  job: order-hdr-incremental-sync
  interval: '*/1 * * * *'  # Every minute
  
- name: order-dtl-full-schedule
  job: order-dtl-full-sync
  interval: '0 2 * * 0'  # Weekly on Sunday at 2 AM
  
- name: order-dtl-incremental-schedule
  job: order-dtl-incremental-sync
  interval: '*/1 * * * *'  # Every minute