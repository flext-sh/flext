[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flx"
version = "0.4.0"
description = "Enterprise-grade Python framework implementing Hexagonal Architecture"
authors = ["FLX Team"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/flx/flx"
repository = "https://github.com/flx/flx"
documentation = "https://flx.readthedocs.io"
keywords = [
    "hexagonal",
    "architecture",
    "ddd",
    "ports",
    "adapters",
    "enterprise",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
packages = [{ include = "flx", from = "src" }]

[tool.poetry.dependencies]
python = "^3.13"
pydantic = "^2.11.5"
pydantic-settings = "^2.9.1"
pluggy = "^1.6.0"
cyclopts = "^3.17.0"
pyyaml = "^6.0.2"
structlog = "^25.4.0"
python-dotenv = "^1.1.0"
anyio = "^4.9.0"
attrs = "^25.3.0"
redis = "^6.2.0"
tenacity = "^9.1.2"
python-json-logger = "^3.3.0"
opentelemetry-api = "^1.34.0"
opentelemetry-sdk = "^1.34.0"
opentelemetry-instrumentation = "^0.55b0"
lato = "^0.12.0"
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
rich = "^14.0.0"
aiohttp = "^3.12.11"
aiosqlite = "^0.21.0"
pyjwt = "^2.10.1"

[tool.poetry.dependencies.dramatiq]
extras = ["redis", "watch"]
version = "^1.18.0"

[tool.poetry.dependencies.httpx]
extras = ["brotli", "http2", "socks", "zstd"]
version = "^0.28.1"

[tool.poetry.dependencies.twisted]
extras = ["tls"]
version = "^25.5.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "<0.24.0"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
pytest-timeout = "^2.4.0"
pytest-xdist = "^3.7.0"
mypy = "^1.16.0"
ruff = "^0.11.13"
isort = "<6"
black = "^25.1.0"
pytest-html = "^4.1.1"
types-sqlalchemy = "^1.4.53.38"
types-pyyaml = "^6.0.12.20250516"
types-redis = "^4.6.0.20240903"
types-requests = "^2.32.0.20241016"
types-setuptools = "^75.7.0.20250106"
types-python-dateutil = "^2.9.0.20241206"
pre-commit = "^4.2.0"
pytest-tornasync = "^0.6.0.post2"
pytest-trio = "^0.8.0"
pytest-twisted = "^1.14.3"

[tool.poetry.group.dev.dependencies.coverage]
extras = ["toml"]
version = "^7.8.2"

[tool.poetry.scripts]
flx = "flx.cli.main:app"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__main__.py",
    "*/legacy/*",
    "**/legacy/**",
    "**/*legacy*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*Protocol:",
    "@abstract",
    "@overload",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src/flx",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--junitxml=reports/junit.xml",
    "-n=auto",
    "--ignore=legacy",
    "--ignore=**/legacy",
]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["legacy", "*/legacy/*", "**/legacy/**"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks tests as end-to-end tests",
    "unit: marks tests as unit tests",
    "hexarch: marks tests as hexagonal architecture tests",
    "ports: marks tests for port interfaces",
    "adapters: marks tests for adapter implementations",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool."ruff.lint"]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "G",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "BLE",
    "COM",
]
ignore = [
    "E501",
    "UP007",
    "BLE001",
    "G004",
    "DTZ007",
    "TRY003",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "TRY401",
]

[tool."ruff.lint.per-file-ignores"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "TID252", "ARG", "FBT"]
"scripts/**/*.py" = ["T20", "S101", "PLR2004"]

[tool."pytest.ini_options"]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--junitxml=reports/junit.xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool."coverage.run"]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__main__.py", "*/conftest.py"]

[tool."coverage.report"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
