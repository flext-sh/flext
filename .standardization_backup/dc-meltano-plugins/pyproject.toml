[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "dc-meltano-plugins"
version = "0.1.0"
description = "Data Cosmos Meltano plugins for Oracle Integration Cloud and WMS"
authors = ["datacosmos-br <dev@datacosmos.com.br>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.3"
python-dotenv = "^1.1.0"
paramiko = "^3.3.1"
oracledb = "^2.5.0"
pydantic = "^2.11.5"
structlog = "^25.4.0"

[tool.poetry.dependencies.meltano]
version = "^3.7.6"
python = "~3.13"

[tool.poetry.dependencies.singer-sdk]
version = "^0.46.3"
python = "~3.13"

[tool.poetry.dependencies.pytest]
version = "^8.4.0"
optional = true

[tool.poetry.dependencies.pytest-cov]
version = "^6.1.1"
optional = true

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.11.13"
isort = "<6"
mypy = "^1.16.0"
pytest = "^8.4.0"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.1"
pytest-asyncio = "<0.24.0"
pre-commit = "^4.2.0"

[tool.poetry.extras]
test = ["pytest", "pytest-cov"]

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
addopts = "--cov=. --cov-report=term-missing --verbose --tb=short --color=yes"

[tool."ruff.lint"]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "G",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "BLE",
    "COM",
]
ignore = [
    "E501",
    "UP007",
    "BLE001",
    "G004",
    "DTZ007",
    "TRY003",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "TRY401",
]

[tool."ruff.lint.per-file-ignores"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "TID252", "ARG", "FBT"]
"scripts/**/*.py" = ["T20", "S101", "PLR2004"]

[tool."pytest.ini_options"]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--junitxml=reports/junit.xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool."coverage.run"]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__main__.py", "*/conftest.py"]

[tool."coverage.report"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
