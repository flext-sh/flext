[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flx-http-oracle-oic"
version = "0.4.0"
description = "HTTP client and FLX plugin for Oracle Integration Cloud with OAuth2/JWT authentication"
authors = ["FlxHttp Oracle OIC Team <team@example.com>"]
license = "MIT"
packages = [{ include = "flx_http_oracle_oic", from = "src" }]
repository = "https://github.com/datacosmos-br/flx-http-oracle-oic"
documentation = "https://datacosmos-br.github.io/flx-http-oracle-oic/"
keywords = ["oracle", "oic", "integration", "cloud", "http", "flx", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

[tool.poetry.dependencies]
python = "^3.13"
PyJWT = "^2.8.0"
cryptography = "^43.0.0"
pandas = "^2.2.0"
tabulate = "^0.9.0"
openpyxl = "^3.1.0"
pyarrow = "^18.0.0"
lxml = "^5.3.0"
xmltodict = "^0.13.0"
click = "^8.2.1"

[tool.poetry.dependencies.flx]
path = "../flx"
develop = true

[tool.poetry.group.dev.dependencies]
pytest = "^8.4.0"
pytest-asyncio = "<0.24.0"
pytest-cov = "^6.1.1"
pytest-xdist = "^3.7.0"
pytest-mock = "^3.14.1"
mypy = "^1.16.0"
types-requests = "^2.32.0.20241016"
ruff = "^0.11.13"
bandit = "^1.8.0"
vulture = "^2.12"
pre-commit = "^4.2.0"
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
pytest-benchmark = "^4.0.0"
black = "^25.1.0"
isort = "<6"

[tool.poetry.scripts]
flx-oic = "flx_http_oracle_oic.oic_cli:sync_main"
oracle-oic-cli = "flx_http_oracle_oic.oic_cli:sync_main"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/datacosmos-br/flx-http-oracle-oic/issues"
Changelog = "https://github.com/datacosmos-br/flx-http-oracle-oic/blob/main/CHANGELOG.md"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src/flx_http_oracle_oic",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--cov-fail-under=30",
    "--junitxml=reports/pytest/junit.xml",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests requiring real environment",
    "slow: Slow tests",
    "record: Tests that record API responses for mockup creation",
    "oic: OIC-specific tests",
    "http: HTTP-related tests",
    "auth: Authentication tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__main__.py",
    "*/conftest.py",
    "*/cli/*",
    "*/__version__.py",
    "*/auth.py",
    "*/exceptions.py",
    "*/factory.py",
    "*/models.py",
    "*/service.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool."ruff.lint"]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "G",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "BLE",
    "COM",
]
ignore = [
    "E501",
    "UP007",
    "BLE001",
    "G004",
    "DTZ007",
    "TRY003",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "TRY401",
]

[tool."ruff.lint.per-file-ignores"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "TID252", "ARG", "FBT"]
"scripts/**/*.py" = ["T20", "S101", "PLR2004"]

[tool."pytest.ini_options"]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--junitxml=reports/junit.xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool."coverage.run"]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__main__.py", "*/conftest.py"]

[tool."coverage.report"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
