[tool.poetry]
name = "pyauto-workspace"
version = "0.1.0"
description = "Root workspace configuration for Python automation projects"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
requests = "^2.32.3"
httpx = "^0.28.1"
pydantic = "^2.11.4"
pydantic-settings = "^2.9.1"
pydantic-core = "^2.33.0"
python-dotenv = "^1.1.0"
rich = "^14.0.0"
structlog = "^25.3.0"
click = "^8.1.8"
responses = "^0.25.7"
tomli = "^2.2.1"
tomli-w = "^1.2.0"
dramatiq = "^1.17.0"
redis = "^5.0.8"
aio-pika = "^9.5.5"
celery = "^5.4.0"
jupyter = "^1.1.1"
ipykernel = "^6.29.5"
pandas = "^2.2.3"
numpy = "^2.2.1"
matplotlib = "^3.10.3"
seaborn = "^0.13.2"
plotly = "^5.24.1"
jsonschema = "^4.23.0"

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
isort = "<6"
mypy = "^1.15.0"
ruff = "^0.11.11"
pyupgrade = "^3.1.0"
pylint = "^3.3.7"
flake8 = "^6.0.0"
autoflake = "^2.2.1"
refurb = "^2.1.0"
bandit = "^1.8.3"
pytest = "^8.3.5"
pytest-cov = "^6.1.1"
pytest-mock = "^3.14.0"
httpx = "^0.28.1"
pipenv = "^2025.0.2"
monkeytype = "^23.3.0"
codebase-digest = "^0.1.43"
pdoc3 = "^0.11.6"
graphviz = "^0.20.3"
openai = "^1.82.0"
interrogate = "^1.7.0"
nuitka = "^2.7.4"
types-requests = "^2.32.0.20250602"
types-pyyaml = "^6.0.12.20250516"
types-setuptools = "^80.9.0.20250529"
types-toml = "^0.10.8.20240310"
types-ujson = "^5.10.0.20250326"
types-certifi = "^2021.10.8.3"
types-attrs = "^19.1.0"
types-six = "^1.17.0.20250515"
types-pytz = "^2025.2.0.20250516"
types-urllib3 = "^1.26.25.14"
sqlalchemy = "^2.0.41"
pytest-asyncio = "^0.24.0"
pre-commit = "^4.2.0"

[tool.poetry.group.dev.dependencies.docformatter]
extras = ["tomli"]
version = "^1.7.7"

[tool.poetry.group.scripts.dependencies]
typer = "^0.15.4"
pyyaml = "^6.0.2"
colorama = "^0.4.6"
tabulate = "^0.9.0"

[tool.poetry.scripts]
flx = "flx.adapters.ingoing.cli.cyclopts:main"

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

[tool."ruff.lint"]
select = [
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "B",
    "C4",
    "DTZ",
    "T10",
    "ISC",
    "G",
    "PIE",
    "PT",
    "RET",
    "SIM",
    "ARG",
    "ERA",
    "PGH",
    "PL",
    "TRY",
    "BLE",
    "COM",
]
ignore = [
    "E501",
    "UP007",
    "BLE001",
    "G004",
    "DTZ007",
    "TRY003",
    "PLR2004",
    "PLR0911",
    "PLR0912",
    "TRY401",
]

[tool."ruff.lint.per-file-ignores"]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "PLR2004", "TID252", "ARG", "FBT"]
"scripts/**/*.py" = ["T20", "S101", "PLR2004"]

[tool."pytest.ini_options"]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov-report=term-missing",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml",
    "--junitxml=reports/junit.xml",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool."coverage.run"]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*", "*/__main__.py", "*/conftest.py"]

[tool."coverage.report"]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[build-system]
requires = ["poetry-core>=2.1.3"]
build-backend = "poetry.core.masonry.api"
