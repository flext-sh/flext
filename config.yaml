# FLEXT Service Configuration
server:
  host: "0.0.0.0"
  port: 8081
  mode: "server"
  environment: "development"

database:
  driver: "memory" 
  host: "localhost"
  port: 5432
  database: "flext_dev"
  user: "flext"
  password: ""

features:
  database_enabled: false

redis:
  url: "redis://redis:6379/0"
  pool_size: 10

logging:
  level: "info"
  format: "json"

plugins:
  directory: "/var/lib/flext/plugins"
  
pipelines:
  workspace: "/var/lib/flext/pipelines"
  max_concurrent: 10

security:
  enable_auth: false
  jwt_secret: "dev-secret-change-in-production"