[tool.poetry]
name = "target-oracle-wms"
version = "1.0.0"
description = "Singer target for Oracle Warehouse Management System (WMS) - handles data loading and business logic transformations"
authors = ["PyAuto Team"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pyauto/target-oracle-wms"
documentation = "https://github.com/pyauto/target-oracle-wms#readme"
keywords = [
    "singer",
    "target",
    "oracle",
    "wms",
    "warehouse",
    "etl",
    "data-pipeline",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
singer-sdk = { path = "../meltano-sdk", develop = true }
pydantic = "^2.11"
python-dotenv = "^1.0.0"
requests = "^2.32.0"
httpx = ">=0.27.0"
typing-extensions = "^4.12.0"
pendulum = "^3.0.0"
sqlalchemy = "^2.0.36"
jsonschema = "^4.24.0"
structlog = "^21.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.24.0"
pytest-mock = "^3.14.0"
mypy = "^1.14.0"
black = "^24.10.0"
ruff = "^0.8.6"
isort = "^5.13.0"
pre-commit = "^4.0.0"
bandit = "^1.7.5"
safety = "^3.2.7"
vulture = "^2.13"
pycodestyle = "^2.12.1"
pydocstyle = "^6.3.0"
flake8 = "^7.1.1"
types-requests = "^2.32.0"
types-python-dateutil = "^2.9.0"
types-jsonschema = "^4.24.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
target-oracle-wms = "target_oracle_wms.__main__:main"


# PEP8 Strict Configuration

[tool.ruff]
line-length = 88                                                                 # PEP8 strict line length
target-version = "py39"
fix = true
extend-exclude = ["__pycache__", ".venv", ".git", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
ignore = [
    "N818",   # Allow Exceptions to have suffix 'Exception' rather than 'Error'
    "S310",   # Allow `urllib.open`
    "S603",   # Allow `subprocess.run(..., shell=False)`
    "COM812", # Handled by the Ruff formatter
    "ISC001", # Handled by the Ruff formatter
    "E501",   # Line too long - ignore for pragmatic development
    "D401",   # First line should be in imperative mood - too pedantic
    "D105",   # Missing docstring in magic method - unnecessary
    "D402",   # First line should not be the function's signature - pedantic
]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "COM",   # flake8-commas
    "D",     # pydocstyle/flake8-docstrings
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle (error)
    "EM",    # flake8-errmsg
    "ERA",   # flake8-eradicate
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle (warning)
    "YTT",   # flake8-2020
]
unfixable = [
    "ERA001", # Don't remove commented-out code
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002", "PLR0913", "PLR2004"]
"**/conftest.py" = ["ARG001", "ARG002"]
"**/*test*.py" = ["S101", "ARG001", "ARG002", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["target_oracle_wms"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.black]
line-length = 88                                              # PEP8 strict line length
target-version = ["py39", "py310", "py311", "py312", "py313"]
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["target_oracle_wms"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_single_line = false
lines_after_imports = 2
src_paths = ["src", "tests"]

[tool.mypy]
python_version = "3.9"
# Pragmatic MyPy - focus only on serious errors
strict = false
warn_return_any = false
warn_unused_configs = false
warn_redundant_casts = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_any_generics = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = false
warn_no_return = false
warn_unreachable = false
strict_equality = false
extra_checks = false
strict_concatenate = false
show_error_codes = true
ignore_missing_imports = true
# Ignore common "bobo" errors
disable_error_code = [
    "arg-type",
    "assignment",
    "call-arg",
    "attr-defined",
    "type-arg",
    "misc",
    "override",
    "operator",
    "return-value",
]

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_untyped_calls = false
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = "singer.*"
ignore_missing_imports = true

[tool.flake8]
# Ignore "bobo" lints - focus only on serious errors
ignore = [
    "E501",   # Line too long
    "W503",   # Line break before binary operator
    "E203",   # Whitespace before ':'
    "D401",   # First line should be in imperative mood
    "D105",   # Missing docstring in magic method
    "D402",   # First line should not be the function's signature
    "BLK100", # Black would make changes (formatting)
]
max-line-length = 120
max-complexity = 15
select = ["F", "E", "W", "C", "N"]
exclude = [".git", "__pycache__", ".venv", "build", "dist", "*.egg-info"]
