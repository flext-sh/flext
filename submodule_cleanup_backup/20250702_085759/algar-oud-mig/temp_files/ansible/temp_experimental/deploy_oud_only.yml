---
- name: Deploy OUD Only - Safe Deployment
  hosts: oud-srv1.ctbc.local
  become: true
  gather_facts: true

  vars:
    # Override to ensure no cleaning
    clean_deployment: false

  tasks:
    - name: Display safe deployment information
      ansible.builtin.debug:
        msg:
          - "======================================="
          - "OUD Safe Deployment Starting"
          - "======================================="
          - "Target Host: {{ inventory_hostname }}"
          - "Clean Deployment: {{ clean_deployment }}"
          - "Base DN: {{ oracle_oud_14_base_dn }}"
          - "Admin User: {{ oracle_oud_14_admin_user }}"
          - "Instances: {{ oracle_oud_14_instances | length }}"
          - "OUDSM: {{ oracle_oud_14_oudsm_enabled | default(false) }}"
          - "======================================"

    - name: Deploy OUD instances safely
      ansible.builtin.include_role:
        name: oracle_oud_14
      vars:
        # Force safe deployment
        clean_deployment: false
      tags:
        - oud
        - instances
        - never_clean

    - name: Display deployment completion
      ansible.builtin.debug:
        msg:
          - "======================================="
          - "OUD Safe Deployment Completed"
          - "======================================="
          - "OUD instances should be running"
          - "LDAP Port: {{ oracle_oud_14_instances[0].ldap_port }}"
          - "Admin Port: {{ oracle_oud_14_instances[0].admin_port }}"
          - ""
          - "Test LDAP connectivity:"
          - "ldapsearch -h {{ ansible_hostname }} -p {{ oracle_oud_14_instances[0].ldap_port }} -D '{{ oracle_oud_14_admin_user }}' -w '{{ oracle_oud_14_admin_password }}' -b '{{ oracle_oud_14_base_dn }}' -s base '(objectclass=*)'"
          - ""
          - "Check service status:"
          - "systemctl status oud@{{ oracle_oud_14_instances[0].name }}"
          - "======================================"
