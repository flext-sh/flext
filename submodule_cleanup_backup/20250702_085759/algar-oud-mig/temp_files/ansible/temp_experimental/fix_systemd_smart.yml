---
# Fix SystemD templates - Smart detection of same physical hosts
- name: Fix SystemD templates with smart host detection
  hosts: oud_cluster
  become: yes
  gather_facts: yes

  tasks:
    - name: Collect real hostname for all hosts
      ansible.builtin.shell: hostname
      register: real_hostname

    - name: Initialize physical hosts mapping
      ansible.builtin.set_fact:
        all_host_mappings: []
      delegate_to: localhost
      run_once: yes

    - name: Collect all host mappings
      ansible.builtin.set_fact:
        all_host_mappings: "{{ hostvars['localhost']['all_host_mappings'] + [{'host': inventory_hostname, 'physical': real_hostname.stdout}] }}"
      delegate_to: localhost

    - name: Build physical hosts grouping
      ansible.builtin.set_fact:
        physical_hosts: |
          {% set ns = namespace(result={}) %}
          {% for item in all_host_mappings %}
            {% if item.physical not in ns.result %}
              {% set _ = ns.result.update({item.physical: []}) %}
            {% endif %}
            {% set _ = ns.result[item.physical].append(item.host) %}
          {% endfor %}
          {{ ns.result }}
      delegate_to: localhost
      run_once: yes

    - name: Display physical host grouping
      ansible.builtin.debug:
        msg: "Physical hosts mapping: {{ hostvars['localhost']['physical_hosts'] }}"
      run_once: yes

    - name: Check if running on same physical host
      ansible.builtin.set_fact:
        same_physical_host: "{{ (hostvars['localhost']['physical_hosts'][real_hostname.stdout] | length) > 1 }}"

    - name: Display same host detection
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Physical: {{ real_hostname.stdout }}"
          - "Same physical host: {{ same_physical_host }}"
          - "All hosts on this server: {{ hostvars['localhost']['physical_hosts'][real_hostname.stdout] | default([]) }}"

- name: Apply SystemD fix for same physical hosts
  hosts: oud_cluster
  become: yes
  serial: 1  # Process one at a time when on same physical host

  tasks:
    - name: Stop ALL OUD services on this physical host first
      ansible.builtin.shell: |
        for service in $(systemctl list-units oud@*.service --all --no-pager | grep oud@ | awk '{print $1}'); do
          systemctl stop $service || true
        done
      when: same_physical_host | default(false)

    - name: Create host-specific SystemD template file
      ansible.builtin.template:
        src: roles/oracle_oud_14/templates/oud_systemd.service.j2
        dest: "/etc/systemd/system/oud-{{ inventory_hostname_short }}@.service"
        owner: root
        group: root
        mode: "0644"
        force: yes
      when: same_physical_host | default(false)

    - name: Deploy standard SystemD template
      ansible.builtin.template:
        src: roles/oracle_oud_14/templates/oud_systemd.service.j2
        dest: /etc/systemd/system/oud@.service
        owner: root
        group: root
        mode: "0644"
        force: yes
      when: not (same_physical_host | default(false))

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes

    - name: Enable and start host-specific service
      ansible.builtin.systemd:
        name: "oud-{{ inventory_hostname_short }}@{{ item.name }}"
        state: started
        enabled: yes
      loop: "{{ oracle_oud_14_instances }}"
      when:
        - same_physical_host | default(false)
        - item.enabled | default(true)

    - name: Enable and start standard service
      ansible.builtin.systemd:
        name: "oud@{{ item.name }}"
        state: started
        enabled: yes
      loop: "{{ oracle_oud_14_instances }}"
      when:
        - not (same_physical_host | default(false))
        - item.enabled | default(true)

    - name: Wait for services to be ready
      ansible.builtin.wait_for:
        port: "{{ item.ldap_port }}"
        host: localhost
        timeout: 30
      loop: "{{ oracle_oud_14_instances }}"
      when: item.enabled | default(true)

    - name: Verify service status
      ansible.builtin.shell: |
        if [[ "{{ same_physical_host }}" == "True" ]]; then
          systemctl status "oud-{{ inventory_hostname_short }}@{{ oracle_oud_14_instances[0].name }}" --no-pager | head -5
        else
          systemctl status "oud@{{ oracle_oud_14_instances[0].name }}" --no-pager | head -5
        fi
      register: final_status

    - name: Display final status
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Service: {% if same_physical_host %}oud-{{ inventory_hostname_short }}@{{ oracle_oud_14_instances[0].name }}{% else %}oud@{{ oracle_oud_14_instances[0].name }}{% endif %}"
          - "Status: {{ final_status.stdout_lines }}"
