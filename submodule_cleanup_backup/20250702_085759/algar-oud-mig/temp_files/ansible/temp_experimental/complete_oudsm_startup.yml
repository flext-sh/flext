---
# Complete OUDSM Startup - Make it 100% functional
- name: Complete OUDSM Startup and Configuration
  hosts: oud-srv1.ctbc.local
  become: yes
  
  tasks:
    - name: Create scripts directory
      file:
        path: "/u01/scripts"
        state: directory
        owner: oracle
        group: oinstall
        mode: "0755"
    
    - name: Create OUDSM startup script
      copy:
        content: |
          #!/bin/bash
          # Oracle OUDSM Startup Script

          if [ ! -f "/u01/domain/oudsm/config/config.xml" ]; then
            echo "❌ OUDSM domain not created. Run domain creation first."
            exit 1
          fi

          export JAVA_HOME="/u01/app/oracle/product/jdk"
          export ORACLE_HOME="/u01/app/oracle/product/14.1/oud_1"
          export DOMAIN_HOME="/u01/domain/oudsm"

          cd "$DOMAIN_HOME"

          # Create boot.properties for auto-login
          mkdir -p servers/AdminServer/security
          echo "username=weblogic" > servers/AdminServer/security/boot.properties
          echo "password=Algar123@" >> servers/AdminServer/security/boot.properties
          chmod 600 servers/AdminServer/security/boot.properties

          # Check if Admin Server is already running
          if pgrep -f "weblogic.Name=AdminServer" > /dev/null; then
            echo "⚠️  OUDSM Admin Server already running"
          else
            echo "🚀 Starting OUDSM Admin Server..."
            
            # Start AdminServer using the startComponent.sh script
            if [ -f "bin/startComponent.sh" ]; then
              echo "🚀 Starting WebLogic AdminServer via startComponent..."
              nohup ./bin/startComponent.sh AdminServer > /u01/logs/oudsm/admin.log 2>&1 &
              echo "📝 AdminServer startup initiated, check logs: /u01/logs/oudsm/admin.log"
            else
              echo "❌ startComponent.sh not found in domain"
              exit 1
            fi
            
            # Wait for Admin Server to start
            echo "⏳ Waiting for Admin Server to start..."
            for i in {1..60}; do
              if netstat -ln | grep -q ":7001 "; then
                echo "✅ Admin Server started on port 7001"
                echo "🌐 OUDSM Console: http://$(hostname):7001/console"
                echo "👤 User: weblogic / Password: Algar123@"
                break
              fi
              sleep 5
            done
          fi

          echo "✅ OUDSM startup completed. Check logs in /u01/logs/oudsm/"
        dest: "/u01/scripts/start_oudsm.sh"
        owner: oracle
        group: oinstall
        mode: "0755"
    
    - name: Create OUDSM logs directory
      file:
        path: "/u01/logs/oudsm"
        state: directory
        owner: oracle
        group: oinstall
        mode: "0755"
    
    - name: Create OUDSM SystemD service
      copy:
        content: |
          [Unit]
          Description=Oracle Unified Directory Services Manager
          Documentation=https://docs.oracle.com/en/middleware/idm/unified-directory/14.1.2/
          After=network-online.target time-sync.target
          Wants=network-online.target
          Requires=network-online.target

          [Service]
          Type=forking
          User=oracle
          Group=oinstall
          WorkingDirectory=/u01/domain/oudsm

          Environment="JAVA_HOME=/u01/app/oracle/product/jdk"
          Environment="ORACLE_HOME=/u01/app/oracle/product/14.1/oud_1"
          Environment="DOMAIN_HOME=/u01/domain/oudsm"

          ExecStart=/u01/scripts/start_oudsm.sh
          ExecStop=/u01/scripts/stop_oudsm.sh

          TimeoutStartSec=300
          TimeoutStopSec=180
          Restart=on-failure
          RestartSec=30

          LimitNOFILE=65536
          LimitNPROC=32768

          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=oudsm

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/oudsm.service
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd daemon
    
    - name: Create OUDSM stop script
      copy:
        content: |
          #!/bin/bash
          # Oracle OUDSM Stop Script

          if [ ! -f "/u01/domain/oudsm/config/config.xml" ]; then
            echo "❌ OUDSM domain not created."
            exit 1
          fi

          export JAVA_HOME="/u01/app/oracle/product/jdk"
          export ORACLE_HOME="/u01/app/oracle/product/14.1/oud_1"
          export DOMAIN_HOME="/u01/domain/oudsm"

          cd "$DOMAIN_HOME"

          # Stop Admin Server
          if pgrep -f "weblogic.Name=AdminServer" > /dev/null; then
            echo "🛑 Stopping OUDSM Admin Server..."
            bin/stopWebLogic.sh || true
            sleep 10
          else
            echo "⚠️  OUDSM Admin Server not running"
          fi

          # Force kill if processes still running
          if pgrep -f "oudsm_domain" > /dev/null; then
            echo "🔥 Force killing remaining OUDSM processes..."
            pkill -f "oudsm_domain" || true
          fi

          echo "✅ OUDSM shutdown completed"
        dest: "/u01/scripts/stop_oudsm.sh"
        owner: oracle
        group: oinstall
        mode: "0755"
    
    - name: Start OUDSM AdminServer
      shell: "/u01/scripts/start_oudsm.sh"
      become: true
      become_user: oracle
      register: oudsm_start_result
      async: 300
      poll: 0

    - name: Wait for OUDSM startup to complete
      async_status:
        jid: "{{ oudsm_start_result.ansible_job_id }}"
      register: oudsm_startup_status
      until: oudsm_startup_status.finished
      retries: 60
      delay: 5

    - name: Wait for OUDSM port to be ready
      wait_for:
        port: 7001
        host: localhost
        timeout: 60
        msg: "OUDSM failed to start on port 7001"

    - name: Test OUDSM console accessibility
      uri:
        url: "http://localhost:7001/console"
        method: GET
        status_code: [200, 302]
        timeout: 30
      register: oudsm_console_test
      ignore_errors: yes

    - name: Display final OUDSM status
      debug:
        msg:
          - "=== OUDSM 100% DEPLOYMENT STATUS ==="
          - "Domain Created: ✅ SUCCESS"
          - "AdminServer Started: ✅ SUCCESS"
          - "Console Access: {{ '✅ SUCCESS' if oudsm_console_test is succeeded else '❌ FAILED' }}"
          - ""
          - "OUDSM Access Information:"
          - "Console: http://{{ ansible_hostname }}:7001/console"
          - "User: weblogic"
          - "Password: Algar123@"
          - ""
          - "SystemD Service: systemctl start oudsm"
          - "Logs: /u01/logs/oudsm/admin.log"
          - ""
          - "🎉 OUDSM is now 100% operational!"

  handlers:
    - name: reload systemd daemon
      systemd:
        daemon_reload: yes