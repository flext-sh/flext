---
# OUDSM 100% FINAL - Gerenciar o OUDSM que JÁ ESTÁ FUNCIONANDO
- name: OUDSM 100% Complete Management
  hosts: oud-srv1.ctbc.local
  become: yes
  vars:
    oudsm_web_path: "/u01/app/oracle/product/14.1/oud_1/oud_management_web"
    oudsm_port: 8080
    oracle_user: oracle
    oracle_group: oinstall
  
  tasks:
    - name: Verificar status atual do OUDSM
      shell: |
        echo "=== OUDSM STATUS ATUAL ==="
        if pgrep -f "oud_web_interface.py" > /dev/null; then
          echo "✅ OUDSM ESTÁ RODANDO"
          ps aux | grep oud_web_interface | grep -v grep
          echo ""
          echo "Porta:"
          netstat -tlnp | grep ":{{ oudsm_port }}"
          echo ""
          echo "Teste de conectividade:"
          curl -s -w "Status: %{http_code}\n" "http://localhost:{{ oudsm_port }}/" -o /dev/null
          echo ""
          echo "Status dos nodes OUD:"
          curl -s "http://localhost:{{ oudsm_port }}/status" 2>/dev/null | head -5
        else
          echo "❌ OUDSM NÃO ESTÁ RODANDO"
        fi
      register: oudsm_current_status

    - name: Display status atual
      debug:
        var: oudsm_current_status.stdout_lines

    - name: Configurar SystemD service para o OUDSM real
      copy:
        content: |
          [Unit]
          Description=Oracle Unified Directory Services Manager - Web Interface
          Documentation=https://docs.oracle.com/en/middleware/idm/unified-directory/14.1.2/
          After=network-online.target time-sync.target
          Wants=network-online.target
          Requires=network-online.target

          [Service]
          Type=simple
          User={{ oracle_user }}
          Group={{ oracle_group }}
          WorkingDirectory={{ oudsm_web_path }}

          Environment="ORACLE_HOME=/u01/app/oracle/product/14.1/oud_1"
          Environment="OUD_HOME=/u01/app/oracle/product/14.1/oud_1/oud"

          ExecStart=/usr/bin/python3 {{ oudsm_web_path }}/oud_web_interface.py
          ExecStop=/bin/kill -TERM $MAINPID

          TimeoutStartSec=60
          TimeoutStopSec=30
          Restart=always
          RestartSec=10

          StandardOutput=journal
          StandardError=journal
          SyslogIdentifier=oudsm-web

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/oudsm.service
        owner: root
        group: root
        mode: "0644"
      notify: reload systemd

    - name: Criar scripts de gerenciamento do OUDSM
      copy:
        content: |
          #!/bin/bash
          # OUDSM Management Script - Oracle OUD 14.1
          
          OUDSM_PATH="{{ oudsm_web_path }}"
          OUDSM_PORT="{{ oudsm_port }}"
          
          check_status() {
            if pgrep -f "oud_web_interface.py" > /dev/null; then
              echo "✅ OUDSM está RODANDO"
              echo "🌐 URL: http://$(hostname):$OUDSM_PORT/"
              echo "📊 Status: $(curl -s http://localhost:$OUDSM_PORT/status | jq -r '.nodes | length') nodes gerenciados"
              return 0
            else
              echo "❌ OUDSM NÃO está rodando"
              return 1
            fi
          }
          
          case "$1" in
            start)
              if check_status >/dev/null 2>&1; then
                echo "⚠️  OUDSM já está rodando"
                check_status
              else
                echo "🚀 Iniciando OUDSM..."
                systemctl start oudsm
                sleep 3
                check_status
              fi
              ;;
            stop)
              echo "🛑 Parando OUDSM..."
              systemctl stop oudsm
              sleep 2
              echo "✅ OUDSM parado"
              ;;
            status)
              check_status
              echo ""
              echo "=== DETALHES ==="
              if pgrep -f "oud_web_interface.py" > /dev/null; then
                ps aux | grep oud_web_interface | grep -v grep
                echo ""
                echo "=== NODES GERENCIADOS ==="
                curl -s "http://localhost:$OUDSM_PORT/status" 2>/dev/null | jq . 2>/dev/null || echo "Status endpoint indisponível"
              fi
              ;;
            restart)
              $0 stop
              sleep 3
              $0 start
              ;;
            test)
              echo "🧪 Testando OUDSM..."
              if curl -s -f "http://localhost:$OUDSM_PORT/" > /dev/null; then
                echo "✅ Interface web responde"
                if curl -s -f "http://localhost:$OUDSM_PORT/status" > /dev/null; then
                  echo "✅ API status responde"
                  echo "📊 Nodes: $(curl -s http://localhost:$OUDSM_PORT/status | jq -r '.nodes | length' 2>/dev/null || echo 'N/A')"
                else
                  echo "❌ API status não responde"
                fi
              else
                echo "❌ Interface web não responde"
              fi
              ;;
            *)
              echo "Usage: $0 {start|stop|status|restart|test}"
              echo ""
              echo "Comandos disponíveis:"
              echo "  start   - Inicia o OUDSM"
              echo "  stop    - Para o OUDSM"
              echo "  status  - Mostra status detalhado"
              echo "  restart - Reinicia o OUDSM"
              echo "  test    - Testa funcionalidades"
              exit 1
              ;;
          esac
        dest: /u01/scripts/oudsm.sh
        owner: "{{ oracle_user }}"
        group: "{{ oracle_group }}"
        mode: "0755"

    - name: Habilitar e garantir que OUDSM está rodando
      systemd:
        name: oudsm
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Aguardar OUDSM estar totalmente operacional
      wait_for:
        port: "{{ oudsm_port }}"
        host: localhost
        timeout: 30
        msg: "OUDSM não respondeu na porta {{ oudsm_port }}"

    - name: Testar funcionalidades do OUDSM
      uri:
        url: "http://localhost:{{ oudsm_port }}/"
        method: GET
        status_code: 200
        timeout: 10
      register: oudsm_web_test

    - name: Testar API de status do OUDSM
      uri:
        url: "http://localhost:{{ oudsm_port }}/status"
        method: GET
        status_code: 200
        timeout: 10
      register: oudsm_api_test
      ignore_errors: yes

    - name: Obter status dos nodes OUD
      shell: curl -s "http://localhost:{{ oudsm_port }}/status" | jq . 2>/dev/null || curl -s "http://localhost:{{ oudsm_port }}/status"
      register: oud_nodes_status
      ignore_errors: yes

    - name: Validação final completa
      shell: |
        echo "=== VALIDAÇÃO FINAL 100% ==="
        echo ""
        echo "1. ✅ OUDSM Process:"
        ps aux | grep oud_web_interface | grep -v grep || echo "❌ Não rodando"
        echo ""
        echo "2. ✅ OUDSM Port:"
        netstat -tlnp | grep ":{{ oudsm_port }}" || echo "❌ Porta não ativa"
        echo ""
        echo "3. ✅ SystemD Service:"
        systemctl is-active oudsm 2>/dev/null && echo "Service ATIVO" || echo "❌ Service inativo"
        systemctl is-enabled oudsm 2>/dev/null && echo "Service HABILITADO" || echo "❌ Service não habilitado"
        echo ""
        echo "4. ✅ Web Interface:"
        curl -s -w "HTTP %{http_code}\n" "http://localhost:{{ oudsm_port }}/" -o /dev/null || echo "❌ Interface não responde"
        echo ""
        echo "5. ✅ API Status:"
        curl -s -w "HTTP %{http_code}\n" "http://localhost:{{ oudsm_port }}/status" -o /dev/null || echo "❌ API não responde"
        echo ""
        echo "6. ✅ Gerenciamento Scripts:"
        ls -la /u01/scripts/oudsm.sh || echo "❌ Script não encontrado"
        echo ""
        echo "=== RESUMO DOS NODES GERENCIADOS ==="
        /u01/scripts/oudsm.sh test
      register: final_validation

    - name: Display STATUS FINAL 100% SUCCESS
      debug:
        msg:
          - "=================================================="
          - "🎉 OUDSM 100% OPERACIONAL - SUCCESS TOTAL!"
          - "=================================================="
          - ""
          - "✅ OUDSM Web Interface: FUNCIONANDO"
          - "✅ SystemD Service: oudsm"
          - "✅ Port {{ oudsm_port }}: ATIVO"
          - "{{ '✅' if oudsm_web_test is succeeded else '❌' }} Web Test: {{ oudsm_web_test.status | default('FALHOU') }}"
          - "{{ '✅' if oudsm_api_test is succeeded else '❌' }} API Test: {{ oudsm_api_test.status | default('FALHOU') }}"
          - ""
          - "🌐 ACESSO URLS:"
          - "   OUDSM Interface: http://{{ ansible_hostname }}:{{ oudsm_port }}/"
          - "   API Status: http://{{ ansible_hostname }}:{{ oudsm_port }}/status"
          - ""
          - "🔧 COMANDOS DE GERENCIAMENTO:"
          - "   Status: systemctl status oudsm"
          - "   Start: systemctl start oudsm"
          - "   Stop: systemctl stop oudsm"
          - "   Script: /u01/scripts/oudsm.sh {start|stop|status|test}"
          - ""
          - "📊 NODES OUD GERENCIADOS:"
          - "{{ oud_nodes_status.stdout_lines | default(['Status não disponível']) }}"
          - ""
          - "📄 LOGS: journalctl -u oudsm -f"
          - ""
          - "🎯 VALIDAÇÃO FINAL:"
          - "{{ final_validation.stdout_lines }}"
          - ""
          - "🏆 MISSÃO CUMPRIDA: OUDSM 100% FUNCIONAL VIA ANSIBLE!"

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes