---
# Fix WebLogic OUDSM using modular structure
- name: Fix WebLogic OUDSM with Modular Structure
  hosts: oud-srv1.ctbc.local
  become: yes

  tasks:
    - name: Create WebLogic startup script using modular approach
      copy:
        content: |
          #!/bin/bash
          cd /u01/domain/oudsm

          export JAVA_HOME=/u01/app/oracle/product/jdk
          export ORACLE_HOME=/u01/app/oracle/product/14.1/oud_1
          export DOMAIN_HOME=/u01/domain/oudsm
          export WEBLOGIC_HOME=$ORACLE_HOME/wlserver

          # Build complete CLASSPATH for WebLogic 14.1 modular structure
          WEBLOGIC_CLASSPATH=""
          WEBLOGIC_CLASSPATH="$WEBLOGIC_CLASSPATH:$WEBLOGIC_HOME/server/lib/weblogic-launcher.jar"
          WEBLOGIC_CLASSPATH="$WEBLOGIC_CLASSPATH:$WEBLOGIC_HOME/server/lib/wls-api-part.jar"

          # Add all modules
          for jar in $WEBLOGIC_HOME/modules/*.jar; do
            if [ -f "$jar" ]; then
              WEBLOGIC_CLASSPATH="$WEBLOGIC_CLASSPATH:$jar"
            fi
          done

          export CLASSPATH=$WEBLOGIC_CLASSPATH

          # Create boot.properties
          mkdir -p servers/AdminServer/security
          if [ ! -f "servers/AdminServer/security/boot.properties" ]; then
            echo "username=weblogic" > servers/AdminServer/security/boot.properties
            echo "password=Algar123@" >> servers/AdminServer/security/boot.properties
            chmod 600 servers/AdminServer/security/boot.properties
          fi

          echo "Starting WebLogic AdminServer with modular classpath..."

          # Use WebLogic launcher instead of direct Server class
          $JAVA_HOME/bin/java -server \
            -Xms512m -Xmx1024m \
            -Djava.security.manager \
            -Djava.security.policy=$WEBLOGIC_HOME/server/lib/weblogic.policy \
            -Dweblogic.Name=AdminServer \
            -Dweblogic.management.username=weblogic \
            -Dweblogic.management.password=Algar123@ \
            -Dweblogic.Domain=$DOMAIN_HOME \
            -Dweblogic.RootDirectory=$DOMAIN_HOME \
            -Dweblogic.ListenPort=7001 \
            -Dweblogic.ListenAddress= \
            -Dweblogic.system.BootIdentityFile=$DOMAIN_HOME/servers/AdminServer/security/boot.properties \
            -jar $WEBLOGIC_HOME/server/lib/weblogic-launcher.jar \
            weblogic.Server
        dest: /u01/domain/oudsm/startWebLogic.sh
        owner: oracle
        group: oinstall
        mode: "0755"

    - name: Start WebLogic using the corrected script
      shell: |
        cd /u01/domain/oudsm

        # Kill any existing processes
        pkill -f "weblogic.Name=AdminServer" || true
        sleep 3

        echo "Starting WebLogic with modular approach..."
        nohup ./startWebLogic.sh > /u01/logs/oudsm/weblogic_modular.log 2>&1 &

        echo "Waiting for WebLogic to start..."
        for i in {1..45}; do
          if netstat -ln | grep -q ":7001 "; then
            echo "SUCCESS: WebLogic started on port 7001"
            break
          fi
          sleep 5
          echo "Waiting... ($i/45)"
        done

        # Final status
        if netstat -ln | grep -q ":7001 "; then
          echo "WebLogic is RUNNING on port 7001"
        else
          echo "WebLogic startup FAILED"
          echo "Last 15 lines of log:"
          tail -15 /u01/logs/oudsm/weblogic_modular.log 2>/dev/null || echo "No log available"
        fi
      become_user: oracle
      register: weblogic_modular_start

    - name: Display startup result
      debug:
        var: weblogic_modular_start.stdout_lines

    - name: Test WebLogic console
      uri:
        url: "http://localhost:7001/console"
        method: GET
        status_code: [200, 302, 401]
        timeout: 30
      register: console_test
      ignore_errors: yes

    - name: Final status check
      shell: |
        echo "=== WEBLOGIC FINAL STATUS ==="
        echo "Process:"
        ps aux | grep "weblogic.Name=AdminServer" | grep -v grep || echo "No process"
        echo ""
        echo "Port:"
        netstat -ln | grep ":7001" || echo "Port not listening"
        echo ""
        echo "Log tail:"
        tail -5 /u01/logs/oudsm/weblogic_modular.log 2>/dev/null || echo "No log"
      register: final_status

    - name: Display final result
      debug:
        msg:
          - "=================================================="
          - "🎯 WEBLOGIC OUDSM FINAL STATUS"
          - "=================================================="
          - "{{ final_status.stdout_lines }}"
          - ""
          - "Console Test: {{ console_test.status | default('FAILED') }}"
          - ""
          - "🌐 If running:"
          - "   Console: http://{{ ansible_hostname }}:7001/console"
          - "   User: weblogic / Password: Algar123@"
          - ""
          - "📄 Log: /u01/logs/oudsm/weblogic_modular.log"
