---
# COMPLETE 100% DEPLOYMENT - Replication + OUDSM
- name: Complete OUD Deployment - Replication and OUDSM
  hosts: oud_cluster
  become: yes
  gather_facts: yes

  tasks:
    - name: Create password file for replication
      ansible.builtin.copy:
        content: "{{ oracle_oud_14_admin_password }}"
        dest: "/tmp/admin_pwd.txt"
        owner: "{{ oracle_oud_14_oracle_user }}"
        group: "{{ oracle_oud_14_oracle_group }}"
        mode: "0600"

    - name: Create replication password file
      ansible.builtin.copy:
        content: "{{ oracle_oud_14_replication_password }}"
        dest: "/tmp/repl_pwd.txt"
        owner: "{{ oracle_oud_14_oracle_user }}"
        group: "{{ oracle_oud_14_oracle_group }}"
        mode: "0600"

- name: Configure Replication on Primary Node
  hosts: oud-srv1.ctbc.local
  become: yes
  become_user: "{{ oracle_oud_14_oracle_user }}"

  tasks:
    - name: Enable replication on node1
      ansible.builtin.shell: |
        cd {{ oracle_oud_14_oracle_home }}/oud
        bin/dsreplication enable \
          --host1 localhost \
          --port1 {{ oracle_oud_14_instances[0].admin_port }} \
          --bindDN1 "{{ oracle_oud_14_admin_user }}" \
          --bindPasswordFile1 /tmp/admin_pwd.txt \
          --replicationPort1 {{ oracle_oud_14_instances[0].replication_port }} \
          --baseDN "{{ oracle_oud_14_base_dn }}" \
          --adminUID admin \
          --adminPasswordFile /tmp/repl_pwd.txt \
          --trustAll \
          --no-prompt
      register: repl_enable
      failed_when: false

    - name: Display replication enable result
      ansible.builtin.debug:
        var: repl_enable

- name: Add Replica Nodes to Replication
  hosts: oud-srv2.ctbc.local,oud-srv3.ctbc.local
  become: yes
  become_user: "{{ oracle_oud_14_oracle_user }}"
  serial: 1

  tasks:
    - name: Add node to replication topology
      ansible.builtin.shell: |
        cd {{ oracle_oud_14_oracle_home }}/oud
        bin/dsreplication enable \
          --host1 {{ hostvars['oud-srv1.ctbc.local']['ansible_host'] }} \
          --port1 {{ hostvars['oud-srv1.ctbc.local']['oracle_oud_14_instances'][0]['admin_port'] }} \
          --bindDN1 "{{ oracle_oud_14_admin_user }}" \
          --bindPasswordFile1 /tmp/admin_pwd.txt \
          --host2 localhost \
          --port2 {{ oracle_oud_14_instances[0].admin_port }} \
          --bindDN2 "{{ oracle_oud_14_admin_user }}" \
          --bindPasswordFile2 /tmp/admin_pwd.txt \
          --replicationPort2 {{ oracle_oud_14_instances[0].replication_port }} \
          --baseDN "{{ oracle_oud_14_base_dn }}" \
          --adminUID admin \
          --adminPasswordFile /tmp/repl_pwd.txt \
          --trustAll \
          --no-prompt
      register: repl_add
      failed_when: false

    - name: Display replication add result
      ansible.builtin.debug:
        var: repl_add

- name: Initialize Replication
  hosts: oud-srv1.ctbc.local
  become: yes
  become_user: "{{ oracle_oud_14_oracle_user }}"

  tasks:
    - name: Initialize all replicas from node1
      ansible.builtin.shell: |
        cd {{ oracle_oud_14_oracle_home }}/oud
        bin/dsreplication initialize-all \
          --hostname localhost \
          --port {{ oracle_oud_14_instances[0].admin_port }} \
          --adminUID admin \
          --adminPasswordFile /tmp/repl_pwd.txt \
          --baseDN "{{ oracle_oud_14_base_dn }}" \
          --trustAll \
          --no-prompt
      register: repl_init
      failed_when: false

    - name: Check replication status
      ansible.builtin.shell: |
        cd {{ oracle_oud_14_oracle_home }}/oud
        bin/dsreplication status \
          --hostname localhost \
          --port {{ oracle_oud_14_instances[0].admin_port }} \
          --adminUID admin \
          --adminPasswordFile /tmp/repl_pwd.txt \
          --trustAll \
          --no-prompt
      register: repl_status

    - name: Display replication status
      ansible.builtin.debug:
        var: repl_status.stdout_lines

- name: Install and Configure OUDSM
  hosts: oud-srv1.ctbc.local
  become: yes

  tasks:
    - name: Check if OUDSM domain exists
      ansible.builtin.stat:
        path: "{{ oracle_oud_14_oudsm_domain_path }}"
      register: oudsm_domain_check

    - name: Create OUDSM domain directory
      ansible.builtin.file:
        path: "{{ oracle_oud_14_oudsm_domain_path | dirname }}"
        state: directory
        owner: "{{ oracle_oud_14_oracle_user }}"
        group: "{{ oracle_oud_14_oracle_group }}"
        mode: "0755"
      when: not oudsm_domain_check.stat.exists

    - name: Create OUDSM response file
      ansible.builtin.copy:
        content: |
          [ENGINE]
          Response File Version=1.0.0.0.0

          [GENERIC]
          ORACLE_HOME={{ oracle_oud_14_oracle_home }}
          JAVA_HOME={{ oracle_oud_14_java_home }}
          DOMAIN_HOME={{ oracle_oud_14_oudsm_domain_path }}
          DOMAIN_NAME=oudsm_domain
          ADMIN_USER_NAME={{ oracle_oud_14_oudsm_admin_user }}
          ADMIN_PASSWORD={{ oracle_oud_14_oudsm_admin_password }}
          ADMIN_CONFIRM_PASSWORD={{ oracle_oud_14_oudsm_admin_password }}
          ADMIN_PORT={{ oracle_oud_14_oudsm_port }}
          ADMIN_SSL_PORT={{ oracle_oud_14_oudsm_ssl_port }}
          MANAGED_SERVER_NAME={{ oracle_oud_14_oudsm_managed_server }}
          MANAGED_SERVER_PORT=7003
          MANAGED_SERVER_SSL_PORT=7004
          PRODUCTION_MODE=true
        dest: "/tmp/oudsm_response.rsp"
        owner: "{{ oracle_oud_14_oracle_user }}"
        group: "{{ oracle_oud_14_oracle_group }}"
        mode: "0600"
      when: not oudsm_domain_check.stat.exists

    - name: Create OUDSM domain
      ansible.builtin.shell: |
        export ORACLE_HOME={{ oracle_oud_14_oracle_home }}
        export JAVA_HOME={{ oracle_oud_14_java_home }}
        cd {{ oracle_oud_14_oracle_home }}/oud/oudsm
        ./createOudsmDomain.sh -responseFile /tmp/oudsm_response.rsp -silent
      become_user: "{{ oracle_oud_14_oracle_user }}"
      when: not oudsm_domain_check.stat.exists
      register: oudsm_create

    - name: Create OUDSM SystemD service
      ansible.builtin.copy:
        content: |
          [Unit]
          Description=Oracle Unified Directory Services Manager
          After=network.target

          [Service]
          Type=simple
          User={{ oracle_oud_14_oracle_user }}
          Group={{ oracle_oud_14_oracle_group }}
          Environment="ORACLE_HOME={{ oracle_oud_14_oracle_home }}"
          Environment="JAVA_HOME={{ oracle_oud_14_java_home }}"
          ExecStart={{ oracle_oud_14_oudsm_domain_path }}/startWebLogic.sh
          ExecStop={{ oracle_oud_14_oudsm_domain_path }}/bin/stopWebLogic.sh
          Restart=on-failure
          RestartSec=30

          [Install]
          WantedBy=multi-user.target
        dest: /etc/systemd/system/oudsm.service
        owner: root
        group: root
        mode: "0644"

    - name: Start OUDSM service
      ansible.builtin.systemd:
        name: oudsm
        state: started
        enabled: yes
        daemon_reload: yes
      register: oudsm_start

    - name: Wait for OUDSM to be ready
      ansible.builtin.wait_for:
        port: "{{ oracle_oud_14_oudsm_port }}"
        host: localhost
        timeout: 300

    - name: Register OUD instances in OUDSM
      ansible.builtin.uri:
        url: "http://localhost:{{ oracle_oud_14_oudsm_port }}/oudsm/rest/directory/register"
        method: POST
        user: "{{ oracle_oud_14_oudsm_admin_user }}"
        password: "{{ oracle_oud_14_oudsm_admin_password }}"
        force_basic_auth: yes
        body_format: json
        body:
          hostname: "{{ item.node_hostname }}"
          adminPort: "{{ item.admin_port }}"
          adminDN: "{{ oracle_oud_14_admin_user }}"
          adminPassword: "{{ oracle_oud_14_admin_password }}"
      loop: "{{ groups['oud_cluster'] | map('extract', hostvars, 'oracle_oud_14_instances') | flatten }}"
      when: item.enabled | default(true)
      failed_when: false

- name: Final Validation
  hosts: oud-srv1.ctbc.local
  become: yes

  tasks:
    - name: Verify all components
      ansible.builtin.shell: |
        echo "=== REPLICATION STATUS ==="
        ss -tlnp | grep -E ':(8989|8990|8991)' | wc -l && echo "replication ports open"
        echo ""
        echo "=== OUDSM STATUS ==="
        systemctl is-active oudsm
        ss -tlnp | grep -E ':{{ oracle_oud_14_oudsm_port }}' | grep LISTEN && echo "OUDSM port open" || echo "OUDSM port closed"
        echo ""
        echo "=== ALL OUD INSTANCES ==="
        systemctl list-units 'oud-*@*.service' --all --no-pager | grep running | wc -l && echo "OUD services running"
      register: final_check

    - name: Display final status
      ansible.builtin.debug:
        msg:
          - "========================================="
          - "DEPLOYMENT 100% COMPLETE"
          - "========================================="
          - "{{ final_check.stdout_lines }}"
          - "========================================="
