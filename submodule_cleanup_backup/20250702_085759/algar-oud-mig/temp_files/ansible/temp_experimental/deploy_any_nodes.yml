---
# Deploy OUD with ANY Number of Nodes - 100% Dynamic and Idempotent
- name: Oracle OUD 14.1 - Dynamic Multi-Node Deployment
  hosts: oud_production
  become: true
  gather_facts: true
  serial: 1  # Deploy one node at a time for safety
  
  vars:
    # FORCE SAFETY SETTINGS
    clean_deployment: false  # NEVER break existing OUD
    protection_mode: true   # ALWAYS protect running instances
    require_100_percent: false  # Set true when confident
    
  pre_tasks:
    - name: "🌟 Display dynamic deployment information"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "🌟 ORACLE OUD 14.1 DYNAMIC DEPLOYMENT"
          - "=================================================="
          - "Total Cluster Nodes: {{ groups['oud_cluster'] | length }}"
          - "Current Node: {{ inventory_hostname }}"
          - "Primary Node: {{ groups['oud_cluster'][0] }}"
          - "Replica Nodes: {{ groups['oud_cluster'][1:] | length }}"
          - "Clean Deployment: {{ clean_deployment }} (SAFE MODE)"
          - "Protection Mode: {{ protection_mode }} (ENABLED)"
          - "Oracle Home: {{ oracle_oud_14_oracle_home }}"
          - "Base DN: {{ oracle_oud_14_base_dn }}"
          - "Admin User: {{ oracle_oud_14_admin_user }}"
          - "=================================================="
          - "🛡️  PROTECTION: Existing OUD will be preserved"
          - "🧠 SMART: Only incorrect configurations will be fixed"
          - "🔍 DYNAMIC: Supports any number of nodes automatically"
          - "=================================================="
      run_once: true
      delegate_to: "{{ groups['oud_cluster'][0] }}"

    - name: "📊 Create deployment log entry"
      ansible.builtin.lineinfile:
        path: "{{ oracle_oud_14_domain_home }}/.deployment_history"
        line: "{{ ansible_date_time.iso8601 }} - Dynamic deployment started on {{ inventory_hostname }} ({{ groups['oud_cluster'].index(inventory_hostname) + 1 }}/{{ groups['oud_cluster'] | length }})"
        create: true
        owner: "{{ oracle_oud_14_oracle_user | default('oracle') }}"
        group: "{{ oracle_oud_14_oracle_group | default('oinstall') }}"
        mode: "0644"
      failed_when: false

  roles:
    - role: oracle_oud_14
      vars:
        # Ensure safety settings
        clean_deployment: false
        protection_mode: true
      tags:
        - oud
        - dynamic
        - safe

  post_tasks:
    - name: "🎯 Deployment completion for node {{ inventory_hostname }}"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "🎯 NODE DEPLOYMENT COMPLETED"
          - "=================================================="
          - "Node: {{ inventory_hostname }}"
          - "Position: {{ groups['oud_cluster'].index(inventory_hostname) + 1 }}/{{ groups['oud_cluster'] | length }}"
          - "Role: {{ 'Primary' if inventory_hostname == groups['oud_cluster'][0] else 'Replica' }}"
          - "Check validation report:"
          - "{{ oracle_oud_14_domain_home }}/scripts/deployment_validation_report.txt"
          - "=================================================="

# Final cluster validation (runs once after all nodes)
- name: Final Cluster Validation
  hosts: oud_production
  become: true
  gather_facts: false
  
  tasks:
    - name: "🏁 Final cluster validation"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "🏁 CLUSTER DEPLOYMENT COMPLETED"
          - "=================================================="
          - "Total Nodes Deployed: {{ groups['oud_cluster'] | length }}"
          - "Primary Node: {{ groups['oud_cluster'][0] }}"
          - "{% if groups['oud_cluster'] | length > 1 %}Replica Nodes: {{ groups['oud_cluster'][1:] | join(', ') }}{% endif %}"
          - "Base DN: {{ oracle_oud_14_base_dn }}"
          - "Admin User: {{ oracle_oud_14_admin_user }}"
          - "=================================================="
          - "🧪 TEST CONNECTIVITY:"
          - "{% for node in groups['oud_cluster'] %}{{ loop.index }}. {{ node }}: ldapsearch -h {{ node }} -p {{ 1000 + (loop.index * 100) + 89 }} -D '{{ oracle_oud_14_admin_user }}' -w '{{ oracle_oud_14_admin_password }}' -b '{{ oracle_oud_14_base_dn }}' -s base '(objectclass=*)'{% endfor %}"
          - "=================================================="
          - "🎉 DYNAMIC CLUSTER READY!"
          - "=================================================="
      run_once: true