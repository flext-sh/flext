---
# Test 100% Functionality Without Breaking Existing OUD
- name: Test OUD 100% Functionality - SAFE MODE
  hosts: oud-srv1.ctbc.local
  become: true
  gather_facts: true
  
  vars:
    # FORCE SAFE MODE
    clean_deployment: false
    protection_mode: true
    require_100_percent: false  # Set to true only when confident
    
  tasks:
    - name: "🛡️  SAFE MODE: Display protection settings"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "🛡️  SAFE MODE TESTING ENABLED"
          - "=================================================="
          - "Clean Deployment: {{ clean_deployment }} (DISABLED)"
          - "Protection Mode: {{ protection_mode }} (ENABLED)"
          - "100% Requirement: {{ require_100_percent }}"
          - "Host: {{ inventory_hostname }}"
          - "Oracle Home: {{ oracle_oud_14_oracle_home }}"
          - "Base DN: {{ oracle_oud_14_base_dn }}"
          - "Admin User: {{ oracle_oud_14_admin_user }}"
          - "=================================================="
          - "⚠️  EXISTING OUD WILL BE PROTECTED"
          - "⚠️  ONLY MISSING COMPONENTS WILL BE CREATED"
          - "=================================================="

    - name: "🧪 Execute OUD role in SAFE mode"
      ansible.builtin.include_role:
        name: oracle_oud_14
      vars:
        clean_deployment: false
        protection_mode: true
      tags:
        - safe_test
        - never_break

    - name: "🎯 Final test summary"
      ansible.builtin.debug:
        msg:
          - "=================================================="
          - "🎯 SAFE MODE TEST COMPLETED"
          - "=================================================="
          - "Check the validation report for detailed results:"
          - "{{ oracle_oud_14_domain_home }}/scripts/deployment_validation_report.txt"
          - ""
          - "To test connectivity manually:"
          - "ldapsearch -h {{ ansible_hostname }} -p {{ oracle_oud_14_instances[0].ldap_port }} -D '{{ oracle_oud_14_admin_user }}' -w '{{ oracle_oud_14_admin_password }}' -b '{{ oracle_oud_14_base_dn }}' -s base '(objectclass=*)'"
          - ""
          - "To check service status:"
          - "systemctl status oud@{{ oracle_oud_14_instances[0].name }}"
          - "=================================================="