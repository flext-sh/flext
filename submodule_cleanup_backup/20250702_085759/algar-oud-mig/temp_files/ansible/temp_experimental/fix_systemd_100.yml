---
# FIX SYSTEMD 100% - Aplicar templates corretos por host
- name: Fix SystemD templates for all hosts
  hosts: oud_cluster
  become: yes
  gather_facts: yes
  
  tasks:
    - name: Stop all OUD services first
      ansible.builtin.systemd:
        name: "oud@{{ item.name }}"
        state: stopped
      loop: "{{ oracle_oud_14_instances }}"
      failed_when: false
      
    - name: Deploy correct SystemD template per host
      ansible.builtin.template:
        src: roles/oracle_oud_14/templates/oud_systemd.service.j2
        dest: /etc/systemd/system/oud@.service
        owner: root
        group: root
        mode: "0644"
        backup: yes
        force: yes
        
    - name: Reload SystemD daemon
      ansible.builtin.systemd:
        daemon_reload: yes
        
    - name: Start only the correct service for each host
      ansible.builtin.systemd:
        name: "oud@{{ item.name }}"
        state: started
        enabled: yes
      loop: "{{ oracle_oud_14_instances }}"
      when: item.enabled | default(true)
      
    - name: Verify service status
      ansible.builtin.systemd:
        name: "oud@{{ item.name }}"
      loop: "{{ oracle_oud_14_instances }}"
      register: service_status
      
    - name: Display final status
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Service: oud@{{ item.item.name }}"
          - "Status: {{ item.status.ActiveState }}"
          - "SubState: {{ item.status.SubState }}"
      loop: "{{ service_status.results }}"
      loop_control:
        label: "{{ item.item.name }}"