---
# Force OUDSM Execution - Bypass any blocking conditions
- name: Force OUDSM Execution
  hosts: oud-srv1.ctbc.local
  become: yes
  vars:
    oracle_oud_14_oudsm_enabled: true
    oracle_oud_14_oracle_home: /u01/app/oracle/product/14.1/oud_1
    oracle_oud_14_java_home: /u01/app/oracle/product/jdk
    oracle_oud_14_oudsm_domain_path: /u01/domain/oudsm
    oracle_oud_14_oudsm_port: 7001
    oracle_oud_14_oudsm_admin_user: weblogic
    oracle_oud_14_oudsm_admin_password: Algar123@
    oracle_oud_14_oracle_user: oracle
    oracle_oud_14_oracle_group: oinstall
    oracle_oud_14_logs_path: /u01/logs
    oracle_oud_14_scripts_path: /u01/scripts

  tasks:
    - name: Check if OUDSM domain already exists
      stat:
        path: "{{ oracle_oud_14_oudsm_domain_path }}/config/config.xml"
      register: oudsm_domain_exists

    - name: Check WLST and Infrastructure availability
      stat:
        path: "{{ oracle_oud_14_oracle_home }}/oracle_common/common/bin/wlst.sh"
      register: wlst_available

    - name: Display conditions check
      debug:
        msg:
          - "Domain exists: {{ oudsm_domain_exists.stat.exists }}"
          - "WLST available: {{ wlst_available.stat.exists }}"
          - "Should execute: {{ not oudsm_domain_exists.stat.exists and wlst_available.stat.exists }}"

    - name: Start OUDSM if domain exists but not running
      shell: |
        cd {{ oracle_oud_14_oudsm_domain_path }}
        export JAVA_HOME={{ oracle_oud_14_java_home }}
        export ORACLE_HOME={{ oracle_oud_14_oracle_home }}

        # Check if already running
        if pgrep -f "weblogic.Name=AdminServer" > /dev/null; then
          echo "OUDSM AdminServer already running"
          exit 0
        fi

        echo "Starting OUDSM AdminServer..."
        nohup ./startWebLogic.sh > {{ oracle_oud_14_logs_path }}/oudsm/admin.log 2>&1 &

        echo "Waiting for startup..."
        for i in {1..60}; do
          if netstat -ln | grep -q ":{{ oracle_oud_14_oudsm_port }} "; then
            echo "OUDSM AdminServer started successfully on port {{ oracle_oud_14_oudsm_port }}"
            echo "Console: http://$(hostname):{{ oracle_oud_14_oudsm_port }}/console"
            exit 0
          fi
          sleep 5
        done

        echo "Startup timeout - check logs"
        exit 1
      become_user: oracle
      when: oudsm_domain_exists.stat.exists
      register: oudsm_startup_result

    - name: Display startup result
      debug:
        var: oudsm_startup_result.stdout_lines
      when: oudsm_startup_result is defined

    - name: Final validation
      shell: |
        echo "=== FINAL OUDSM STATUS ==="
        echo "1. Process:"
        ps aux | grep weblogic | grep -v grep || echo "No WebLogic process"
        echo "2. Port:"
        netstat -ln | grep :{{ oracle_oud_14_oudsm_port }} || echo "Port not listening"
        echo "3. Domain:"
        ls -la {{ oracle_oud_14_oudsm_domain_path }}/config/config.xml || echo "Domain config missing"
      register: final_status

    - name: Display final status
      debug:
        var: final_status.stdout_lines
