---
# Fix WebLogic OUDSM Startup - Make it 100% functional
- name: Fix WebLogic OUDSM Domain Startup
  hosts: oud-srv1.ctbc.local
  become: yes

  tasks:
    - name: Create corrected startWebLogic.sh with proper CLASSPATH
      copy:
        content: |
          #!/bin/bash
          cd /u01/domain/oudsm

          export JAVA_HOME=/u01/app/oracle/product/jdk
          export ORACLE_HOME=/u01/app/oracle/product/14.1/oud_1
          export DOMAIN_HOME=/u01/domain/oudsm
          export WEBLOGIC_HOME=$ORACLE_HOME/wlserver

          # Set correct CLASSPATH for WebLogic
          export CLASSPATH=$WEBLOGIC_HOME/server/lib/weblogic.jar:$ORACLE_HOME/oracle_common/modules/com.oracle.cie.config.jar:$CLASSPATH

          # Create boot.properties if not exists
          mkdir -p servers/AdminServer/security
          if [ ! -f "servers/AdminServer/security/boot.properties" ]; then
            echo "username=weblogic" > servers/AdminServer/security/boot.properties
            echo "password=Algar123@" >> servers/AdminServer/security/boot.properties
            chmod 600 servers/AdminServer/security/boot.properties
          fi

          echo "Starting WebLogic AdminServer for OUDSM..."

          $JAVA_HOME/bin/java -server \
            -Xms512m -Xmx1024m \
            -cp $CLASSPATH \
            -Djava.security.policy=$WEBLOGIC_HOME/server/lib/weblogic.policy \
            -Dweblogic.Name=AdminServer \
            -Dweblogic.Domain=$DOMAIN_HOME \
            -Dweblogic.ListenPort=7001 \
            -Dweblogic.ListenAddress= \
            -Dweblogic.RootDirectory=$DOMAIN_HOME \
            -Dweblogic.system.BootIdentityFile=$DOMAIN_HOME/servers/AdminServer/security/boot.properties \
            weblogic.Server
        dest: /u01/domain/oudsm/startWebLogic.sh
        owner: oracle
        group: oinstall
        mode: "0755"

    - name: Test WebLogic startup in background
      shell: |
        cd /u01/domain/oudsm
        export JAVA_HOME=/u01/app/oracle/product/jdk
        export ORACLE_HOME=/u01/app/oracle/product/14.1/oud_1

        # Kill any existing WebLogic processes
        pkill -f "weblogic.Name=AdminServer" || true
        sleep 2

        # Start WebLogic in background
        nohup ./startWebLogic.sh > /u01/logs/oudsm/weblogic_startup.log 2>&1 &

        echo "WebLogic startup initiated, waiting for port..."

        # Wait for WebLogic to start
        for i in {1..60}; do
          if netstat -ln | grep -q ":7001 "; then
            echo "SUCCESS: WebLogic AdminServer started on port 7001"
            break
          fi
          sleep 5
          echo "Waiting... ($i/60)"
        done

        if netstat -ln | grep -q ":7001 "; then
          echo "FINAL STATUS: WebLogic is RUNNING"
        else
          echo "FINAL STATUS: WebLogic FAILED to start"
          echo "Last 10 lines of log:"
          tail -10 /u01/logs/oudsm/weblogic_startup.log 2>/dev/null || echo "No log file"
        fi
      become_user: oracle
      register: weblogic_startup

    - name: Display startup results
      debug:
        var: weblogic_startup.stdout_lines

    - name: Verify WebLogic is running
      shell: |
        echo "=== FINAL VERIFICATION ==="
        echo "1. Process:"
        ps aux | grep "weblogic.Name=AdminServer" | grep -v grep || echo "No WebLogic process"
        echo ""
        echo "2. Port 7001:"
        netstat -ln | grep ":7001" || echo "Port 7001 not listening"
        echo ""
        echo "3. Console test:"
        curl -s -w "HTTP %{http_code}\n" "http://localhost:7001/console" -o /dev/null || echo "Console not responding"
      register: final_check

    - name: Display final status
      debug:
        msg:
          - "=================================================="
          - "🎉 WEBLOGIC OUDSM DOMAIN STATUS"
          - "=================================================="
          - "{{ final_check.stdout_lines }}"
          - ""
          - "🌐 If running, access at:"
          - "   Console: http://{{ ansible_hostname }}:7001/console"
          - "   User: weblogic / Password: Algar123@"
          - ""
          - "📄 Logs: /u01/logs/oudsm/weblogic_startup.log"
