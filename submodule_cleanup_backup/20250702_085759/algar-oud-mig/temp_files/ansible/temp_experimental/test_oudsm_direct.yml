---
# Direct OUDSM Test - Force execution
- name: Test OUDSM Direct Execution
  hosts: oud-srv1.ctbc.local
  become: yes
  vars:
    oracle_oud_14_oudsm_enabled: true

  tasks:
    - name: Debug OUDSM enabled status
      debug:
        msg: "OUDSM Enabled: {{ oracle_oud_14_oudsm_enabled | default('NOT SET') }}"

    - name: Check if OUDSM domain exists
      stat:
        path: "/u01/domain/oudsm/config/config.xml"
      register: oudsm_domain_exists

    - name: Debug domain existence
      debug:
        msg: "OUDSM Domain Exists: {{ oudsm_domain_exists.stat.exists }}"

    - name: Check WLST availability
      stat:
        path: "/u01/app/oracle/product/14.1/oud_1/oracle_common/common/bin/wlst.sh"
      register: wlst_available

    - name: Debug WLST availability
      debug:
        msg: "WLST Available: {{ wlst_available.stat.exists }}"

    - name: Force create OUDSM domain using WLST
      shell: |
        export JAVA_HOME="/u01/app/oracle/product/jdk"
        export ORACLE_HOME="/u01/app/oracle/product/14.1/oud_1"

        cat > /tmp/create_oudsm_domain.py << 'EOF'
        # WLST script to create OUDSM domain for OUD 14.1
        # Using the base_standalone template for OUD 14.1 without Infrastructure

        readTemplate('/u01/app/oracle/product/14.1/oud_1/wlserver/common/templates/wls/base_standalone.jar')

        # Set domain options
        setOption('DomainName', 'oudsm_domain')
        setOption('JavaHome', '/u01/app/oracle/product/jdk')

        # Configure AdminServer
        cd('Servers/AdminServer')
        set('ListenPort', 7001)
        set('ListenAddress', '')

        # Create user and set password
        cd('/')
        create('weblogic', 'User')
        cd('/Security/base_domain/User/weblogic')
        cmo.setPassword('Algar123@')

        # Write domain
        setOption('OverwriteDomain', 'true')
        writeDomain('/u01/domain/oudsm')
        closeTemplate()

        print('OUDSM domain created successfully with base_standalone template')
        exit()
        EOF

        cd "/u01/app/oracle/product/14.1/oud_1/oracle_common/common/bin"
        ./wlst.sh /tmp/create_oudsm_domain.py

        # Fix domain ownership after creation
        chown -R oracle:oinstall "/u01/domain/oudsm"
      become: true
      become_user: oracle
      when: not oudsm_domain_exists.stat.exists and wlst_available.stat.exists
      register: oudsm_domain_creation

    - name: Display OUDSM creation result
      debug:
        var: oudsm_domain_creation
      when: oudsm_domain_creation is defined
