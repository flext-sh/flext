[tool.poetry]
name = "oracle-oic-ext"
version = "0.1.0"
description = "Meltano extension for Oracle Integration Cloud lifecycle and monitoring"
authors = ["PyAuto Team"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pyauto/oracle-oic-ext"
keywords = [
    "meltano",
    "extension",
    "oracle",
    "oic",
    "integration",
    "lifecycle",
    "monitoring",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
"meltano-edk" = { path = "../meltano-edk", develop = true }
typer = "^0.16.0"
structlog = "^21.2.0"
httpx = ">=0.28.1"
pydantic = "^2.11"
pyyaml = "^6.0.1"
rich = "^14.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
mypy = "^1.13.0"
ruff = "^0.8.6"
black = "^24.10.0"
isort = "^5.13.2"
pre-commit = "^4.0.0"
types-pyyaml = "^6.0.12"

[tool.poetry.scripts]
oracle_oic_extension = "oracle_oic_ext.main:app"
oracle_oic_invoker = "oracle_oic_ext.pass_through:pass_through_cli"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py39"
fix = true

[tool.ruff.lint]
ignore = [
    "N818",   # Allow Exceptions to have suffix 'Exception' rather than 'Error'
    "S310",   # Allow `urllib.open`
    "S603",   # Allow `subprocess.run(..., shell=False)`
    "COM812", # Handled by the Ruff formatter
    "ISC001", # Handled by the Ruff formatter
]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations
    "ARG",   # flake8-unused-arguments
    "ASYNC", # flake8-async
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "COM",   # flake8-commas
    "D",     # pydocstyle/flake8-docstrings
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle (error)
    "EM",    # flake8-errmsg
    "ERA",   # flake8-eradicate
    "F",     # pyflakes
    "FBT",   # flake8-boolean-trap
    "G",     # flake8-logging-format
    "I",     # isort
    "ICN",   # flake8-import-conventions
    "INP",   # flake8-no-pep420
    "ISC",   # flake8-implicit-str-concat
    "N",     # pep8-naming
    "PERF",  # Perflint
    "PGH",   # pygrep-hooks
    "PIE",   # flake8-pie
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "Q",     # flake8-quotes
    "RET",   # flake8-return
    "RSE",   # flake8-raise
    "RUF",   # Ruff specific rules
    "S",     # flake8-bandit
    "SIM",   # flake8-simplify
    "T10",   # flake8-debugger
    "T20",   # flake8-print
    "TID",   # flake8-tidy-imports
    "UP",    # pyupgrade
    "W",     # pycodestyle (warning)
    "YTT",   # flake8-2020
]
unfixable = [
    "ERA001", # Don't remove commented-out code
]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true

[tool.black]
line-length = 120
target-version = ["py39"]

[tool.isort]
profile = "black"
line_length = 120
