[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "PROJECT_NAME"
version = "0.5.0"
description = "PyAuto Enterprise - PROJECT_NAME component"
authors = ["Marlon Costa <marlon.costa@datacosmos.com.br>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/datacosmos-br/PROJECT_NAME"
documentation = "https://github.com/datacosmos-br/PROJECT_NAME/blob/main/README.md"
keywords = ["pyauto", "enterprise", "data", "integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
packages = [{include = "PROJECT_MODULE", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
# Core dependencies - Keep minimal and specific
pydantic = "^2.11.0"
typing-extensions = "^4.12.0"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.0"
pytest-mock = "^3.14.0"
pytest-asyncio = "^0.24.0"

# Linting and formatting
ruff = "^0.8.4"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.0"

# Type checking
types-requests = "^2.32.0"
types-setuptools = "^75.6.0"

# Pre-commit and hooks
pre-commit = "^4.0.0"

# Documentation
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"

# Development utilities
ipython = "^8.29.0"
rich = "^13.9.0"

[tool.poetry.group.security.dependencies]
bandit = {extras = ["toml"], version = "^1.7.0"}
safety = "^3.2.0"

[tool.poetry.group.build.dependencies]
build = "^1.2.0"
twine = "^6.0.0"

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/datacosmos-br/PROJECT_NAME/issues"
"Changelog" = "https://github.com/datacosmos-br/PROJECT_NAME/blob/main/CHANGELOG.md"

# ═══════════════════════════════════════════════════════════════════════════
#  TOOL CONFIGURATIONS - ENTERPRISE STANDARDS
# ═══════════════════════════════════════════════════════════════════════════

[tool.ruff]
line-length = 88
target-version = "py39"
src = ["src", "tests"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
# Comprehensive rule selection for enterprise quality
select = [
    # Core Python
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "YTT",  # flake8-2020

    # Best practices
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "EM",   # flake8-errmsg
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "PIE",  # flake8-pie
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "TD",   # flake8-todos
    "FIX",  # flake8-fixme
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # numpy
    "PERF", # perflint
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific
]

ignore = [
    # Relaxed rules for practical development
    "E501",    # line-too-long (handled by formatter)
    "E203",    # whitespace-before-colon (conflicts with black)
    "W503",    # line-break-before-binary-operator (conflicts with black)
    "D100",    # missing-docstring-in-public-module (too verbose)
    "D101",    # missing-docstring-in-public-class (too verbose)
    "D102",    # missing-docstring-in-public-method (too verbose)
    "D103",    # missing-docstring-in-public-function (too verbose)
    "D104",    # missing-docstring-in-public-package (too verbose)
    "D105",    # missing-docstring-in-magic-method (too verbose)
    "TD002",   # missing-todo-author (optional for internal projects)
    "TD003",   # missing-todo-link (optional for internal projects)
    "FIX002",  # line-contains-todo (allow TODOs in development)
    "PGH003",  # blanket-type-ignore (sometimes necessary)
    "PLR0913", # too-many-arguments (sometimes necessary for APIs)
    "PLR2004", # magic-value-comparison (sometimes practical)
    "RUF001",  # ambiguous-unicode-character-string (false positives)
    "RUF002",  # ambiguous-unicode-character-docstring (false positives)
    "RUF003",  # ambiguous-unicode-character-comment (false positives)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",    # assert (needed in tests)
    "PLR2004", # magic-value-comparison (common in tests)
    "S105",    # hardcoded-password-string (test data)
    "S106",    # hardcoded-password-func-arg (test data)
    "ARG001",  # unused-function-argument (fixtures)
    "PT011",   # pytest-raises-too-broad (sometimes necessary)
]
"scripts/**/*.py" = [
    "T201",    # print statements allowed in scripts
    "S603",    # subprocess-without-shell-equals-true (scripts need shell)
    "S607",    # start-process-with-partial-path (scripts use PATH)
]
"examples/**/*.py" = [
    "T201",    # print statements allowed in examples
    "INP001",  # implicit-namespace-package (examples don't need __init__.py)
]

[tool.ruff.lint.isort]
known-first-party = ["PROJECT_MODULE"]
force-single-line = false
lines-between-types = 1
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 8

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']
skip-string-normalization = false
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | \.venv
  | build
  | dist
  | \.eggs
)/
'''

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["PROJECT_MODULE"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_single_line = false
lines_between_types = 1
lines_after_imports = 2

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
show_error_codes = true
show_error_context = true
show_column_numbers = true
pretty = true
color_output = true
error_summary = true

# Strict options for enterprise quality
disallow_any_generics = true
disallow_any_unimported = true
disallow_any_expr = false  # Too strict for practical development
disallow_any_decorated = false  # Too strict for decorators
disallow_any_explicit = false  # Allow explicit Any when needed
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
strict_equality = true

# Import discovery
ignore_missing_imports = false
follow_imports = "silent"
no_silence_site_packages = false

# Platform and namespace packages
namespace_packages = true
explicit_package_bases = true

# Error reporting
show_none_errors = true
show_error_end = true

[[tool.mypy.overrides]]
module = [
    "tests.*",
    "conftest",
]
ignore_errors = false
disallow_untyped_defs = false  # More lenient for tests

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/pytest.xml",
    "--maxfail=10",
    "--tb=short",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "smoke: marks tests as smoke tests",
    "regression: marks tests as regression tests",
    "security: marks tests as security tests",
    "performance: marks tests as performance tests",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
log_cli = false
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
]
data_file = "reports/.coverage"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
]

[tool.coverage.html]
directory = "reports/coverage"
title = "PROJECT_NAME Coverage Report"

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]  # Skip assert and shell usage in appropriate contexts

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]

# ═══════════════════════════════════════════════════════════════════════════
#  ENTERPRISE QUALITY GATES
# ═══════════════════════════════════════════════════════════════════════════

# Quality thresholds that MUST be met:
# - Test coverage: >= 85%
# - MyPy: strict mode, zero errors
# - Ruff: zero errors, comprehensive rule set
# - Security: bandit clean, no hardcoded secrets
# - Performance: no obvious anti-patterns
# - Documentation: README + inline docs required
# - Typing: full type hints required

# Build requirements:
# - All tests pass
# - All quality gates pass
# - No TODO/FIXME in production code
# - Version incremented
# - CHANGELOG updated
