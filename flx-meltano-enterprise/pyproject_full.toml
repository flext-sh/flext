[tool.poetry]
name = "flx-meltano-enterprise"
version = "2.0.0"
description = "FLX Enterprise Data Platform - Built on Meltano"
authors = ["FLX Team <team@flx.io>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "flx", from = "src" },
    { include = "flx_web", from = "src" },
    { include = "flx_api", from = "src" },
    { include = "flx_cli", from = "src" },
    { include = "flx_extensions", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.13"

# Core dependencies
pydantic = "^2.11.0"
pydantic-settings = "^2.3.0"

# Async and concurrency
uvloop = "^0.21.0"
aiofiles = "^24.1.0"

# gRPC
grpcio = "^1.68.1"
grpcio-tools = "^1.68.1"
grpcio-reflection = "^1.68.1"

# Database
asyncpg = "^0.30.0"
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
alembic = "^1.14.0"

# Redis
redis = { extras = ["hiredis"], version = "^5.2.1" }
aioredis = "^2.0.1"

# Message Queue
aio-pika = "^9.5.2"
celery = { extras = ["redis"], version = "^5.4.0" }

# Web Framework - Django
django = "^5.1.5"
django-redis = "^5.4.0"
django-environ = "^0.12.0"
django-extensions = "^3.2.3"
djangorestframework = "^3.15.2"
django-cors-headers = "^4.6.0"
gunicorn = "^23.0.0"
whitenoise = "^6.8.2"

# API Framework - FastAPI
fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
httpx = "^0.28.1"
websockets = "^14.1"
python-multipart = "^0.0.19"

# CLI
click = "^8.1.8"
rich = "^13.9.4"
typer = "^0.15.1"

# Authentication & Security
python-jose = { extras = ["cryptography"], version = "^3.3.0" }
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
cryptography = "^44.0.0"

# Monitoring & Observability
prometheus-client = "^0.21.1"
opentelemetry-api = "^1.29.0"
opentelemetry-sdk = "^1.29.0"
opentelemetry-exporter-otlp = "^1.29.0"
opentelemetry-instrumentation-grpc = "^0.50b0"
opentelemetry-instrumentation-sqlalchemy = "^0.50b0"
opentelemetry-instrumentation-redis = "^0.50b0"
opentelemetry-instrumentation-requests = "^0.50b0"
opentelemetry-instrumentation-fastapi = "^0.50b0"
opentelemetry-instrumentation-django = "^0.50b0"

# Utilities
python-dotenv = "^1.0.1"
pyyaml = "^6.0.2"
orjson = "^3.10.12"
structlog = "^24.5.0"
tenacity = "^9.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.1"
pytest-timeout = "^2.3.1"
pytest-django = "^4.10.0"
# pytest-benchmark = "^5.1.0"
factory-boy = "^3.3.1"
faker = "^33.1.0"
hypothesis = "^6.122.0"
# testcontainers = { extras = ["postgres", "redis", "rabbitmq"], version = "^4.8.0" }

# Type checking & linting
mypy = "^1.14.1"
black = "^24.8.0"
ruff = "^0.8.5"
isort = "^5.13.2"
bandit = "^1.8.0"
safety = "^3.2.0"

# Documentation
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.0"
mkdocstrings = { extras = ["python"], version = "^0.26.0" }

[tool.poetry.scripts]
flx = "flx_cli.cli:main"
flx-daemon = "flx.daemon:main"
flx-web = "flx_web.manage:main"
flx-api = "flx_api.main:start"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  migrations
  | grpc/proto
)/
'''

[tool.ruff]
target-version = "py313"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "DTZ", # flake8-datetimez
    "ICN", # flake8-import-conventions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "Q",   # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "TID", # flake8-tidy-imports
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "PTH", # flake8-use-pathlib
    "ERA", # eradicate
    "PL",  # Pylint
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101",    # Use of assert detected
    "B008",    # Do not perform function calls in argument defaults
    "C901",    # Too complex
    "PLR0913", # Too many arguments
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S101", "ARG", "PLR2004"]
"migrations/*" = ["ALL"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = false
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true

[[tool.mypy.overrides]]
module = ["meltano.*", "celery.*", "django.*", "grpc.*", "testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = """
    -ra
    --strict-markers
    --strict-config
    --cov=src/flx
    --cov=src/flx_api
    --cov=src/flx_cli
    --cov=src/flx_web
    --cov-branch
    --cov-report=term-missing:skip-covered
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=90
"""
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["*/migrations/*", "*/tests/*", "*/conftest.py", "*/__main__.py"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
