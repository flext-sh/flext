version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flx
      POSTGRES_USER: flx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flx_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flx_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - flx_network

  # FLX Core Daemon
  flx-core:
    build:
      context: .
      dockerfile: Dockerfile.core
    environment:
      FLX_ENVIRONMENT: ${FLX_ENVIRONMENT:-production}
      FLX_GRPC_PORT: 50051
      FLX_METRICS_PORT: 9090
      FLX_DATABASE_URL: postgresql://flx:${POSTGRES_PASSWORD:-flx_secret}@postgres:5432/flx
      FLX_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/0
      FLX_LOG_LEVEL: ${FLX_LOG_LEVEL:-INFO}
      MELTANO_DATABASE_URI: postgresql://flx:${POSTGRES_PASSWORD:-flx_secret}@postgres:5432/flx
      MELTANO_PROJECT_ROOT: /app/meltano
    volumes:
      - ./meltano:/app/meltano
      - flx_logs:/app/logs
      - flx_data:/app/data
    ports:
      - "50051:50051"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - flx_network
    restart: unless-stopped

  # FLX Web Interface (Django)
  flx-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      DJANGO_SETTINGS_MODULE: flx_web.settings.production
      FLX_ENVIRONMENT: ${FLX_ENVIRONMENT:-production}
      FLX_DATABASE_URL: postgresql://flx:${POSTGRES_PASSWORD:-flx_secret}@postgres:5432/flx
      FLX_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/1
      FLX_GRPC_HOST: flx-core
      FLX_GRPC_PORT: 50051
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change_me_in_production}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-*}
    volumes:
      - ./media:/app/media
      - flx_logs:/app/logs
      - static_files:/app/staticfiles
    ports:
      - "8080:80"
    depends_on:
      - postgres
      - redis
      - flx-core
    networks:
      - flx_network
    restart: unless-stopped

  # FLX REST API (FastAPI)
  flx-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      FLX_ENVIRONMENT: ${FLX_ENVIRONMENT:-production}
      FLX_API_HOST: 0.0.0.0
      FLX_API_PORT: 8000
      FLX_API_WORKERS: ${FLX_API_WORKERS:-4}
      FLX_GRPC_HOST: flx-core
      FLX_GRPC_PORT: 50051
      FLX_DATABASE_URL: postgresql://flx:${POSTGRES_PASSWORD:-flx_secret}@postgres:5432/flx
      FLX_REDIS_URL: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379/2
      FLX_JWT_SECRET: ${FLX_JWT_SECRET:-change_me_in_production}
      FLX_CORS_ORIGINS: ${FLX_CORS_ORIGINS:-http://localhost:8080}
    volumes:
      - flx_logs:/app/logs
    ports:
      - "8000:8000"
    depends_on:
      - flx-core
      - redis
    networks:
      - flx_network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional, for production)
  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/sites:/etc/nginx/sites-enabled:ro
      - static_files:/usr/share/nginx/html/static:ro
      - ./media:/usr/share/nginx/html/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - flx-web
      - flx-api
    networks:
      - flx_network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9091:9090"
    networks:
      - flx_network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - flx_network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  flx_logs:
  flx_data:
  static_files:
  prometheus_data:
  grafana_data:

networks:
  flx_network:
    driver: bridge
