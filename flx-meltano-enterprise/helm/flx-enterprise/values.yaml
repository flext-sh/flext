# Default values for flx-enterprise
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  environment: production
  domain: flx.local
  storageClass: ""

# Image configuration
images:
  core:
    repository: flx-enterprise/core
    tag: latest
    pullPolicy: IfNotPresent
  web:
    repository: flx-enterprise/web
    tag: latest
    pullPolicy: IfNotPresent
  api:
    repository: flx-enterprise/api
    tag: latest
    pullPolicy: IfNotPresent
  pullSecrets: []

# Core daemon configuration
core:
  enabled: true
  replicaCount: 1

  service:
    type: ClusterIP
    grpcPort: 50051
    metricsPort: 9090

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80

  persistence:
    enabled: true
    size: 10Gi
    accessMode: ReadWriteOnce
    storageClass: ""

  env:
    FLX_LOG_LEVEL: INFO
    FLX_METRICS_ENABLED: "true"
    MELTANO_PROJECT_ROOT: /app/meltano

# Web interface configuration
web:
  enabled: true
  replicaCount: 2

  service:
    type: ClusterIP
    port: 80

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/proxy-body-size: 100m
    hosts:
      - host: flx.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: flx-tls
        hosts:
          - flx.local

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi

  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

  env:
    DJANGO_ALLOWED_HOSTS: "*"
    DJANGO_SETTINGS_MODULE: flx_web.settings.production

# API configuration
api:
  enabled: true
  replicaCount: 3

  service:
    type: ClusterIP
    port: 8000

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: api.flx.local
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: flx-api-tls
        hosts:
          - api.flx.local

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  env:
    FLX_API_WORKERS: "4"
    FLX_CORS_ORIGINS: "https://flx.local"

# PostgreSQL configuration
postgresql:
  enabled: true
  auth:
    postgresPassword: postgres
    username: flx
    password: flx_secret
    database: flx

  primary:
    persistence:
      enabled: true
      size: 20Gi

    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Redis configuration
redis:
  enabled: true
  auth:
    enabled: true
    password: redis_secret

  master:
    persistence:
      enabled: true
      size: 5Gi

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 5Gi

    resources:
      limits:
        cpu: 1000m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 256Mi

  sentinel:
    enabled: true

  metrics:
    enabled: true
    serviceMonitor:
      enabled: true

# Prometheus configuration
prometheus:
  enabled: true
  alertmanager:
    enabled: true

  server:
    persistentVolume:
      enabled: true
      size: 50Gi

    resources:
      limits:
        cpu: 2000m
        memory: 2Gi
      requests:
        cpu: 500m
        memory: 512Mi

  pushgateway:
    enabled: false

# Grafana configuration
grafana:
  enabled: true
  adminUser: admin
  adminPassword: admin

  persistence:
    enabled: true
    size: 10Gi

  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi

  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          url: http://prometheus-server
          access: proxy
          isDefault: true

# Security settings
security:
  networkPolicies:
    enabled: true

  podSecurityPolicy:
    enabled: false

  serviceAccount:
    create: true
    annotations: {}
    name: ""

# Backup configuration
backup:
  enabled: true
  schedule: "0 2 * * *"
  retention: 30

  s3:
    enabled: false
    bucket: ""
    region: ""
    accessKeyId: ""
    secretAccessKey: ""

# Monitoring configuration
monitoring:
  serviceMonitor:
    enabled: true
    interval: 30s
    path: /metrics

  prometheusRule:
    enabled: true
    rules:
      - alert: FlxCoreDown
        expr: up{job="flx-core"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "FLX Core is down"
          description: "FLX Core has been down for more than 5 minutes"

      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{pod=~"flx-.*"} / container_spec_memory_limit_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage detected"
          description: "Pod {{ $labels.pod }} memory usage is above 90%"

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{pod=~"flx-.*"}[5m]) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage detected"
          description: "Pod {{ $labels.pod }} CPU usage is above 90%"

# Node affinity configuration
nodeSelector: {}
tolerations: []
affinity: {}
