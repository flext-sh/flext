apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "flx-enterprise.fullname" . }}-config
  labels:
    {{- include "flx-enterprise.labels" . | nindent 4 }}
data:
  # Core configuration
  FLX_ENVIRONMENT: {{ .Values.global.environment | quote }}
  FLX_GRPC_HOST: {{ include "flx-enterprise.fullname" . }}-core
  FLX_GRPC_PORT: "50051"

  # Django configuration
  DJANGO_SETTINGS_MODULE: "flx_web.settings.production"
  DJANGO_ALLOWED_HOSTS: {{ .Values.web.env.DJANGO_ALLOWED_HOSTS | quote }}

  # API configuration
  FLX_API_WORKERS: {{ .Values.api.env.FLX_API_WORKERS | quote }}
  FLX_CORS_ORIGINS: {{ .Values.api.env.FLX_CORS_ORIGINS | quote }}

  # Monitoring configuration
  FLX_METRICS_ENABLED: "true"
  FLX_METRICS_PORT: "9090"

  # Meltano configuration
  MELTANO_PROJECT_ROOT: "/app/meltano"
  MELTANO_ENVIRONMENT: {{ .Values.global.environment | quote }}
