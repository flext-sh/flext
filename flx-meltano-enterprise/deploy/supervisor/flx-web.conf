[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx/access.log
stderr_logfile=/var/log/nginx/error.log
priority=10

[program:gunicorn]
command=/usr/local/bin/gunicorn flx_web.wsgi:application
    --bind unix:/app/tmp/gunicorn.sock
    --workers 4
    --worker-class sync
    --timeout 120
    --access-logfile -
    --error-logfile -
    --log-level info
directory=/app/src
user=flx
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/app/logs/gunicorn.log
environment=PATH="/usr/local/bin:/usr/bin:/bin",
    PYTHONPATH="/app/src:%(ENV_PYTHONPATH)s",
    DJANGO_SETTINGS_MODULE="flx_web.settings.production"
priority=20

[program:django-migrate]
command=/usr/local/bin/python -m flx_web.manage migrate --noinput
directory=/app/src
user=flx
startsecs=0
autorestart=false
autostart=true
stdout_logfile=/app/logs/migrate.log
stderr_logfile=/app/logs/migrate.err
environment=PATH="/usr/local/bin:/usr/bin:/bin",
    PYTHONPATH="/app/src:%(ENV_PYTHONPATH)s",
    DJANGO_SETTINGS_MODULE="flx_web.settings.production"
priority=5

[program:celery-worker]
command=/usr/local/bin/celery -A flx_web worker -l info -c 4
directory=/app/src
user=flx
autostart=true
autorestart=true
stdout_logfile=/app/logs/celery-worker.log
stderr_logfile=/app/logs/celery-worker.err
environment=PATH="/usr/local/bin:/usr/bin:/bin",
    PYTHONPATH="/app/src:%(ENV_PYTHONPATH)s",
    DJANGO_SETTINGS_MODULE="flx_web.settings.production"
priority=30

[program:celery-beat]
command=/usr/local/bin/celery -A flx_web beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
directory=/app/src
user=flx
autostart=true
autorestart=true
stdout_logfile=/app/logs/celery-beat.log
stderr_logfile=/app/logs/celery-beat.err
environment=PATH="/usr/local/bin:/usr/bin:/bin",
    PYTHONPATH="/app/src:%(ENV_PYTHONPATH)s",
    DJANGO_SETTINGS_MODULE="flx_web.settings.production"
priority=30
