[tool.poetry]
name = "flx-meltano-enterprise"
version = "2.0.0"
description = "FLX Enterprise Data Platform - Built on Meltano"
authors = ["FLX Team <team@flx.io>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "flx", from = "src" },
    { include = "flx_web", from = "src" },
    { include = "flx_api", from = "src" },
    { include = "flx_cli", from = "src" },
    { include = "flx_extensions", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.11"

# Core dependencies
pydantic = "^2.11.0"
pydantic-settings = "^2.3.0"

# Async and concurrency
uvloop = "^0.21.0"
aiofiles = "^24.1.0"

# gRPC
grpcio = "^1.68.1"
grpcio-tools = "^1.68.1"

# Database
asyncpg = "^0.30.0"
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"

# Redis
redis = "^5.2.1"

# Message Queue
aio-pika = "^9.5.2"
celery = "^5.4.0"

# Web Framework - Django
django = "^5.1.5"
django-redis = "^5.4.0"
djangorestframework = "^3.15.2"
django-cors-headers = "^4.6.0"
gunicorn = "^23.0.0"
whitenoise = "^6.8.2"

# API Framework - FastAPI
fastapi = "^0.115.6"
uvicorn = "^0.34.0"
httpx = "^0.28.1"
websockets = "^14.1"
python-multipart = "^0.0.20"

# CLI Framework
click = "^8.1.8"
rich = "^13.9.4"
typer = "^0.15.1"

# Authentication
pyjwt = "^2.10.1"
passlib = "^1.7.4"
python-jose = "^3.3.0"

# Monitoring & Logging
structlog = "^25.1.0"
prometheus-client = "^0.21.1"
opentelemetry-api = "^1.29.0"
opentelemetry-sdk = "^1.29.0"
sentry-sdk = "^2.19.2"
python-json-logger = "^3.2.0"

# Utilities
python-dotenv = "^1.0.1"
tenacity = "^9.0.0"
croniter = "^5.0.0"
pyyaml = "^6.0.2"
orjson = "^3.10.12"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
pytest-cov = "^6.0.0"
pytest-xdist = "^3.6.1"
pytest-timeout = "^2.3.1"
pytest-django = "^4.10.0"
factory-boy = "^3.3.1"
faker = "^33.1.0"

# Type checking & linting
mypy = "^1.14.1"
black = "^24.8.0"
ruff = "^0.8.5"
isort = "^5.13.2"
bandit = "^1.8.0"

# Documentation
mkdocs = "^1.6.1"
mkdocs-material = "^9.5.0"

[tool.poetry.scripts]
flx = "flx_cli.cli:main"
flx-daemon = "flx.daemon:main"
flx-web = "flx_web.manage:main"
flx-api = "flx_api.main:start"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
