[build-system]
requires = [ "poetry-core",]
build-backend = "poetry.core.masonry.api"

[project]
name = "flext-meltano-bridge"
dynamic = [ "version",]
description = "FLEXT Meltano Bridge - Go integration for Meltano using gopy"
readme = "README.md"
requires-python = ">=3.13,<3.14"
keywords = [ "flext", "meltano", "bridge", "go", "gopy", "integration", "enterprise",]
classifiers = [ "Development Status :: 4 - Beta", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Operating System :: OS Independent", "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3 :: Only", "Topic :: Software Development :: Libraries :: Python Modules", "Topic :: System :: Systems Administration", "Typing :: Typed",]
dependencies = [ "meltano>=3.7.9", "pydantic>=2.11.0", "click>=8.1.7", "structlog>=21.0.0",]
[[project.authors]]
name = "FLEXT Team"
email = "team@flext.sh"

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/flext-sh/flext-meltano-bridge"
Repository = "https://github.com/flext-sh/flext-meltano-bridge"
Documentation = "https://github.com/flext-sh/flext-meltano-bridge/blob/main/README.md"
"Bug Tracker" = "https://github.com/flext-sh/flext-meltano-bridge/issues"
Changelog = "https://github.com/flext-sh/flext-meltano-bridge/blob/main/CHANGELOG.md"

[tool.poetry]
version = "0.6.0"
[[tool.poetry.packages]]
include = "flext_meltano_bridge"
from = "src"

[tool.ruff]
line-length = 88
target-version = "py312"
fix = true

[tool.black]
line-length = 88
target-version = [ "py312",]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.poetry.dependencies]
python = ">=3.13,<3.14"

[tool.ruff.lint]
ignore = [ "COM812", "ISC001", "D203", "D213", "T201", "S101", "INP001", "D100", "D101", "D102", "D103", "D105", "D107", "D401", "D417", "ANN001", "ANN201", "ANN202", "ANN204", "ANN401", "ANN003", "ANN002", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "C901",]
select = [ "ALL",]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [ "--strict-markers", "--strict-config", "--verbose", "--tb=short", "--cov=src", "--cov-report=term-missing:skip-covered", "--cov-report=html:reports/coverage", "--cov-report=xml:reports/coverage.xml", "--cov-fail-under=85", "--junitxml=reports/pytest.xml", "--maxfail=5", "--timeout=60", "--disable-warnings", "--randomly-seed=1234", "--randomly-dont-reorganize",]
testpaths = [ "tests",]
python_files = [ "test_*.py", "*_test.py",]
python_classes = [ "Test*",]
python_functions = [ "test_*",]
markers = [ "slow: marks tests as slow (deselect with '-m \"not slow\"')", "fast: marks tests as fast", "integration: marks tests as integration tests", "unit: marks tests as unit tests", "e2e: marks tests as end-to-end tests", "domain: marks tests as domain tests", "application: marks tests as application layer tests", "infrastructure: marks tests as infrastructure tests", "api: marks tests as API tests", "cli: marks tests as CLI tests", "performance: marks tests as performance tests", "benchmark: marks tests as benchmark tests", "security: marks tests as security tests", "load: marks tests as load tests", "requires_database: tests that need database", "requires_redis: tests that need Redis", "requires_ldap: tests that need LDAP server", "requires_oracle: tests that need Oracle database", "requires_network: tests that need network access", "local_only: tests that only run locally", "ci_only: tests that only run in CI", "docker: tests that require Docker",]
filterwarnings = [ "error", "ignore::UserWarning", "ignore::DeprecationWarning", "ignore::PendingDeprecationWarning", "ignore::pytest.PytestCollectionWarning" ]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_auto_indent = true
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = [ "src",]
omit = [ "*/tests/*", "*/test_*", "*/*_test.py", "*/conftest.py", "*/__pycache__/*", "*/site-packages/*", "*/.venv/*", "*/venv/*", "*/build/*", "*/dist/*", "*/.eggs/*", "*/migrations/*", "*/static/*", "*/media/*", "manage.py", "*/settings/*", "*/__init__.py",]
data_file = "reports/.coverage"
parallel = true
concurrency = [ "thread", "multiprocessing",]
dynamic_context = "test_function"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
precision = 2
fail_under = 85
exclude_lines = [ "pragma: no cover", "def __repr__", "if self.debug:", "if settings.DEBUG", "raise AssertionError", "raise NotImplementedError", "if 0:", "if __name__ == .__main__.:", "class .*\\bProtocol\\):", "@(abc\\.)?abstractmethod", "TYPE_CHECKING", "\\.\\.\\.", "pass", "def __str__", "def __unicode__",]

[tool.coverage.html]
directory = "reports/coverage"
title = "Flext-Meltano-Bridge Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"
show_contexts = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = [ "S101", "PLR2004", "D", "ANN",]

[tool.pytest.ini_options.markers_by_type]
singer = [ "tap: marks tests for Singer taps", "target: marks tests for Singer targets", "stream: marks tests for data streams", "catalog: marks tests for catalog discovery", "state: marks tests for state management",]
django = [ "django_db: marks tests as requiring database access", "selenium: marks tests as requiring selenium", "client: marks tests using Django test client", "REDACTED_LDAP_BIND_PASSWORD: marks tests for Django REDACTED_LDAP_BIND_PASSWORD",]
grpc = [ "grpc_server: marks tests requiring gRPC server", "proto: marks tests for protobuf validation", "streaming: marks tests for streaming RPCs", "interceptor: marks tests for gRPC interceptors",]
observability = [ "metrics: marks tests as metrics tests", "tracing: marks tests as tracing tests", "health: marks tests as health check tests", "prometheus: tests that need Prometheus", "grafana: tests that need Grafana",]

[tool.setuptools.dynamic.version]
attr = "flext_meltano_bridge.__version__.__version__"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
ruff = "^0.8.4"
mypy = "^1.13.0"
black = "^24.10.0"
isort = "^5.13.0"
