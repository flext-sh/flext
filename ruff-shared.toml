
exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "archive",
    "backup",
    "build",
    "dist",
    "htmlcov",
    "temp-backup",
    "venv",
]
fix = false
format.docstring-code-format = true
format.indent-style = "space"
format.line-ending = "lf"
format.quote-style = "double"
line-length = 88
lint.ignore = [
    "B017",
    "BLE001",
    "C901",    # Too complex (some functions need complexity)
    "COM812",
    "D102",    # Missing docstring in public method (test methods don't need them)
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in __init__
    "D203",    # conflicting with D211 (blank line before class)
    "D213",    # conflicting with D212 (summary line position)
    "D401",    # non-imperative-mood: too opinionated in multilingual codebase
    "E501",    # line-too-long
    "ERA001",  # False positives on legitimate comments
    "G004",
#    "N999",    # Invalid module name (examples use numbered prefixes)
    "PLR0913", # Too many arguments in function definition (sometimes necessary)
    "RUF002",
    "RUF003",
    "RUF100",
    "SLF001",
    "TC001",   # Pydantic requirement
    "TC002",   # Pydantic requirement
    "TC003",   # Pydantic requirement
    "TRY300",
]
lint.isort.force-single-line = false
lint.isort.split-on-trailing-comma = true
lint.isort.combine-as-imports = true
lint.per-file-ignores."**/__init__.py" = [
    "E402",   # Import not at top of file
    "F401",   # Unused imports (common in __init__.py)
    "I001",   # Import sorting
    "RUF022", # __all__ sorting
]
lint.per-file-ignores."**/*_pb2_grpc.py" = ["ALL"]
lint.per-file-ignores."**/*_pb2.py" = ["ALL"]
lint.per-file-ignores."**/generated/**/*.py" = ["ALL"]
lint.per-file-ignores."**/proto/*_pb2_grpc.py" = ["ALL"]
lint.per-file-ignores."**/proto/*_pb2.py" = ["ALL"]
lint.per-file-ignores."**/examples/**" = [
    "EXE001",
    "INP001",
    "N999",
    "T201",
    "TID252",
]
lint.per-file-ignores."**/scripts/**" = [
    "EXE001",
    "INP001",
#     "N999",
    "PLR0911",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "S107",
    "T201",
    "TID252",

]
lint.per-file-ignores."**/test_*.py" = [
    "EM102",
    "FBT003",
    "INP001",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PT011",
    "S101",
    "S103",
    "S104",
    "S105",
    "S106",
    "S107",
    "S112",
    "S603",
    "TID252",
    "TRY003",
]
lint.per-file-ignores."**/tests/**" = [
    "EM102",
    "FBT003",
    "INP001",
    "PLR0912",
    "PLR0915",
    "PLR2004",
    "PT011",
    "S101",
    "S103",
    "S104",
    "S105",
    "S106",
    "S107",
    "S112",
    "S603",
    "TID252",
    "TRY003",
]
lint.per-file-ignores."**/typings/**" = ["PYI001"]
lint.select = ["ALL"]
respect-gitignore = true
show-fixes = true
src = ["examples", "scripts", "src", "tests"]
target-version = "py313"
lint.pep8-naming.classmethod-decorators = ["classmethod"]
lint.pep8-naming.staticmethod-decorators = ["staticmethod"]
