version: "3.8"

services:
  # Oracle Database 23c Free - Latest version for testing
  oracle-db:
    image: container-registry.oracle.com/database/free:latest
    container_name: flext-oracle-db-e2e
    environment:
      # Oracle Database Configuration
      ORACLE_PWD: Oracle123!
      ORACLE_PDB: FLEXT_PDB
      ORACLE_CHARACTERSET: AL32UTF8
      ORACLE_EDITION: free

      # Performance settings for testing
      ORACLE_SGA_SIZE: 2GB
      ORACLE_PGA_SIZE: 1GB

      # Faster startup for E2E testing
      ORACLE_INIT_SGA_SIZE: 1GB
      ORACLE_INIT_PGA_SIZE: 512MB

    ports:
      - "1521:1521"
      - "5500:5500" # Oracle Enterprise Manager Express

    volumes:
      # Persistent data for development
      - oracle_data:/opt/oracle/oradata

      # Initialize scripts for FLEXT testing
      - ./scripts/oracle-init:/opt/oracle/scripts/setup
      - ./scripts/oracle-init:/opt/oracle/scripts/startup

    shm_size: 2gb

    # Health check for Oracle Database readiness
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "sqlplus -s sys/Oracle123!@localhost:1521/FLEXT_PDB as sysdba <<< 'SELECT 1 FROM DUAL;' | grep -q '1'",
        ]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 5

    # Resource limits for CI/CD
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 2G
          cpus: "1.0"

    networks:
      - flext-oracle-network

  # FLEXT Oracle E2E Test Runner
  flext-oracle-e2e:
    build:
      context: .
      dockerfile: docker/Dockerfile.oracle-e2e
      args:
        PYTHON_VERSION: "3.13"
        FLEXT_VERSION: "0.7.0"

    container_name: flext-oracle-e2e-runner

    environment:
      # Oracle Database Connection
      ORACLE_HOST: oracle-db
      ORACLE_PORT: 1521
      ORACLE_SERVICE_NAME: FLEXT_PDB
      ORACLE_USERNAME: FLEXT_USER
      ORACLE_PASSWORD: FlextTest123!
      ORACLE_SCHEMA: FLEXT_TEST

      # FLEXT Configuration
      FLEXT_ENV: testing
      FLEXT_DEBUG: "true"
      FLEXT_LOG_LEVEL: DEBUG
      PYTHONPATH: /workspace/src

      # Singer Testing Configuration
      TAP_ORACLE_BATCH_SIZE: 1000
      TAP_ORACLE_MAX_PARALLEL_STREAMS: 2
      TAP_ORACLE_CONNECTION_POOL_SIZE: 3

      TARGET_ORACLE_BATCH_SIZE: 500
      TARGET_ORACLE_MAX_PARALLELISM: 2
      TARGET_ORACLE_LOAD_METHOD: append-only

      # DBT Testing Configuration
      DBT_PROFILES_DIR: /workspace/tests/dbt/profiles
      DBT_PROJECT_DIR: /workspace/tests/dbt/projects/oracle_test

      # E2E Test Configuration
      E2E_TEST_TIMEOUT: 300
      E2E_ORACLE_SAMPLE_SIZE: 10000
      E2E_CREATE_TEST_DATA: "true"
      E2E_CLEANUP_AFTER_TEST: "true"

    volumes:
      # Mount workspace for development
      - .:/workspace

      # Cache directories for faster builds
      - flext_poetry_cache:/root/.cache/pypoetry
      - flext_pip_cache:/root/.cache/pip
      - flext_mypy_cache:/root/.cache/mypy

      # Test results and artifacts
      - ./test-results:/workspace/test-results
      - ./test-reports:/workspace/test-reports

    working_dir: /workspace

    # Wait for Oracle to be ready
    depends_on:
      oracle-db:
        condition: service_healthy

    # Override for development
    command: ["tail", "-f", "/dev/null"]

    networks:
      - flext-oracle-network

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 1G
          cpus: "0.5"

  # Oracle SQL Developer Web (Optional - for debugging)
  oracle-sqldev:
    image: container-registry.oracle.com/database/sqldev-web:latest
    container_name: flext-oracle-sqldev

    environment:
      DATABASE_HOSTNAME: oracle-db
      DATABASE_PORT: 1521
      DATABASE_SERVICE: FLEXT_PDB

    ports:
      - "8080:8080"

    depends_on:
      oracle-db:
        condition: service_healthy

    networks:
      - flext-oracle-network

    profiles:
      - dev # Only include in development profile

volumes:
  # Persistent Oracle data
  oracle_data:
    driver: local
    name: flext_oracle_e2e_data

  # Cache volumes for faster development
  flext_poetry_cache:
    driver: local
    name: flext_poetry_cache

  flext_pip_cache:
    driver: local
    name: flext_pip_cache

  flext_mypy_cache:
    driver: local
    name: flext_mypy_cache

networks:
  flext-oracle-network:
    driver: bridge
    name: flext-oracle-e2e-network
