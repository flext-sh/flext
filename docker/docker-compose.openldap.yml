# FLEXT Shared LDAP Container - Single Definition for All Projects
# Used by: flext-ldap, flext-ldif, flext-tap-ldap, flext-target-ldap, flext-dbt-ldap
# This eliminates container conflicts and provides consistent testing infrastructure

services:
  # Shared OpenLDAP Server for all FLEXT projects
  openldap:
    image: osixia/openldap:1.5.0
    container_name: flext-openldap-test
    environment:
      # Core LDAP Configuration
      LDAP_ORGANISATION: "FLEXT Shared Test Organization"
      LDAP_DOMAIN: "internal.invalid"
      LDAP_BASE_DN: "dc=flext,dc=local"
      LDAP_ADMIN_PASSWORD: "REDACTED_LDAP_BIND_PASSWORD123"
      LDAP_CONFIG_PASSWORD: "config123"

      # User Configuration
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly123"

      # Schema and Backend
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_BACKEND: "mdb"

      # Security Configuration
      LDAP_TLS: "false"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_DH_PARAM_FILENAME: "dhparam.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_CIPHER_SUITE: "SECURE256:-VERS-SSL3.0"
      LDAP_TLS_PROTOCOL_MIN: "3.1"
      LDAP_TLS_VERIFY_CLIENT: "demand"

      # Replication and Setup
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_SSL_HELPER_PREFIX: "ldap"

    ports:
      - "3390:389" # Shared LDAP port for all FLEXT projects
      - "3636:636" # Standard LDAPS port

    volumes:
      - flext_ldap_data:/var/lib/ldap
      - flext_ldap_config:/etc/ldap/slapd.d
      - ./openldap/bootstrap.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro

    command: --copy-service --loglevel debug

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost -b dc=flext,dc=local -D 'cn=REDACTED_LDAP_BIND_PASSWORD,dc=flext,dc=local' -w REDACTED_LDAP_BIND_PASSWORD123 -s base '(objectClass=*)'",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

    networks:
      - flext-shared-network

  # Optional LDAP Admin Interface
  openldap-REDACTED_LDAP_BIND_PASSWORD:
    image: osixia/phpldapREDACTED_LDAP_BIND_PASSWORD:0.9.0
    container_name: flext-openldap-test-REDACTED_LDAP_BIND_PASSWORD
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8080:80"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - flext-shared-network
    profiles:
      - REDACTED_LDAP_BIND_PASSWORD

volumes:
  flext_ldap_data:
    driver: local
  flext_ldap_config:
    driver: local

networks:
  flext-shared-network:
    driver: bridge
