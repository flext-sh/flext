# FlexCore Go Service Test Container
# Service name: flexcore
# Container name: flext-flexcore-test

services:
  flexcore:
    build:
      context: ../flexcore
      dockerfile: ../docker/flexcore/Dockerfile
    container_name: flext-flexcore-test
    ports:
      - "8090:8080" # HTTP API
      - "50051:50051" # gRPC API
      - "9091:9090" # Metrics
    environment:
      FLEXCORE_ENV: test
      FLEXCORE_DEBUG: "true"
      FLEXCORE_PORT: 8080
      FLEXCORE_GRPC_PORT: 50051
      FLEXCORE_METRICS_PORT: 9090
    volumes:
      - ../flexcore:/app:ro
      - flexcore_test_cache:/app/.cache
    command: ./bin/flexcore server
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - flext-shared-network

volumes:
  flexcore_test_cache:
    driver: local

networks:
  flext-shared-network:
    driver: bridge
