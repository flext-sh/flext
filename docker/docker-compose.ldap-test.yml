version: "3.8"
services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: flext-test-ldap
    environment:
      LDAP_ORGANISATION: "FLEXT Test Organization"
      LDAP_DOMAIN: "flext-test.local"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "config123"
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: "readonly"
      LDAP_READONLY_USER_PASSWORD: "readonly123"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS: "true"
      LDAP_TLS_CRT_FILENAME: "ldap.crt"
      LDAP_TLS_KEY_FILENAME: "ldap.key"
      LDAP_TLS_DH_PARAM_FILENAME: "dhparam.pem"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_CIPHER_SUITE: "SECURE256:-VERS-SSL3.0"
      LDAP_TLS_PROTOCOL_MIN: "3.1"
      LDAP_TLS_VERIFY_CLIENT: "demand"
      LDAP_REPLICATION: "false"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_SSL_HELPER_PREFIX: "ldap"
    ports:
      - "11389:389"
      - "11636:636"
    volumes:
      - ./tests/fixtures/test-data.ldif:/container/service/slapd/assets/config/bootstrap/ldif/test-data.ldif
    command: --copy-service --loglevel debug
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "ldapsearch -x -H ldap://localhost -b dc=flext-test,dc=local -D 'cn=admin,dc=flext-test,dc=local' -w admin123",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - flext-test-network

  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: flext-test-ldap-admin
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "8180:80"
    depends_on:
      - openldap
    networks:
      - flext-test-network

networks:
  flext-test-network:
    driver: bridge
