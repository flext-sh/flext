global
    daemon
    maxconn 4096
    log stdout local0

defaults
    mode http
    timeout connect 5000ms
    timeout client 50000ms
    timeout server 50000ms
    option httplog
    log global

frontend flext_frontend
    bind *:80
    default_backend flext_backend

backend flext_backend
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    server flext-node-1 flext-node-1:8080 check inter 30s fall 3 rise 2
    server flext-node-2 flext-node-2:8080 check inter 30s fall 3 rise 2
    server flext-node-3 flext-node-3:8080 check inter 30s fall 3 rise 2

frontend stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 30s
    stats REDACTED_LDAP_BIND_PASSWORD if TRUE