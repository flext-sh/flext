# FLEXT Services Virtual Host Configuration

# FLEXT Web Interface (Primary)
server {
    listen 80;
    server_name localhost flext-web _;

    # Security headers
    add_header X-Frame-Options DENY;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # Web Interface (Flask Dashboard)
    location / {
        limit_req zone=web burst=20 nodelay;
        
        proxy_pass http://flext_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        
        # WebSocket support for real-time updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # FLEXT API Service (Backend)
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        
        # Strip /api prefix and forward to service
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://flext_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;  # Longer timeout for data processing
        
        # Handle large request bodies for data uploads
        client_max_body_size 100M;
    }

    # Direct FLEXT Service Access (for advanced users)
    location /service/ {
        limit_req zone=api burst=5 nodelay;
        
        # Strip /service prefix and forward
        rewrite ^/service/(.*) /$1 break;
        
        proxy_pass http://flext_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
    }

    # Health checks (no rate limiting)
    location /health {
        proxy_pass http://flext_web;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        access_log off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
    }

    # Metrics endpoint (Prometheus)
    location /metrics {
        proxy_pass http://flext_service/metrics;
        proxy_set_header Host $http_host;
        
        # Restrict access to monitoring systems
        allow 172.20.0.0/16;  # Docker network
        allow 127.0.0.1;      # Localhost
        deny all;
        
        access_log off;
    }

    # Static files caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://flext_web;
        proxy_cache_valid 200 1d;
        add_header Cache-Control "public, max-age=86400";
        
        access_log off;
    }

    # Security - block sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ \.(sql|log|env)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# FLEXT Service Direct Access (Port 8080)
server {
    listen 8080;
    server_name flext-api api.localhost;

    # Direct access to FLEXT Go service
    location / {
        limit_req zone=api burst=15 nodelay;
        
        proxy_pass http://flext_service;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s;
        
        client_max_body_size 100M;
    }
}