# ===== FLEXT DOCKER COMPOSE TEMPLATE =====
# =========================================
# Unified Docker Compose template for all FLEXT deployment scenarios
# Supports: development, distributed, cluster modes with profiles
# Based on FLEXT enterprise standards

version: "3.8"

# ===== GLOBAL CONFIGURATION =====
x-common-variables: &common-variables
  FLEXT_ENV: ${FLEXT_ENV:-development}
  FLEXT_DEBUG: ${FLEXT_DEBUG:-true}
  FLEXT_LOG_LEVEL: ${FLEXT_LOG_LEVEL:-info}
  FLEXT_HOST: ${FLEXT_HOST:-0.0.0.0}
  PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
  PYTHONPATH: ${PYTHONPATH:-/app/src}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

x-database-variables: &database-variables
  FLEXT_DB_TYPE: ${FLEXT_DB_TYPE:-postgresql}
  FLEXT_DB_HOST: ${FLEXT_DB_HOST:-postgres}
  FLEXT_DB_PORT: ${FLEXT_DB_PORT:-5432}
  FLEXT_DB_NAME: ${FLEXT_DB_NAME:-{{PROJECT_NAME}}}
  FLEXT_DB_USER: ${FLEXT_DB_USER:-flext}
  FLEXT_DB_PASSWORD: ${FLEXT_DB_PASSWORD:-flext_dev_password}
  FLEXT_DB_POOL_SIZE: ${FLEXT_DB_POOL_SIZE:-20}
  FLEXT_DB_MAX_OVERFLOW: ${FLEXT_DB_MAX_OVERFLOW:-30}

x-redis-variables: &redis-variables
  FLEXT_REDIS_HOST: ${FLEXT_REDIS_HOST:-redis}
  FLEXT_REDIS_PORT: ${FLEXT_REDIS_PORT:-6379}
  FLEXT_REDIS_PASSWORD: ${FLEXT_REDIS_PASSWORD:-flext_redis_password}
  FLEXT_REDIS_DB: ${FLEXT_REDIS_DB:-0}

x-auth-variables: &auth-variables
  FLEXT_SECRET_KEY: ${FLEXT_SECRET_KEY:-flext_super_secret_key_change_in_production}
  FLEXT_JWT_SECRET: ${FLEXT_JWT_SECRET:-flext_jwt_secret_change_in_production}
  FLEXT_JWT_ALGORITHM: ${FLEXT_JWT_ALGORITHM:-HS256}
  FLEXT_JWT_EXPIRATION: ${FLEXT_JWT_EXPIRATION:-3600}

x-observability-variables: &observability-variables
  FLEXT_METRICS_ENABLED: ${FLEXT_METRICS_ENABLED:-true}
  FLEXT_TRACING_ENABLED: ${FLEXT_TRACING_ENABLED:-true}
  FLEXT_LOGGING_STRUCTURED: ${FLEXT_LOGGING_STRUCTURED:-true}
  OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-{{PROJECT_NAME}}}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:14268/api/traces}

x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 40s

services:
  # ===== CORE INFRASTRUCTURE =====

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME}}-postgres
    environment:
      POSTGRES_DB: ${FLEXT_DB_NAME:-{{PROJECT_NAME}}}
      POSTGRES_USER: ${FLEXT_DB_USER:-flext}
      POSTGRES_PASSWORD: ${FLEXT_DB_PASSWORD:-flext_dev_password}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-{{PROJECT_NAME}},{{PROJECT_NAME}}_test}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
      - ./docker/postgres/init-schema.sql:/docker-entrypoint-initdb.d/01-init-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FLEXT_DB_USER:-flext} -d ${FLEXT_DB_NAME:-{{PROJECT_NAME}}}"]
      <<: *healthcheck-defaults
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped

  # Redis Cache & Coordination
  redis:
    image: redis:7-alpine
    container_name: {{PROJECT_NAME}}-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-flext_redis_password}
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      <<: *healthcheck-defaults
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped

  # ===== MAIN APPLICATION =====

  # FLEXT Application (Single Node)
  {{PROJECT_NAME}}-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.13}
        PROJECT_NAME: {{PROJECT_NAME}}
    container_name: {{PROJECT_NAME}}-app
    environment:
      <<: *common-variables
      FLEXT_DB_TYPE: ${FLEXT_DB_TYPE:-postgresql}
      FLEXT_DB_HOST: ${FLEXT_DB_HOST:-postgres}
      FLEXT_DB_PORT: ${FLEXT_DB_PORT:-5432}
      FLEXT_DB_NAME: ${FLEXT_DB_NAME:-{{PROJECT_NAME}}}
      FLEXT_DB_USER: ${FLEXT_DB_USER:-flext}
      FLEXT_DB_PASSWORD: ${FLEXT_DB_PASSWORD:-flext_dev_password}
      FLEXT_REDIS_HOST: ${FLEXT_REDIS_HOST:-redis}
      FLEXT_REDIS_PORT: ${FLEXT_REDIS_PORT:-6379}
      FLEXT_REDIS_PASSWORD: ${FLEXT_REDIS_PASSWORD:-flext_redis_password}
      FLEXT_SECRET_KEY: ${FLEXT_SECRET_KEY:-flext_super_secret_key_change_in_production}
      FLEXT_METRICS_ENABLED: ${FLEXT_METRICS_ENABLED:-true}
      FLEXT_TRACING_ENABLED: ${FLEXT_TRACING_ENABLED:-true}
      FLEXT_PORT: ${FLEXT_PORT:-8080}
      FLEXT_WORKERS: ${FLEXT_WORKERS:-4}
      NODE_ID: ${NODE_ID:-single-node}
    ports:
      - "${FLEXT_PORT:-8080}:8080"
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      <<: *healthcheck-defaults
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - single
      - dev

  # ===== DISTRIBUTED NODES (Cluster Mode) =====

  # FLEXT Node 1 (Leader candidate)
  {{PROJECT_NAME}}-node-1:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: {{PROJECT_NAME}}-node-1
    environment:
      <<: *common-variables
      <<: *database-variables
      <<: *redis-variables
      <<: *auth-variables
      <<: *observability-variables
      FLEXT_PORT: 8080
      FLEXT_WORKERS: ${FLEXT_NODE1_WORKERS:-10}
      NODE_ID: node-1
      CLUSTER_NAME: {{PROJECT_NAME}}-cluster
      FLEXT_DISTRIBUTED: "true"
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    command: ["/app/{{PROJECT_NAME}}", "-distributed"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      <<: *healthcheck-defaults
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - cluster
      - distributed

  # FLEXT Node 2
  {{PROJECT_NAME}}-node-2:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: {{PROJECT_NAME}}-node-2
    environment:
      <<: *common-variables
      <<: *database-variables
      <<: *redis-variables
      <<: *auth-variables
      <<: *observability-variables
      FLEXT_PORT: 8080
      FLEXT_WORKERS: ${FLEXT_NODE2_WORKERS:-8}
      NODE_ID: node-2
      CLUSTER_NAME: {{PROJECT_NAME}}-cluster
      FLEXT_DISTRIBUTED: "true"
    ports:
      - "8081:8080"
      - "9091:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      {{PROJECT_NAME}}-node-1:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    command: ["/app/{{PROJECT_NAME}}", "-distributed"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      <<: *healthcheck-defaults
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - cluster
      - distributed

  # FLEXT Node 3
  {{PROJECT_NAME}}-node-3:
    build:
      context: .
      dockerfile: Dockerfile
      target: ${DOCKER_TARGET:-production}
    container_name: {{PROJECT_NAME}}-node-3
    environment:
      <<: *common-variables
      <<: *database-variables
      <<: *redis-variables
      <<: *auth-variables
      <<: *observability-variables
      FLEXT_PORT: 8080
      FLEXT_WORKERS: ${FLEXT_NODE3_WORKERS:-6}
      NODE_ID: node-3
      CLUSTER_NAME: {{PROJECT_NAME}}-cluster
      FLEXT_DISTRIBUTED: "true"
    ports:
      - "8082:8080"
      - "9092:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      {{PROJECT_NAME}}-node-1:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    command: ["/app/{{PROJECT_NAME}}", "-distributed"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      <<: *healthcheck-defaults
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - cluster
      - distributed

  # ===== LOAD BALANCER =====

  # HAProxy Load Balancer
  load-balancer:
    image: haproxy:2.8-alpine
    container_name: {{PROJECT_NAME}}-lb
    ports:
      - "${LB_PORT:-80}:80"
      - "${LB_STATS_PORT:-8404}:8404"
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - {{PROJECT_NAME}}-node-1
      - {{PROJECT_NAME}}-node-2
      - {{PROJECT_NAME}}-node-3
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - cluster
      - distributed
      - proxy

  # ===== OBSERVABILITY STACK =====

  # Prometheus Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: {{PROJECT_NAME}}-prometheus
    ports:
      - "${PROMETHEUS_EXTERNAL_PORT:-9093}:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - observability
      - monitoring

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: {{PROJECT_NAME}}-grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-REDACTED_LDAP_BIND_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - observability
      - monitoring

  # Jaeger Tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: {{PROJECT_NAME}}-jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - {{PROJECT_NAME}}-network
    restart: unless-stopped
    profiles:
      - observability
      - tracing

# ===== NETWORKS =====
networks:
  {{PROJECT_NAME}}-network:
    driver: bridge
    name: {{PROJECT_NAME}}-network

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
    name: {{PROJECT_NAME}}-postgres-data
  redis_data:
    driver: local
    name: {{PROJECT_NAME}}-redis-data
  prometheus_data:
    driver: local
    name: {{PROJECT_NAME}}-prometheus-data
  grafana_data:
    driver: local
    name: {{PROJECT_NAME}}-grafana-data 
