# ===== FLEXT STANDARD PRE-COMMIT CONFIGURATION =====
# Modern, comprehensive pre-commit hooks for Python 3.13
# Ensures code quality before commits reach the repository
# All tools use latest versions with maximum strictness

repos:
  # ===== BUILT-IN HOOKS =====
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-json
      - id: check-xml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: fix-byte-order-marker
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: name-tests-test
        args: [--pytest-test-first]
      - id: requirements-txt-fixer
      - id: sort-simple-yaml
      - id: file-contents-sorter
        files: ^(\.gitignore|\.dockerignore)$

  # ===== PYTHON CODE QUALITY =====
  # Ruff - Modern all-in-one linter & formatter (replaces flake8, isort, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        name: ruff-lint
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --show-fixes
          - --select=ALL
          - --preview
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        types_or: [python, pyi]

  # Black - The uncompromising code formatter (complementary to Ruff)
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        name: black-format
        language_version: python3.13
        args: [--target-version=py313]

  # isort - Import sorting (complementary to Ruff)
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort-imports
        args:
          - --profile=black
          - --force-sort-within-sections
          - --skip-gitignore

  # ===== TYPE CHECKING =====
  # MyPy - Static type checker
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        name: mypy-type-check
        args:
          - --strict
          - --show-error-codes
          - --pretty
          - --python-version=3.13
        additional_dependencies:
          - types-requests
          - types-setuptools
          - types-python-dateutil
          - types-toml
        exclude: ^(tests/|examples/|scripts/)

  # ===== SECURITY =====
  # Bandit - Security linter for Python
  - repo: https://github.com/pycqa/bandit
    rev: 1.8.0
    hooks:
      - id: bandit
        name: bandit-security
        args:
          - -r
          - src/
          - -ll
          - -f
          - json
        exclude: ^tests/

  # Safety - Dependency vulnerability scanner
  - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
    rev: v1.3.2
    hooks:
      - id: python-safety-dependencies-check
        name: safety-check
        files: pyproject.toml

  # Semgrep - Static analysis for security and bugs
  - repo: https://github.com/returntocorp/semgrep
    rev: v1.104.0
    hooks:
      - id: semgrep
        name: semgrep-security
        args:
          - --config=auto
          - --error
          - --skip-unknown-extensions
        exclude: ^(tests/|examples/)

  # ===== PYTHON MODERNIZATION =====
  # pyupgrade - Automatically upgrade syntax for newer Python versions
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.0
    hooks:
      - id: pyupgrade
        name: pyupgrade-syntax
        args: [--py313-plus]

  # autoflake - Remove unused imports and variables
  - repo: https://github.com/pycqa/autoflake
    rev: v2.3.1
    hooks:
      - id: autoflake
        name: autoflake-unused
        args:
          - --remove-all-unused-imports
          - --remove-unused-variables
          - --in-place

  # ===== DOCUMENTATION =====
  # pydocstyle - Docstring style checker
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: pydocstyle-docs
        args:
          - --convention=google
          - --add-ignore=D100,D101,D102,D103,D104,D105,D107
        exclude: ^(tests/|examples/|scripts/)

  # ===== YAML & CONFIGURATION =====
  # yamllint - YAML linter
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.35.1
    hooks:
      - id: yamllint
        name: yamllint-yaml
        args:
          - --strict
          - --config-data
          - |
            extends: default
            rules:
              line-length:
                max: 88
                level: warning
              comments-indentation: disable
              comments: disable
              document-start: disable

  # ===== SECRETS DETECTION =====
  # detect-secrets - Prevent secrets from being committed
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect-secrets
        args:
          - --baseline
          - .secrets.baseline
          - --exclude-files
          - \.lock$
          - --exclude-files
          - \.min\.js$
        exclude: ^(tests/fixtures/|examples/data/)

  # ===== COMMIT MESSAGE =====
  # commitizen - Enforce conventional commit messages
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.1.1
    hooks:
      - id: commitizen
        name: commitizen-check
        stages: [commit-msg]

  # ===== DOCKER (if applicable) =====
  # hadolint - Dockerfile linter
  - repo: https://github.com/hadolint/hadolint
    rev: v2.12.0
    hooks:
      - id: hadolint-docker
        name: hadolint-dockerfile
        files: Dockerfile.*

  # ===== SHELL SCRIPTS (if applicable) =====
  # shellcheck - Shell script analysis
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        name: shellcheck-scripts
        args: [--severity=warning]

  # ===== MARKDOWN =====
  # markdownlint - Markdown linter
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.42.0
    hooks:
      - id: markdownlint
        name: markdownlint-docs
        args:
          - --config
          - .markdownlint.json

  # ===== FINAL VALIDATION =====
  # poetry - Validate pyproject.toml and lock file
  - repo: https://github.com/python-poetry/poetry
    rev: 1.8.0
    hooks:
      - id: poetry-check
        name: poetry-validate
        args: [--lock]

# ===== CONFIGURATION =====
default_language_version:
  python: python3.13

default_stages: [pre-commit]

fail_fast: false # Run all hooks even if one fails

minimum_pre_commit_version: "3.0.0"

# ===== CI CONFIGURATION =====
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: weekly
  skip: []
  submodules: false
