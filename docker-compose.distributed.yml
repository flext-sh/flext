# Docker Compose for FLEXT Distributed Development Environment
version: "3.8"

services:
  # Redis for cluster coordination
  redis:
    image: redis:7-alpine
    container_name: flext-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - flext-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # PostgreSQL for persistent storage
  postgres:
    image: postgres:15-alpine
    container_name: flext-postgres
    environment:
      POSTGRES_DB: flext_distributed
      POSTGRES_USER: flext
      POSTGRES_PASSWORD: flext
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/infrastructure/database/migrations:/docker-entrypoint-initdb.d
    networks:
      - flext-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flext -d flext_distributed"]
      interval: 10s
      timeout: 3s
      retries: 3

  # FLEXT Node 1 (Leader candidate)
  flext-node-1:
    build:
      context: .
      dockerfile: Dockerfile.distributed
    container_name: flext-node-1
    environment:
      FLEXT_SERVER_HOST: "0.0.0.0"
      FLEXT_SERVER_PORT: "8081"
      FLEXT_ENVIRONMENT: "development"
      FLEXT_DEBUG: "true"

      # Database
      FLEXT_DATABASE_ENABLED: "true"
      FLEXT_DB_HOST: "postgres"
      FLEXT_DB_PORT: "5432"
      FLEXT_DB_NAME: "flext_distributed"
      FLEXT_DB_USER: "flext"
      FLEXT_DB_PASSWORD: "flext"

      # Redis
      FLEXT_REDIS_ADDRESS: "redis:6379"

      # Distributed settings
      FLEXT_MAX_WORKERS: "10"
      FLEXT_MIN_WORKERS: "2"
      FLEXT_QUEUE_SIZE: "1000"

      # Service info
      FLEXT_SERVICE_NAME: "flext-api"
      FLEXT_SERVICE_VERSION: "2.0.0-distributed"

    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - flext-network
    volumes:
      - ./config/distributed.yaml:/app/config/config.yaml
    command:
      ["/app/flext", "-distributed", "-config", "/app/config/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FLEXT Node 2
  flext-node-2:
    build:
      context: .
      dockerfile: Dockerfile.distributed
    container_name: flext-node-2
    environment:
      FLEXT_SERVER_HOST: "0.0.0.0"
      FLEXT_SERVER_PORT: "8082"
      FLEXT_ENVIRONMENT: "development"
      FLEXT_DEBUG: "true"

      # Database
      FLEXT_DATABASE_ENABLED: "true"
      FLEXT_DB_HOST: "postgres"
      FLEXT_DB_PORT: "5432"
      FLEXT_DB_NAME: "flext_distributed"
      FLEXT_DB_USER: "flext"
      FLEXT_DB_PASSWORD: "flext"

      # Redis
      FLEXT_REDIS_ADDRESS: "redis:6379"

      # Distributed settings
      FLEXT_MAX_WORKERS: "8"
      FLEXT_MIN_WORKERS: "2"
      FLEXT_QUEUE_SIZE: "800"

      # Service info
      FLEXT_SERVICE_NAME: "flext-api"
      FLEXT_SERVICE_VERSION: "2.0.0-distributed"

    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flext-node-1:
        condition: service_healthy
    networks:
      - flext-network
    volumes:
      - ./config/distributed.yaml:/app/config/config.yaml
    command:
      ["/app/flext", "-distributed", "-config", "/app/config/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FLEXT Node 3
  flext-node-3:
    build:
      context: .
      dockerfile: Dockerfile.distributed
    container_name: flext-node-3
    environment:
      FLEXT_SERVER_HOST: "0.0.0.0"
      FLEXT_SERVER_PORT: "8083"
      FLEXT_ENVIRONMENT: "development"
      FLEXT_DEBUG: "true"

      # Database
      FLEXT_DATABASE_ENABLED: "true"
      FLEXT_DB_HOST: "postgres"
      FLEXT_DB_PORT: "5432"
      FLEXT_DB_NAME: "flext_distributed"
      FLEXT_DB_USER: "flext"
      FLEXT_DB_PASSWORD: "flext"

      # Redis
      FLEXT_REDIS_ADDRESS: "redis:6379"

      # Distributed settings
      FLEXT_MAX_WORKERS: "6"
      FLEXT_MIN_WORKERS: "1"
      FLEXT_QUEUE_SIZE: "600"

      # Service info
      FLEXT_SERVICE_NAME: "flext-api"
      FLEXT_SERVICE_VERSION: "2.0.0-distributed"

    ports:
      - "8083:8083"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      flext-node-1:
        condition: service_healthy
    networks:
      - flext-network
    volumes:
      - ./config/distributed.yaml:/app/config/config.yaml
    command:
      ["/app/flext", "-distributed", "-config", "/app/config/config.yaml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: flext-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - flext-network
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--storage.tsdb.retention.time=200h"
      - "--web.enable-lifecycle"

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: flext-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: REDACTED_LDAP_BIND_PASSWORD
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - flext-network
    depends_on:
      - prometheus

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: flext-jaeger
    ports:
      - "16686:16686"
      - "14268:14268"
    environment:
      COLLECTOR_ZIPKIN_HTTP_PORT: 9411
    networks:
      - flext-network

  # Load balancer (HAProxy)
  load-balancer:
    image: haproxy:latest
    container_name: flext-load-balancer
    ports:
      - "8080:8080"
      - "8404:8404" # HAProxy stats
    volumes:
      - ./config/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
    networks:
      - flext-network
    depends_on:
      - flext-node-1
      - flext-node-2
      - flext-node-3

volumes:
  redis_data:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  flext-network:
    driver: bridge
