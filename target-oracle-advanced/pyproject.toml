[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "target-oracle-advanced"
version = "0.1.0"
description = "Advanced Singer target for Oracle databases using FLX framework and modern SDK patterns"
authors = ["FLX Team <dev@flx.com>"]
license = "Apache-2.0"
readme = "README.md"
homepage = "https://github.com/pyauto/target-oracle-advanced"
repository = "https://github.com/pyauto/target-oracle-advanced"
documentation = "https://pyauto.github.io/target-oracle-advanced"
keywords = [
    "singer-io",
    "elt",
    "oracle",
    "database",
    "data-loading",
    "meltano",
    "flx-framework",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.poetry.dependencies]
python = "^3.13"
singer-sdk = "^0.45.0"
oracledb = "^2.3.0"
structlog = "^24.4.0"
pydantic = "^2.10.0"
pendulum = "^3.0.0"
sqlalchemy = { extras = ["mypy"], version = "^2.0.0" }
click = "^8.1.0"
rich = "^13.0.0"

# FLX Framework integration
flx-database-oracle = { path = "../flx-database-oracle", develop = true }

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
mypy = "^1.13.0"
ruff = "^0.8.0"
pre-commit = "^4.0.0"
black = "^24.0.0"
isort = "^5.13.0"
bandit = "^1.7.0"
safety = "^3.0.0"
coverage = "^7.6.0"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
mkdocstrings = { extras = ["python"], version = "^0.27.0" }

[tool.poetry.scripts]
target-oracle-advanced = "target_oracle_advanced.target:TargetOracleAdvanced.cli"

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "S",   # bandit
]
ignore = [
    "ANN101", # missing-type-self
    "ANN102", # missing-type-cls
    "S101",   # assert
    "S603",   # subprocess-without-shell-equals-true
    "S607",   # start-process-with-partial-path
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["S101", "ANN", "ARG"]
"docs/**/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["target_oracle_advanced"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
