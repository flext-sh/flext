[tool.poetry]
name = "dbt-ldap"
version = "1.0.0"
description = "dbt models and transformations for LDAP data analysis and organizational hierarchy mapping"
authors = ["PyAuto Team <pyauto@example.com>"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/pyauto/dbt-ldap"
documentation = "https://github.com/pyauto/dbt-ldap#readme"
keywords = ["dbt", "ldap", "data", "transformation", "hierarchy", "analytics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database :: Front-Ends",
]

[tool.poetry.dependencies]
python = "^3.9,<4.0"
# dbt projects don't use singer-sdk - they are Meltano EDK components
# singer-sdk = { path = "../meltano-sdk", develop = true }
dbt-core = "^1.8.0"
dbt-postgres = "^1.8.0"
dbt-duckdb = "^1.8.5"
pydantic = "^2.11.0"
python-dotenv = "^1.0.0"
click = "^8.1.7"
rich = "^14.0.0"
typing-extensions = "^4.12.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-mock = "^3.14.0"
mypy = "^1.14.0"
black = "^24.10.0"
ruff = "^0.8.6"
isort = "^5.13.0"
pre-commit = "^4.0.0"
bandit = "^1.7.5"
safety = "^3.2.7"
vulture = "^2.13"
pycodestyle = "^2.12.1"
pydocstyle = "^6.3.0"
flake8 = "^7.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

# PEP8 Strict Configuration

[tool.ruff]
line-length = 88                                                                 # PEP8 strict line length
target-version = "py39"
fix = true
extend-exclude = ["__pycache__", ".venv", ".git", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "T20",  # flake8-print
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "ARG",  # flake8-unused-arguments
    "DTZ",  # flake8-datetimez
    "ERA",  # eradicate
    "PGH",  # pygrep-hooks
    "PL",   # pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "PERF", # perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",    # line too long (handled by black)
    "S101",    # assert used (OK in tests)
    "S603",    # subprocess call
    "S607",    # starting process with partial executable path
    "PLR0913", # too many arguments
    "PLR0915", # too many statements
    "B008",    # do not perform function calls in argument defaults
    "TRY003",  # avoid specifying long messages outside exception class
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "ARG002", "PLR0913", "PLR2004"]
"**/conftest.py" = ["ARG001", "ARG002"]
"**/*test*.py" = ["S101", "ARG001", "ARG002", "PLR0913", "PLR2004"]

[tool.ruff.lint.isort]
known-first-party = ["dbt_ldap"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.black]
line-length = 88                                              # PEP8 strict line length
target-version = ["py39", "py310", "py311", "py312", "py313"]
skip-string-normalization = false
skip-magic-trailing-comma = false

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["dbt_ldap"]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
force_single_line = false
lines_after_imports = 2
src_paths = ["macros", "tests"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
extra_checks = true
strict_concatenate = true
pretty = true
show_error_codes = true
show_column_numbers = true
show_error_context = true
color_output = true
error_summary = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=macros",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=90",
]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["macros"]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
