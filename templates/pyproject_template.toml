# Template Padrão para Projetos FLEXT
# Baseado na auditoria dos projetos funcionais
# Versão: 1.0 - 2025-07-05

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "{{PROJECT_NAME}}"
dynamic = ["version"]
description = "{{PROJECT_DESCRIPTION}}"
readme = "README.md"
requires-python = ">=3.13,<3.15"
keywords = ["flext", "{{PROJECT_CATEGORY}}", "enterprise", "python", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.5.0",
    "typing-extensions>=4.12.0",
    # Adicionar dependências específicas do projeto
]

[[project.authors]]
name = "FLEXT Team"
email = "team@flext.sh"

[project.license]
text = "MIT"

[project.scripts]
# Adicionar scripts CLI se necessário

[project.urls]
Homepage = "https://github.com/flext-sh/{{PROJECT_NAME}}"
Repository = "https://github.com/flext-sh/{{PROJECT_NAME}}"
Documentation = "https://github.com/flext-sh/{{PROJECT_NAME}}/blob/main/README.md"
"Bug Tracker" = "https://github.com/flext-sh/{{PROJECT_NAME}}/issues"

[tool.poetry]
version = "0.6.0"

[[tool.poetry.packages]]
include = "{{PACKAGE_NAME}}"
from = "src"

# ====== FERRAMENTAS DE QUALIDADE ======

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
unsafe-fixes = false
respect-gitignore = true
src = ["src", "tests", "scripts"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
    "node_modules",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # Trailing comma missing
    "ISC001",  # Implicitly concatenated string literals
    "D203",    # 1 blank line required before class docstring
    "D213",    # Multi-line docstring summary should start at the second line
    "E501",    # Line too long (handled by formatter)
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D105",    # Missing docstring in magic method
    "D107",    # Missing docstring in __init__
    "D205",    # 1 blank line required between summary line and description
    "D401",    # First line should be in imperative mood
    "D417",    # Missing argument descriptions in the docstring
    "ANN101",  # Missing type annotation for self
    "ANN102",  # Missing type annotation for cls
    "PLR0911", # Too many arguments
    "PLR0912", # Too many branches
    "PLR0913", # Too many arguments
    "PLR0915", # Too many statements
    "C901",    # Too complex
    "E402",    # Module level import not at top of file
    "T201",    # print() found
    "INP001",  # File is part of an implicit namespace package
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = 20

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D", "ANN", "ARG", "FBT", "SLF001"]
"*/tests/*" = ["S101", "PLR2004", "D", "ANN", "ARG", "FBT", "SLF001"]
"__init__.py" = ["D104"]
"conftest.py" = ["D"]
"scripts/*" = ["T201", "D", "ERA001"]
"examples/*" = ["T201", "D", "ERA001"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["{{PACKAGE_NAME}}"]
known_local_folder = ["{{PACKAGE_NAME}}"]
force_single_line = false
combine_as_imports = true
order_by_type = true
atomic = true
remove_redundant_aliases = true
honor_noqa = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
disable_error_code = ["misc", "unused-ignore"]
ignore_missing_imports = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = true
disallow_any_explicit = false
strict_optional = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "dependency_injector.*",
    "structlog.*",
    "alembic.*",
    "sqlalchemy.*",
    "redis.*",
    "asyncpg.*",
    "psycopg2.*",
    "meltano.*",
    "grpc.*",
    "aio_pika.*",
    "ldap3.*",
    "oracledb.*",
    "fire.*",
    "singer.*",
    "prefect.*",
]
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]
severity = "high"
confidence = "high"

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]

[tool.vulture]
min_confidence = 100
paths = ["src"]
exclude = ["tests/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post"]
ignore_names = ["_*"]
make_whitelist = true
sort_by_size = true

[tool.radon]
exclude = ["tests/*", "*/tests/*"]
ignore = ["F401"]
total_average = true
show_complexity = true
average = true
order = "SCORE"

# ====== TESTES E COBERTURA ======

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/pytest.xml",
    "--maxfail=5",
    "--timeout=60",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "performance: marks tests as performance tests",
    "benchmark: marks tests as benchmark tests",
    "security: marks tests as security tests",
    "smoke: smoke tests for basic functionality",
    "load: marks tests as load tests",
    "requires_database: tests that need database",
    "requires_redis: tests that need Redis",
    "requires_ldap: tests that need LDAP server",
    "requires_oracle: tests that need Oracle database",
    "requires_network: tests that need network access",
    "local_only: tests that only run locally",
    "ci_only: tests that only run in CI",
    "docker: tests that require Docker",
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::pytest.PytestCollectionWarning",
]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_auto_indent = true
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/*_test.py",
    "*/conftest.py",
    "*/__pycache__/*",
    "*/site-packages/*",
    "*/.venv/*",
    "*/venv/*",
    "*/build/*",
    "*/dist/*",
    "*/.eggs/*",
    "*/migrations/*",
    "*/static/*",
    "*/media/*",
    "manage.py",
    "*/settings/*",
    "*/__init__.py",
]
data_file = "reports/.coverage"
parallel = true
concurrency = ["thread", "multiprocessing"]
dynamic_context = "test_function"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
precision = 2
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING",
    "\\.\\.\\.",
    "pass",
    "def __str__",
    "def __unicode__",
]

[tool.coverage.html]
directory = "reports/coverage"
title = "{{PROJECT_NAME}} Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"
show_contexts = true

# ====== DEPENDÊNCIAS DE DESENVOLVIMENTO ======

[tool.poetry.dependencies]
python = ">=3.13,<3.15"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.0.0"
pytest-asyncio = "^0.23.0"
pytest-timeout = "^2.2.0"
pytest-mock = "^3.12.0"
mypy = "^1.8.0"
ruff = "^0.1.9"
black = "^23.12.0"
isort = "^5.13.0"
bandit = "^1.7.5"
vulture = "^2.10"
radon = "^6.0.1"
pre-commit = "^3.6.0"
