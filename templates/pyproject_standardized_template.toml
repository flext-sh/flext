# =============================================================================
# FLEXT STANDARDIZED PYPROJECT.TOML TEMPLATE
# Based on existing patterns in the workspace
#
# ⚠️  IMPORTANTE: NUNCA adicionar singer-python - pacote pré-histórico e descontinuado
# ✅  Use apenas singer-sdk para integração Singer protocol
# =============================================================================

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "PROJECT_NAME_PLACEHOLDER"
dynamic = ["version"]
description = "PROJECT_DESCRIPTION_PLACEHOLDER"
readme = "README.md"
requires-python = ">=3.13,<3.15"
keywords = ["flext", "PROJECT_KEYWORDS_PLACEHOLDER"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
dependencies = [
    "pydantic>=2.11.0",
    "pydantic-settings>=2.5.0",
    # PROJECT_SPECIFIC_DEPS_PLACEHOLDER
]

[[project.authors]]
name = "FLEXT Team"
email = "team@flext.sh"

[project.license]
text = "MIT"

[project.scripts]
PROJECT_CLI_PLACEHOLDER = "PROJECT_MODULE_PLACEHOLDER.cli:main"

[project.urls]
Homepage = "https://github.com/flext-sh/PROJECT_NAME_PLACEHOLDER"
Repository = "https://github.com/flext-sh/PROJECT_NAME_PLACEHOLDER"
Documentation = "https://github.com/flext-sh/PROJECT_NAME_PLACEHOLDER/blob/main/README.md"
"Bug Tracker" = "https://github.com/flext-sh/PROJECT_NAME_PLACEHOLDER/issues"
Changelog = "https://github.com/flext-sh/PROJECT_NAME_PLACEHOLDER/blob/main/CHANGELOG.md"

[tool.poetry]
version = "0.6.0"
[[tool.poetry.packages]]
include = "PROJECT_PACKAGE_PLACEHOLDER"
from = "src"

# =============================================================================
# CODE QUALITY TOOLS - STANDARDIZED ACROSS ALL FLEXT PROJECTS
# =============================================================================

[tool.ruff]
target-version = "py312"
line-length = 88
fix = true
unsafe-fixes = false
respect-gitignore = true
src = ["src", "tests", "scripts"]
extend-exclude = [
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "build",
    "dist",
    "htmlcov",
    "node_modules"
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",  # trailing-comma-missing
    "ISC001",  # implicit-str-concat
    "D203",    # one-blank-line-before-class
    "D213",    # multi-line-docstring-summary-second-line
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "D", "ANN", "ARG", "FBT", "SLF001"]
"*/tests/*" = ["S101", "PLR2004", "D", "ANN", "ARG", "FBT", "SLF001"]
"__init__.py" = ["D104"]
"conftest.py" = ["D"]
"scripts/*" = ["T201", "D", "ERA001"]
"examples/*" = ["T201", "D", "ERA001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-type-checking]
strict = true

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.pylint]
max-args = 10
max-branches = 15
max-returns = 8
max-statements = 60

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["PROJECT_FIRST_PARTY_PLACEHOLDER"]
known_local_folder = ["PROJECT_LOCAL_FOLDER_PLACEHOLDER"]
force_single_line = false
combine_as_imports = true
order_by_type = true
atomic = true
remove_redundant_aliases = true
honor_noqa = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_error_context = true
pretty = true
color_output = true
error_summary = true
ignore_missing_imports = false
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_any_unimported = true
disallow_any_expr = false
disallow_any_decorated = true
disallow_any_explicit = false
strict_optional = true
strict_concatenate = true

[[tool.mypy.overrides]]
module = [
    "ldif.*", "singer.*", "meltano.*", "oracledb.*",
    "fire.*", "ldap3.*", "prefect.*", "redis.*"
]
ignore_missing_imports = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", "build", "dist"]
skips = ["B101", "B601"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]

[tool.vulture]
min_confidence = 100
paths = ["src"]
exclude = ["tests/"]
ignore_decorators = ["@app.route", "@router.get", "@router.post"]
ignore_names = ["_*"]
make_whitelist = true
sort_by_size = true

[tool.radon]
exclude = ["tests/*", "*/tests/*"]
ignore = ["F401"]
total_average = true
show_complexity = true
average = true
order = "SCORE"

# =============================================================================
# TESTING CONFIGURATION - STANDARDIZED
# =============================================================================

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=src",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:reports/coverage",
    "--cov-report=xml:reports/coverage.xml",
    "--cov-fail-under=85",
    "--junitxml=reports/pytest.xml",
    "--maxfail=5",
    "--disable-warnings"
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "fast: marks tests as fast",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "e2e: marks tests as end-to-end tests",
    "performance: marks tests as performance tests",
    "security: marks tests as security tests",
    "requires_database: tests that need database",
    "requires_redis: tests that need Redis",
    "requires_ldap: tests that need LDAP server",
    "requires_oracle: tests that need Oracle database",
    "requires_network: tests that need network access"
]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
asyncio_mode = "auto"
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(name)s: %(message)s"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"
log_auto_indent = true
timeout = 60
timeout_method = "thread"

[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "*/tests/*", "*/test_*", "*/*_test.py", "*/conftest.py",
    "*/__pycache__/*", "*/site-packages/*", "*/.venv/*",
    "*/venv/*", "*/build/*", "*/dist/*", "*/.eggs/*"
]
data_file = "reports/.coverage"
parallel = true
concurrency = ["thread", "multiprocessing"]
dynamic_context = "test_function"

[tool.coverage.report]
skip_empty = true
skip_covered = false
show_missing = true
sort = "Cover"
precision = 2
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
    "TYPE_CHECKING"
]

[tool.coverage.html]
directory = "reports/coverage"
title = "PROJECT_NAME_PLACEHOLDER Coverage Report"
show_contexts = true

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.json]
output = "reports/coverage.json"
show_contexts = true

# =============================================================================
# DEPENDENCIES - POETRY GROUPS
# =============================================================================

[tool.poetry.dependencies]
python = ">=3.13,<3.15"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-cov = "^6.0.0"
pytest-asyncio = ">=0.23.5,<0.24.0"
pytest-benchmark = "^4.0.0"
pytest-mock = "^3.14.0"
pytest-xdist = "^3.6.0"
pytest-timeout = "^2.3.0"
pytest-randomly = "^3.15.0"
pytest-sugar = "^1.0.0"
pytest-clarity = "^1.0.1"

# Code Quality
ruff = "^0.12.0"
black = "^25.1.0"
isort = "^6.0.1"
mypy = "^1.13.0"
pre-commit = "^4.0.0"
vulture = "^2.14"
radon = "^6.0.1"

# Type Stubs
types-requests = "^2.32.0"
types-setuptools = "^75.6.0"
types-redis = "^4.6.0"
types-pyyaml = "^6.0.12"
types-python-dateutil = "^2.9.0"

# Documentation
mkdocs = "^1.6.0"
mkdocs-material = "^9.5.0"
sphinx = "^8.0.0"
sphinx-rtd-theme = "^3.0.0"
myst-parser = "^4.0.0"

# Development Tools
ipython = "^9.4.0"
rich = "^13.9.0"
rich-traceback = "^1.0.3"

[tool.poetry.group.security.dependencies]
bandit = { extras = ["toml"], version = "^1.7.0" }
safety = "^3.2.0"

[tool.poetry.group.build.dependencies]
build = "^1.2.0"
twine = "^6.0.0"

[tool.poetry.group.test.dependencies]
hypothesis = "~6.135.0"
faker = "^30.8.0"
factory-boy = "^3.3.0"

# =============================================================================
# VERSION MANAGEMENT
# =============================================================================

[tool.setuptools.dynamic.version]
attr = "PROJECT_MODULE_PLACEHOLDER.__version__.__version__"
