# Example configuration for flx-ldap

# Tap configuration for extracting from source LDAP
tap:
  host: source.ldap.example.com
  port: 389
  bind_dn: cn=admin,dc=source,dc=example,dc=com
  password: ${LDAP_SOURCE_PASSWORD}
  base_dn: dc=source,dc=example,dc=com
  use_ssl: false
  timeout: 30
  page_size: 1000
  user_filter: "(objectClass=inetOrgPerson)"
  group_filter: "(objectClass=groupOfNames)"

  # Custom streams for specific extractions
  custom_streams:
    - name: service_accounts
      search_filter: "(&(objectClass=account)(uid=svc-*))"
      primary_keys: ["dn"]
      replication_key: "modifyTimestamp"
      schema:
        properties:
          dn: { type: string }
          uid: { type: string }
          description: { type: string }
          modifyTimestamp: { type: string, format: date-time }

# Target configuration for loading to destination LDAP
target:
  host: target.ldap.example.com
  port: 389
  bind_dn: cn=admin,dc=target,dc=example,dc=com
  password: ${LDAP_TARGET_PASSWORD}
  base_dn: dc=target,dc=example,dc=com
  use_ssl: false
  timeout: 30
  validate_records: true
  user_rdn_attribute: uid
  group_rdn_attribute: cn

  # DN templates for each stream
  dn_templates:
    users: "uid={uid},ou=users,dc=target,dc=example,dc=com"
    groups: "cn={cn},ou=groups,dc=target,dc=example,dc=com"
    service_accounts: "uid={uid},ou=services,dc=target,dc=example,dc=com"

  # Default object classes for streams
  default_object_classes:
    users: [inetOrgPerson, organizationalPerson, person, top]
    groups: [groupOfNames, top]
    service_accounts: [account, top]

# DBT configuration for transformations
dbt:
  project_dir: ../dbt-ldap
  profiles_dir: ~/.dbt
  target: dev
  threads: 4
  vars:
    ldap_base_dn: dc=example,dc=com
    ldap_user_base: ou=users
    ldap_group_base: ou=groups

# Migration configuration for OID to OUD migrations
migration:
  source_tap_config:
    host: oid.example.com
    port: 389
    bind_dn: cn=orcladmin
    password: ${OID_PASSWORD}
    base_dn: dc=example,dc=com

  target_tap_config:
    host: oud.example.com
    port: 389
    bind_dn: cn=Directory Manager
    password: ${OUD_PASSWORD}
    base_dn: dc=example,dc=com

  target_config:
    host: oud.example.com
    port: 389
    bind_dn: cn=Directory Manager
    password: ${OUD_PASSWORD}
    base_dn: dc=example,dc=com

  comparison_enabled: true
  dry_run: false
  batch_size: 1000

# General configuration
catalog_path: ./catalog.json
state_path: ./state.json
output_path: ./output
log_level: INFO
