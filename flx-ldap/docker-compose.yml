version: "3.8"

services:
  source-ldap:
    image: osixia/openldap:1.5.0
    container_name: flx-ldap-source
    environment:
      LDAP_ORGANISATION: "Source Company"
      LDAP_DOMAIN: "source.com"
      LDAP_BASE_DN: "dc=source,dc=com"
      LDAP_ADMIN_PASSWORD: "source_password"
      LDAP_CONFIG_PASSWORD: "config_password"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_TLS: "false"
    ports:
      - "30389:389"
    volumes:
      - ./tests/e2e/ldif/source:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service --loglevel debug
    networks:
      - flx-network

  target-ldap:
    image: osixia/openldap:1.5.0
    container_name: flx-ldap-target
    environment:
      LDAP_ORGANISATION: "Target Company"
      LDAP_DOMAIN: "target.com"
      LDAP_BASE_DN: "dc=target,dc=com"
      LDAP_ADMIN_PASSWORD: "target_password"
      LDAP_CONFIG_PASSWORD: "config_password"
      LDAP_RFC2307BIS_SCHEMA: "true"
      LDAP_TLS: "false"
    ports:
      - "31389:389"
    volumes:
      - ./tests/e2e/ldif/target:/container/service/slapd/assets/config/bootstrap/ldif/custom
    command: --copy-service --loglevel debug
    networks:
      - flx-network

  postgres:
    image: postgres:15-alpine
    container_name: flx-ldap-postgres
    environment:
      POSTGRES_DB: flx_ldap_test
      POSTGRES_USER: flx_user
      POSTGRES_PASSWORD: flx_password
    ports:
      - "35432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tests/e2e/sql:/docker-entrypoint-initdb.d
    networks:
      - flx-network

  tap-ldap:
    build:
      context: ../tap-ldap
      dockerfile: Dockerfile
    container_name: flx-ldap-tap
    volumes:
      - ./tests/e2e/configs:/app/configs
      - ./tests/e2e/data:/app/data
    depends_on:
      - source-ldap
    networks:
      - flx-network
    command: ["sleep", "infinity"]

  target-ldap-service:
    build:
      context: ../target-ldap
      dockerfile: Dockerfile
    container_name: flx-ldap-target-service
    volumes:
      - ./tests/e2e/configs:/app/configs
      - ./tests/e2e/data:/app/data
    depends_on:
      - target-ldap
    networks:
      - flx-network
    command: ["sleep", "infinity"]

  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.latest
    container_name: flx-ldap-dbt
    environment:
      DBT_PROFILES_DIR: /app/profiles
      DBT_PROJECT_DIR: /app/dbt_project
    volumes:
      - ../dbt-ldap:/app/dbt_project
      - ./tests/e2e/dbt-profiles:/app/profiles
    depends_on:
      - postgres
    networks:
      - flx-network
    command: ["sleep", "infinity"]

  phpldapREDACTED_LDAP_BIND_PASSWORD:
    image: osixia/phpldapREDACTED_LDAP_BIND_PASSWORD:0.9.0
    container_name: flx-ldap-REDACTED_LDAP_BIND_PASSWORD
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "#PYTHON2BASH:[{'source-ldap': [{'server': [{'tls': False}]}, {'login': [{'bind_id': 'cn=REDACTED_LDAP_BIND_PASSWORD,dc=source,dc=com'}]}]}, {'target-ldap': [{'server': [{'tls': False}]}, {'login': [{'bind_id': 'cn=REDACTED_LDAP_BIND_PASSWORD,dc=target,dc=com'}]}]}]"
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "30080:80"
    depends_on:
      - source-ldap
      - target-ldap
    networks:
      - flx-network

  pgREDACTED_LDAP_BIND_PASSWORD:
    image: dpage/pgREDACTED_LDAP_BIND_PASSWORD4:latest
    container_name: flx-ldap-pgREDACTED_LDAP_BIND_PASSWORD
    environment:
      PGADMIN_DEFAULT_EMAIL: REDACTED_LDAP_BIND_PASSWORD@test.com
      PGADMIN_DEFAULT_PASSWORD: REDACTED_LDAP_BIND_PASSWORD_password
    ports:
      - "35050:80"
    depends_on:
      - postgres
    networks:
      - flx-network

networks:
  flx-network:
    driver: bridge

volumes:
  postgres_data:
