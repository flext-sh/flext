# FLEXT Workspace - Centralized Development Dependencies
# Following KISS principle - Single source of truth for all dev dependencies
# All FLEXT projects inherit from this file to eliminate duplication

[tool.poetry.group.dev.dependencies]
# Core linting and formatting - KISS: single linter (ruff replaces multiple tools)
ruff = "^0.12.3"
black = "^25.1.0"                 # Keep for compatibility during transition
isort = "^6.0.1"                  # Keep for compatibility during transition
mypy = "^1.13.0"
pylint = "^3.3.0"
pre-commit = "^4.0.1"
vulture = "^2.13"
radon = "^6.0.1"
codespell = "^2.3.0"
pyupgrade = "^3.19.0"
autoflake = "^2.3.1"

[tool.poetry.group.test.dependencies]
# Testing framework - KISS: unified test stack
pytest = "^8.4.0"
pytest-asyncio = "^1.0.0"
pytest-cov = "^6.2.0"
pytest-xdist = "^3.8.0"
pytest-mock = "^3.14.0"
pytest-timeout = "^2.4.0"
pytest-benchmark = "^5.1.0"
pytest-randomly = "^3.16.0"
pytest-sugar = "^1.0.0"
pytest-clarity = "^1.0.1"
pytest-deadfixtures = "^2.2.1"
pytest-env = "^1.1.5"
pytest-httpx = "^0.35.0"
hypothesis = "^6.125.0"
factory-boy = "^3.3.1"
faker = "^37.4.0"

[tool.poetry.group.typings.dependencies]
# Type stubs - KISS: common stubs for all projects
types-python-dateutil = "^2.9.0"
types-pyyaml = "^6.0.12"
types-setuptools = "^80.9.0"
types-toml = "^0.10.8.20240310"
types-requests = "^2.32.4"
types-redis = "^4.6.0"
types-psutil = "^7.0.0"

[tool.poetry.group.security.dependencies]
# Security scanning - KISS: essential security tools only
bandit = "^1.8.0"
pip-audit = "^2.7.3"