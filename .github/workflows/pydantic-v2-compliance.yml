name: Pydantic v2 Compliance Check

on:
  pull_request:
    paths:
      - "**.py"
      - "flext-*/docs/pydantic-v2-modernization/**"
  push:
    branches:
      - main
      - develop
    paths:
      - "**.py"

jobs:
  pydantic-v2-audit:
    name: Audit Pydantic v2 Compliance
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [flext-core, flext-cli, flext-ldif, flext-ldap, client-a-oud-mig]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install audit dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic

      - name: Run Pydantic v2 Audit for ${{ matrix.project }}
        id: audit
        run: |
          cd ${{ matrix.project }}
          python docs/pydantic-v2-modernization/audit_pydantic_v2.py
        continue-on-error: true

      - name: Comment on PR if violations found
        if: steps.audit.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **${{ matrix.project }}**: Pydantic v1 patterns detected in this PR. Please run `make audit-pydantic-v2` to see violations and fix them before merging.'
            })

      - name: Fail workflow if violations found
        if: steps.audit.outcome == 'failure'
        run: |
          echo "❌ Pydantic v2 compliance check failed for ${{ matrix.project }}"
          exit 1

  summary:
    name: Compliance Summary
    runs-on: ubuntu-latest
    needs: pydantic-v2-audit
    if: always()
    steps:
      - name: Check audit results
        run: |
          if [ "${{ needs.pydantic-v2-audit.result }}" == "success" ]; then
            echo "✅ All projects are Pydantic v2 compliant"
          else
            echo "❌ Some projects have Pydantic v1 patterns"
            exit 1
          fi
