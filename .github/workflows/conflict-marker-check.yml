name: conflict-marker-check

on:
  pull_request:

permissions:
  contents: read

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for merge conflict markers
        run: |
          set -euo pipefail
          status=0
          markers=$(git grep -lE "^<<<<<<< |^>>>>>>> " -- \
            ":(exclude).venv/" ":(exclude)node_modules/" \
            ":(exclude)dist/" ":(exclude)build/" \
            ":(exclude).cache/" ":(exclude)_vendor/") || status=$?
          if [ "$status" -gt 1 ]; then
            echo "::error::git grep failed with exit status $status"
            exit "$status"
          fi
          if [ -n "$markers" ]; then
            echo "::error::Merge conflict markers found in tracked files:"
            echo "$markers"
            exit 1
          fi
          echo "No conflict markers found."
