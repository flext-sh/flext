name: Pydantic v2 Compliance Check

on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/pydantic-v2-check.yml'
  push:
    branches:
      - main
      - develop
    paths:
      - '**.py'

jobs:
  pydantic-v2-audit:
    name: Audit Pydantic v2 Compliance
    runs-on: ubuntu-latest

    strategy:
      matrix:
        project: [flext-core, flext-ldap, flext-ldif, flext-cli, client-a-oud-mig]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run Pydantic v2 Audit
        run: |
          cd ${{ matrix.project }}
          python ../scripts/audit_pydantic_v2.py --project .

      - name: Report Results
        if: success()
        run: |
          echo "✅ Pydantic v2 compliance verified for ${{ matrix.project }}"

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: pydantic-v2-audit
    if: always()

    steps:
      - name: Check Audit Results
        run: |
          if [ "${{ needs.pydantic-v2-audit.result }}" = "failure" ]; then
            echo "❌ Pydantic v2 compliance check failed"
            exit 1
          else
            echo "✅ All projects passed Pydantic v2 compliance"
          fi
