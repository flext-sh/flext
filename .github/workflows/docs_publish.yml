name: Publish Docs Portal

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      force:
        description: "Force docs publish deployment"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.force == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs

      - name: Build root docs portal
        run: |
          make docs DOCS_PHASE=build

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.reports/docs/site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
