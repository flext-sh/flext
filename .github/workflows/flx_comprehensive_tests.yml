name: FLEXT Comprehensive Tests

on:
  push:
    branches: [main, develop, feature/*]
  pull_request:
    branches: [main, develop]
  schedule:
    # Run tests daily at 2 AM UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      test_type:
        description: "Type of tests to run"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - unit
          - integration
          - performance
          - security
      coverage_threshold:
        description: "Coverage threshold percentage"
        required: false
        default: "80"
        type: string

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "1.8.3"
  COVERAGE_THRESHOLD: ${{ github.event.inputs.coverage_threshold || '80' }}

jobs:
  # ============================================================================
  # SETUP AND VALIDATION
  # ============================================================================
  setup:
    name: Setup and Validation
    runs-on: ubuntu-latest
    outputs:
      test-matrix: ${{ steps.test-matrix.outputs.matrix }}
      projects: ${{ steps.projects.outputs.list }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
          virtualenvs-create: true

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          poetry install --with dev,test
          poetry run pip install --upgrade pip

      - name: Validate flext_project structure
        run: |
          echo "🔍 Validating FLEXT flext_project structure..."
          poetry run python -c "
          import sys
          from pathlib import Path

          required_dirs = [
              'flext/src', 'flext/tests',
              'flext-database-oracle/src', 'flext-database-oracle/tests',
              'flext-http-oracle-wms/src', 'flext-http-oracle-wms/tests'
          ]

          missing = [d for d in required_dirs if not Path(d).exists()]
          if missing:
              print(f'❌ Missing directories: {missing}')
              sys.exit(1)
          else:
              print('✅ Project structure validated')
          "

      - name: Generate test matrix
        id: test-matrix
        run: |
          echo "🎯 Generating test execution matrix..."

          TEST_TYPE="${{ github.event.inputs.test_type || 'all' }}"

          if [ "$TEST_TYPE" = "all" ]; then
            CATEGORIES='["unit", "integration", "performance", "security"]'
          else
            CATEGORIES='["${{ github.event.inputs.test_type }}"]'
          fi

          MATRIX=$(cat << EOF
          {
            "include": [
              {
                "flext_project": "flext-core",
                "path": "flext/tests",
                "categories": $CATEGORIES
              },
              {
                "flext_project": "flext-database-oracle",
                "path": "flext-database-oracle/tests",
                "categories": $CATEGORIES
              },
              {
                "flext_project": "flext-http-oracle-wms",
                "path": "flext-http-oracle-wms/tests",
                "categories": $CATEGORIES
              }
            ]
          }
          EOF
          )

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

      - name: Discover projects
        id: projects
        run: |
          PROJECTS=$(find . -name "tests" -type d | grep -E "(flext|dc-)" | head -10 | jq -R -s -c 'split("\n")[:-1]')
          echo "list=$PROJECTS" >> $GITHUB_OUTPUT

  # ============================================================================
  # UNIT TESTS
  # ============================================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event.inputs.test_type == 'unit' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '' }}
    strategy:
      fail-fast: false
      matrix:
        flext_project:
          [
            { name: "flext-core", path: "flext/tests" },
            {
              name: "flext-database-oracle",
              path: "flext-database-oracle/tests",
            },
            {
              name: "flext-http-oracle-wms",
              path: "flext-http-oracle-wms/tests",
            },
          ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run unit tests
        run: |
          echo "🧪 Running unit tests for ${{ matrix.flext_project.name }}..."
          poetry run python -m pytest ${{ matrix.flext_project.path }} \
            -m "unit" \
            --verbose \
            --tb=short \
            --color=yes \
            --durations=10 \
            --maxfail=5 \
            --cov=flext \
            --cov=wms \
            --cov=db \
            --cov-report=xml:coverage-${{ matrix.flext_project.name }}.xml \
            --cov-report=html:htmlcov-${{ matrix.flext_project.name }} \
            --cov-report=term-missing \
            --junit-xml=junit-${{ matrix.flext_project.name }}.xml \
            --html=report-${{ matrix.flext_project.name }}.html \
            --self-contained-html \
            || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results-${{ matrix.flext_project.name }}
          path: |
            junit-*.xml
            report-*.html
            coverage-*.xml
            htmlcov-*/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage-${{ matrix.flext_project.name }}.xml
          flags: unit,${{ matrix.flext_project.name }}
          name: ${{ matrix.flext_project.name }}-unit-coverage

  # ============================================================================
  # INTEGRATION TESTS
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event.inputs.test_type == 'integration' || github.event.inputs.test_type == 'all' || github.event.inputs.test_type == '' }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Set up test environment
        run: |
          echo "🔧 Setting up integration test environment..."
          export DATABASE_URL="postgresql://postgres:postgres@localhost:5432/test_db"
          export TEST_MODE="integration"

      - name: Run integration tests
        run: |
          echo "🔗 Running integration tests..."
          poetry run python -m pytest \
            -m "integration" \
            --verbose \
            --tb=short \
            --color=yes \
            --durations=10 \
            --maxfail=3 \
            --cov=flext \
            --cov-report=xml:coverage-integration.xml \
            --cov-report=term-missing \
            --junit-xml=junit-integration.xml \
            --html=report-integration.html \
            --self-contained-html \
            || true

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: |
            junit-integration.xml
            report-integration.html
            coverage-integration.xml

  # ============================================================================
  # PERFORMANCE TESTS
  # ============================================================================
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event.inputs.test_type == 'performance' || github.event.inputs.test_type == 'all' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run performance tests
        run: |
          echo "⚡ Running performance tests..."
          poetry run python -m pytest \
            -m "performance" \
            --verbose \
            --tb=short \
            --color=yes \
            --benchmark-only \
            --benchmark-json=benchmark-results.json \
            --junit-xml=junit-performance.xml \
            || true

      - name: Upload performance results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-test-results
          path: |
            benchmark-results.json
            junit-performance.xml

  # ============================================================================
  # SECURITY TESTS
  # ============================================================================
  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ github.event.inputs.test_type == 'security' || github.event.inputs.test_type == 'all' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run security scans
        run: |
          echo "🔒 Running security scans..."

          # Bandit security scan
          poetry run bandit -r flext/ -f json -o bandit-report.json || true

          # Safety check for vulnerabilities
          poetry run safety check --json --output safety-report.json || true

          # Security-focused tests
          poetry run python -m pytest \
            -m "security" \
            --verbose \
            --tb=short \
            --junit-xml=junit-security.xml \
            || true

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: |
            bandit-report.json
            safety-report.json
            junit-security.xml

  # ============================================================================
  # CODE QUALITY CHECKS
  # ============================================================================
  quality-checks:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Run linting
        run: |
          echo "🔍 Running code quality checks..."


          poetry run ruff check . --output-format=json --output-file=ruff-report.json || true

        
          poetry run mypy flext/ --json-report mypy-report || true

          # Black formatting check
          poetry run black --check --diff flext/ || true

      - name: Upload quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-check-results
          path: |
            ruff-report.json
            mypy-report/

  # ============================================================================
  # DEPLOYMENT TESTS
  # ============================================================================
  deployment-tests:
    name: Deployment Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Test package build
        run: |
          echo "📦 Testing package builds..."

          # Test FLEXT core build
          cd flext && poetry build && cd ..

          # Test client packages build
          cd flext-database-oracle && poetry build && cd ..
          cd flext-http-oracle-wms && poetry build && cd ..

      - name: Test installation
        run: |
          echo "💿 Testing package installation..."

          # Create fresh virtual environment
          python -m venv test-env
          source test-env/bin/activate

          # Install built packages
          pip install flext/dist/*.whl
          pip install flext-database-oracle/dist/*.whl
          pip install flext-http-oracle-wms/dist/*.whl

          # Test imports
          python -c "import flext; print('✅ FLEXT core imported successfully')"
          python -c "import flext_database_oracle; print('✅ FLEXT Oracle imported successfully')" || true
          python -c "import flext_http_oracle_wms; print('✅ FLEXT WMS imported successfully')" || true

  # ============================================================================
  # COMPREHENSIVE REPORT
  # ============================================================================
  comprehensive-report:
    name: Generate Comprehensive Report
    runs-on: ubuntu-latest
    needs:
      [
        unit-tests,
        integration-tests,
        performance-tests,
        security-tests,
        quality-checks,
      ]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --with dev,test

      - name: Generate comprehensive report
        run: |
          echo "📊 Generating comprehensive test report..."
          poetry run python scripts/testing/run_all_tests.py || true

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: comprehensive-test-report
          path: |
            reports/
            junit/
            test-results/

      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: FLEXT Test Results
          path: "test-results/**/*.xml"
          reporter: java-junit

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read test results and generate comment
            let comment = '## 🧪 FLEXT Test Results\n\n';

            // Add summary
            comment += '### Summary\n';
            comment += '- ✅ Unit Tests: Completed\n';
            comment += '- 🔗 Integration Tests: Completed\n';
            comment += '- ⚡ Performance Tests: Completed\n';
            comment += '- 🔒 Security Tests: Completed\n';
            comment += '- 🔍 Quality Checks: Completed\n\n';

            comment += '### Coverage\n';
            comment += `Target: ${process.env.COVERAGE_THRESHOLD}%\n\n`;

            comment += '### Artifacts\n';
            comment += '- 📊 [Comprehensive Report](../actions/runs/${{ github.run_id }})\n';
            comment += '- 📈 [Coverage Reports](../actions/runs/${{ github.run_id }})\n';
            comment += '- 🔒 [Security Scans](../actions/runs/${{ github.run_id }})\n';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================================
  # NOTIFICATION
  # ============================================================================
  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [comprehensive-report]
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Notify success
        if: ${{ needs.comprehensive-report.result == 'success' }}
        run: |
          echo "✅ All FLEXT tests completed successfully!"
          echo "🎉 Ready for deployment"

      - name: Notify failure
        if: ${{ needs.comprehensive-report.result == 'failure' }}
        run: |
          echo "❌ Some FLEXT tests failed"
          echo "🔧 Please review the test results and fix issues"
          exit 1
