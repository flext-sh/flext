name: Docs

on:
  push:
    branches:
      - main
      - 0.12.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "flext-*/docs/**"
      - "flext-*/src/**"
      - "flext-infra/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Boot (advisory)
        continue-on-error: true
        run: make boot

      # mro-o6h5 (agent: kimi) — failure diagnostics: per-project logs live under
      # .reports/workspace/docs/*.log and were invisible in CI ("0 errors" FAILs);
      # dump them inline + upload as artifact so the real error is always reachable.
      - name: Docs audit (blocking)
        run: |
          make docs DOCS_PHASE=audit || {
            for f in .reports/workspace/docs/*.log; do
              echo "=== $f ==="
              tail -60 "$f"
            done
            exit 1
          }

      - name: Docs validate (blocking)
        run: |
          make docs DOCS_PHASE=validate || {
            for f in .reports/workspace/docs/*.log; do
              echo "=== $f ==="
              tail -60 "$f"
            done
            exit 1
          }

      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-reports
          path: .reports/
          retention-days: 7

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      - name: Generate docs (engine SSOT, root scope included)
        # mro-jwop (agent: kimi) — engine direct call: the make orchestrator fans
        # out per project and never builds the root scope; the engine CLI at the
        # workspace root always includes it (scopes = [root, *selected]).
        run: uv run --all-packages python -m flext_infra docs generate --workspace . --apply

      - name: Build site (mkdocs strict, root + flext-infra scopes)
        run: uv run --all-packages python -m flext_infra docs build --workspace . --projects flext-infra

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
