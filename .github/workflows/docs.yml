name: Docs

on:
  push:
    branches:
      - main
      - 0.12.0-dev
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "flext-*"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docs-quality:
    name: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      # mro-o6h5 (agent: kimi) — root cause of the "No module named ruff"
      # audit failures: `make boot` runs DRY-RUN without APPLY=Y (mutator
      # guard), and `uv run`/`uv sync` defaults never install the root
      # `dev` EXTRA where ruff/pytest live. Materialize the full workspace
      # toolchain explicitly (same flags as the Makefile's
      # ENSURE_WORKSPACE_RUNTIME), then verify the audit toolchain is present.
      - name: Sync workspace toolchain
        run: uv sync --all-packages --all-groups --all-extras

      - name: Verify docs toolchain
        run: |
          .venv/bin/python -c "import flext_infra.docs"
          .venv/bin/python -m ruff --version

      # mro-o6h5 (agent: kimi) — failure diagnostics: per-project logs live under
      # .reports/workspace/docs/*.log and were invisible in CI ("0 errors" FAILs);
      # dump them inline + per-project audit-report.md for non-zero issue counts +
      # upload as artifact so the real error is always reachable.
      - name: Docs audit (blocking)
        run: |
          make docs DOCS_PHASE=audit || {
            for f in .reports/workspace/docs/*.log; do
              echo "=== $f ==="
              tail -60 "$f"
            done
            for r in */.reports/docs/audit-summary.json; do
              [ -f "$r" ] || continue
              n=$(grep -o '"issues": [0-9]*' "$r" | head -1 | grep -o '[0-9]*')
              if [ "${n:-0}" -gt 0 ]; then
                echo "=== $(dirname "$r")/audit-report.md ==="
                cat "$(dirname "$r")/audit-report.md"
              fi
            done
            exit 1
          }

      # mro-o6h5 (agent: kimi) — root cause of the "missing required docs
      # files: mkdocs.yml" validate FAILs: the docs contract requires
      # GENERATED artifacts (project mkdocs.yml from flext-infra templates,
      # docs/api-reference/generated/*.md), but validate ran on the raw
      # checkout. Local worktrees pass because devs already generated them;
      # CI must generate before validate, same as the build job does.
      - name: Docs generate (materialize contract artifacts)
        run: uv run --all-packages python -m flext_infra docs generate --workspace . --apply

      - name: Docs validate (blocking)
        run: |
          make docs DOCS_PHASE=validate || {
            for f in .reports/workspace/docs/*.log; do
              echo "=== $f ==="
              tail -60 "$f"
            done
            exit 1
          }

      # mro-o6h5 (agent: kimi) — include-hidden-files: .reports/ is a dot-dir and
      # upload-artifact v4 skips hidden paths by default (artifact silently empty).
      - name: Upload docs reports on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-reports
          path: .reports/
          retention-days: 7
          include-hidden-files: true

  build:
    name: build
    needs: docs-quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true

      # mro-o6h5 (agent: kimi) — same root cause as the docs-quality ruff
      # incident: `uv run` implicit-sync never installs the root `dev` EXTRA
      # where the mkdocs plugin set lives (git-revision-date-localized,
      # mermaid2, minify, ...). Materialize the full toolchain explicitly
      # before generate/build, or mkdocs --strict aborts with
      # "plugin is not installed".
      - name: Sync workspace toolchain
        run: uv sync --all-packages --all-groups --all-extras

      - name: Generate docs (engine SSOT, root scope included)
        # mro-jwop (agent: kimi) — engine direct call: the make orchestrator fans
        # out per project and never builds the root scope; the engine CLI at the
        # workspace root always includes it (scopes = [root, *selected]).
        run: uv run --all-packages python -m flext_infra docs generate --workspace . --apply

      - name: Build site (mkdocs strict, root + flext-infra scopes)
        run: uv run --all-packages python -m flext_infra docs build --workspace . --projects flext-infra

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .reports/docs/site

  deploy:
    name: deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
